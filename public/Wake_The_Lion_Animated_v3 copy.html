<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wake the Lion</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#080b08;overflow:hidden;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#39431b,#090b08 70%)}
#stage{position:relative;width:min(96vw,620px);height:min(92vh,820px);overflow:hidden;border-radius:26px;box-shadow:0 18px 60px #000;touch-action:manipulation;cursor:pointer;background:#111}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.015);transition:opacity .38s ease,transform .7s ease;pointer-events:none}
.frame.on{opacity:1;transform:scale(1)}
#hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;background:#000b;color:#fff;padding:12px 20px;border-radius:28px;font-size:clamp(16px,4vw,23px);white-space:nowrap;pointer-events:none}
#hand{position:absolute;z-index:21;right:9%;bottom:18%;font-size:70px;filter:drop-shadow(0 5px 5px #0008);animation:guide 1.55s ease-in-out infinite;pointer-events:none}
@keyframes guide{0%,100%{transform:translate(24px,28px) rotate(-18deg)}50%{transform:translate(-70px,-100px) rotate(-25deg)}}
#roar{position:absolute;z-index:22;left:50%;top:12%;transform:translate(-50%,-50%) scale(.5);opacity:0;font-weight:900;font-size:clamp(42px,12vw,88px);color:#ffe52b;text-shadow:0 4px 0 #b40000,0 8px 20px #000;pointer-events:none}
#roar.show{animation:pop 1.7s ease both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#sound{position:absolute;right:14px;top:14px;z-index:30;border:0;border-radius:50%;width:48px;height:48px;font-size:23px;background:#000b;color:#fff}
#status{position:absolute;left:14px;top:16px;z-index:25;color:white;background:#0009;padding:8px 12px;border-radius:18px;font-weight:bold;pointer-events:none}
.shake{animation:shake .55s linear 2}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px) rotate(-.4deg)}75%{transform:translate(4px,-2px) rotate(.4deg)}}
</style>
</head>

const stage=document.getElementById('stage'), audio=document.getElementById('audio');
const hint=document.getElementById('hint'), hand=document.getElementById('hand');
const roar=document.getElementById('roar'), status=document.getElementById('status');
const sound=document.getElementById('sound'), fs=[...document.querySelectorAll('.frame')];
let busy=false, muted=false;
const names=['Sleeping…','Waking up…','Eyes opening…','Raising head…','Mouth opening…','Roaring!','PEAK ROAR!','Settling down…'];
const delays=[0,650,1350,2050,2750,3400,4050,5150];

function show(i){
 fs.forEach((f,n)=>f.classList.toggle('on',n===i));
 status.textContent=names[i];
}
function wake(){
 if(busy)return; busy=true;
 hint.style.display='none'; hand.style.display='none';
 audio.pause(); audio.currentTime=0; audio.muted=muted;
 // Audio starts inside the actual user gesture, important for iPhone/Safari.
 audio.play().catch(()=>{ status.textContent='Tap again for sound'; });
 delays.forEach((d,i)=>setTimeout(()=>{
   show(i);
   if(i===5) roar.classList.add('show');
   if(i===6) stage.classList.add('shake');
 },d));
 setTimeout(()=>{
   roar.classList.remove('show'); stage.classList.remove('shake');
   show(0); hint.style.display='block'; hand.style.display='block'; busy=false;
 },6500);
}
function activate(e){if(e.target===sound)return;if(e.cancelable)e.preventDefault();wake();}
stage.addEventListener('pointerup',activate);
stage.addEventListener('touchend',activate,{passive:false});
stage.addEventListener('click',activate);
sound.addEventListener('click',e=>{e.stopPropagation();muted=!muted;audio.muted=muted;sound.textContent=muted?'🔇':'🔊';});
</script>
</body></html>
