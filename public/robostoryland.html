/* === 9:16 Mobile Format Overrides === */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
#root { width: 100%; height: 100%; }
#root > div { min-height: 100% !important; height: 100% !important; }

/* Ensure background images cover the full 9:16 frame */
.absolute.inset-0 img[alt=""] { object-fit: cover; width: 100%; height: 100%; }

/* Make the main content area fill the frame and use flex to push robot up */
main.relative.z-20 { 
  min-height: calc(100% - 72px) !important; 
  height: calc(100% - 72px) !important;
  padding-top: 4px !important;
  padding-bottom: 8px !important;
}

/* Scale down the robot avatar for 9:16 mobile */
main.relative.z-20 > div:first-child > div {
  transform: scale(0.85);
  transform-origin: center top;
  margin-top: -10px;
}

/* Ensure caption + controls fit at bottom */
.w-full.max-w-3xl.mx-auto { max-width: 100% !important; }

/* Hide the story title h2 if it still renders */
h2.text-center.font-display { display: none !important; }

/* Progress bar section - reduce margin */
.w-full.max-w-4xl.mx-auto { max-width: 100% !important; }
.w-full.max-w-4xl.mx-auto > .flex.items-center.gap-3 { margin-bottom: 8px !important; }
.story-card-layer {
  position: absolute !important;
  top: 230px !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  width: min(416px, calc(100vw - 32px)) !important;
  transform: translateX(-50%) !important;
  z-index: 20 !important;
  pointer-events: none !important;
}
.story-card-layer > div {
  height: 260px !important;
  min-height: 0 !important;
  max-height: 260px !important;
  overflow-y: auto !important;
  overscroll-behavior: contain;
  touch-action: pan-y;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.72) rgba(255,255,255,0.16);
  -webkit-overflow-scrolling: touch;
  background: rgba(7,15,31,0.46) !important;
  border: 2px solid rgba(255,255,255,0.42) !important;
  border-radius: 22px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.24);
  pointer-events: auto !important;
}
/* Lullaby per-story borders - 15px thick multi-color spiraling light */
.story-card-layer > div.lullaby-border {
  border-width: 15px !important;
  border-style: solid !important;
  border-image-slice: 1 !important;
  position: relative !important;
}
.story-card-layer > div.lullaby-border::before {
  content: "";
  position: absolute;
  inset: -15px;
  z-index: -1;
  border-radius: inherit;
  opacity: 0;
  animation: lullabySpiral 3s linear infinite;
  transition: opacity .3s ease;
  pointer-events: none;
}
.story-card-layer > div.lullaby-border.lullaby-playing::before {
  opacity: 1;
}
@keyframes lullabySpiral {
  0% { filter: hue-rotate(0deg) blur(2px); }
  50% { filter: hue-rotate(180deg) blur(4px); }
  100% { filter: hue-rotate(360deg) blur(2px); }
}
/* 1. Moonboat - rounded with cyan/gold spiral glow */
.lb-1 { border-radius: 28px !important; }
.lb-1::before { background: conic-gradient(from 0deg, rgba(94,231,255,.9), rgba(255,209,102,.8), rgba(94,231,255,.9), rgba(167,139,250,.8), rgba(94,231,255,.9)); }
.lb-1.lullaby-playing { box-shadow: 0 0 20px rgba(94,231,255,.6), 0 0 40px rgba(255,209,102,.3) !important; }
/* 2. Sleepy Cloud - soft cloud-like rounded with pink/lavender glow */
.lb-2 { border-radius: 50px 22px 50px 22px !important; }
.lb-2::before { background: conic-gradient(from 90deg, rgba(244,114,182,.85), rgba(196,181,253,.8), rgba(244,114,182,.85), rgba(165,243,252,.8), rgba(244,114,182,.85)); }
.lb-2.lullaby-playing { box-shadow: 0 0 18px rgba(244,114,182,.5), 0 0 36px rgba(196,181,253,.3) !important; }
/* 3. Firefly Hush - hexagon-feel with golden green glow */
.lb-3 { border-radius: 12px 32px 12px 32px !important; }
.lb-3::before { background: conic-gradient(from 45deg, rgba(255,215,0,.85), rgba(134,239,172,.8), rgba(255,215,0,.85), rgba(253,224,71,.8), rgba(255,215,0,.85)); }
.lb-3.lullaby-playing { box-shadow: 0 0 16px rgba(255,215,0,.5), 0 0 32px rgba(134,239,172,.3) !important; }
/* 4. Dream Train - ticket-shape with blue/silver glow */
.lb-4 { border-radius: 8px 8px 8px 8px !important; }
.lb-4::before { background: conic-gradient(from 180deg, rgba(96,165,250,.85), rgba(203,213,225,.8), rgba(96,165,250,.85), rgba(147,197,253,.8), rgba(96,165,250,.85)); }
.lb-4.lullaby-playing { box-shadow: 0 0 18px rgba(96,165,250,.5), 0 0 36px rgba(203,213,225,.3) !important; }
/* 5. Garden Goodnight - leaf-shape with green/emerald glow */
.lb-5 { border-radius: 40px 40px 8px 8px !important; }
.lb-5::before { background: conic-gradient(from 135deg, rgba(52,211,153,.85), rgba(167,243,208,.8), rgba(52,211,153,.85), rgba(134,239,172,.8), rgba(52,211,153,.85)); }
.lb-5.lullaby-playing { box-shadow: 0 0 18px rgba(52,211,153,.5), 0 0 36px rgba(167,243,208,.3) !important; }
/* 6. Pillow Boat - boat-shape with warm orange/cream glow */
.lb-6 { border-radius: 8px 40px 8px 40px !important; }
.lb-6::before { background: conic-gradient(from 270deg, rgba(251,146,60,.85), rgba(254,215,170,.8), rgba(251,146,60,.85), rgba(253,186,116,.8), rgba(251,146,60,.85)); }
.lb-6.lullaby-playing { box-shadow: 0 0 18px rgba(251,146,60,.5), 0 0 36px rgba(254,215,170,.3) !important; }
/* 7. Rain on the Roof - droplet-shape with blue/teal glow */
.lb-7 { border-radius: 32px 32px 32px 8px !important; }
.lb-7::before { background: conic-gradient(from 60deg, rgba(56,189,248,.85), rgba(94,234,212,.8), rgba(56,189,248,.85), rgba(125,211,252,.8), rgba(56,189,248,.85)); }
.lb-7.lullaby-playing { box-shadow: 0 0 18px rgba(56,189,248,.5), 0 0 36px rgba(94,234,212,.3) !important; }
/* 8. Little Lantern - lantern-shape with amber/warm glow */
.lb-8 { border-radius: 20px 8px 20px 8px !important; }
.lb-8::before { background: conic-gradient(from 30deg, rgba(251,191,36,.9), rgba(253,230,138,.85), rgba(251,191,36,.9), rgba(252,211,77,.85), rgba(251,191,36,.9)); }
.lb-8.lullaby-playing { box-shadow: 0 0 22px rgba(251,191,36,.6), 0 0 44px rgba(253,230,138,.35) !important; }
/* 9. Whispering Woods - tree-feel with deep green/lime glow */
.lb-9 { border-radius: 8px 28px 8px 28px !important; }
.lb-9::before { background: conic-gradient(from 120deg, rgba(34,197,94,.85), rgba(190,242,100,.8), rgba(34,197,94,.85), rgba(132,204,22,.8), rgba(34,197,94,.85)); }
.lb-9.lullaby-playing { box-shadow: 0 0 18px rgba(34,197,94,.5), 0 0 36px rgba(190,242,100,.3) !important; }
/* 10. Sunrise Promise - sun-rise with coral/gold glow */
.lb-10 { border-radius: 36px 12px 36px 12px !important; }
.lb-10::before { background: conic-gradient(from 200deg, rgba(251,113,133,.9), rgba(253,224,71,.85), rgba(251,113,133,.9), rgba(252,165,165,.85), rgba(251,113,133,.9)); }
.lb-10.lullaby-playing { box-shadow: 0 0 20px rgba(251,113,133,.55), 0 0 40px rgba(253,224,71,.3) !important; }
.story-card-layer > div::-webkit-scrollbar { width: 8px; }
.story-card-layer > div::-webkit-scrollbar-track { background: rgba(255,255,255,0.16); border-radius: 8px; }
.story-card-layer > div::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.78); border-radius: 8px; }
