 cap back. Even the mayor got his top hat back! \"That monkey is not so bad,\" said the baker. \"He just needed a hat of his own.\"","es":"En un pueblo junto al mar, vivía un mono travieso llamado Momo. Momo amaba los sombreros. ¡Los robaba! ¿El sombrero del panadero? ¡Ido! ¿La gorra del cartero? ¡Ido! ¿El sombrero de copa del alcalde? ¡Ido, ido, ido! Momo estaba en el techo, usando tres sombreros. Un marinero tuvo una idea. Puso su sombrero en el suelo. Momo bajó y lo tomó. ¡Pero tenía una cuerda! El marinero tiró y el sombrero voló. \"¡Oh!\" dijo Momo. Lo intentó otra vez. ¡Tira! ¡Vuela! \"¡Esto es divertido!\" Momo olvidó robar. Jugó toda la tarde. Al día siguiente, el marinero le regaló un sombrero. \"¡Ahora tienes el tuyo!\" Momo estaba feliz. Devolvió todos los sombreros. \"Ese mono no es tan malo,\" dijo el panadero. \"Solo necesitaba uno propio.\"","ja":"うみのそばのまちにモモというわるだくみのさるがすんでいました。モモはぼうしがだいすきでした。かわないでぬすみました！パンやのぼうし？ない！ゆびんやのぼうし？ない！しちょうのシルクハット？ないないない！モモはやねのうえにすわってさんぼうしもかぶっていました。みにきたふなのりがアイデアをだしました。しろいぼうしをじめんにおいてとおざかりました。モモがやねからおりてぼうしをとりました。でもぼうしにはひもがついていました！ふなのりがひもをひっぱるとぼうしはモモのあたまからとびました。「おお！」モモがおどろきました。もういちどやってみました。ひっぱる！とぶ！「たのしい！」モモはぬすむのをわすれました。ごごじゅうたいあそびました。つぎのひふなのりはもういっかいぼうしをもってきてモモにあげました。「じぶんのぼうしだよ！」モモはうれしかった！ぬすんだぼうしをぜんぶかえしました。パンやもゆびんやもしちょうももどりました。「あのさるはわるくない」パンやがいいました。「じぶんのぼうしがほしかっただけ。」","fr":"Dans une ville au bord de la mer, vivait un singe espiègle nommé Momo. Momo adorait les chapeaux. Il les volait ! Le chapeau du boulanger ? Disparu ! La casquette du facteur ? Disparu ! Le haut-de-forme du maire ? Disparu, disparu, disparu ! Momo était sur le toit, portant trois chapeaux. Un marin de passage eut une idée. Il posa son chapeau par terre et s'éloigna. Momo descendit et le prit. Mais le chapeau avait une ficelle ! Le marin tira et le chapeau vola. « Oh ! » dit Momo. Il réessaya. Tire ! Vole ! « C'est amusant ! » Momo oublia de voler. Il joua tout l'après-midi. Le lendemain, le marin lui offrit un chapeau. « Tu as le tien ! » Momo était heureux. Il rendit tous les chapeaux volés. « Ce singe n'est pas si mauvais, » dit le boulanger. « Il avait juste besoin du sien."}},{"id":"animals-8","category":"animals","title":{"en":"The Snail's Big Race","es":"La gran carrera del caracol","ja":"かたつむりのレース","fr":"La grande course de l'escargot"},"text":{"en":"Everyone in the garden knew that snails were slow. But Sydney the Snail wanted to race. \"I challenge anyone to a race!\" declared Sydney. The grasshopper laughed. \"A snail? Race? That is the funniest thing I have ever heard!\" \"I am serious,\" said Sydney. \"I have been practicing.\" The grasshopper agreed to race. The course was from the flower bed to the old boot at the end of the garden. \"Ready, set, go!\" The grasshopper leaped — boing, boing, boing! — and reached the boot in three seconds. Sydney started sliding. Slide... slide... slide... One hour later, Sydney was halfway there. Two hours later, he was three-quarters there. Three hours later, he reached the boot. The grasshopper had been waiting the whole time, eating leaves. \"You won,\" said Sydney, \"but I finished.\" The grasshopper was impressed. \"You are the slowest racer I have ever seen, but also the most determined.\" The next week, Sydney challenged the caterpillar. The caterpillar crawled. Sydney slid. It was neck and neck — well, as much as a snail and caterpillar can be. They raced for two hours. The caterpillar won by an inch. \"Good race!\" said the caterpillar. \"Same time next week?\" Sydney agreed. They raced every week. And although Sydney never won, he became the most respected snail in the garden. \"It is not about winning,\" said Sydney. \"It is about not giving up.\" And all the garden animals cheered.","es":"Todos en el jardín sabían que los caracoles eran lentos. Pero Sydney el Caracol quería correr. \"¡Reto a cualquiera a una carrera!\" La langosta rio. \"¿Un caracol? ¿Carrera? ¡Es lo más gracioso que he oído!\" \"Hablo en serio,\" dijo Sydney. \"He practicado.\" La langosta aceptó. El recorrido era del jardín a la bota vieja. \"¡Listos, ya!\" La langasta saltó y llegó en tres segundos. Sydney empezó a deslizarse. Una hora después, estaba a la mitad. Dos horas, tres cuartos. Tres horas, llegó. \"Ganaste,\" dijo Sydney, \"pero terminé.\" La langosta quedó impresionada. \"Eres el más lento pero el más decidido.\" La semana siguiente, retó a la oruga. Competieron por dos horas. La oruga ganó por un centímetro. \"¡Buena carrera!\" Semana tras semana, Sydney nunca ganó, pero se hizo el caracol más respetado. \"No se trata de ganar, sino de no rendirse.\"","ja":"ていえんのみんなはかたつむりがおそいことをしっていました。でもシドニーかたつむりはレースがしたいとおもいました。「だれでもレースしよう！」バッタがわらいました。「かたつむり？レース？いちばんおかしい！」「ほんとうだよ」シドニーがいいました。「れんしゅうしたんだ。」バッタがきまりました。コースははなばたけからていえんのはしのふるいブーツまで。「よーいスタート！」バッタはぴょんぴょんでさんビョウでつきました。シドニーはすべりはじめました。いちじかんしてはんぶん。にじかんでさんぶんのに。さんじかんでブーツにつきました。バッタはまちながらはっぱをたべていました。「かったけど、ゴールした。」バッタはかんしんしました。「いちばんおそいけどがんばりやだ。」つぎのしゅうシドニーはいもむしにちょうせんしました。にじかんレースしました。いもむしがいんチでかちました。「いいレース！」まいしゅうレースしました。シドニーはけっしょうちませんでしたがていえんでいちばんそんけいされるかたつむりになりました。「かつことじゃなくあきらめないことだ。」みんなはくしょくしました。","fr":"Tout le monde au jardin savait que les escargots sont lents. Mais Sydney l'escargot voulait faire la course. « Je défie quiconque ! » La sauterelle rit. « Un escargot ? Courir ? C'est la chose la plus drôle que j'aie entendue ! — Je suis sérieux, » dit Sydney. La sauterelle accepta. Le parcours : du parterre à la vieille botte. « Prêt, partez ! » La sauterelle bondit et arriva en trois secondes. Sydney glissa. Une heure plus tard, à mi-chemin. Deux heures, trois quarts. Trois heures, arrivée. « Tu as gagné, mais j'ai fini. » La sauterelle fut impressionnée. « Le plus lent mais le plus déterminé. » La semaine suivante, il défia la chenille. Deux heures de course. La chenille gagna d'un centimètre. « Bonne course ! » Chaque semaine, Sydney ne gagna jamais mais devint le plus respecté. « Ce n'est pas gagner, c'est ne pas abandonner."}},{"id":"animals-9","category":"animals","title":{"en":"The Hedgehog's Balloon Problem","es":"El problema de globos del erizo","ja":"はりねずみのバルーンもんだい","fr":"Le problème de ballons du hérisson"},"text":{"en":"Henry the Hedgehog wanted to hold a balloon. He had never held a balloon before. Every time he tried, his spikes would pop it. POP! \"Oh no,\" said Henry, watching the balloon pieces float away. He tried holding the string instead. But the string kept sliding off his spikes. \"Maybe I should wear a sweater,\" he thought. He put on a sweater and tried again. He held the balloon against the sweater. It worked! But then he could not see where he was walking, and he bumped into a tree. \"Watch out!\" said the owl. \"Sorry,\" said Henry, \"I am just trying to hold a balloon.\" The owl thought for a moment. \"Have you tried holding the string with your mouth?\" Henry tried. The string tasted funny. \"No,\" he said, spitting it out. The squirrel suggested taping the string to his spikes. Henry tried. The tape kept falling off. The rabbit suggested putting the balloon in a basket. \"But then I am not holding it!\" said Henry. Finally, the wise old tortoise spoke up. \"Why do you want to hold a balloon?\" \"Because everyone else can,\" said Henry sadly. \"Henry,\" said the tortoise, \"you have spikes. That is what makes you special. You can do things no one else can. You can carry apples on your back! You can roll into a ball! Why would you want to hold a silly balloon?\" Henry thought about this. \"You are right,\" he said. \"I can carry ten apples at once!\" He rolled an apple onto his back, then another, then another. \"Look at me!\" he said, walking around with ten apples. Everyone was impressed. \"That is much better than a balloon!\" said the rabbit. And Henry agreed.","es":"Henry el Erizo quería agarrar un globo. Cada vez que intentaba, sus púas lo reventaban. ¡POP! Probó sostener el hilo, pero resbalaba. \"Quizás un suéter.\" Lo intentó. ¡Funcionó! Pero no veía y chocó con un árbol. El búho sugirió el hilo con la boca. Sabía raro. La ardilla sugirió cinta. Se caía. El conejo sugirió una canasta. \"¡Pero entonces no lo sostengo!\" La tortuga sabia habló. \"¿Por qué quieres un globo?\" \"Porque todos pueden.\" \"Henry, tienes púas. Eso te hace especial. Puedes cargar manzanas en la espalda. ¿Por qué un globo?\" Henry pensó. \"Tienes razón.\" Cargó diez manzanas. \"¡Mírenme!\" Todos impresionados. \"¡Mejor que un globo!\" Y Henry estuvo de acuerdo.","ja":"ヘンリーハリネズミはふうせんをもちたかったです。もったことがありませんでした。やろうとするたびにはりでぱん！ぱふっ！「ああ」ふうせんのかけらがとんでいきました。ひもをもってみました。でもひもははりからすべりおちました。「セーターをきればいいのかな」セーターをきてやってみました。ふうせんをセーターにあてました。できました！でもみえなくてきにぶつかりました。「きをつけて」ふくろうがいいました。「ごめん、ふうせんをもちたかっただけ。」ふくろうはかんがえました。「くちでひもをもってみた？」ヘンリーがやりました。へんなあじでした。「だめだ」リスがテープをはりましょうといいました。おちました。うさぎがかごにいれましょうといいました。「でももってない！」さいごにかしこいカメがいいました。「なぜふうせんがほしいの？」「みんなもてるから。」「ヘンリー、きみにはりがある。それがとくいなところ。りんごをせなかにのせられる。まるくなれる。なぜふうせん？「そうだね」りんごをじっこせなかにのせました。「みて！」みんなかんしんしました。「ふうせんよりいい！」ヘンリーもそうおもいました。","fr":"Henri le hérisson voulait tenir un ballon. À chaque essai, ses piquants le faisaient éclater. POP ! Il essaya la ficelle, ça glissait. « Un pull ? » Il mit un pull. Ça marcha ! Mais il ne voyait pas et cogna un arbre. Le hibou suggéra la ficelle dans la bouche. Mauvais goût. L'écureuil suggéra du ruban adhésif. Ça tombait. Le lapin suggéra un panier. « Mais je ne le tiens pas ! » La vieille tortue sage parla. « Pourquoi veux-tu un ballon ? — Parce que tout le monde peut. — Henri, tu as des piquants. C'est ce qui te rend spécial. Tu peux porter des pommes sur ton dos. Pourquoi un ballon ? — Tu as raison. » Il porta dix pommes. « Regardez-moi ! » Tout le monde fut impressionné. « Mieux qu'un ballon ! » Et Henri fut d'accord."}},{"id":"animals-10","category":"animals","title":{"en":"The Fox Who Learned to Share","es":"El zorro que aprendió a compartir","ja":"わかちあうことをまなんだきつね","fr":"Le renard qui apprit à partager"},"text":{"en":"Felix the Fox was known for being greedy. If he found a berry bush, he would eat all the berries and not share with anyone. If he caught a fish, he would eat it alone. \"Mine! Mine! All mine!\" he would say, guarding his food. One winter, the snow was very deep. Felix could not find any food. He searched and searched, but the snow covered everything. He was so hungry that his tummy rumbled like thunder. Rumble, rumble, rumble! He came across a cave where a family of badgers was roasting sweet potatoes by a warm fire. The smell was amazing! Felix stood outside, drooling. \"Can I have a sweet potato?\" he asked. The mother badger looked at him. \"You never share with us. Why should we share with you?\" Felix felt ashamed. \"I know,\" he said quietly. \"I have been selfish. But I am very hungry.\" The mother badger looked at her children. They whispered to her. \"Mama, he looks cold too.\" She sighed. \"Come in, Felix. Have a sweet potato.\" Felix ate the sweet potato. It was the most delicious thing he had ever tasted. \"Thank you,\" he said, tears in his eyes. \"I do not deserve this.\" The next spring, Felix found a huge field of strawberries. Instead of eating them all, he picked the biggest, reddest ones and brought them to the badger family. \"These are for you,\" he said. \"Thank you for sharing with me when I had nothing.\" The badgers were so surprised! \"Felix, you have changed!\" \"I have,\" said Felix, smiling. \"Sharing makes food taste better.\" And it was true. The strawberries they shared together were the sweetest anyone had ever tasted.","es":"Félix el Zorro era conocido por ser codicioso. Si encontraba arbustos de bayas, los comía todos. \"¡Mío! ¡Mío! ¡Todo mío!\" Un invierno, la nieve fue muy profunda. Félix no encontraba comida. Tenía tanta hambre que su estómago rugía. Llegó a una cueva donde una familia de tejones asaba batatas. \"¿Puedo tener una?\" La madre tejón lo miró. \"Tú nunca compartes. ¿Por qué deberíamos nosotros?\" Félix se avergonzó. \"Sé que he sido egoísta.\" Los hijos susurraron: \"Mamá, también tiene frío.\" \"Entra, Félix.\" Comió la batata. \"Gracias,\" dijo con lágrimas. La primavera siguiente, Félix encontró un campo de fresas. En vez de comérselas todas, llevó las mejores a los tejones. \"Para ustedes.\" \"¡Félix, has cambiado!\" \"Compartir hace que la comida sepa mejor.\" Y era verdad.","ja":"フェリックスきつねはよくばりやでした。いちごをつくとぜんぶたべてわかちあいませんでした。「わたしの！わたしの！ぜんぶわたしの！」あるふゆ、ゆきがとてもふりました。フェリックスはたべものをみつけられませんでした。おなかがかみなりのようにぐうぐうなりました。ぐうぐうぐう！あなぐまのいえでさつまいもをやいているのみつけました。においがすごかったです。「さつまいももらえる？」おかあさんあなぐまがみました。「あなたはわかちあわないのに？」「わかってる。でもとてもおなかがすいた。」こどもたちがささやきました。「かあさん、さむそうだよ。」「はいってフェリックス。」さつまいもをたべました。いちばんおいしいものでした。「ありがとう」なみだをながしました。はるになるとフェリックスはいちごのはたけをみつけました。ぜんぶたべずにいちばんおいしいものをあなぐまにもっていきました。「これを。」「フェリックスかわったね！」「わかちあうとおいしくなるんだ。」ほんとうでした。","fr":"Félix le renard était connu pour être gourmand. S'il trouvait des baies, il les mangeait toutes. « À moi ! À moi ! Tout à moi ! » Un hiver, la neige était très profonde. Félix ne trouvait rien à manger. Son ventre grondait comme le tonnerre. Il arriva à une grotte où une famille de blaireaux rôtissait des patates douces. « Puis-je en avoir une ? » La maman blaireau le regarda. « Tu ne partages jamais. Pourquoi partagerions-nous ? — Je sais, » dit Félix, honteux. Les enfants chuchotèrent : « Maman, il a l'air froid aussi. — Entre, Félix. » Il mangea la patate. « Merci, » dit-il, les larmes aux yeux. Au printemps, Félix trouva un champ de fraises. Au lieu de tout manger, il apporta les meilleures aux blaireaux. « Pour vous. — Félix, tu as changé ! — Partager rend la nourriture meilleure. » Et c'était vrai."}}],Jf=[{"id":"magic-1","category":"magic","title":{"en":"The Tiny Dragon","es":"El dragón pequeño","ja":"ちいさなドラゴン","fr":"Le petit dragon"},"text":{"en":"Deep in an enchanted forest, inside a hollow oak tree, lived a dragon named Spark. But Spark was no ordinary dragon — he was the size of a teacup! While other dragons breathed fire that could roast a whole cow, Spark could barely toast a marshmallow. \"Pfft!\" went his tiny flame. It was warm, but not very impressive. The other dragons laughed. \"Look at Spark! He is so small!\" said the big dragons, flapping their enormous wings. \"His fire is like a candle!\" Spark felt sad. He tried to breathe bigger flames. He ate extra spicy peppers. He practiced every day. But his flame stayed tiny. \"I will never be a real dragon,\" he said, sitting on a mushroom and sighing. A little girl named Lily found him sitting there. \"Are you a dragon?\" she asked, eyes wide. \"A very small one,\" said Spark. \"The smallest dragon in the world.\" \"You are perfect!\" said Lily. \"I need a small dragon. The bakery oven is broken, and we need just a tiny flame to bake the cookies!\" Spark went to the bakery. He breathed his tiny flame into the oven — pfft! — and the oven was the perfect temperature! The cookies came out golden and delicious. \"Amazing!\" said the baker. \"You are the best dragon I have ever met!\" Word spread. People needed small flames for all sorts of things — lighting birthday candles, warming tea, toasting crème brûlée, starting campfires. Spark was busier than all the big dragons put together! \"I may be small,\" said Spark, \"but I am exactly the right size for what the world needs.\" And he breathed a tiny, happy flame — pfft! — and toasted one perfect marshmallow.","es":"En un bosque encantado, dentro de un roble hueco, vivía un dragón llamado Spark. Pero Spark era del tamaño de una taza de té. \"¡Pfft!\" iba su pequeña llama. Los otros dragones se reían. \"¡Miren a Spark! ¡Es tan pequeño!\" Spark estaba triste. Una niña llamada Lily lo encontró. \"¡Eres un dragón! ¡Perfecto! El horno de la panadería está roto y necesitamos una llama pequeña.\" Spark sopló en el horno — ¡pfft! — y las galletas salieron doradas. \"¡Increíble!\" Todos necesitaban pequeñas llamas: velas de cumpleaños, té, crema catalana. Spark estaba más ocupado que todos los dragones grandes juntos. \"Puede que sea pequeño, pero soy del tamaño perfecto.\" Y tostó un malvavisco perfecto.","ja":"まほうのもりのうつろいたかぎのなかにスパークというドラゴンがすんでいました。でもスパークはちゃわんのサイズでした！ほかのドラゴンはおおきい火をはいてスパークはマシュマロもやけませんでした。「ぷふん！」ちいさなひかりでした。ほかのドラゴンがわらいました。「スパークはちいさい！」スパークはかなしくなりました。ゆりというおんなのこがみつけました。「ドラゴン？パンやのオーブンがこわれてちいさな火がいるの！」スパークがぷふんとはくとオーブンがぴったりになりました！クッキーがきんいろになりました。「すごい！」たびびとがきてバースデーキャンドルやおちゃやキャンプファイヤーにちいさな火がほしくなりました。スパークはおおきいドラゴンよりいそがしくなりました。「ちいさくてもぴったりのサイズだ。」ぴふんとひとつのマシュマロをやきました。","fr":"Dans une forêt enchantée, dans un chêne creux, vivait un dragon nommé Spark. Mais Spark était de la taille d'une tasse de thé ! « Pfft ! » faisait sa petite flamme. Les autres dragons riaient. Spark était triste. Une fille nommée Lily le trouva. « Tu es un dragon ! Parfait ! Le four de la boulangerie est cassé et il nous faut une petite flamme. » Spark souffla — pfft ! — et les biscuits sortirent dorés. Tout le monde avait besoin de petites flammes : bougies, thé, crème brûlée. Spark fut plus occupé que tous les grands dragons. « Je suis petit mais de la bonne taille. » Et il grillait un guimauve parfait."}},{"id":"magic-2","category":"magic","title":{"en":"The Wizard's Lost Hat","es":"El sombrero perdido del mago","ja":"まほうつかいのぼうし","fr":"Le chapeau perdu du sorcier"},"text":{"en":"Wizard Wumble was the most forgetful wizard in the land. He could turn a frog into a prince, but he could not remember where he put his hat. \"Where is my hat?\" he asked every morning. \"It is on your head, dear,\" said his cat, Whiskers. \"Oh! So it is!\" But one day, the hat was truly gone. Wumble looked under his bed, behind his cauldron, inside his spell book. No hat. \"Whiskers! I have lost my hat!\" \"You cannot go outside without your hat,\" said Whiskers. \"People will think you are not a wizard!\" Wumble tried a spell to summon the hat. \"Hat-icus find-icus!\" A chicken appeared. \"That is not my hat.\" He tried again. \"Hat-icus appear-icus!\" A pumpkin appeared. \"Also not my hat.\" He tried one more time. \"Hat-icus come-icus!\" A small dragon appeared and burped. \"Definitely not my hat.\" Wumble set out to find it. He asked the baker. \"Have you seen my hat?\" \"The blue one with stars?\" asked the baker. \"Yes!\" \"No, I have not seen it.\" He asked the farmer. \"Have you seen my hat?\" \"The pointy one with moons?\" \"Yes!\" \"Nope.\" He asked the children playing in the square. \"Have you seen my hat?\" A little girl raised her hand. \"Is it the hat that the scarecrow is wearing in the cornfield?\" Wumble ran to the cornfield. There was the scarecrow, wearing his hat! \"My hat!\" cried Wumble. \"But how did it get here?\" The wind had blown it off his head the night before, all the way to the cornfield. The scarecrow looked very stylish. \"I hate to take it from you,\" said Wumble. The scarecrow just smiled (well, as much as a scarecrow can smile). Wumble took his hat back and placed it firmly on his head. \"I will tie it on this time,\" he said. And he never lost it again. Well, almost never.","es":"El Mago Wumble era el mago más olvidadizo del reino. Podía convertir ranas en príncipes, pero no recordaba dónde dejaba su sombrero. \"¿Dónde está mi sombrero?\" preguntaba cada mañana. \"En tu cabeza, querido,\" decía su gato Whiskers. Pero un día, el sombrero desapareció. Probó hechizos: aparecieron pollos, calabazas y dragones. Preguntó al panadero, al granjero, a los niños. Una niña levantó la mano: \"¿El espantapájaros del maizal lo lleva?\" Corrió al maizal. ¡Allí estaba! El viento lo había llevado. \"Lo ataré esta vez.\" Y casi nunca lo perdió de nuevo.","ja":"ワンブルまほうつかいはせかいいちわすれっぽいまほうつかいでした。カエルをおうじにできるけどぼうしのばしょをわすれます。「ぼうしはどこ？」「あたまのうえよ」ねこウィスカーズがいいました。でもあるひぼうしがほんとうになくなりました。「ウィスカーズ！ぼうしをなくした！」「ぼうしなしではでかけられない！」まほうをつかいました。「ぼうしのみつけ！」にわとりがでました。「ちがう。」「ぼうしでてこい！」かぼちゃがでました。「ちがう。」「ぼうしでて！」ちいさなドラゴンがでてげふっとしました。「ぜったいちがう。」ワンブルはさがしにいきました。パンや、のうや、こどもたちにききました。おんなのこがてをあげました。「とうもろこしはたけのかかしがかぶってる？」はしりました。かかしがかぶってました！かぜがとばしたのです。「こんどはむすぶよ。」もうほとんどなくしませんでした。","fr":"Le sorcier Wumble était le plus étourdi du royaume. Il pouvait transformer une grenouille en prince, mais ne retrouvait jamais son chapeau. « Où est mon chapeau ? — Sur ta tête, » disait son chat. Mais un jour, il disparut. Il essaya des sorts : poulets, citrouilles, dragons apparurent. Il demanda au boulanger, au fermier, aux enfants. Une fille leva la main : « L'épouvantail du champ de maïs le porte ? » Il courut. L'épouvantail le portait ! Le vent l'avait emporté. « Je l'attacherai cette fois. » Et il ne le perdit presque jamais plus."}},{"id":"magic-3","category":"magic","title":{"en":"The Fairy Who Lost Her Wings","es":"El hada que perdió sus alas","ja":"つばさをなくしたようせい","fr":"La fée qui perdit ses ailes"},"text":{"en":"Bella the Fairy woke up one morning and her wings were gone! She looked behind her — nothing. She looked under her pillow — nothing. \"My wings! Where are my wings?\" she cried. Without wings, she could not fly. She had to walk everywhere, like a human! Her legs got tired. Her feet hurt. \"This is terrible!\" she said, trudging through the fairy garden. Her friend, a butterfly named Blue, flew down. \"Why are you walking?\" \"I lost my wings!\" Bella wailed. Blue gasped. \"Lost your wings? That is terrible! Let me help you look!\" They searched the garden. They asked the ladybugs — they had not seen the wings. They asked the bees — they had not seen them either. They asked the wise old moth. \"When did you last have them?\" the moth asked. \"Last night, at the Fairy Ball,\" said Bella. \"I was dancing and then...\" She thought hard. \"And then I fell asleep in a flower!\" They went to the flower garden. In a big pink peony, they found the wings! They had slipped off while Bella was sleeping and were stuck to the flower petals! \"My wings!\" Bella put them on and fluttered up into the air. \"I can fly again!\" she cheered. \"Next time, I will tie them on before sleeping!\" she said. The moth nodded wisely. \"That is a good lesson for all fairies.\" And from that day on, every fairy in the garden tied their wings before bed.","es":"Bella el Hada se despertó sin sus alas. \"¡Mis alas!\" Buscó en el jardín. Preguntó a las mariquitas, a las abejas. El viejo polilla preguntó: \"¿Cuándo las tuviste por última vez?\" \"Anoche, en el Baile de Hadas. Me dormí en una flor.\" Fueron al jardín. En una peonía, ¡encontró las alas pegadas a los pétalos! \"¡Mis alas!\" Las puso y voló. \"¡La próxima vez las ataré antes de dormir!\" Y desde entonces, todas las hadas atan sus alas al acostarse.","ja":"ベラようせいはあるあさおきてつばさがなくなりました！「つばさ！つばさはどこ？」つばさなしだととべません。あるいてあるいてあしいたくてした。「たいへんだ！」ちょうちょのブルーがとんできました。「なんであるいてる？」「つばさをなくした！」さがしました。てんとうむしやはちにききました。かしこいガがききました。「さいごにあったのはいつ？」「きのうのよる、フェアリーボールで。おはなでねちゃった！」はなばたけにいきました。ピンクのぼたんでつばさがはなびらにくっついてました！「つばさ！」はめてそらへとびました。「こんどはねるまえにむすぶ！」それからみんなつばさをむすんでねるようになりました。","fr":"Bella la fée se réveilla sans ses ailes. « Mes ailes ! » Elles cherchèrent dans le jardin, demandèrent aux coccinelles et aux abeilles. Le vieux papillon de nuit demanda : « Quand les as-tu eues la dernière fois ? — Hier soir, au Bal des Fées. Je me suis endormie dans une fleur. » Elles allèrent au jardin. Dans une pivoine, les ailes étaient collées aux pétales ! « Mes ailes ! » Elle les mit et vola. « La prochaine fois, je les attacherai avant de dormir ! » Et depuis, toutes les fées attachent leurs ailes en se couchant."}},{"id":"magic-4","category":"magic","title":{"en":"The Magic Paintbrush","es":"El pincel mágico","ja":"まほうのふで","fr":"Le pinceau magique"},"text":{"en":"A poor boy named Kai found a paintbrush in the river. It looked old and ordinary, but when he dipped it in paint and drew a fish on a rock, the fish jumped off the rock and swam away! \"This is a magic paintbrush!\" said Kai. He painted a bird, and the bird flew into the sky. He painted a flower, and it bloomed right there. \"I can paint anything!\" Kai was excited. He painted food for the hungry villagers — rice, fruit, bread. All of it became real! The village was so happy. But the greedy king heard about the magic paintbrush. \"Bring me that brush!\" he commanded. His soldiers took it from Kai. The king painted a pile of gold. But nothing happened. \"Why won't it work?\" he shouted. He painted again. Still nothing. The brush would not work for greedy people. \"Give it back to the boy!\" the king ordered. Kai took the brush back and painted a key, which unlocked the king's treasure room. But instead of taking the gold, Kai painted beautiful things for everyone — warm houses, green gardens, playful kittens. The king watched, amazed. \"You could have taken all my gold.\" \"Gold does not make people happy,\" said Kai. \"But warm houses and playful kittens do.\" The king thought about this for a long time. \"Maybe... you are right.\" He gave Kai his own castle to use as a school, where Kai taught all the village children to paint. And the magic paintbrush never worked for greed — only for kindness.","es":"Un niño llamado Kai encontró un pincel en el río. ¡Era mágico! Lo que pintaba cobraba vida. Pintó peces que nadaron, aves que volaron, comida para los aldeanos. El rey codicioso lo robó, pero no funcionó para él. Kai lo recuperó y pintó casas cálidas, jardines, gatitos. \"El oro no da felicidad,\" dijo. El rey reflexionó y le dio su castillo como escuela. El pincel solo funcionaba con bondad.","ja":"かわでカイがふでをみつけました。ふではまほうでした！えをかくとほんものになりました。さかなをかくとおよぎ、とりをかくととびました。むらびとにたべものをかきました。よくぼうなおうさまがふでをとりました。でもおうさまにはききませんでした。カイがもどしてへや、にわ、こねこをえがきました。「きんはしあわせをつくらない。」おうさまはかんがえてしろをがっこうにしました。ふではしんせつなひとにしかききませんでした。","fr":"Kai trouva un pinceau dans la rivière. Il était magique ! Ce qu'il peignait devenait réel. Poissons qui nageaient, oiseaux qui volaient, nourriture pour les villageois. Le roi avare le vola, mais le pinceau ne fonctionna pas pour lui. Kai le reprit et peignit maisons chaudes, jardins, chatons. « L'or ne rend pas heureux. » Le roi réfléchit et donna son château comme école. Le pinceau ne fonctionnait qu'avec la gentillesse."}},{"id":"magic-5","category":"magic","title":{"en":"The Mermaid and the Music Box","es":"La sirena y la caja de música","ja":"にんぎょとオルゴール","fr":"La sirène et la boîte à musique"},"text":{"en":"Deep beneath the waves, a young mermaid named Coral found a music box. It had fallen from a ship long ago. She turned the key — tinka tinka tinka — and a beautiful melody played. Coral had never heard music before! In the ocean, there were whale songs and dolphin clicks, but nothing like this. \"What is this?\" she whispered. She listened every day. She hummed the melody while she swam. The fish swam along beside her, entranced. Even the grumpy octopus stopped to listen. \"What is that sound?\" he asked. \"It is music from the land,\" said Coral. \"I wish I could share it with everyone.\" The octopus had an idea. \"I can make instruments from shells!\" He made a conch trumpet. The seahorses made xylophones from coral. The crabs banged clamshell drums. Soon, the whole ocean was making music! They had a concert — the first ever Ocean Symphony. Whales sang bass. Dolphins played melody. Crabs kept the beat. And Coral played her music box for the grand finale. Fish came from miles around. Even the old sea turtle came, and he never went anywhere. \"This is the most beautiful thing I have ever heard,\" he said, wiping a tear. The music floated up to the surface, and sailors on ships would stop and listen. \"Where is that beautiful music coming from?\" they wondered. And down below, Coral smiled, knowing she had brought music to the entire ocean.","es":"Bajo las olas, la sirena Coral encontró una caja de música. Tinka tinka — una melodía preciosa. Nunca había oído música. El pulpo hizo instrumentos con conchas: trompetas, xilófonos de coral, tambores de almejas. Dieron el primer Concierto del Océano. Ballenas cantaron bajo, delfines melodía, cangrejos ritmo. Coral tocó su caja de música al final. La música subió a la superficie y los marineros escuchaban maravillados. Coral sonrió, sabiendo que había traído música a todo el océano.","ja":"うみのそこでコーラルというにんぎょがオルゴールをみつけました。きかくをまわすとチカチカときれいなおんがくがながれました。うみではおんがくをきいたことがありませんでした。「なにこれ？」まいびきききました。うたいながらおよぎました。さかなもいっしょにおよぎました。おこりやのたこもききました。「なんのおと？」「りくのおんがくだよ。」たこがアイデアをだしました。「がいからがっきをつくろう！」らっぱ、シロフォン、たいこ。うみぜんぶがおんがくをつくりました。はじめてのうみのおんがくかいでした。くじらがベース、イルカがメロディー、カニがリズム。コーラルがさいごにオルゴールをならしました。おんがくはひょうめんにのぼりふなのりたちがききました。コーラルはわらいました。","fr":"Sous les vagues, la sirène Coral trouva une boîte à musique. Tinka tinka — une mélodie magnifique. Elle n'avait jamais entendu de musique. Le poulpe fabriqua des instruments avec des coquillages : trompettes, xylophones en corail, tambours en coquilles. Ils donnèrent le premier Concert de l'Océan. Baleines en basse, dauphins en mélodie, crabes en rythme. Coral joua sa boîte à musique en final. La musique monta à la surface et les marins écoutèrent, émerveillés. Coral sourit, sachant qu'elle avait apporté la musique à tout l'océan."}},{"id":"magic-6","category":"magic","title":{"en":"The Invisible Cloak","es":"La capa invisible","ja":"みえないマント","fr":"La cape invisible"},"text":{"en":"A young wizard named Finn found a cloak in his grandmother's attic. When he put it on, he disappeared! \"Grandma! I am invisible!\" \"Oh, that old thing,\" said Grandma. \"Your grandfather used to wear it to hide from his chores.\" Finn was thrilled. He could sneak anywhere! He went to the kitchen and took a cookie. Nobody saw him! He went to the garden and picked the biggest strawberry. Nobody saw him! He went to the village and listened to people's conversations. \"This is amazing!\" But then, he heard something sad. Two children were talking. \"I wish someone would help us fix our treehouse,\" said one. \"Nobody ever helps us.\" Finn felt bad. He had been using the cloak for selfish things — cookies, strawberries, spying. He could use it to help! He put on the cloak and went to the treehouse at night. He fixed the broken steps. He hammered new boards. He painted the walls. In the morning, the children found their treehouse fixed! \"Who did this?\" they asked. Nobody knew. Finn did many good things with the cloak — he left food on doorsteps for hungry families, he fixed broken toys, he planted flowers in empty gardens. Everyone wondered who the mysterious helper was. One day, the cloak stopped working. Finn was visible again. \"It only works when you do not need recognition,\" said Grandma. \"You have learned to be kind without being seen. You do not need the cloak anymore.\" Finn smiled. He went outside and helped his neighbors openly. And it felt even better than being invisible.","es":"El joven mago Finn encontró una capa invisible. ¡Podía esconderse! Tomó galletas, fresas, espió. Pero escuchó a unos niños que querían arreglar su casa del árbol. Finn usó la capa para arreglarla de noche. Hizo muchas buenas acciones en secreto. Un día, la capa dejó de funcionar. \"Solo funciona cuando no buscas reconocimiento,\" dijo su abuela. \"Aprendiste a ser amable sin ser visto. Ya no la necesitas.\" Finn sonrió y ayudó a todos abiertamente. Se sintió aún mejor.","ja":"フィンまほうつかいはおばあさんのやねのうえでマントをみつけました。きるとみえなくなりました！クッキーをとりいちごをとりひそかにききました。でもこどもたちがツリーハウスをなおしたいといっているのをききました。フィンはよるにツリーハウスをなおしました。ひみつでいいことをたくさんしました。あるひマントがきかなくなりました。「みとめられなくてもやさしくできるようになったからもういらない」おばあさんがいいました。フィンはみんなのまえでたすけました。もっといいきもちでした。","fr":"Le jeune sorcier Finn trouva une cape invisible. Il pouvait se cacher ! Il prit des biscuits, des fraises, espia. Mais il entendit des enfants qui voulaient réparer leur cabane. Finn répara la cabane la nuit. Il fit beaucoup de bonnes actions en secret. Un jour, la cape cessa de fonctionner. « Elle ne marche que quand tu ne cherches pas de reconnaissance, » dit sa grand-mère. « Tu as appris à être gentil sans être vu. » Finn sourit et aida tout le monde ouvertement. C'était encore mieux."}},{"id":"magic-7","category":"magic","title":{"en":"The Magic Garden","es":"El jardín mágico","ja":"まほうのおはなばたけ","fr":"Le jardin magique"},"text":{"en":"Maya moved to a new house with a garden that was completely bare. No flowers, no grass, just dirt. \"I will plant a garden,\" she said. But every seed she planted grew into something magical! She planted a sunflower seed — and it grew ten feet tall in one hour, with a face that smiled! \"Hello, Maya!\" said the sunflower. \"Um... hello?\" said Maya. She planted a pumpkin seed — and the pumpkin grew to the size of a car! It rolled around the garden on its own. She planted a strawberry — and the plant produced strawberries that glowed in the dark! Her neighbors were amazed. \"How did you do that?\" asked Mrs. Green. \"I just planted seeds!\" said Maya. \"It must be magic soil,\" said Mr. Brown, examining the dirt. Indeed, it was. A fairy had lived in the garden long ago and left her magic behind. The garden became the talk of the town. People came from everywhere to see the smiling sunflower, the giant rolling pumpkin, and the glowing strawberries. Maya shared the magic seeds with everyone. Soon, the whole street had magical gardens. There were tomatoes that sang, roses that changed color, and cabbages that told jokes. \"Why did the tomato blush? Because it saw the salad dressing!\" said the cabbage. Everyone groaned and laughed. \"This is the best neighborhood ever,\" said Maya. And the magic garden grew and grew, making everyone who visited smile and laugh. Even the plants were happy. Especially the sunflower, who never stopped grinning.","es":"Maya plantó un jardín y cada semilla creció mágica. Un girasol que hablaba, una calabaza gigante que rodaba, fresas que brillaban. Resultó que un hada había vivido allí. Compartió las semillas mágicas. Pronto, toda la calle tuvo jardines mágicos: tomates que cantaban, rosas que cambiaban de color, coles que contaban chistes. \"¡El mejor vecindario!\" Y el jardín creció, haciendo sonreír a todos.","ja":"マヤはあたらしいいえにひっこしました。にはは何もない土だけでした。「おはなばたけをつくろう」たねをうえました。ひまわりのタネをうえると１じかんでじゅうメートルにのびてわらいました！「こんにちはマヤ！」かぼちゃのタネをうえるとくるまでおおきくなってじぶんでコロコロしました。いちごをうえるとやみでぴかぴかしました！むかしえんにようせいがすんでいたのです。マヤはみんなにまほうのタネをわけました。うたうトマト、いろがかわるバラ、ジョークをいうキャベツ。「トマトはなぜあかくなった？サラダドレッシングをみたから！」みんなわらいました。「いちばんいいまちだ！」","fr":"Maya planta un jardin et chaque graine poussa magiquement. Un tournesol qui parlait, une citrouille géante qui roulait, des fraises qui brillaient. Une fée avait vécu là autrefois. Maya partagea les graines magiques. Bientôt, toute la rue eut des jardins magiques : tomates qui chantaient, roses qui changeaient de couleur, choux qui racontaient des blagues. « Le meilleur quartier ! » Et le jardin grandit, faisant sourire tout le monde."}},{"id":"magic-8","category":"magic","title":{"en":"The Crystal Ball's Bad Day","es":"El mal día de la bola de cristal","ja":"すいきゅうのわるいひ","fr":"La mauvaise journée de la boule de cristal"},"text":{"en":"Crystal the Crystal Ball was having a bad day. Usually, she showed the future — kings on thrones, heroes on quests, dragons in caves. But today, she was only showing silly things! \"Show me tomorrow!\" said the wizard. Crystal showed a cat wearing a hat. \"That is not the future! That is a cat in a hat!\" The wizard shook her. \"Show me something important!\" Crystal showed a duck riding a bicycle. \"A duck?! On a bicycle?!\" The wizard was very frustrated. \"What is wrong with you today?\" Crystal tried her best. She concentrated. She focused. She showed... a pizza. \"A PIZZA?!\" The wizard threw his hands up. \"You are useless today!\" Crystal felt bad. She did not know why she was showing silly things. The wizard's apprentice, a young girl named Ava, came by. \"What is wrong with the crystal ball?\" \"She is broken!\" said the wizard. \"She keeps showing cats and ducks and pizza.\" Ava looked into the ball. \"Maybe she is not broken. Maybe she is showing what you need to see.\" \"I need to see a cat in a hat?\" \"When was the last time you laughed?\" asked Ava. The wizard thought. And thought. And thought. \"I... cannot remember.\" \"The crystal ball is telling you to have fun!\" said Ava. \"Look at the cat! It is funny! Look at the duck! It is ridiculous! Look at the pizza — who does not love pizza?\" The wizard looked at the images again. The cat was pretty funny. The duck on a bicycle was hilarious. And the pizza looked delicious. \"Maybe you are right,\" said the wizard. He ordered a pizza, put on a funny hat, and laughed for the first time in years. Crystal glowed happily. She was not broken — she was just trying to make an old wizard smile.","es":"La bola de cristal Crystal tuvo un mal día. Solo mostraba cosas tontas: gatos con sombrero, patos en bicicleta, pizzas. El mago estaba frustrado. Pero la aprendiz Ava dijo: \"¿Cuándo fue la última vez que reíste?\" El mago no recordaba. \"La bola te dice que te diviertas.\" El mago pidió pizza, se puso un sombrero gracioso y rió. Crystal brilló feliz. No estaba rota, solo quería hacer sonreír al mago.","ja":"すいきゅうクリスタルはわるいひでした。ふつうみらいをみせましたがきょうはおかしなことばかりみせました。「あしたをみせて！」ねこがぼうしをかぶってました。「これはみらいじゃない！」アヒルがじてんしゃにのってました。ピザがみえました。「ピザ！？」みならいのアバがきていいました。「さいごにわらったのはいつ？」「…おもいだせない。」「たのしめっていってるんだよ。」まほうつかいはピザをたのんでおかしなぼうしをかぶってわらいました。クリスタルはぴかぴかしました。こわれてなかった—わらってほしかっただけでした。","fr":"La boule de cristal Crystal eut une mauvaise journée. Elle ne montrait que des choses drôles : chats en chapeau, canards à vélo, pizzas. Le sorcier était frustré. L'apprentie Ava dit : « Quand as-tu ri pour la dernière fois ? — Je ne me souviens pas. — La boule te dit de t'amuser. » Le sorcier commanda une pizza, mit un chapeau drôle et rit. Crystal brilla heureuse. Elle n'était pas cassée — elle voulait juste faire sourire le sorcier."}},{"id":"magic-9","category":"magic","title":{"en":"The Spell That Went Wrong","es":"El hechizo que salió mal","ja":"まちがえたまほう","fr":"Le sort qui tourna mal"},"text":{"en":"Young witch Willow was practicing spells. \"Turn this apple into a frog!\" she said. The apple turned into a frog. \"Turn this stone into a bird!\" The stone turned into a bird. \"I am getting good at this!\" she said proudly. \"Now, turn this pillow into a... into a...\" She could not remember the word. \"Into a penguin!\" she said, not sure if that was right. The pillow turned into a penguin. But not a normal penguin — a penguin that could talk! \"Hello!\" said the penguin. \"Where am I?\" \"Oh no,\" said Willow. \"I turned my pillow into a talking penguin.\" \"I am cold,\" said the penguin. \"Can I have a blanket?\" Willow was confused. She tried to turn the penguin back into a pillow. \"Penguin-icus pillow-icus!\" Nothing happened. \"Hmm. I should have studied more.\" The penguin waddled around the house. \"Nice place. Do you have fish?\" \"I have crackers.\" \"Crackers will do.\" The penguin ate all the crackers. \"Now what?\" asked Willow. \"Well, I cannot sleep without my pillow. And you seem nice. Can you at least be soft?\" The penguin fluffed its feathers. \"I am pretty soft.\" Willow tried sleeping on the penguin. It was surprisingly comfortable! \"Actually, you make a better pillow than my old one.\" \"I will take that as a compliment,\" said the penguin. The next day, Willow's teacher helped her turn the penguin back. But Willow missed her penguin pillow. So she turned a new pillow into a penguin — on purpose this time. \"Hello again!\" said the penguin. \"Fish?\" \"Crackers,\" said Willow. And they lived happily ever after, as witch and penguin-pillow.","es":"La joven bruja Willow practicaba hechizos. Manzana → rana ✓. Piedra → pájaro ✓. \"¡Almohada en pingüino!\" El pingüino hablaba: \"¡Hola! ¿Dónde estoy?\" No podía revertirlo. El pingüino comió galletas y resultó ser una almohada cómoda. Al día siguiente, su maestra lo revirtió. Pero extrañaba su almohada-pingüino. Así que convirtió otra almohada en pingüino a propósito. \"¿Pescado?\" \"Galletas.\" Y vivieron felices.","ja":"ウィローまじょはまほうのれんしゅうをしていました。りんごをカエルに、いしをとりにできました。「つぎまくらをペンギンに！」ペンギンがはなしました。「こんにちは！ここはどこ？」「まくらをペンギンにしちゃった。」もどせませんでした。ペンギンはクラッカーをたべてまくらにかるととてもねやすかったです。つぎのひせんせいがもどしました。でもペンギンまくらがなつかしくてわざとペンギンにしました。「さかな？」「クラッカー。」ふたりはしあわせにくらしました。","fr":"La jeune sorcière Willow pratiquait des sorts. Pomme → grenouille ✓. Pierre → oiseau ✓. « Oreiller en pingouin ! » Le pingouin parla : « Bonjour ! Où suis-je ? » Impossible de l'annuler. Le pingouin mangea des biscuits et se révéla être un oreiller confortable. Le lendemain, sa maître l'annula. Mais Willow manquait son oreiller-pingouin. Elle en recréa un exprès. « Poisson ? — Biscuits. » Et ils vécurent heureux."}},{"id":"magic-10","category":"magic","title":{"en":"The Unicorn Who Could Not Sparkle","es":"El unicornio que no podía brillar","ja":"きらきらできないユニコーン","fr":"La licorne qui ne pouvait pas briller"},"text":{"en":"Star the Unicorn was the only unicorn in the forest who could not sparkle. All the other unicorns sparkled when they walked — glitter fell from their manes, their horns glowed with rainbow light, their hoofprints shimmered. But Star was... dull. \"Maybe I am not really a unicorn,\" said Star, looking at her reflection in the pond. Her horn was there, her mane was there, but no sparkle. \"You are a unicorn,\" said her mother. \"Sparkle comes from inside. You just have not found yours yet.\" Star tried everything. She ate glittery food. She stood in the moonlight. She practiced sparkling. Nothing worked. \"I am a sparkle-less unicorn,\" she said sadly. One day, a lost child wandered into the forest. The child was crying. \"I cannot find my way home!\" Star went to the child. \"Do not cry. I will help you.\" Star walked beside the child through the dark forest. She used her horn to light the path — and to her surprise, it glowed! Not with rainbow light, but with a warm, golden light. \"Your horn is glowing!\" said the child, amazed. \"So it is!\" said Star, equally amazed. She guided the child all the way home. When they arrived, the child hugged Star. \"Thank you. You are the most beautiful unicorn I have ever seen.\" And as Star walked back to the forest, she noticed something — she was sparkling! Not with glitter, but with a warm, golden shine that came from her heart. \"My sparkle was inside me all along,\" she said. \"I just needed to help someone to find it.\" And from that day on, Star sparkled brighter than any unicorn in the forest.","es":"Star la Unicornio no podía brillar. Los demás unicornios brillaban al caminar. Star probó todo: comida brillante, luz de luna. Nada. Un día encontró a un niño perdido que lloraba. Star usó su cuerno para guiarlo — ¡y brilló con luz dorada! El niño la abrazó: \"¡La unicornio más bella!\" Al volver, Star brillaba con una luz dorada que venía del corazón. \"Mi brillo estaba dentro todo el tiempo.\" Y brilló más que cualquier unicornio.","ja":"スターユニコーンはきらきらできませんでした。みんなはあるくときらきらしました。スターピカピカしようとしてもできませんでした。あるひまいごのこどもをみつけました。こどもがないていました。スターはつのをひからせてみちをてんあんしました。さんのつのがきんいろにひかりました！こどもはだきしめました。「いちばんきれいなユニコーン！」もどるとスターピカピカしていました。こころからきんいろのひかりがでていました。「ピカピカはずっとなかにあったんだ。」それからスターピカピカしました。","fr":"Star la licorne ne pouvait pas briller. Les autres licornes scintillaient en marchant. Star essaya tout : nourriture brillante, lumière de lune. Rien. Un jour, elle trouva un enfant perdu qui pleurait. Star utilisa sa corne pour le guider — et elle brilla d'une lumière dorée ! L'enfant la serra : « La plus belle licorne ! » En rentrant, Star scintillait d'une lumière dorée venue du cœur. « Mon éclat était en moi depuis toujours. » Et elle brilla plus que toute autre licorne."}}],Xf=[{"id":"adventures-1","category":"adventures","title":{"en":"The Little Boat That Sailed","es":"El barquito que navegó","ja":"こきぼうのぼうけん","fr":"Le petit bateau qui navigua"},"text":{"en":"In a harbor where big ships towered like floating buildings, there was a tiny boat named Pebble. Pebble was so small that the big ships laughed. \"You are not a real boat!\" said the cruise ship. \"You are a toy!\" said the cargo ship. \"You cannot cross the ocean!\" Pebble did not care. \"I may be small, but I am brave,\" said Pebble. One morning, Pebble set sail. The wind was gentle, the waves were small, and the sun was warm. Pebble sailed past the harbor, past the lighthouse, past the big ships. \"Where are you going?\" called the lighthouse. \"To see the world!\" called Pebble. The first day, Pebble met a family of dolphins. \"You are far from home, little boat,\" said the dolphin. \"I am on an adventure!\" said Pebble. The dolphins guided Pebble through a reef safely. The second day, a storm came. The waves were as tall as houses! Pebble was tossed up and down — wheee! Then splash! Then wheee again! \"Hold on!\" Pebble said to itself. The storm lasted all night. But Pebble was small and light, and the big waves just lifted Pebble up and over. The big ships would have struggled, but Pebble just rode the waves like a surfboard! In the morning, the storm cleared. Pebble found a beautiful island with palm trees and white sand. \"I discovered an island!\" said Pebble. A parrot flew down. \"Welcome! Nobody has ever visited us before!\" Pebble stayed for a week, exploring the island. Then Pebble sailed home. When the big ships saw Pebble return, they were amazed. \"You survived the storm?\" \"I did! And I discovered an island!\" The big ships were silent. Then the cruise ship said, \"Maybe... small boats can do big things.\" \"That is exactly right,\" said Pebble, smiling.","es":"En un puerto donde los grandes barcos se reían de él, el barquito Pebble zarpó. \"¡A ver el mundo!\" Sobrevivió una tormenta — las olas lo lanzaban como tabla de surf. Descubrió una isla con palmeras. Al regresar, los barcos grandes se asombraron. \"Quizás los barcos pequeños pueden hacer cosas grandes.\" \"¡Exacto!\" dijo Pebble.","ja":"おおきなふねがわらうみなとにペブルというちいさなふねがありました。「ほんもののふねじゃない！」「おもちゃだ！」ペブルはきにしませんでした。「ちいさいけどゆうきだよ。」あるあさペブルはしゅっぱつしました。イルカにあいふうあらしにあいました。でもペブルはちいさくかるいからなみのようにサーフボードでこえました。あさになるとしろいすなとヤシのきのしまをみつけました。「しまをはっけん！」かえるとおおきなふねがおどろきました。「ちいさなふねがおおきなことをできるんだ。」","fr":"Dans un port où les grands navires se moquaient de lui, le petit bateau Pebble appareilla. « Voir le monde ! » Il survécut à une tempête — les vagues le lançaient comme un surf. Il découvrit une île avec palmiers. En rentrant, les grands bateaux furent émerveillés. « Les petits bateaux peuvent faire de grandes choses. — Exactement ! » dit Pebble."}},{"id":"adventures-2","category":"adventures","title":{"en":"The Hot Air Balloon Ride","es":"El viaje en globo","ja":"ふうせんのたび","fr":"Le voyage en montgolfière"},"text":{"en":"Tom and his dad found a hot air balloon in a field. \"Can we ride it?\" asked Tom. \"I do not know how to fly a balloon,\" said Dad. But the balloon had instructions painted on the basket. \"Pull cord to go up. Pull other cord to go down. Do not pull both at once.\" \"Simple enough!\" said Dad. They climbed in and pulled the up cord. Whoosh! The balloon shot into the sky! \"Too fast! Too fast!\" shouted Dad. They went up past the birds, past the clouds, past a very confused airplane pilot. \"Where are you going?\" the pilot asked on the radio. \"We are not sure!\" said Dad. The balloon floated over the city. Tom could see his school, his house, and the park. \"Everything looks so small from up here!\" said Tom. \"The cars look like ants!\" The wind carried them over the mountains. They saw snow on the peaks and eagles nesting on cliffs. \"This is amazing!\" said Tom. Then the wind changed. They drifted toward the ocean! \"Pull the down cord!\" shouted Tom. Dad pulled it. They slowly descended, but they were still over the water. \"We are going to land in the sea!\" Just then, a fishing boat appeared below. \"Ahoy!\" called the fisherman. \"Need a lift?\" They landed the balloon right on the boat! \"That was the best ride ever!\" said Tom. \"Next time, let us read the instructions before we go,\" said Dad, shaking but smiling. The fisherman gave them fish for dinner and took them home. Tom told all his friends about the balloon ride. Nobody believed him. But he had photos to prove it!","es":"Tom y su papá encontraron un globo aerostático. Subieron sin saber volar. Pasaron pájaros, nubes, un avión. Vieron la ciudad desde arriba — \"¡Los autos parecen hormigas!\" El viento los llevó al océano. Descendieron sobre un barco pesquero. \"¡El mejor viaje!\" El pescador los llevó a casa. Tom nadie le creyó, pero tenía fotos.","ja":"トムとパパはきにふうせんをみつけました。「のれる？」「そらしらないよ。」でもかごにせつめいがかいてありました。うえのロープをひっぱるとあがる。したのをひっぱるとうさがる。しゅっぱつ！とつぜんそらへ！とりとくもとひこうきをとおりすぎました。まちが蟻のようでした。かぜがうみへながしました。したのロープをひっぱるとぎょせんのうえにおりました。「いちばんたのしいりょこう！」ぎょしんがいえにつれていきました。","fr":"Tom et son père trouvèrent une montgolfière. Ils montèrent sans savoir piloter. Passèrent oiseaux, nuages, un avion. Virent la ville d'en haut — « Les voitures ressemblent à des fourmis ! » Le vent les poussa vers l'océan. Ils descendirent sur un bateau de pêche. « Le meilleur voyage ! » Le pêcheur les ramena. Personne ne crut Tom, mais il avait des photos."}},{"id":"adventures-3","category":"adventures","title":{"en":"The Treasure Map","es":"El mapa del tesoro","ja":"たからのちず","fr":"La carte au trésor"},"text":{"en":"Three friends — Mia, Jake, and Sam — found a treasure map in Mia's grandmother's attic. \"X marks the spot!\" said Jake, pointing to a big X in the middle of the map. \"That is in the woods behind the school,\" said Sam. \"Let us go!\" said Mia. They packed supplies: flashlights, snacks, a shovel, and juice boxes. They entered the woods. The map said: \"Turn left at the big rock.\" They found a big rock and turned left. \"Go straight until you see the bent tree.\" They walked and walked. \"Is that a bent tree?\" asked Mia. \"It is more of a leaning tree,\" said Sam. \"Close enough,\" said Jake. They turned right at the leaning tree. \"Cross the stream on the stepping stones.\" They found the stream. The stepping stones were wobbly! Jake stepped on the first one — wobble! He almost fell in! \"Careful!\" said Mia. They all crossed, though Sam got one foot wet. \"My sock is soggy,\" he complained. \"Now walk fifty paces from the old well.\" They found the well. Mia counted: \"One, two, three... forty-eight, forty-nine, fifty!\" \"Dig here!\" said Jake. They dug and dug. The dirt was hard. The sun was hot. They were tired. Then — CLUNK! The shovel hit something! They brushed the dirt away. It was a box! They opened it. Inside were... old coins? No. Jewels? No. It was full of letters! \"Letters?\" said Jake, disappointed. Mia picked one up. It was from her grandmother to her grandfather, written fifty years ago. \"Dear George, I have hidden our love letters here so you will always know where to find them. Follow the map I made. Love, Eleanor.\" \"Your grandmother made this map!\" said Sam. \"This is the treasure — their love letters!\" Mia smiled. \"This is better than gold.\" They took the box to Grandma, who cried happy tears. \"You found them! I thought they were lost forever!\" And that was the best treasure any of them had ever found.","es":"Tres amigos encontraron un mapa del tesoro en el desván. Siguiendo pistas — piedra grande, árbol inclinado, arroyo — cavaron y encontraron una caja. ¡Cartas de amor de la abuela de Mia! \"Mejor que oro.\" La abuela lloró de felicidad.","ja":"みお、ジェイク、サムはやねのうえでたからのちずをみつけました。もりのうらのバツばこのばしょへいきました。おおきないし、かたむいたき、小川をわたってほりました。ぼっくすがでました！なかみはてがみでした。おばあちゃんからおじいちゃんへのラブレターでした。「きんよりいい。」おばあちゃんはうれしいていでなきました。","fr":"Trois amis trouvèrent une carte au trésor dans un grenier. Suivant les indices — gros rocher, arbre penché, ruisseau — ils creusèrent et trouvèrent une boîte. Des lettres d'amour de la grand-mère de Mia ! « Mieux que l'or. » La grand-mère pleura de joie."}},{"id":"adventures-4","category":"adventures","title":{"en":"The Mountain Climber","es":"El escalador de montañas","ja":"やまのぼり","fr":"Le grimpeur de montagne"},"text":{"en":"A young goat named Billy lived at the bottom of the tallest mountain in the world. \"I am going to climb to the top!\" declared Billy. \"You are a goat,\" said the sheep. \"Goats climb mountains. That is what you do.\" \"I know! But I am going to climb THIS mountain!\" Billy started climbing. He climbed past the trees, past the rocks, past the snow line. He met a mountain goat who was coming down. \"Turn back, little one. The top is too dangerous.\" \"I can do it!\" said Billy. He climbed higher. The wind was fierce. The rocks were icy. His hooves slipped on the ice — whoa! He grabbed a rock just in time. \"That was close,\" he said, heart pounding. He climbed higher still. He was above the clouds now. He could see the whole world below — forests, rivers, towns, everything. \"It is so beautiful,\" he whispered. At the very top, he found a small flat rock. He stood on it and looked around. He was the highest goat in the world! \"I did it!\" he shouted. His voice echoed: \"Did it! Did it! Did it!\" Then he realized something. He had to get back down. \"Oh,\" said Billy. \"Going down is harder than going up.\" It took him twice as long to get down. He slipped, slid, and tumbled a few times. But he made it! The sheep was waiting at the bottom. \"How was it?\" \"Amazing. But next time, I will bring a parachute.\" And he ate some grass, happy to be home.","es":"Billy, una joven cabra, decidió escalar la montaña más alta. \"¡Las cabras escalan!\" Subió pasado árboles, rocas, nieve. El viento era feroz. Resbaló pero se agarró. Llegó a la cima: \"¡Lo logré!\" Entonces tuvo que bajar — más difícil que subir. Lo logró. \"La próxima vez, traeré paracaídas.\" Y comió hierba, feliz.","ja":"ビリーというわかいやぎがせかいいちたかいやまのふもとにすんでいました。「てっぺんまでのぼる！」ひつじがいいました。「やぎはやまにのぼるものだよ。」のぼりはじめました。きもいわもゆきもこえました。かぜがつよくこおりでツルッとすべりました。くもよりうえにでました。せかいぜんぶみえました。「きれい…」てっぺんにたちました。「やったー！」でもおりなきゃいけません。「おりるのはのぼるよりむずかしい。」にばいかかってしまたがぜったいかえりました。「つぎはパラシュートをもってくるよ。」","fr":"Billy, une jeune chèvre, décida de gravir la plus haute montagne. « Les chèvres grimpent ! » Il monta passé les arbres, rochers, neige. Le vent était féroce. Il glissa mais s'aggrippa. Arrivé au sommet : « J'ai réussi ! » Puis il dut descendre — plus dur que monter. Il y parvint. « La prochaine fois, j'apporterai un parachute. » Et il brouta l'herbe, heureux."}},{"id":"adventures-5","category":"adventures","title":{"en":"The Underground Tunnel","es":"El túnel subterráneo","ja":"ちかトンネル","fr":"Le tunnel souterrain"},"text":{"en":"While digging in the garden, Leo found a tunnel. It was dark and went deep underground. \"I am going to explore it!\" said Leo. His sister Zoe was scared. \"It could be dangerous!\" \"I will bring a flashlight.\" Leo crawled in. The tunnel was narrow and dark. His flashlight made long shadows on the walls. The dirt smelled like earth and old leaves. He crawled for what felt like forever. Then the tunnel opened up into a huge cave! Stalactites hung from the ceiling like icicles. A underground stream flowed through the middle. \"Wow!\" whispered Leo. In the cave, he found something amazing — drawings on the walls! They were old, very old. They showed people, animals, and stars. \"These are cave paintings!\" said Leo. He took photos with his phone. He followed the stream deeper into the cave. The water was clear and cold. He saw tiny fish swimming — fish that had never seen sunlight! Their eyes were clear and they were almost transparent. Then he found the biggest surprise of all — a large crystal formation that glowed with its own light! The crystals filled the cave with a soft blue glow. \"This is incredible!\" He took more photos and hurried back. When he emerged, covered in dirt, Zoe screamed. \"You look like a mole!\" \"You will not believe what I found!\" He showed her the photos. They went to the museum, and the experts were amazed. \"These cave paintings could be thousands of years old!\" Leo became famous as the boy who discovered a cave. And his garden became a protected historical site. \"Best dig ever,\" said Leo.","es":"Leo encontró un túnel en el jardín. Lo exploró con una linterna. Encontró una cueva con pinturas rupestres, peces ciegos y cristales brillantes. \"¡Increíble!\" Llevó las fotos al museo. Los expertos quedaron asombrados. Su jardín se convirtió en sitio histórico. \"Mejor excavación de mi vida.\"","ja":"レオはていえんをほってトンネルをみつけました。ちっちでたんけんしました。どうくつがでてきました。かべにかつどうきのえがかいてありました。ひかりのないさかなもいました。ぴかぴかのクリスタルもありました！しゃしんをとってかえりました。はかせがおどろきました。「せんねんまえのえだ！」レオはゆうめいなりました。","fr":"Léo trouva un tunnel dans le jardin. Il l'explora avec une lampe. Il découvrit une grotte avec des peintures rupestres, des poissons aveugles et des cristaux brillants. « Incroyable ! » Il porta les photos au musée. Les experts furent émerveillés. Son jardin devint un site historique. « Meilleure fouille de ma vie."}},{"id":"adventures-6","category":"adventures","title":{"en":"The River Raft Race","es":"La carrera de balsas","ja":"いかだレース","fr":"La course de radeaux"},"text":{"en":"Every year, the town held a river raft race. Anyone could enter, with any kind of raft. This year, there were fifteen rafts! There was a raft made of barrels, a raft made of pool noodles, and a raft made of empty milk jugs. \"Our raft is the best!\" said the team with the barrel raft. \"We will win easily!\" Maya and her friends built their raft from old wooden pallets and bicycle inner tubes. \"It is not pretty,\" said Maya, looking at the lumpy raft. \"But it might float!\" The race started! Splash! All the rafts hit the water at once. The barrel raft took the lead — it was fast! The pool noodle raft was wobbly. The milk jug raft was surprisingly speedy. Maya's pallet raft was slow but steady. \"Pedal harder!\" shouted Maya's friend. They paddled with all their might. The river had rapids! The barrel raft hit a rock and spun around. \"Whoa!\" The pool noodle raft folded in half. \"Abandon raft!\" The milk jug raft lost some jugs and started sinking. \"Glub glub!\" Maya's pallet raft was tough. It bumped over the rocks — bang! It scraped through the rapids — scrape! It was not fast, but it would not break! \"We are still floating!\" cheered Maya. They came out of the rapids in second place! The only raft ahead was a fancy store-bought raft. \"Catch them!\" shouted Maya. They paddled with everything they had. The finish line was close! The fancy raft was ahead — but then it hit a submerged log and got stuck! \"Oh no!\" Maya's pallet raft bumped right past them and crossed the finish line! \"We won! We won!\" The crowd went wild. \"The ugliest raft won!\" said the announcer. Maya smiled. \"It may be ugly, but it floats!\" And that was the most important thing.","es":"La carrera anual de balsas tenía quince participantes. Barriles, fideos de piscina, botellas de leche. El equipo de Maya usó palets y cámaras de bici. \"¡No es bonita, pero flota!\" Los rápidos destruyeron a los demás. La balsa de Maya resistió y ganó. \"¡La balsa más fea ganó!\" Maya sonrió: \"¡Flota y eso importa!\"","ja":"まいとしかわでいかだレースがありました。タル、プールぬいぐるみ、牛乳パックのいかだ。マヤはパレットとじてんしゃのタイヤでつくりました。「きれくないでもうくかも！」レーススタート！タルがリードしました。しかしラピッドでタルはスピン、プールぬいぐるみはまっぷたつ、牛乳パックはしずみました。マヤのいかだはがんじょうでした。ゴールちかくでかりのいかだがきにひっかかりました。マヤがかちました！「いちばんかっこわるいけどうかぶ！」","fr":"La course annuelle de radeaux avait quinze participants. Tonneaux, frites de piscine, bouteilles de lait. L'équipe de Maya utilisa des palettes et des chambres à air. « Pas jolie mais ça flotte ! » Les rapides détruisirent les autres. Le radeau de Maya résista et gagna. « Le plus laid a gagné ! » Maya sourit : « Il flotte, c'est ce qui compte ! »"}},{"id":"adventures-7","category":"adventures","title":{"en":"The Treehouse Kingdom","es":"El reino de la casa del árbol","ja":"ツリーハウスおうこく","fr":"Le royaume de la cabane"},"text":{"en":"Max built a treehouse in the old oak tree in his backyard. But it was not just a treehouse — it was a kingdom! \"I am King Max of the Oak Tree!\" he declared, sitting on his throne (an old beanbag chair). His friends were the royal court. Sophie was the Royal Scientist. Ben was the Royal Knight. Lily was the Royal Chef. \"What does the Royal Chef make?\" asked Lily. \"Whatever is in the kitchen. Bring cookies.\" The kingdom had rules: 1. No grown-ups allowed (unless they bring snacks). 2. All disputes settled by rock-paper-scissors. 3. The King gets the best seat. One day, a crisis happened. The neighbor's cat, Mr. Whiskers, invaded the kingdom! \"Intruder!\" shouted Ben, the Royal Knight. \"Defend the kingdom!\" They tried to shoo Mr. Whiskers away, but he just sat on the throne and purred. \"He has taken the throne!\" said Max. \"What do we do?\" Sophie, the Royal Scientist, observed. \"He seems to like the beanbag.\" \"Of course he does. It is warm.\" They negotiated with Mr. Whiskers. \"You can have the throne for ten minutes if you let us rule the rest of the treehouse.\" Mr. Whiskers purred. \"I think that is a yes,\" said Lily. The kingdom expanded. They built a second level — the Lookout Tower. They added a rope ladder — the Drawbridge. They hung a sign: \"Welcome to Oak Kingdom. Population: 4 kids, 1 cat.\" The kingdom lasted all summer. When school started, they still met in the treehouse every weekend. \"Best kingdom ever,\" said King Max. And Mr. Whiskers, now the Royal Cat, purred in agreement from the throne.","es":"Max construyó un reino en su casa del árbol. Sus amigos eran la corte: Sophie la científica, Ben el caballero, Lily la chef. El gato del vecino invadió y se sentó en el trono. Negociaron: el gato tendría el trono diez minutos. Expandieron el reino con torre y puente levadizo. \"Reino de Roble. Población: 4 niños, 1 gato.\" Duró todo el verano. \"Mejor reino.\"","ja":"マックスはうらにわのきでツリーハウスおうこくをつくりました。「マックスおう！」ともだちはせんし、ナイト、シェフでした。おとなりにねこのミスターびっくりがしんにゅうしてスロープにすわりました。「スロープうばわれた！」じょうやくしました。ねこは１０ぷんスロープでいいことになりました。おうこくはひろがりました。「オークおうこく。じんこう：よにん、ねこいっぴき。」なつのあいだつづきました。","fr":"Max construisit un royaume dans sa cabane. Ses amis étaient la cour : Sophie la scientifique, Ben le chevalier, Lily la chef. Le chat du voisin envahit et s'assit sur le trône. Ils négocièrent : le chat aurait le trône dix minutes. Le royaume s'étendit avec tour et pont-levis. « Royaume du Chêne. Population : 4 enfants, 1 chat. » Il dura tout l'été. « Meilleur royaume."}},{"id":"adventures-8","category":"adventures","title":{"en":"The Desert Island","es":"La isla desierta","ja":"むじんとう","fr":"L'île déserte"},"text":{"en":"A family was sailing when their boat hit a rock. They swam to a nearby island. \"We are stranded!\" said Dad. \"Like Robinson Crusoe!\" said Mom. \"Cool!\" said the kids. It was not cool. There was no food, no shelter, no Wi-Fi. \"How will we survive?\" asked the kids. \"We will use our brains,\" said Mom. Dad built a shelter from palm leaves and driftwood. \"It is not a house, but it will keep the rain off.\" Mom found coconuts. \"Coconut water for drinking, coconut meat for eating!\" The kids found bananas growing in the interior. \"We will not starve!\" They built a fire by rubbing two sticks together. It took two hours! \"My arms are falling off!\" said Dad. But finally — spark! Flame! Fire! \"We have fire!\" They cooked bananas on the fire. \"These are the best bananas I have ever eaten,\" said the kids. That was probably because they were hungry, but still. Days passed. They explored the island. They found a freshwater spring. They caught fish with a net made from vines. They even built a message on the beach: HELP, spelled in large rocks. A week later, a helicopter saw the message! \"Look! Someone is down there!\" The family was rescued! On the boat home, the kids said, \"That was actually kind of fun.\" \"Fun?\" said Dad. \"We ate coconuts for a week!\" \"Best vacation ever,\" said the kids. Mom and Dad looked at each other and laughed. \"Next time, we are taking a cruise.\"","es":"Una familia naufragó en una isla. Sin comida, refugio ni Wi-Fi. Papá construyó refugio con palmas. Mamá encontró cocos. Los niños plátanos. Hicieron fuego frotando palos. Pescaron con red de lianas. Escribieron HELP en la playa. Una semana después, un helicóptero los rescató. \"¡Mejores vacaciones!\" dijeron los niños. \"La próxima vez, crucero.\"","ja":"あるかぞくがふねがいわにぶつかってむじんとうにおよぎました。「コウザツだ！」「ロビンソンクルーソーみたい！」「すごい！」でもすごくなかったです。たべものもいえもWi-Fiもありませんでした。パパはヤシのきでいえをつくりました。ママはココナッツをみつけました。こどもはバナナをみつけました。２じかんきをこすってひをおこしました。かわでさかなをつりました。ビーチにHELPとかきました。いっしゅうかんでヘリコプターがすくいました。「いちばんたのしいやすみだった！」「つぎはクルーズだ。」","fr":"Une famille fit naufrage sur une île. Sans nourriture, abri ni Wi-Fi. Papa construisit un abri en palmes. Maman trouva des noix de coco. Les enfants des bananes. Ils firent du feu en frottant des bâtons. Pêchèrent avec un filet en lianes. Écrivirent HELP sur la plage. Une semaine plus tard, un hélicoptère les secourut. « Meilleures vacances ! — La prochaine fois, un cruise."}},{"id":"adventures-9","category":"adventures","title":{"en":"The Balloon That Flew Away","es":"El globo que voló","ja":"とんでいったふうせん","fr":"Le ballon qui s'envola"},"text":{"en":"Little Emma was at the fair when her red balloon slipped from her hand. \"No! My balloon!\" she cried. The balloon floated up, up, up into the sky. Emma watched it go with tears in her eyes. But the balloon was having an adventure! It floated over the fairground, over the houses, over the school. A bird flew alongside. \"Where are you going?\" asked the bird. \"I do not know! The wind is taking me!\" The balloon floated over the mountains. It was cold up there, and the balloon shivered. \"Brrr!\" Then it floated over the ocean. A whale spouted water nearby. \"Spout!\" The balloon got splashed but kept floating. It floated over a desert. The hot air made it rise higher. \"I am so high!\" It floated over a forest. A monkey saw it from the treetops. \"Ooh! A red thing!\" The monkey tried to grab it, but the balloon was too high. The wind changed direction. The balloon floated back toward the city. It floated over Emma's house! Emma was in the garden, looking sad. The balloon descended slowly. Down, down, down... and landed right in Emma's lap! \"My balloon came back!\" shouted Emma, hugging it. The balloon was a little deflated and very tired, but it was home. \"Where did you go?\" Emma asked the balloon. The balloon could not answer, of course. But Emma imagined all the places it had been — mountains, oceans, deserts, forests. \"You had the best adventure,\" she said. And she tied the string around her wrist this time, so it would not fly away again. Well, not unless it wanted to.","es":"El globo rojo de Emma escapó en la feria. flotó sobre casas, montañas, océano, desierto, bosque. Un mono intentó atraparlo. El viento lo llevó de vuelta a la ciudad, sobre la casa de Emma. Descendió y aterrizó en su regazo. \"¡Mi globo volvió!\" Emma ató la cuerda a su muñeca.","ja":"エマのあかいふうせんがとんでしまいました！ふうせんはぼうけんしました。まち、やま、うみ、さばく、もりをとびました。さるがつかまえようとしました。かぜがまちのかえてエマのいえのうえに。ゆっくりおりてエマのひざにのりました。「ふうせんかえってきた！」エマはてくびにむすびました。","fr":"Le ballon rouge d'Emma s'échappa à la fête. Il flotta au-dessus des maisons, montagnes, océan, désert, forêt. Un singe essaya de l'attraper. Le vent le ramena vers la ville, au-dessus de la maison d'Emma. Il descendit et atterrit sur ses genoux. « Mon ballon est revenu ! » Emma noua la ficelle à son poignet."}},{"id":"adventures-10","category":"adventures","title":{"en":"The Secret Cave","es":"La cueva secreta","ja":"ひみつのどうくつ","fr":"La grotte secrète"},"text":{"en":"While hiking with his grandfather, Kai found a hidden cave behind a waterfall. \"Grandpa, look! A cave!\" \"I have hiked this trail a hundred times and never saw it,\" said Grandpa. They went inside. The cave was dry behind the waterfall. Sunlight came through the water, making rainbow patterns on the walls. \"It is beautiful!\" said Kai. In the back of the cave, they found something unexpected — a small wooden boat, old and dusty. \"Someone lived here,\" said Grandpa. They explored further. There was a bed made of moss, a shelf with old books, and a journal. Kai opened the journal. \"It says: 'I have decided to live behind the waterfall. The world is too noisy. Here, it is peaceful. I can fish in the river and read my books. If you find this, please enjoy the cave. — Old Thomas, 1923.'\" \"Old Thomas!\" said Grandpa. \"My father used to tell me about him! He was a hermit who disappeared. Everyone thought he left town. But he was here the whole time!\" They read more of the journal. Old Thomas wrote about the changing seasons, the animals he saw, and the fish he caught. He wrote about watching the sunrise through the waterfall every morning. \"He was happy here,\" said Kai. They left the cave as they found it, but Kai took the journal to share with the town. The historical society was thrilled. \"Old Thomas's journal! This is a treasure!\" They made the cave a protected site. Kai visited every month. He would sit behind the waterfall, listening to the water, and read a page of Old Thomas's journal. \"It is peaceful here,\" he said. \"I can see why he stayed.\" And he brought a book of his own, just in case he wanted to stay too.","es":"Kai y su abuelo encontraron una cueva detrás de una cascada. Adentro había un barco viejo, libros y un diario de 1923. \"Old Thomas, un ermitaño.\" El diario contaba de estaciones, animales y pesca. \"Era feliz aquí.\" Kai lo compartió con el pueblo. La cueva se protegó. Kai la visitaba cada mes a leer y disfrutar la paz.","ja":"カイとおじいさんはたきのうらにどうくつをみつけました。なかはふるいふねとほんとにっきがありました。「1923ねん、Old Thomas。」まちではきえていったひとでした。にっきにはきせつやどうぶつやつりのかいてありました。カイはまちにつたえました。どうくつはほごされました。カイはまいつきみにきました。","fr":"Kai et son grand-père trouvèrent une grotte derrière une cascade. À l'intérieur, un vieux bateau, des livres et un journal de 1923. « Old Thomas, un ermite. » Le journal parlait de saisons, animaux, pêche. « Il était heureux ici. » Kai le partagea avec la ville. La grotte fut protégée. Kai la visitait chaque mois pour lire et profiter de la paix."}}],Zf=[{"id":"kindness-1","category":"kindness","title":{"en":"The Garden of Friends","es":"El jardín de los amigos","ja":"ともだちのおはなばたけ","fr":"Le jardin des amis"},"text":{"en":"In a village where everyone had their own garden, old Mrs. Pumpkin had the most beautiful flowers. But she never shared her seeds. \"My seeds are special,\" she said. \"If I share them, everyone will have my flowers.\" Her garden was beautiful, but she was lonely. Next door, young Lily had a garden with nothing but dirt. \"I want to grow flowers, but I do not have any seeds.\" Mrs. Pumpkin watched Lily try to plant things — old beans, apple seeds, even a piece of popcorn. Nothing grew. One day, Mrs. Pumpkin was sick. She could not tend her garden. Lily saw her struggling and came over. \"Let me help,\" said Lily. She watered Mrs. Pumpkin's flowers every day. She pulled the weeds. She talked to the plants. \"Grow, little flowers! Grow!\" Mrs. Pumpkin watched from her window, touched. \"Why are you helping me? I never shared my seeds with you.\" \"Because you are my neighbor,\" said Lily. \"And neighbors help each other.\" When Mrs. Pumpkin got better, she went to her garden. It was more beautiful than ever! Lily had taken such good care of it. Mrs. Pumpkin went to Lily's garden with a big bag. \"Here,\" she said. \"These are my best seeds. Let us plant them together.\" Lily's eyes lit up. \"Really?\" \"Really. I was selfish. But you showed me that sharing makes everything better.\" They planted the seeds together. Soon, both gardens were full of beautiful flowers. And they became the best of friends. Every spring, they shared seeds with everyone in the village. \"Mrs. Pumpkin's seeds are famous!\" said the villagers. \"Now they are everyone's seeds,\" said Mrs. Pumpkin with a smile. And the whole village bloomed like never before.","es":"La vieja Sra. Calabaza tenía las flores más bellas pero nunca compartía semillas. Lily, su vecina, no tenía semillas. Cuando la Sra. se enfermó, Lily cuidó su jardín. Al recuperarse, la Sra. compartió sus semillas. Plantaron juntas. Se hicieron amigas y compartieron semillas con todo el pueblo. El pueblo floreció.","ja":"パンプキンおばあさんはせかいいちきれいなはなをそだてていましたがタネをわかちあいませんでした。「わたしのタネはとくべつ。」となりのゆりはタネがありませんでした。あるひおばあさんがびょうきになりました。ゆりがせわをしました。なおるとおばあさんはタネをゆりにわけました。いっしょにうえました。ふたりはともだちになりました。むらぜんぶがさいました。","fr":"Vieille Madame Citrouille avait les plus belles fleurs mais ne partageait jamais ses graines. Lily, sa voisine, n'avait pas de graines. Quand Madame tomba malade, Lily soigna son jardin. Guérie, Madame partagea ses graines. Elles plantèrent ensemble. Devinrent amies et partagèrent avec tout le village. Le village fleurit."}},{"id":"kindness-2","category":"kindness","title":{"en":"The Soup Stone","es":"La sopa de piedra","ja":"ストーンスープ","fr":"La soupe de pierre"},"text":{"en":"A hungry traveler came to a village. \"Could you spare some food?\" he asked. But the villagers slammed their doors. \"We have barely enough for ourselves!\" The traveler sat by the well, thinking. Then he had an idea. He built a small fire, filled a pot with water, and dropped in a round stone. \"What are you doing?\" asked a curious child. \"Making stone soup!\" said the traveler. \"Stone soup? That is not real.\" \"It is! But it needs a little help. If I had a carrot, it would be perfect.\" The child ran home and brought a carrot. \"Here!\" \"Wonderful! But a potato would make it even better.\" An old woman overheard and brought a potato. \"I have an extra one.\" \"Amazing! But an onion would make it delicious.\" A farmer brought an onion. \"I was not going to use it anyway.\" Soon, everyone was adding something — cabbage, salt, herbs, chicken. The pot was full and bubbling! The smell was incredible! The traveler stirred the soup and removed the stone. \"The soup is ready!\" He poured soup for everyone. They all ate together — the traveler, the child, the old woman, the farmer, all the villagers. \"This is the best soup I have ever had!\" said the child. \"And to think it all started with a stone!\" said the old woman. The traveler smiled. \"The stone did not make the soup. You all did. You just needed a reason to share.\" The villagers looked at each other, embarrassed but happy. \"Next time, we will share without needing a stone.\" And from that day on, they did.","es":"Un viajero hambriento llegó a un pueblo donde nadie compartía. Hizo \"sopa de piedra\": pidió zanahoria, papa, cebolla, y pronto todos aportaron algo. La sopa fue deliciosa. \"La piedra no hizo la sopa. Ustedes la hicieron. Solo necesitaban una razón para compartir.\" Desde entonces, compartieron sin necesitar piedra.","ja":"おなかをすかせたたびびとがむらにやってきました。だれもたべものをくれませんでした。たびびとはストーンスープをつくることにしました。「いしをいれるだけ。でもニンジンがあればもっといい。」こどもがニンジンを、おばあさんがジャガイモを、のうやがタマネギをもってきました。みんなでなにかいれました。おいしいスープができました。「いしがスープをつくったんじゃない。みんながつくったんだ。わけあうりゆうがひつようだっただけ。」それからみんなわかちあうようになりました。","fr":"Un voyageur affamé arriva dans un village où personne ne partageait. Il fit de la « soupe de pierre » : demanda carotte, pomme de terre, oignon, et bientôt tous contribuèrent. La soupe fut délicieuse. « La pierre n'a pas fait la soupe. Vous l'avez faite. Vous aviez juste besoin d'une raison pour partager. » Dès lors, ils partagèrent sans pierre."}},{"id":"kindness-3","category":"kindness","title":{"en":"The New Kid","es":"El niño nuevo","ja":"あたらしいこ","fr":"Le nouvel enfant"},"text":{"en":"It was Tom's first day at a new school. He was nervous. His family had just moved, and he did not know anyone. He sat alone at lunch. Nobody talked to him. He felt invisible. A girl named Aisha noticed him sitting alone. She walked over. \"Hi! Are you new?\" \"Yes,\" said Tom. \"I am Tom.\" \"I am Aisha! Do you like soccer? We need one more player.\" Tom did not really like soccer, but he did not want to sit alone. \"Sure!\" Aisha introduced him to the other kids. \"This is Tom! He is on our team!\" The kids were friendly. \"Welcome, Tom! Can you kick the ball far?\" \"I can try!\" Tom kicked the ball — it went sideways and hit a tree. Everyone laughed, but not in a mean way. \"Okay, you are defender!\" said the team captain. Tom played badly, but everyone cheered for him anyway. \"Good try, Tom!\" \"Almost!\" \"Next time!\" After the game, Aisha sat with him. \"Do you really like soccer?\" \"Not really,\" admitted Tom. \"What do you like?\" \"I like drawing.\" \"Drawing! We need someone to make posters for the school play! Come on!\" Aisha took Tom to the art teacher. \"Tom can draw! Can he make posters?\" The art teacher looked at Tom's sketchbook. \"These are wonderful! Yes, please!\" By the end of the week, Tom had made friends with the art club, the soccer team, and half the school. All because Aisha said hi. Years later, Tom won an art contest. In his speech, he said, \"I want to thank Aisha, who said hi to the new kid. One hi can change everything.\" Aisha smiled from the audience. She always said hi to the new kids.","es":"Tom estaba solo en su nuevo colegio. Aisha se acercó: \"¿Te gusta el fútbol?\" Jugó mal, pero todos lo aplaudieron. Descubrió que le gustaba dibujar. Aisha lo llevó al club de arte. Hizo carteles para la obra escolar. Hizo muchos amigos. Años después, ganó un concurso de arte. \"Gracias Aisha, que le dijo hola al niño nuevo. Un hola lo cambia todo.\"","ja":"トムはあたらしいがっこうのいちにちめでした。ひとりできょくべんをたべていました。アイシャがきて「サッカーすき？」じょうずじゃなかったけどみんなおうえんしました。トムはえをかくのがすきでした。アイシャがアートクラブにつれていきました。ポスターをかきました。たくさんともだちができました。ねんごトムはアートコンテストでかちました。「アイシャありがとう。ひとことのこんにちはぜんぶをかえる。」","fr":"Tom était seul dans sa nouvelle école. Aisha s'approcha : « Tu aimes le foot ? » Il joua mal mais tous l'applaudirent. Il aimait dessiner. Aisha l'emmena au club d'art. Il fit des affiches. Il se fit beaucoup d'amis. Des années plus tard, il gagna un concours. « Merci Aisha, qui a dit bonjour au nouvel enfant. Un bonjour change tout."}},{"id":"kindness-4","category":"kindness","title":{"en":"The Shared Umbrella","es":"El paraguas compartido","ja":"わかちあうかさ","fr":"Le parapluie partagé"},"text":{"en":"It was raining hard. Maya was waiting at the bus stop with her umbrella. A boy she did not know was standing nearby, getting soaked. He did not have an umbrella. His shirt was wet and his hair was dripping. Maya looked at him, then at her umbrella. She could share, but that would be awkward. They did not know each other. What if he thought she was weird? She hesitated. Then she remembered what her mother always said: \"When you can help someone, help them.\" Maya walked over. \"Do you want to share my umbrella?\" The boy looked surprised. \"Really? Are you sure?\" \"Yes! You are getting soaked.\" The boy stepped under the umbrella. \"Thank you! I was freezing!\" \"I am Maya.\" \"I am Sam. I forgot my umbrella at home.\" They stood together under the umbrella, watching the rain. \"Do you take this bus every day?\" asked Maya. \"Yes! I just moved here.\" \"Me too! Well, I just started taking this bus.\" They talked and talked. Sam was funny. He told jokes. \"Why do bees hum? Because they do not know the words!\" Maya laughed. The bus came. They sat together. They became friends. Every morning after that, they met at the bus stop. One had the umbrella, the other had the snacks. \"Best bus buddies!\" said Sam. One rainy day, Maya saw another kid getting soaked. She looked at Sam. He nodded. They walked over together. \"Do you want to share our umbrella?\" The kid smiled. \"Yes, please!\" Three under one umbrella, a little squished but warm and dry. \"The more, the merrier,\" said Maya. And from that day on, the umbrella was always shared.","es":"Maya compartió su paraguas con Sam, un desconocido que se empapaba. Se hicieron amigos. Cada mañana se encontraban en la parada. Un día, compartieron con otro niño. \"Cuanto más, mejor.\" El paraguas siempre fue compartido.","ja":"あめのひまやはバスていでかさをもっていました。しらないおとこのこがぬれていました。まやはかさをわけてあげました。「ありがとう！サムだよ。」「まやだよ。」ふたりはともだちになりました。まいあさあっていっしょにのりました。あるあめのひほかのこもぬれていました。ふたりでわけてあげました。「おおいほどたのしい！」","fr":"Maya partagea son parapluie avec Sam, un inconnu trempé. Ils devinrent amis. Chaque matin, ils se retrouvaient à l'arrêt. Un jour, ils partagèrent avec un autre enfant. « Plus on est, plus on rit ! » Le parapluie fut toujours partagé."}},{"id":"kindness-5","category":"kindness","title":{"en":"The Old Woman and the Cat","es":"La anciana y el gato","ja":"おばあさんとねこ","fr":"La vieille dame et le chat"},"text":{"en":"Mrs. Chen lived alone in a small apartment. Her husband had passed away, and her children lived far away. She was lonely. Every day, she sat by the window and watched the world go by. One cold winter night, she heard a sound outside her door. Meow. M
