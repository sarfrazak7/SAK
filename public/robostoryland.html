/* === 9:16 Mobile Format Overrides === */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
#root { width: 100%; height: 100%; }
#root > div { min-height: 100% !important; height: 100% !important; }

/* Ensure background images cover the full 9:16 frame */
.absolute.inset-0 img[alt=""] { object-fit: cover; width: 100%; height: 100%; }

/* Make the main content area fill the frame and use flex to push robot up */
main.relative.z-20 { 
  min-height: calc(100% - 72px) !important; 
  height: calc(100% - 72px) !important;
  padding-top: 4px !important;
  padding-bottom: 8px !important;
}

/* Scale down the robot avatar for 9:16 mobile */
main.relative.z-20 > div:first-child > div {
  transform: scale(0.85);
  transform-origin: center top;
  margin-top: -10px;
}

/* Ensure caption + controls fit at bottom */
.w-full.max-w-3xl.mx-auto { max-width: 100% !important; }

/* Hide the story title h2 if it still renders */
h2.text-center.font-display { display: none !important; }

/* Progress bar section - reduce margin */
.w-full.max-w-3xl.mx-auto > .flex.items-center.gap-3 { margin-bottom: 8px !important; }

 */const Gf=Ae("VolumeX",[["path",{d:"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z",key:"uqj9uw"}],["line",{x1:"22",x2:"16",y1:"9",y2:"15",key:"1ewh16"}],["line",{x1:"16",x2:"22",y1:"9",y2:"15",key:"5ykzw1"}]]);const Kn=[{"code":"en","label":"English","flag":"US","bcp47":"en-US"},{"code":"es","label":"Español","flag":"ES","bcp47":"es-ES"},{"code":"ja","label":"日本語","flag":"JP","bcp47":"ja-JP"},{"code":"fr","label":"Français","flag":"FR","bcp47":"fr-FR"},{"code":"ur","label":"اردو","flag":"PK","bcp47":"ur-PK"},{"code":"pa","label":"ਪੰਜਾਬੀ","flag":"IN","bcp47":"pa-IN"}],ql=[{"id":"bedtime","label":"Bedtime & Stars","background":"/storynook-bedtime.webp","ambient":"crickets","accent":"indigo","avatarTint":"#6366f1"},{"id":"animals","label":"Animal Pals","background":"/storynook-animals.webp","ambient":"birds","accent":"green","avatarTint":"#22c55e"},{"id":"magic","label":"Magic & Fairytales","background":"/storynook-magic.webp","ambient":"sparkle","accent":"pink","avatarTint":"#ec4899"},{"id":"adventures","label":"Little Adventures","background":"/storynook-adventures.webp","ambient":"stream","accent":"amber","avatarTint":"#f59e0b"},{"id":"kindness","label":"Kindness & Friends","background":"/storynook-kindness.webp","ambient":"garden","accent":"rose","avatarTint":"#f43f5e"},{"id":"haunted","label":"Spooky Tales","background":"none","ambient":"haunted","accent":"purple","avatarTint":"#7c3aed"}];Yf=[{"id":"bedtime-1","category":"bedtime","title":{"en":"The Star Who Wanted to Sleep","es":"La estrella que quería dormir","ja":"ねむりたかったほし","fr":"L'étoile qui voulait dormir"},"text":{"en":"High above the rooftops, a little star named Pip was very, very tired. Every single night, Pip had to shine and shine and shine. \"Shine, Pip, shine!\" said the big stars. \"The children down there need their nightlight!\" Pip tried his best, but tonight, his light kept flickering like a birthday candle in the wind. \"I want to sleep,\" whispered Pip, letting out the biggest yawn the sky had ever seen. It was so big that three small clouds bumped into each other! The Moon heard the little star and smiled kindly. \"Close your eyes, dear Pip. I will watch over the sky tonight.\" \"But who will light the way for the children?\" asked Pip, worried. \"The fireflies will help,\" said the Moon. \"And the owls too. Everyone needs rest, even stars.\" So Pip closed his eyes, and the clouds made a soft, fluffy blanket around him. The crickets sang a gentle lullaby: chirp, chirp, chirp. A passing comet whispered, \"Sweet dreams, little Pip.\" And Pip fell asleep, twinkling softly in his dreams, dreaming of a sky where stars could nap all day long.","es":"Muy arriba sobre los tejados, una pequeña estrella llamada Pip estaba muy, muy cansada. Cada noche, Pip tenía que brillar y brillar y brillar. \"¡Brilla, Pip, brilla!\" decían las estrellas grandes. \"¡Los niños de abajo necesitan su luz de noche!\" Pip lo intentó con todas sus fuerzas, pero esta noche, su luz parpadeaba como una vela de cumpleaños en el viento. \"Quiero dormir\", susurró Pip, dando el bostezo más grande que el cielo había visto jamás. ¡Fue tan grande que tres nubes pequeñas chocaron entre sí! La Luna escuchó a la pequeña estrella y sonrió con amabilidad. \"Cierra los ojos, querido Pip. Yo cuidaré el cielo esta noche.\" \"¿Pero quién iluminará el camino de los niños?\" preguntó Pip, preocupado. \"Las luciérnagas ayudarán\", dijo la Luna. \"Y los búhos también. Todos necesitan descansar, incluso las estrellas.\" Así que Pip cerró los ojos, y las nubes hicieron una manta suave y esponjosa a su alrededor. Los grillos cantaron una dulce nana: cri, cri, cri. Un cometa que pasaba susurró: \"Dulces sueños, pequeño Pip.\" Y Pip se durmió, brillando suavemente en sus sueños, soñando con un cielo donde las estrellas podían dormir todo el día.","ja":"やねのずっとうえに、ピップというちいさなほしがいました。ピップはとてもとてもつかれていました。まいにちよる、ピップはかがやいて、かがやいて、かがやかなければなりませんでした。「かがやいて、ピップ、かがやいて！」おおきなほしたちがいいました。「したのこどもたちはよるのひかりがいるんだよ！」ピップはがんばりましたが、こんやはひかりがたびのろうそくのようにちかちかしました。「ねむりたいな」ピップはそらでいちばんおおきなあくびをしました。それはとてもおおきくて、さんこつのこいぬぐもがぶつかりました！お月さまがほしのこえをきいて、やさしくわらいました。「めをとじてね、ピップ。こんやはそらをわたしがみているよ。」「でもこどもたちのみちをてらすのはだれ？」ピップはしんぱいしました。「ほたるがたすけてくれるよ」お月さまがいいました。「ふくろうもよ。みんなきゅうけいがいるんだ、ほしだってね。」ピップはめをとじて、くもがやわらかいもうふをつくりました。こおろぎがやさしいゆりかごのうたをうたいました。とおるすいせいがささやきました「おやすみ、ちいさなピップ。」ピップはねむりにつき、ゆめのなかでやさしくまたたきました。","fr":"Haut au-dessus des toits, une petite étoile nommée Pip était très, très fatiguée. Chaque nuit, Pip devait briller et briller et briller. « Brille, Pip, brille ! » disaient les grandes étoiles. « Les enfants là-bas ont besoin de leur veilleuse ! » Pip faisait de son mieux, mais ce soir, sa lumière clignotait comme une bougie d'anniversaire dans le vent. « Je veux dormir, » murmura Pip, en poussant le plus grand bâillement que le ciel ait jamais vu. C'était si grand que trois petits nuages se cognèrent les uns contre les autres ! La Lune entendit la petite étoile et sourit gentiment. « Ferme les yeux, cher Pip. Je veillerai sur le ciel cette nuit. — Mais qui éclairera le chemin des enfants ? » demanda Pip, inquiet. — Les lucioles aideront, » dit la Lune. « Et les hiboux aussi. Tout le monde a besoin de repos, même les étoiles. » Alors Pip ferma les yeux, et les nuages firent une douce couverture moelleuse autour de lui. Les grillons chantèrent une douce berceuse : cri-cri-cri. Une comète passant chuchota : « Doux rêves, petit Pip. » Et Pip s'endormit, scintillant doucement dans ses rêves, rêvant d'un ciel où les étoiles pourraient faire la sieste toute la journée."}},{"id":"bedtime-2","category":"bedtime","title":{"en":"Grandpa's Lantern","es":"La linterna del abuelo","ja":"おじいさんのちょうちん","fr":"La lanterne de grand-père"},"text":{"en":"In a small tatami room at the edge of a quiet village, Grandpa lit a paper lantern. The warm golden glow danced on the walls, making shadows that looked like dancing rabbits. \"Come, little one,\" said Grandpa, patting the cushion next to him. \"Let me tell you a story.\" A young child snuggled under a soft quilt, eyes already half-closed. Grandpa told a story about a firefly named Flicker who could not find his way home. \"Flicker flew left, then right, then upside down!\" said Grandpa, wiggling his fingers. The child giggled. \"He bumped into a frog who said, Ribbit! Watch where you're going, little light!\" The child laughed softly. \"But then Flicker met a friendly moth who said, Follow me! I know every garden in the village. And the moth led Flicker home, past the sleeping roses, over the quiet pond, through the tall bamboo.\" The child yawned, and the lantern flickered gently, as if it were nodding along. \"And Flicker's family was so happy to see him that they all lit up at once — whoosh! — brighter than ever.\" Grandpa looked down. The child was already asleep, breathing softly. Grandpa smiled, turned the lantern down low, and whispered, \"Sweet dreams, little firefly.\" Outside, a real firefly blinked goodnight at the window.","es":"En una pequeña habitación de tatami en el borde de un pueblo tranquilo, el abuelo encendió una linterna de papel. el brillo dorado y cálido bailaba en las paredes, creando sombras que parecían conejos bailando. \"Ven, pequeño,\" dijo el abuelo, dando palmaditas al cojín a su lado. \"Déjame contarte un cuento.\" Un niño se acurrucó bajo una colcha suave, con los ojos ya medio cerrados. El abuelo contó una historia sobre una luciérnaga llamada Flicker que no podía encontrar el camino a casa. \"¡Flicker voló a la izquierda, luego a la derecha, luego al revés!\" dijo el abuelo, moviendo los dedos. El niño rio suavemente. \"¡Se chocó con una rana que dijo, ¡Croac! ¡Mira por dónde vas, lucecita!\" El niño rio suavemente. \"Pero entonces Flicker conoció a una polilla amigable que dijo, ¡Sígueme! Conozco cada jardín del pueblo. Y la polilla guio a Flicker a casa, pasado las rosas dormidas, sobre el estanque tranquilo, a través del bambú alto.\" El niño bostezó, y la linterna parpadeó suavemente, como si asintiera. \"Y la familia de Flicker estaba tan feliz de verlo que todos se encendieron a la vez — ¡whoosh! — más brillantes que nunca.\" El abuelo miró hacia abajo. El niño ya estaba dormido, respirando suavemente. El abuelo sonrió, bajó la linterna, y susurró, \"Dulces sueños, pequeña luciérnaga.\" Afuera, una luciérnaga real parpadeó buenas noches en la ventana.","ja":"しずかなむらのはずれのちいさなたたみのへやで、おじいさんががみのちょうちんをつけました。あたたかいきんいろのひかりがかべでおどり、うさぎのようにみえるかげをつくりました。「おいで、こどもよ」おじいさんがそばのざぶとんをぽんぽんといいました。「おはなししてあげよう。」こどもはやわらかいふとんにもぐりこみ、めはもうはんぶんとじていました。おじいさんはフリッカーというみちにまよったほたるのはなしをしました。「フリッカーはひだりにんで、みぎにんで、さかさまにんで！」おじいさんがゆびをゆらゆらしました。こどもはわらいました。「かえるにぶつかったら、かえるが『げろ！みてあるけよ、ちいさなひかり！』といいました。」こどもはわらいました。「でもフリッカーはしんせつながにふられるもとであったら、ついてきて！むらのはたけをぜんぶしってるよ。がはフリッカーをつれてかえりました。ねているばらのそばをとおり、しずかないけをこえ、たかいたけのあいだをぬけて。こどもはあくびをし、ちょうちんはゆれました。「フリッカーのかぞくはとてもうれしくて、みんなぴかっと—わあ！—いちばんまぶしくなったよ。」おじいさんがみおろすと、こどもはもうねていました。おじいさんはわらって、ちょうちんをちいさくし、「おやすみ、ちいさなほたるさん」とささやきました。そとで、ほんもののほたるがまどでぴかりとおやすみしました。","fr":"Dans une petite pièce de tatami au bord d'un village tranquille, grand-père alluma une lanterne en papier. La lueur dorée et chaude dansait sur les murs, créant des ombres qui ressemblaient à des lapins dansants. « Viens, petit, » dit grand-père, tapotant le coussin à côté de lui. « Laisse-moi te raconter une histoire. » Un jeune enfant se blottit sous une douce couette, les yeux déjà à moitié fermés. Grand-père raconta l'histoire d'une luciole nommée Flicker qui ne pouvait pas retrouver le chemin de la maison. « Flicker vola à gauche, puis à droite, puis à l'envers ! » dit grand-père, remuant ses doigts. L'enfant rit doucement. « Il se cogna contre une grenouille qui dit, Croa ! Fais attention où tu vas, petite lumière ! » L'enfant rit doucement. « Mais alors Flicker rencontra un papillon de nuit amical qui dit, Suis-moi ! Je connais chaque jardin du village. Et le papillon guida Flicker chez lui, passé les roses endormies, au-dessus de l'étang tranquille, à travers le grand bambou. » L'enfant bâilla, et la lanterne vacilla doucement, comme si elle hochait la tête. « Et la famille de Flicker était si heureuse de le voir qu'ils s'allumèrent tous d'un coup — whoosh ! — plus brillants que jamais. » Grand-père regarda en bas. L'enfant dormait déjà, respirant doucement. Grand-père sourit, baissa la lanterne, et murmura : « Doux rêves, petite luciole. » Dehors, une vraie luciole cligna une bonne nuit à la fenêtre."}},{"id":"bedtime-3","category":"bedtime","title":{"en":"The Sleepy Owl","es":"El búho soñoliento","ja":"ねむたいふくろう","fr":"Le hibou ensommeillé"},"text":{"en":"Oliver the Owl was the sleepiest owl in the whole forest. All the other owls said, \"Hoot! Hoot! We are awake at night!\" But Oliver said, \"Hoot... yawn... hoot...\" and kept nodding off on his branch. One night, Oliver tried to stay awake. He drank a cup of dew-drop tea. He splashed cold water on his feathers. He even tried singing, but his song sounded like a lullaby, and he fell asleep mid-note! The mice below whispered, \"Should we wake him?\" \"No,\" said Mama Mouse. \"He looks so peaceful.\" So the mice tip-toed around, and the crickets played extra soft, and the fireflies dimmed their lights. Oliver slept so deeply that he started sleep-hooting. \"Hoooot... zzz... hoooot...\" The other owls giggled from their branches. \"Oliver is sleep-hooting again!\" they whispered. When morning came, Oliver woke up feeling wonderful. \"What a great night!\" he said. \"I had the most amazing dream about a mouse wearing a tiny hat.\" The mice looked at each other and giggled. From that night on, Oliver was the only owl who slept at night and stayed awake during the day. \"I am a day-owl!\" he declared proudly. And everyone agreed that was perfectly fine.","es":"Oliver el Búho era el búho más soñoliento de todo el bosque. Todos los demás búhos decían, \"¡Hoo! ¡Hoo! ¡Estamos despiertos de noche!\" Pero Oliver decía, \"Hoo... bostezo... hoo...\" y seguía cabeceando en su rama. Una noche, Oliver intentó mantenerse despierto. Bebió una taza de té de gotas de rocío. Se salpicó agua fría en las plumas. Incluso intentó cantar, pero su canción sonaba como una nana, ¡y se quedó dormido a medio nota! Los ratones de abajo susurraron, \"¿Deberíamos despertarlo?\" \"No,\" dijo Mamá Ratona. \"Se ve tan tranquilo.\" Así que los ratones caminaron de puntillas, los grillos tocaron suave, y las luciérnagas bajaron sus luces. Oliver durmió tan profundamente que empezó a ulular dormido. \"Hoooo... zzz... hoooo...\" Los demás búhos se rieron desde sus ramas. \"¡Oliver está ululando dormido otra vez!\" susurraron. Cuando llegó la mañana, Oliver despertó sintiéndose maravilloso. \"¡Qué gran noche!\" dijo. \"Tuve el sueño más increíble sobre un ratón con un sombrerito.\" Los ratones se miraron y rieron. Desde esa noche, Oliver fue el único búho que dormía de noche y se quedaba despierto de día. \"¡Soy un búho diurno!\" declaró con orgullo. Y todos estuvieron de acuerdo en que eso estaba perfectamente bien.","ja":"オリバーふくろうはもりでいちばんねむたいふくろうでした。ほかのふくろうたちは「ふー！ふー！よるはおきているよ！」といいました。でもオリバーは「ふー…あくび…ふー…」といってえだからおちそうになりました。あるよる、オリバーはおきているようにがんばりました。つゆのおちゃをのみました。つめたいみずをはねにかけてひやしました。うたをうたおうとしましたが、うたがゆりかごのうたのようで、いってるあいだにねてしまいました！したのねずみたちはささやきました。「おこしたほうがいい？」「だめよ」ねずみのかあさんがいいました。「とてもへいきそうね。」ねずみたちはしずかにあるき、こおろぎはもっとやさしくひき、ほたるはひかりをちいさくしました。オリバーはぐっすりねて、ねながらふーといいました。「ふーー…くー…ふーーー…」ほかのふくろうたちはえだからわらいました。「オリバーがまたねながらないてる！」とささやきました。あさになると、オリバーはすっきりおきました。「いいよるだった！」といいました。「ちいなぼうしをかぶったねずみのゆめをみたよ。」ねずみたちはみあわせてわらいました。そのよるから、オリバーはよるにねてひるにおきるふくろうになりました。「ひるのふくろうだ！」とほこっていいました。みんなそれでいいねとおもいました。","fr":"Oliver le hibou était le hibou le plus ensommeillé de toute la forêt. Tous les autres hiboux disaient : « Hou ! Hou ! Nous sommes éveillés la nuit ! » Mais Oliver disait : « Hou... bâille... hou... » et continuait de hocher du bec sur sa branche. Une nuit, Oliver essaya de rester éveillé. Il but une tasse de thé de gouttes de rosée. Il s'éclaboussa d'eau froide sur les plumes. Il essaya même de chanter, mais sa chanson ressemblait à une berceuse, et il s'endormit au milieu d'une note ! Les souris en dessous chuchotèrent : « Devrions-nous le réveiller ? — Non, » dit maman souris. « Il a l'air si paisible. » Alors les souris marchèrent sur la pointe des pieds, les grillons jouèrent très doucement, et les lucioles baissèrent leurs lumières. Oliver dormait si profondément qu'il se mit à hululer en dormant. « Houuuut... zzz... houuuut... » Les autres hiboux rirent depuis leurs branches. « Oliver hulule en dormant encore ! » chuchotèrent-ils. Quand le matin arriva, Oliver se réveilla en se sentant merveilleux. « Quelle grande nuit ! » dit-il. « J'ai fait le rêve le plus incroyable d'une souris avec un tout petit chapeau. » Les souris se regardèrent et rirent. Depuis cette nuit, Oliver fut le seul hibou qui dormait la nuit et restait éveillé le jour. « Je suis un hibou diurne ! » déclara-t-il fièrement. Et tout le monde convint que c'était parfaitement bien."}},{"id":"bedtime-4","category":"bedtime","title":{"en":"The Moon's Blanket","es":"La manta de la luna","ja":"つきのもうふ","fr":"La couverture de la lune"},"text":{"en":"The Moon was cold. \"Brrr!\" said the Moon, shivering in the night sky. \"I need a blanket.\" The stars tried to help. \"We can shine on you!\" they offered. But moon-light and star-light together were still chilly. The clouds tried to help. \"We can wrap around you!\" they said. But the clouds were thin and full of holes, like old socks. The wind tried to help. \"I can blow warm air!\" But the wind's air was cold too, and it made the Moon sneeze. \"Achoo!\" The Moon's sneeze was so big it moved the tides down on Earth! A little girl named Yuki looked out her window and saw the Moon shivering. \"Poor Moon,\" she said. She took her favorite blanket — the one with the bunny rabbits on it — and held it out the window as high as she could. \"Here, Moon! Take my blanket!\" The Moon smiled and pulled the soft blanket around herself. \"Mmm, warm!\" said the Moon. \"Thank you, Yuki!\" The Moon was so cozy that she started to glow warmer and warmer, lighting up the whole night sky with a gentle golden light. Yuki yawned, climbed into bed, and fell fast asleep. And the Moon kept the blanket all night long, returning it gently to Yuki's windowsill just before the sun came up. In the morning, the blanket smelled like starlight.","es":"La Luna tenía frío. \"¡Brrr!\" dijo la Luna, tiritando en el cielo nocturno. \"Necesito una manta.\" Las estrellas intentaron ayudar. \"¡Podemos brillar sobre ti!\" ofrecieron. Pero la luz de la luna y la de las estrellas juntas seguían siendo frías. Las nubes intentaron ayudar. \"¡Podemos envolverte!\" dijeron. Pero las nubes eran delgadas y estaban llenas de agujeros, como calcetines viejos. El viento intentó ayudar. \"¡Puedo soplar aire caliente!\" Pero el aire del viento también era frío, e hizo que la Luna estornudara. \"¡Achís!\" ¡El estornudo de la Luna fue tan grande que movió las mareas en la Tierra! Una niña llamada Yuki miró por la ventana y vio a la Luna tiritando. \"Pobre Luna,\" dijo. Tomó su manta favorita — la de los conejitos — y la sostuvo por la ventana lo más alto que pudo. \"¡Toma, Luna! ¡Toma mi manta!\" La Luna sonrió y se envolvió en la suave manta. \"Mmm, ¡calentita!\" dijo la Luna. \"¡Gracias, Yuki!\" La Luna estaba tan cómoda que empezó a brillar cada vez más cálido, iluminando todo el cielo nocturno con una luz dorada y suave. Yuki bostezó, se metió en la cama y se quedó profundamente dormida. Y la Luna mantuvo la manta toda la noche, devolviéndola suavemente al alféizar de Yuki justo antes de que saliera el sol. Por la mañana, la manta olía a luz de estrellas.","ja":"お月さまはさむかったです。「ぶるぶる！」お月さまがそらでふるえました。「もうふがほしいな。」ほしたちがたすけようとしました。「かがやいてあげる！」でもつきのひかりとほしのひかりじゃまださむいです。くもがたすけようとしました。「つつんであげる！」でもくもはうすくてあなだらけで、ふるいくつのようでした。かぜがたすけようとしました。「あたたかいかぜをふかせるよ！」でもかぜのかぜもつめたくて、お月さまはくしゃみをしました。「へっくし！」お月さまのくしゃみはとてもおおきくて、ちきゅうのしおがうごきました！ゆきというおんなのこがまどからそとをみて、お月さまがふるえているのをみました。「かわいそうなお月さま。」おんなのこはいちばんすきなうさぎさんのもうふをとって、まどからできるだけたかくさしました。「はい、お月さま！わたしのもうふをつかって！」お月さまはわらって、やわらかいもうふでじぶんをつつみました。「んん、あたたかい！」お月さまがいいました。「ありがとう、ゆき！」お月さまはとてもこそおとして、だんだんあたたかくかがやきはじめ、よぞらをきんいろのやさしいひかりでてらしました。ゆきはあくびをして、べっどにいってぐっすりねました。お月さまはよるじゅうもうふをつかって、たいようがでるまえにゆきのまどぎわにそっとかえしました。あさになると、もうふはほしのひかりのにおいがしました。","fr":"La Lune avait froid. « Brrr ! » dit la Lune, frissonnant dans le ciel nocturne. « J'ai besoin d'une couverture. » Les étoiles essayèrent d'aider. « Nous pouvons briller sur toi ! » offrirent-elles. Mais la lumière de la lune et celle des étoiles ensemble faisaient encore froid. Les nuages essayèrent d'aider. « Nous pouvons t'envelopper ! » dirent-ils. Mais les nuages étaient fins et pleins de trous, comme de vieux bas. Le vent essaya d'aider. « Je peux souffler de l'air chaud ! » Mais l'air du vent était froid aussi, et il fit éternuer la Lune. « Atchoum ! » L'éternuement de la Lune fut si grand qu'il déplaça les marées sur Terre ! Une petite fille nommée Yuki regarda par sa fenêtre et vit la Lune frissonner. « Pauvre Lune, » dit-elle. Elle prit sa couverture préférée — celle avec les lapins — et la tendit par la fenêtre le plus haut possible. « Tiens, Lune ! Prends ma couverture ! » La Lune sourit et s'enveloppa dans la douce couverture. « Mmm, chaud ! » dit la Lune. « Merci, Yuki ! » La Lune était si confortable qu'elle se mit à briller de plus en plus chaud, éclairant tout le ciel nocturne d'une douce lumière dorée. Yuki bâilla, monta dans son lit et s'endormit profondément. Et la Lune garda la couverture toute la nuit, la rendant doucement au rebord de fenêtre de Yuki juste avant le lever du soleil. Au matin, la couverture sentait la lumière des étoiles."}},{"id":"bedtime-5","category":"bedtime","title":{"en":"The Cloud That Couldn't Rain","es":"La nube que no podía llover","ja":"あめをふらせられなかったくも","fr":"Le nuage qui ne pouvait pas pleuvoir"},"text":{"en":"There was once a little cloud named Puff who could not rain. All the other clouds could rain. They went puff, puff, splash! And down came the rain. But Puff went puff, puff, and... nothing. \"Try harder!\" said Big Cloud. Puff tried so hard his face turned purple. But still nothing came out. \"Maybe I am broken,\" said Puff, and a tiny tear rolled down his cheek. The wind saw Puff crying and blew over. \"What is wrong, little cloud?\" \"I cannot rain,\" sniffled Puff. \"All the other clouds can rain, but I just puff and puff and nothing happens.\" The wind smiled. \"Have you ever tried sneezing instead?\" \"Sneezing?\" asked Puff. \"Yes! When you feel a tickle, just let out a big sneeze!\" The wind blew some dust up into Puff. It tickled! It tingled! Puff scrunched up his face and... \"A-CHOO!\" Out came a beautiful spray of tiny raindrops, sparkling in the sunlight! \"I did it!\" shouted Puff. \"I can rain! I just had to sneeze!\" From that day on, Puff was the happiest cloud in the sky. Whenever the flowers needed water, Puff would fly over, take a deep breath, and sneeze the most beautiful rain showers. And all the children below would look up and say, \"Look! It's Puff! He's sneezing again!\" And they would run out with their umbrellas, laughing.","es":"Había una vez una pequeña nube llamada Puff que no podía llover. Todas las demás nubes podían llover. Hacían puff, puff, ¡splash! Y caía la lluvia. Pero Puff hacía puff, puff, y... nada. \"¡Esfuérzate más!\" dijo la Nube Grande. Puff se esforzó tanto que su cara se puso morada. Pero aún así no salió nada. \"Quizás estoy rota,\" dijo Puff, y una pequeña lágrima rodó por su mejilla. El viento vio a Puff llorando y se acercó. \"¿Qué pasa, pequeña nube?\" \"No puedo llover,\" lloriqueó Puff. \"Todas las demás nubes pueden llover, pero yo solo hago puff y puff y no pasa nada.\" El viento sonrió. \"¿Alguna vez has intentado estornudar?\" \"¿Estornudar?\" preguntó Puff. \"¡Sí! Cuando sientas cosquillas, ¡solo da un gran estornudo!\" El viento sopló un poco de polvo hacia Puff. ¡Cosquillas! ¡Hormigueos! Puff arrugó la cara y... \"¡A-CHÍS!\" ¡Salió una hermosa rociada de pequeñas gotas de lluvia, brillando bajo la luz del sol! \"¡Lo logré!\" gritó Puff. \"¡Puedo llover! ¡Solo tenía que estornudar!\" Desde ese día, Puff fue la nube más feliz del cielo. Cada vez que las flores necesitaban agua, Puff volaba, tomaba una gran respiración, y estornudaba las lluvias más hermosas. Y todos los niños abajo miraban y decían, \"¡Miren! ¡Es Puff! ¡Está estornudando otra vez!\" Y salían corriendo con sus paraguas, riendo.","ja":"むかし、ぱふというくもはあめをふらせることができませんでした。ほかのくもはみんなあめをふらせることができました。ぷふ、ぷふ、ざぱー！あめがふりました。でもぱふはぷふ、ぷふ、とやっても…でてきませんでした。「もっとがんばれ！」おおきいくもがいいました。ぱふはがんばりすぎてかおがむらさきになりました。でもなにもでてきませんでした。「こわれているのかな」ぱふがいうと、ほほからなみだがひとつぶこぼれました。かぜがぱふがないているのをみてふいてきました。「どうしたの、ちいさなくも？」「あめがふらせられないの」ぱふがしくしくといいました。「ほかのくもはみんなふらせられるのに、わたしはぷふぷふしてもなにもおきないの。」かぜはわらいました。「くしゃみをしてみた？」「くしゃみ？」「そう！むずむずしたら、おおきなくしゃみをするの！」かぜがぱふにちりをふきあげました。むずむず！ぴりぴり！ぱふはかおをしくしくして…「へっくしょん！」きらきらひかるちいさなあまのつぶがざぱーとでました！「やった！」ぱふがさけびました。「あめがふらせられる！くしゃみをするだけだったんだ！」そのひから、ぱふはそらでいちばんしあわせなくもでした。はながみずをほしがると、ぱふはとんでいって、おおきくいきをすって、いちばんきれいなあめをくしゃみでふらせました。したのこどもたちはみあげて「みて！ぱふだ！またくしゃみしてる！」といって、かさをもってわらいいながらはしりました。","fr":"Il était une fois un petit nuage nommé Puff qui ne pouvait pas pleuvoir. Tous les autres nuages pouvaient pleuvoir. Ils faisaient pouf, pouf, splash ! Et la pluie tombait. Mais Puff faisait pouf, pouf, et... rien. « Efforce-toi davantage ! » dit le Grand Nuage. Puff s'efforça si fort que son visage devint violet. Mais toujours rien. « Peut-être que je suis cassé, » dit Puff, et une petite larme roula sur sa joue. Le vent vit Puff pleurer et souffla vers lui. « Qu'y a-t-il, petit nuage ? — Je ne peux pas pleuvoir, » renifla Puff. « Tous les autres nuages peuvent pleuvoir, mais moi je fais pouf et pouf et rien ne se passe. » Le vent sourit. « As-tu déjà essayé d'éternuer ? — D'éternuer ? » demanda Puff. — Oui ! Quand tu sens des chatouilles, laisse juste sortir un grand éternuement ! » Le vent souffla un peu de poussière vers Puff. Ça chatouillait ! Ça picotait ! Puff plissa le visage et... « A-CHOU ! » Sortit un magnifique jet de petites gouttes de pluie, étincelant au soleil ! « J'ai réussi ! » cria Puff. « Je peux pleuvoir ! Je devais juste éternuer ! » Depuis ce jour, Puff fut le nuage le plus heureux du ciel. Chaque fois que les fleurs avaient besoin d'eau, Puff volait au-dessus, prenait une grande respiration, et éternuait les plus belles averses. Et tous les enfants en bas regardaient et disaient : « Regardez ! C'est Puff ! Il éternue encore ! » Et ils couraient dehors avec leurs parapluies, en riant."}},{"id":"bedtime-6","category":"bedtime","title":{"en":"The Dream Train","es":"El tren de los sueños","ja":"ゆめれっしゃ","fr":"Le train des rêves"},"text":{"en":"Every night at exactly eight o'clock, a magical train pulled into the station. It had no tracks. It had no wheels. It floated on clouds and ran on starlight. \"All aboard the Dream Train!\" called the conductor, a friendly badger in a blue hat. \"Next stop: Sweet Dreams!\" Children from all over the world climbed aboard. There was a girl from Japan who brought her teddy bear, and a boy from Brazil who brought his soccer ball, and twins from Canada who brought matching blankets. \"Where does the train go?\" asked the girl from Japan. \"To the Land of Dreams,\" said the conductor. \"Everyone picks their favorite dream before they fall asleep.\" The train chugged through the sky — choo choo! — past the Moon, through fields of stars, over rainbow bridges. The seats were made of marshmallows, and the windows showed pictures of candy forests and jellyfish gardens. \"I want to dream about flying!\" said the boy from Brazil. \"I want to dream about pandas!\" said the girl from Japan. \"We want to dream about snow!\" said the twins. The conductor punched their tickets with a star-shaped hole punch. \"All set! Close your eyes, everyone.\" One by one, the children drifted off to sleep. The Dream Train glided silently through the night, delivering each child to their perfect dream. And in the morning, they all woke up smiling, remembering the wonderful ride.","es":"Cada noche a las ocho en punto, un tren mágico llegaba a la estación. No tenía vías. No tenía ruedas. Flotaba sobre nubes y corría con luz de estrellas. \"¡Todos a bordo del Tren de los Sueños!\" llamó el revisor, un amistoso tejón con sombrero azul. \"¡Próxima parada: Dulces Sueños!\" Niños de todo el mundo subían al tren. Había una niña de Japón que trajo su osito, un niño de Brasil que trajo su balón, y gemelas de Canadá que trajeron mantas iguales. \"¿A dónde va el tren?\" preguntó la niña de Japón. \"A la Tierra de los Sueños,\" dijo el revisor. \"Cada uno elige su sueño favorito antes de quedarse dormido.\" El tren avanzó por el cielo — ¡choo choo! — pasó la Luna, cruzó campos de estrellas, sobre puentes de arcoíris. Los asientos eran de malvaviscos, y las ventanas mostraban imágenes de bosques de caramelos y jardines de medusas. \"¡Quiero soñar con volar!\" dijo el niño de Brasil. \"¡Quiero soñar con pandas!\" dijo la niña de Japón. \"¡Queremos soñar con nieve!\" dijeron las gemelas. El revisor perforó sus billetes con un perforador en forma de estrella. \"¡Todo listo! Cierren los ojos, todos.\" Uno por uno, los niños se quedaron dormidos. El Tren de los Sueños se deslizó silenciosamente por la noche, llevando a cada niño a su sueño perfecto. Y por la mañana, todos despertaron sonriendo, recordando el maravilloso viaje.","ja":"まいばんやじはちピッキにか、まほうれっしゃがえきにはいりました。せんろもたません。くるまもありません。くものうえにういてほしのひかりではしりました。「ゆめれっしゃにのるんだよ！」せんつうさんがいいました。あおいぼうしをかぶったしんせつなあなぐまさんでした。「つぎはゆめのくにだよ！」せかいじゅうのこどもたちがのりました。にほんのじょのこはぬいぐるみ、ブラジルのだんのこはサッカーボール、カナダのふたごはおそろいのぶらんかーとをつれてきました。「れっしゃはどこへいくの？」にほんのじょのこがききました。「ゆめのくにだよ」せんつうさんがいいました。「ねるまえにすきなゆめをえらぶんだ。」れっしゃはそらをはしりました—ちゅっちゅっ！—つきをとおりほしのはたけをぬけにじのはしをこえました。いすはましゅまろでまどはキャンディのもりとくらげのはなばたけをうつしました。「とぶゆめがいい！」ブラジルのだんのこがいいました。「パンダのゆめがいい！」にほんのじょのこがいいました。「ゆきのゆめがいい！」ふたごがいいました。せんつうさんはほしのかたちのパンチできっぷにあなをあけました。「よし！みんなめをとじて。」ひとりずつこどもたちはねむりました。ゆめれっしゃはしずかによるをすい、こどもたちをすきなゆめにつたえました。あさになるとみんなわらっておきました。すてきなたびをおもいだしながら。","fr":"Chaque nuit à huit heures pile, un train magique entrait en gare. Il n'avait ni rails ni roues. Il flottait sur les nuages et roulait sur la lumière des étoiles. « Tout à bord du Train des Rêves ! » appelait le contrôleur, un blaireau amical avec un chapeau bleu. « Prochain arrêt : Doux Rêves ! » Des enfants du monde entier montaient à bord. Il y avait une fille du Japon qui avait apporté son doudou, un garçon du Brésil avec son ballon, et des jumelles du Canada avec des couvertures assorties. « Où va le train ? » demanda la fille du Japon. « Au Pays des Rêves, » dit le contrôleur. « Chacun choisit son rêve préféré avant de s'endormir. » Le train avança dans le ciel — tchou tchou ! — passé la Lune, à travers des champs d'étoiles, sur des ponts d'arcs-en-ciel. Les sièges étaient en guimauve, et les fenêtres montraient des images de forêts de bonbons et de jardins de méduses. « Je veux rêver de voler ! » dit le garçon du Brésil. « Je veux rêver de pandas ! » dit la fille du Japon. « Nous voulons rêver de neige ! » dirent les jumelles. Le contrôleur poinçonna leurs billets avec un poinçon en forme d'étoile. « C'est parti ! Fermez les yeux, tout le monde. » Un par un, les enfants s'endormirent. Le Train des Rêves glissa silencieusement dans la nuit, livrant chaque enfant à son rêve parfait. Et au matin, tous se réveillèrent en souriant, se souvenant du merveilleux voyage."}},{"id":"bedtime-7","category":"bedtime","title":{"en":"The Lullaby Bird","es":"El pájaro nana","ja":"ゆりかごのうたのとり","fr":"L'oiseau berceuse"},"text":{"en":"In a tall tree at the center of the village lived a tiny bird named Melody. Melody had a special gift: she could sing the most beautiful lullabies. When she sang, the flowers closed their petals, the bees stopped buzzing, and even the river seemed to slow down to listen. Every evening, Melody would fly to each house in the village and sing outside the windows. At the baker's house, she sang a lullaby about warm bread and honey. The baker's children fell asleep smelling imaginary croissants. At the fisherman's house, she sang a lullaby about gentle waves and sleepy fish. The fisherman's baby nodded off, dreaming of tiny boats. At the schoolteacher's house, she sang a lullaby about books that read themselves to sleep. The schoolteacher smiled and closed her eyes. One night, Melody lost her voice. \"Tweet... croak... tweet...\" That was all she could manage. She felt terrible. \"I cannot sing tonight!\" The village was quiet. Babies cried. Children tossed and turned. Nobody could sleep. Then, something wonderful happened. The crickets began to chirp softly. The frogs hummed a low, gentle song. The wind rustled the leaves in a rhythm. And the river babbled a melody of its own. Together, all the sounds of nature made a lullaby even more beautiful than Melody's. \"Tweet!\" said Melody happily. \"I do not have to sing alone.\" And from that night on, Melody sang with the whole village, and everyone slept beautifully.","es":"En un árbol alto en el centro del pueblo vivía un pequeño pájaro llamado Melody. Melody tenía un don especial: podía cantar las nanas más hermosas. Cuando cantaba, las flores cerraban sus pétalos, las abejas dejaban de zumbar, e incluso el río parecía frenar para escuchar. Cada noche, Melody volaba a cada casa del pueblo y cantaba fuera de las ventanas. En la casa del panadero, cantaba una nana sobre pan tibio y miel. Los hijos del panadero se dormían oliendo croissants imaginarios. En la casa del pescador, cantaba una nana sobre olas suaves y peces soñolientos. El bebé del pescador se dormía, soñando con barquitos. En la casa de la maestra, cantaba una nana sobre libros que se leían solos antes de dormir. La maestra sonreía y cerraba los ojos. Una noche, Melody perdió la voz. \"Pío... croac... pío...\" Era todo lo que podía decir. Se sintió terrible. \"¡No puedo cantar esta noche!\" El pueblo quedó en silencio. Los bebés lloraban. Los niños daban vueltas en la cama. Nadie podía dormir. Entonces, algo maravilloso sucedió. Los grillos empezaron a cantar suavemente. Las ranas tararearon una canción baja y gentil. El viento movió las hojas en ritmo. Y el río murmuró su propia melodía. Juntos, todos los sonidos de la naturaleza crearon una nana aún más hermosa que la de Melody. \"¡Pío!\" dijo Melody feliz. \"No tengo que cantar sola.\" Y desde esa noche, Melody cantó con todo el pueblo, y todos dormían maravillosamente.","ja":"むらのまんなかのたかいきに、メロディーというちいさなとりがすんでいました。メロディーにはとくいなちからがありました。いちばんきれいなゆりかごのうたをうたえるのです。メロディーがうたうと、はながはなびらをとじ、はちがぶんぶんをやめ、かわもおそくながれてきくようになりました。まいばんメロディーはむらのいえいえをとんでまどのそとでうたいました。パンやのいえではあたたかいパンとはちみつのゆりかごのうたをうたいました。パンやのこどもたちはクロワッサンのにおいをかぎながらねました。りょしのいえではやさしいなみとねむたいさかなのゆりかごのうたをうたいました。りょしのあかちゃんはちいさなふねのゆめをみながらねました。せんせいのいえではじぶんでよむほんのゆりかごのうたをうたいました。せんせいはわらってめをとじました。あるよる、メロディーはこえをなくしました。「ちゅ…げろ…ちゅ…」それしかできませんでした。かなしくなりました。「こんやはうたえない！」むらはしずかになりました。あかちゃんがないた。こどもたちはねがえりをうった。だれもねられませんでした。するとすてきなことがおきました。こおろぎがやさしくないはじめました。かえるがひくいやさしいうたをハミングしました。かぜがはっぱをリズミカルにざわざわさせました。かわがじぶんのメロディーをぼそぼといいました。みんなのねいろがメロディーよりきれいなゆりかごのうたをつくりました。「ちゅ！」メロディーはうれしくなりました。「ひとりでうたなくてもいいんだ。」そのよるからメロディーはむらじゅうといっしょにうたってみんなぐっすりねました。","fr":"Dans un grand arbre au centre du village vivait un petit oiseau nommé Mélodie. Mélodie avait un don spécial : elle pouvait chanter les plus belles berceuses. Quand elle chantait, les fleurs fermaient leurs pétales, les abeilles cessaient de bourdonner, et même la rivière semblait ralentir pour écouter. Chaque soir, Mélodie volait à chaque maison du village et chantait aux fenêtres. Chez le boulanger, elle chantait une berceuse sur le pain chaud et le miel. Les enfants du boulanger s'endormaient en sentant des croissants imaginaires. Chez le pêcheur, elle chantait une berceuse sur les douces vagues et les poissons ensommeillés. Le bébé du pêcheur s'endormait, rêvant de petits bateaux. Chez la maîtresse, elle chantait une berceuse sur des livres qui se lisaient eux-mêmes avant de dormir. La maîtresse souriait et fermait les yeux. Une nuit, Mélodie perdit sa voix. « Cui... croa... cui... » C'était tout ce qu'elle pouvait faire. Elle se sentit terrible. « Je ne peux pas chanter ce soir ! » Le village fut silencieux. Les bébés pleurèrent. Les enfants se tournèrent dans leur lit. Personne ne pouvait dormir. Alors, quelque chose de merveilleux se produisit. Les grillons commencèrent à chanter doucement. Les grenouilles fredonnèrent une chanson basse et douce. Le vent fit bruire les feuilles en rythme. Et la rivière murmura sa propre mélodie. Ensemble, tous les sons de la nature créèrent une berceuse encore plus belle que celle de Mélodie. « Cui ! » dit Mélodie joyeusement. « Je n'ai pas à chanter seule. » Et depuis cette nuit, Mélodie chanta avec tout le village, et tout le monde dormait merveilleusement."}},{"id":"bedtime-8","category":"bedtime","title":{"en":"The Pillow That Was Too Soft","es":"La almohada demasiado suave","ja":"やわかりすぎたまくら","fr":"L'oreiller trop mou"},"text":{"en":"Emma had a new pillow. It was the softest pillow in the world. When she laid her head on it, she sank in like sinking into a marshmallow cloud. \"This is the best pillow ever,\" said Emma. But there was a problem. The pillow was so soft that Emma kept sinking deeper and deeper. First, her head sank in. Then her shoulders. Then her whole body! \"Help!\" cried Emma, disappearing into the pillow. She slid down a long, soft tunnel made of cotton and dreams. At the bottom, she landed in a bouncy, fluffy world. Everything was soft — the ground was soft, the trees were soft, even the rocks were soft! \"Where am I?\" asked Emma. \"You are in Pillow Land!\" said a round, squishy creature with button eyes. \"I am Mr. Fluff.\" \"How do I get home?\" asked Emma. \"You have to find the Firm Pillow,\" said Mr. Fluff. \"It is at the top of the Squishy Mountain.\" So Emma climbed the Squishy Mountain, bouncing with every step — boing, boing, boing! At the top, she found the Firm Pillow. It was not too soft and not too hard. It was just right. Emma laid her head on it and immediately woke up in her own bed. \"What a strange dream!\" she said. She looked at her new pillow. \"Maybe I will use my old pillow tonight.\" And she slept perfectly, dreaming of nothing at all.","es":"Emma tenía una almohada nueva. Era la almohada más suave del mundo. Cuando apoyaba la cabeza, se hundía como en una nube de malvavisco. \"Esta es la mejor almohada del mundo,\" dijo Emma. Pero había un problema. La almohada era tan suave que Emma seguía hundiéndose más y más. Primero se hundió su cabeza. Luego sus hombros. ¡Luego todo su cuerpo! \"¡Ayuda!\" gritó Emma, desapareciendo en la almohada. Se deslizó por un largo y suave túnel hecho de algodón y sueños. Al final, aterrizó en un mundo rebotante y esponjoso. Todo era suave — el suelo era suave, los árboles eran suaves, ¡hasta las rocas eran suaves! \"¿Dónde estoy?\" preguntó Emma. \"¡Estás en Tierra Almohada!\" dijo una criatura redonda y blanda con ojos de botón. \"Yo soy el Sr. Fluff.\" \"¿Cómo llego a casa?\" preguntó Emma. \"Tienes que encontrar la Almohada Firme,\" dijo el Sr. Fluff. \"Está en lo alto de la Montaña Esponjosa.\" Así que Emma subió la Montaña Esponjosa, rebotando con cada paso — ¡boing, boing, boing! En la cima, encontró la Almohada Firme. No era ni demasiado suave ni demasiado dura. Era perfecta. Emma apoyó la cabeza y inmediatamente despertó en su propia cama. \"¡Qué sueño tan extraño!\" dijo. Miró su almohada nueva. \"Quizás use mi almohada vieja esta noche.\" Y durmió perfectamente, sin soñar nada.","ja":"エマはあたらしいまくらをかいました。せかいいちやわらかいまくらでした。あたまをのせるとましゅまろのくものなかにしずむようでした。「せかいいちいいまくらだ」エマがいいました。でももんだいがありました。まくらはやわらかすぎてエマはどんどんしずんでいきました。まずあたまがしずみました。つぎにかた。そしてぜんしん！「たすけて！」エマがさけんでまくらのなかにきえました。わたとゆめでできたながいやわらかいトンネルをすべりおりました。したにつくとぴょんぴょんするふわふわのせかいにとびました。すべてがやわらかかったです — じめんもきもいわもやわらかかったです！「ここはどこ？」エマがききました。「まくらのくにだよ！」まるくてぎゅっとできるボタンめのせいぶつがいいました。「ふわふわせんせいだよ。」「おうちにかえるにはどうすればいい？」エマがききました。「かためのまくらをみつけるんだ」ふわふわせんせいがいいました。「ふわふわやまのうえにあるよ。」エマはふわふわやまをのぼりました — ぴょん、ぴょん、ぴょん！うえにかためのまくらをみつけました。やわらかすぎずかたすぎずぴったりでした。エマがあたまをのせるとじぶんのベッドでめがさめました。「へんなゆめだったな」いいました。あたらしいまくらをみました。「こんやはまえのまくらにしよう。」そしてなにもゆめをみずぐっすりねました。","fr":"Emma avait un nouvel oreiller. C'était l'oreiller le plus doux du monde. Quand elle y posait sa tête, elle s'enfonçait comme dans un nuage de guimauve. « C'est le meilleur oreiller du monde, » dit Emma. Mais il y avait un problème. L'oreiller était si doux qu'Emma continuait de s'enfoncer de plus en plus. D'abord, sa tête s'enfonça. Puis ses épaules. Puis tout son corps ! « À l'aide ! » cria Emma, disparaissant dans l'oreiller. Elle glissa dans un long et doux tunnel fait de coton et de rêves. Au bout, elle atterrit dans un monde rebondissant et moelleux. Tout était doux — le sol était doux, les arbres étaient doux, même les rochers étaient doux ! « Où suis-je ? » demanda Emma. « Tu es au Pays de l'Oreiller ! » dit une créature ronde et molle avec des yeux en boutons. « Je suis Monsieur Fluff. — Comment rentre-t-on à la maison ? » demanda Emma. — Tu dois trouver l'Oreiller Ferme, » dit Monsieur Fluff. « Il est en haut de la Montagne Moelleuse. » Alors Emma gravit la Montagne Moelleuse, rebondissant à chaque pas — boing, boing, boing ! Au sommet, elle trouva l'Oreiller Ferme. Il n'était ni trop mou ni trop dur. Il était parfait. Emma y posa sa tête et se réveilla immédiatement dans son propre lit. « Quel rêve étrange ! » dit-elle. Elle regarda son nouvel oreiller. « Peut-être que je vais utiliser mon vieil oreiller ce soir. » Et elle dormit parfaitement, sans rêver du tout."}},{"id":"bedtime-9","category":"bedtime","title":{"en":"The Clock That Stopped Time","es":"El reloj que detuvo el tiempo","ja":"じかんをとめたとけい","fr":"L'horloge qui arrêta le temps"},"text":{"en":"In a cozy little shop on a quiet street, there was an old clock. It had a round face, two hands, and a tiny door at the top where a bird was supposed to come out and sing. But the bird had not come out in a hundred years. One night, a little boy named Tom wandered into the shop. He touched the clock, and suddenly — tick... tock... tick... The clock started ticking again! The bird popped out and sang, \"Cuckoo! Cuckoo!\" But something strange happened. Everything outside the shop stopped. The rain hung in mid-air. The birds froze in the sky. Even the wind stopped blowing. \"I stopped time!\" said Tom, amazed. The little bird looked at Tom and said, \"You woke me up! I have been asleep for a hundred years! Quick, before time starts again — what year is it?\" \"It is 2026,\" said Tom. \"Oh my!\" said the bird. \"I have missed so many lullabies! Do children still sing before bed?\" \"Yes,\" said Tom. \"Good!\" said the bird. \"Then I must sing the oldest lullaby, the one that helps all children dream.\" The bird sang a song so beautiful that Tom felt his eyes grow heavy. The notes floated out the shop door and drifted across the frozen world. \"Now,\" said the bird, \"push the small button under my door.\" Tom pushed it. The clock chimed softly. Time started again. The rain fell. The birds flew. The wind blew. And Tom, back in his bed, heard a tiny cuckoo singing goodnight from somewhere far away.","es":"En una pequeña tienda acogedora en una calle tranquila, había un viejo reloj. Tenía una esfera redonda, dos manecillas, y una pequeña puerta arriba donde se suponía que un pájaro salía y cantaba. Pero el pájaro no había salido en cien años. Una noche, un niño llamado Tom entró en la tienda. Tocó el reloj, y de repente — tic... toc... tic... ¡El reloj empezó a funcionar! El pájaro salió y cantó, \"¡Cu-cú! ¡Cu-cú!\" Pero algo extraño pasó. Todo afuera de la tienda se detuvo. La lluvia colgaba en el aire. Los pájaros se congelaron en el cielo. Incluso el viento dejó de soplar. \"¡Detuve el tiempo!\" dijo Tom, asombrado. El pajarito miró a Tom y dijo, \"¡Me despertaste! ¡He estado dormido cien años! Rápido, antes de que el tiempo recomience — ¿qué año es?\" \"Es 2026,\" dijo Tom. \"¡Cielos!\" dijo el pájaro. \"¡Me he perdido muchas nanas! ¿Los niños todavía cantan antes de dormir?\" \"Sí,\" dijo Tom. \"¡Bien!\" dijo el pájaro. \"Entonces debo cantar la nana más antigua, la que ayuda a todos los niños a soñar.\" El pájaro cantó una canción tan hermosa que Tom sintió los ojos pesados. Las notas flotaron por la puerta y se esparcieron por el mundo congelado. \"Ahora,\" dijo el pájaro, \"presiona el botón pequeño debajo de mi puerta.\" Tom lo presionó. El reloj sonó suavemente. El tiempo recomenzó. La lluvia cayó. Los pájaros volaron. El viento sopló. Y Tom, de vuelta en su cama, escuchó un pequeño cu-cú cantando buenas noches desde muy lejos.","ja":"しずかなとおりにあるこじんまりしたみせにふるいとけいがありました。まるいもじばんとにほんのはりとうえにちいさなとびらがあってとりがでてうたうはずでした。でもとりはひゃくねんでてきませんでした。あるよる、トムというおとこのこがみせにはいりました。とけいにさわるととつぜん—ちく…たく…ちく…—とけいがうごきはじめました！とりがとびらからでて「カッコー！カッコー！」とうたいました。でもへんなことがおきました。みせのそとのすべてがとまりました。あめがそらでとまりました。とりがそらでこおりました。かぜもふきやみました。「じかんをとめた！」トムがおどろきました。とりがトムをみて「おこしてくれた！わたしはひゃくねんねていた！はやく、じかんがまたうごくまえに—いまなんねん？」「2026ねんだよ」トムがいいました。「まあ！」とりがいいました。「たくさんのゆりかごのうたをききのがした！こどもたちはまだねるまえにうたうの？」「うたうよ」トムがいいました。「よかった！」とりがいいました。「じゃあいちばんふるいゆりかごのうたをうたおう。こどもみんなのゆめをたすけるうただ。」とりはとてもきれいなうたをうたいトムのめがとろんになりました。おんぷがみせのドアからでてとまったせかいにひろがりました。「さあ」とりがいいました。「わたしのとびらのしたのちいさなボタンをおして。」トムがおすととけいがやさしくなりました。じかんがまたうごきはじめました。あめがふりとりがとびかぜがふきました。トムはベッドにかえりとおくからちいさなカッコーがおやすみをうたうのをききました。","fr":"Dans une petite boutique douillette sur une rue tranquille, il y avait une vieille horloge. Elle avait un cadran rond, deux aiguilles, et une petite porte en haut d'où un oiseau devait sortir et chanter. Mais l'oiseau n'était pas sorti depuis cent ans. Une nuit, un petit garçon nommé Tom erra dans la boutique. Il toucha l'horloge, et soudain — tic... toc... tic... L'horloge se remit à ticoter ! L'oiseau sortit et chanta : « Coucou ! Coucou ! » Mais quelque chose d'étrange se produisit. Tout à l'extérieur de la boutique s'arrêta. La pluie resta suspendue en l'air. Les oiseaux se figèrent dans le ciel. Même le vent cessa de souffler. « J'ai arrêté le temps ! » dit Tom, émerveillé. Le petit oiseau regarda Tom et dit : « Tu m'as réveillé ! Je dormais depuis cent ans ! Vite, avant que le temps reparte — en quelle année sommes-nous ? — En 2026, » dit Tom. — Oh là là ! » dit l'oiseau. « J'ai manqué tant de berceuses ! Les enfants chantent-ils encore avant de dormir ? — Oui, » dit Tom. — Bien ! » dit l'oiseau. « Alors je dois chanter la plus ancienne berceuse, celle qui aide tous les enfants à rêver. » L'oiseau chanta une chanson si belle que Tom sentit ses yeux s'alourdir. Les notes flottèrent hors de la boutique et dérivèrent à travers le monde figé. « Maintenant, » dit l'oiseau, « appuie sur le petit bouton sous ma porte. » Tom appuya. L'horloge sonna doucement. Le temps reprit. La pluie tomba. Les oiseaux volèrent. Le vent souffla. Et Tom, de retour dans son lit, entendit un petit coucou chanter bonne nuit de quelque part au loin."}},{"id":"bedtime-10","category":"bedtime","title":{"en":"The Sandman's Assistant","es":"El asistente del Hombre de Arena","ja":"すなおとこのじてん","fr":"L'assistant du Marchand de Sable"},"text":{"en":"The Sandman was very busy. Every night, he had to visit every child in the world and sprinkle magic sleep-sand on their eyes. \"There are too many children!\" he groaned, rubbing his tired eyes. \"I need an assistant!\" He put up a sign: \"Wanted: Sandman's Assistant. Must be quiet, gentle, and good at sprinkling.\" The first applicant was a elephant. \"I can sprinkle!\" she said. But when she tried, she sprayed sand everywhere — in the Sandman's eyes, on the ceiling, in the fish tank. \"No, no,\" said the Sandman, brushing sand off his hat. The second applicant was a snake. \"I am very quiet,\" she hissed. But she slithered so quietly that she scared the children. \"A snake in my bedroom!\" cried one child. \"No, no,\" said the Sandman. The third applicant was a tiny mouse named Pip. \"I am quiet and gentle,\" said Pip. \"And I have very small paws for precise sprinkling.\" The Sandman watched as Pip took a pinch of magic sand and sprinkled it — perfectly! Not too much, not too little. Right on a sleeping child's eyelids. \"Perfect!\" said the Sandman. \"You are hired!\" So Pip became the Sandman's assistant. Every night, the Sandman carried the big bag of sand, and Pip did the delicate sprinkling. They made a great team. And children all over the world fell asleep gently, dreaming of tiny mice and friendly sandmen. \"Best assistant ever,\" said the Sandman, and Pip squeaked happily.","es":"El Hombre de Arena estaba muy ocupado. Cada noche, tenía que visitar a cada niño del mundo y espolvorear arena mágica de sueño en sus ojos. \"¡Hay demasiados niños!\" gimió, restregándose los ojos cansados. \"¡Necesito un asistente!\" Puso un cartel: \"Se busca: Asistente del Hombre de Arena. Debe ser callado, gentil y bueno espolvoreando.\" La primera solicitante fue un elefante. \"¡Yo puedo espolvorear!\" dijo. Pero cuando lo intentó, roció arena por todas partes — en los ojos del Hombre de Arena, en el techo, en la pecera. \"No, no,\" dijo el Hombre de Arena, quitándose arena del sombrero. La segunda solicitante fue una serpiente. \"Soy muy callada,\" siseó. Pero se deslizó tan silenciosamente que asustó a los niños. \"¡Una serpiente en mi cuarto!\" lloró un niño. \"No, no,\" dijo el Hombre de Arena. El tercer solicitante fue un ratoncito llamado Pip. \"Soy callado y gentil,\" dijo Pip. \"Y tengo patitas muy pequeñas para espolvorear con precisión.\" El Hombre de Arena vio cómo Pip tomó una pizca de arena mágica y la espolvoreó — ¡perfectamente! Ni demasiado ni muy poco. Justo en los párpados de un niño dormido. \"¡Perfecto!\" dijo el Hombre de Arena. \"¡Estás contratado!\" Así que Pip se convirtió en el asistente del Hombre de Arena. Cada noche, el Hombre de Arena cargaba la bolsa grande de arena, y Pip hacía el espolvoreado delicado. Hacían un gran equipo. Y los niños de todo el mundo se dormían suavemente, soñando con ratonitos y hombres de arena amigables. \"El mejor asistente,\" dijo el Hombre de Arena, y Pip chilló felizmente.","ja":"すなおとこはとてもいそがしかったです。まいばんせかいのこどもみんなをたずねてまほうのすなをめにかける必要がありました。「こどもがおおすぎる！」すなおとこはつかれためをこすりながらうめきました。「じてんがほしい！」かんばんをたてました。「ぼしゅう：すなおとこのじてん。しずかでやさしくすなをかけられるひと。」いちばんめはぞうでした。「わたしはかけられる！」でもかけるとあちこちにすなばらまきました—すなおとこのめにもてんじょうにもさかなのすいそうにも。「だめだめ」すなおとこがぼうしのすなをはらいながらいいました。にばんめはへびでした。「わたしはとてもしずか」でもしずかすぎてこどもがこわがりました。「へびがへやにいる！」こどもがないました。「だめだめ」すなおとこがいいました。さんばんめはピップというちいさなねずみでした。「しずかでやさしいよ」ピップがいいました。「それにてがちいさからぴったりかけられるよ。」すなおとこがみているとピップはすなをつまんでぱらぱらと—ぴったり！おおすぎず少なすぎず。ねているこどものまぶたにかわに。「ぴったり！」すなおとこがいいました。「けっとく！」ピップはすなおとこのじてんになりました。まいばんすなおとこはおおきいふくろをもちピップがていねいにかけました。ふたりはチームでした。せかいのこどもたちはやさしくねむりちいさなねずみとしんせつなすなおとこのゆめをみました。「いちばんのじてんだ」すなおとこがいうとピップはちゅうとなくかいかい鳴きました。","fr":"Le Marchand de Sable était très occupé. Chaque nuit, il devait visiter chaque enfant du monde et saupoudrer de la magique sable à sommeil sur leurs yeux. « Il y a trop d'enfants ! » grommela-t-il, se frottant les yeux fatigués. « J'ai besoin d'un assistant ! » Il afficha une pancarte : « Recherché : Assistant du Marchand de Sable. Doit être silencieux, doux, et bon pour saupoudrer. » Le premier candidat fut un éléphant. « Je peux saupoudrer ! » dit-elle. Mais quand elle essaya, elle projeta du sable partout — dans les yeux du Marchand de Sable, au plafond, dans l'aquarium. « Non, non, » dit le Marchand de Sable, brossant le sable de son chapeau. Le deuxième candidat fut un serpent. « Je suis très silencieuse, » siffla-t-elle. Mais elle rampa si silencieusement qu'elle effraya les enfants. « Un serpent dans ma chambre ! » cria un enfant. « Non, non, » dit le Marchand de Sable. Le troisième candidat fut une petite souris nommée Pip. « Je suis silencieux et doux, » dit Pip. « Et j'ai de toutes petites pattes pour saupoudrer avec précision. » Le Marchand de Sable regarda Pip prendre une pincée de sable magique et saupoudrer — parfaitement ! Ni trop ni trop peu. Juste sur les paupières d'un enfant endormi. « Parfait ! » dit le Marchand de Sable. « Tu es embauché ! » Alors Pip devint l'assistant du Marchand de Sable. Chaque nuit, le Marchand de Sable portait le grand sac de sable, et Pip faisait le saupoudrage délicat. Ils faisaient une belle équipe. Et les enfants du monde entier s'endormaient doucement, rêvant de petites souris et de marchands de sable amicaux. « Le meilleur assistant, » dit le Marchand de Sable, et Pip couina joyeusement."}}],Kf=[{"id":"animals-1","category":"animals","title":{"en":"Granny and the Lost Bunny","es":"La abuela y el conejito perdido","ja":"おばあさんとまいごのうさぎ","fr":"Mamie et le lapin perdu"},"text":{"en":"Granny Mouse lived in a cozy teapot at the bottom of the garden. One morning, she woke up and found her grandson, little Bumper Bunny, was missing! \"Oh dear! Oh my!\" cried Granny, putting on her spectacles. \"Bumper! Bumper, where are you?\" She asked the robin. \"Have you seen my Bumper?\" \"Tweet tweet!\" said the robin. \"I saw a bunny hopping toward the pond!\" Granny grabbed her walking stick and hurried to the pond. But Bumper was not there. Only a frog on a lily pad. \"Have you seen a little bunny?\" asked Granny. \"Ribbit,\" said the frog. \"He hopped past here so fast he splashed me!\" Granny followed the wet footprints to the garden wall. A family of snails was sliding slowly along. \"Slow down, dear,\" said the snail. \"We saw a bunny go over the wall.\" Over the wall? At her age? Granny took a deep breath and climbed. Up, up, up — huff, puff, huff! At the top, she saw Bumper in the meadow, sitting in a patch of clover, eating happily. \"Bumper!\" called Granny. \"You scared me to pieces!\" Bumper looked up with clover all over his face. \"Sorry, Granny! I found the best clover ever! I had to share it!\" He held out a big bunch of sweet clover flowers. Granny smiled and sat down beside him. \"Well, next time, leave a note.\" They ate clover together in the sunshine, and Granny had to admit — it was the best clover she had ever tasted.","es":"La abuelita Ratona vivía en una tetera acogedora al fondo del jardín. Una mañana, descubrió que su nieto, el conejito Bumper, había desaparecido. \"¡Ay! ¡Dios mío!\" gritó, poniéndose los anteojos. \"¡Bumper! ¿Dónde estás?\" Preguntó al petirrojo. \"¿Has visto a mi Bumper?\" \"¡Pío, pío!\" dijo el petirrojo. \"¡Vi un conejo saltando hacia el estanque!\" La abuela tomó su bastón y corrió al estanque. Pero Bumper no estaba. Solo una rana en una hoja de lirio. \"¿Has visto un conejito?\" \"Croac,\" dijo la rana. \"¡Pasó tan rápido que me salpicó!\" La abuela siguió las huellas mojadas hasta el muro. Una familia de caracoles se deslizaba lentamente. \"Tranquila, querida,\" dijo el caracol. \"Vimos un conejo saltar el muro.\" ¿Saltar el muro? ¿A su edad? La abuela respiró profundo y escaló. ¡Arriba, arriba! En la cima, vio a Bumper en el prado, comiendo tréboles feliz. \"¡Bumper!\" gritó. \"¡Me asustaste mucho!\" Bumper levantó la mirada con tréboles en toda la cara. \"¡Perdón, abuela! ¡Encontré los mejores tréboles!\" Le dio un ramo. La abuela sonrió. \"La próxima vez, deja una nota.\" Comieron tréboles juntos bajo el sol.","ja":"おばあさんねずみはていえんのしたのちゃわんにすんでいました。あるあさ、まごのバンパーうさぎがいなくなりました！「おやおや！」おばあさんがめがねをかけました。「バンパー！どこ？」こまどりにききました。「バンパーをみた？」「ちゅんちゅん！」こまどりがいいました。「いけのほうにぴょんぴょんしていったよ！」おばあさんはつえをもちいけにいそぎました。でもバンパーはいませんでした。すいれんのはのうえにかえるだけでした。「うさぎをみた？」「げろ」かえるがいいました。「はやくとびすぎてみずがとんだよ！」おばあさんはぬれたあしもとをたどってかべにきました。かたつむりがゆっくりあるいていました。「ゆっくりね」かたつむりがいいました。「うさぎがかべをとびこえたよ。」とびこえる？このとしで？おばあさんはいきをすってのぼりました。うえにでるとバンパーがくさはらにすわってクローバーをたべていました。「バンパー！びっくりさせないで！」バンパーはかおじゅうクローバーだらけでみあげました。「ごめんねおばあちゃん！いちばんおいしいクローバーがみつかったの！」クローバーをわたしました。おばあさんはわらってとなりにすわりました。「つぎはメモをのこしてね。」ふたりはひなたでクローバーをたべました。","fr":"Mamie Souris vivait dans une théière douillette au fond du jardin. Un matin, elle découvrit que son petit-fils, le lapin Bumper, avait disparu ! « Mon Dieu ! » cria Mamie, mettant ses lunettes. « Bumper ! Où es-tu ? » Elle demanda au rouge-gorge. « As-tu vu mon Bumper ? — Cui cui ! » dit le rouge-gorge. « J'ai vu un lapin sauter vers l'étang ! » Mamie prit sa canne et courut à l'étang. Mais Bumper n'était pas là. Seule une grenouille sur un nénuphar. « As-tu vu un petit lapin ? — Croac, » dit la grenouille. « Il a passé si vite qu'il m'a éclaboussée ! » Mamie suivit les empreintes mouillées jusqu'au mur. Une famille d'escargots glissait lentement. « Doucement, chère, » dit l'escargot. « Nous avons vu un lapin franchir le mur. » Franchir le mur ? À son âge ? Mamie respira profondément et grimpa. En haut, elle vit Bumper dans la prairie, assis dans les trèfles, mangeant joyeusement. « Bumper ! » cria Mamie. « Tu m'as fait peur ! » Bumper leva les yeux, le visage couvert de trèfles. « Pardon, Mamie ! J'ai trouvé les meilleurs trèfles ! » Il lui tendit un bouquet. Mamie sourit et s'assit près de lui. « La prochaine fois, laisse un mot. » Ils mangèrent des trèfles ensemble au soleil."}},{"id":"animals-2","category":"animals","title":{"en":"The Penguin Who Couldn't Slide","es":"El pingüino que no podía deslizarse","ja":"すべれなかったペンギン","fr":"Le pingouin qui ne pouvait pas glisser"},"text":{"en":"Pico the Penguin lived in a big colony of penguins in Antarctica. All the other penguins could slide on their bellies — whoosh! — across the ice. But Pico could not slide. Every time he tried, he would wobble, tip over, and face-plant into the snow. SPLAT! \"Try again, Pico!\" called his friends. Pico tried again. SPLAT! \"Maybe I need more speed,\" said Pico. He backed up and took a running start. Run, run, run, dive! SPLAT! Snow everywhere. The other penguins giggled. \"Pico, you are the only penguin who cannot slide!\" Pico felt sad. He sat on the ice and watched everyone else having fun. An old polar seal slid up next to him. \"What is wrong, little one?\" \"I cannot slide,\" said Pico. \"Everyone can slide but me.\" The seal looked at Pico's belly. \"Hmm. Your belly is too fluffy! It is catching on the ice. You need to wax it.\" \"Wax it?\" \"Yes! Find some fish oil and rub it on your belly. It will make you slippery.\" Pico found some fish oil and rubbed it all over his belly. His belly became shiny and slick. He took a deep breath, got into position, and pushed off. Whoosh! He slid and slid and slid — across the whole ice field, past the seals, past the penguins, past the research station! \"Wheeeeee!\" shouted Pico. He slid so far he ended up in the ocean! When he climbed back out, everyone cheered. \"Pico can slide! Pico can slide!\" And from that day on, Pico was the fastest slider in Antarctica.","es":"Pico el Pingüino vivía en una gran colonia en la Antártida. Todos los demás pingüinos podían deslizarse sobre sus panzas — ¡whoosh! — por el hielo. Pero Pico no podía. Cada vez que intentaba, se tambaleaba, volcaba, y se estrellaba contra la nieve. ¡PLAF! \"¡Inténtalo de nuevo, Pico!\" Pico intentó otra vez. ¡PLAF! \"Quizás necesito más velocidad,\" dijo. Retrocedió, corrió, ¡y saltó! ¡PLAF! Los demás pingüinos rieron. \"Pico, ¡eres el único que no puede deslizarse!\" Pico se sentó triste en el hielo. Una foca vieja se deslizó a su lado. \"¿Qué pasa, pequeño?\" \"No puedo deslizarme,\" dijo Pico. La foca miró su panza. \"¡Tu panza es muy esponjosa! Necesitas aceitarla.\" Pico encontró aceite de pescado y se lo frotó. Su panza brilló. Respiró, se posicionó, y se impulsó. ¡Whoosh! Se deslizó por todo el hielo — ¡pasó las focas, los pingüinos, la estación! \"¡Wheeee!\" gritó Pico. Se deslizó tanto que terminó en el océano. Cuando salió, todos aplaudieron. \"¡Pico puede deslizarse!\" Y desde entonces, Pico fue el más rápido de la Antártida.","ja":"ピコペンギンはなんきょくのペンギンぐんにすんでいました。みんなおなかですべれました—しゅるる！—こおりのうえを。でもピコはすべれませんでした。やろうとするたびにぐらぐらしてひっくりかえりゆきにめがはいりました。ばふっ！「もういちどやってみてピコ！」ピコはもういちどやりました。ばふっ！「スピードがたりないのかな」ピコはあともどりしてとびのりました。あるけあるけあるけとびこめ！ばふっ！ほかのペンギンがわらいました。「ピコはすべれないペンギンだ！」ピコはかなしくなってこおりにすわりました。おおきいあざらしがすべってきました。「どうしたのちいさいの？」「すべれないの」ピコがいいました。あざらしはピコのおなかをみました。「おなかがふわふわすぎるよ！つるつるにしなきゃ。」ピコはさかなのあぶらをみつけておなかにぬりました。おなかがぴかぴかになりました。いきをしてすわってとびだしました。しゅるるるる！ずーっとすべっていきました—あざらしのそばペンギンのそばきょうかのそばをとおりすぎて！「わあああ！」ピコがさけびました。うみまでとんでいきました！でてくるとみんなはくしょくしました。「ピコがすべれる！」そのひからピコはなんきょくでいちばんはやいすべりやになりました。","fr":"Pico le Pingouin vivait dans une grande colonie en Antarctique. Tous les autres pingouins pouvaient glisser sur le ventre — whoosh ! — sur la glace. Mais Pico ne pouvait pas. Chaque fois qu'il essayait, il chancelait, basculait, et s'écrasait dans la neige. SPLAT ! « Réessaie, Pico ! » Pico réessaya. SPLAT ! « J'ai peut-être besoin de plus de vitesse, » dit Pico. Il recula, prit de l'élan, plongea ! SPLAT ! Les autres pingouins rirent. « Pico, tu es le seul pingouin qui ne peut pas glisser ! » Pico était triste. Un vieux phoque glissa près de lui. « Qu'y a-t-il, petit ? — Je ne peux pas glisser, » dit Pico. Le phoque regarda son ventre. « Hmm. Ton ventre est trop duveté ! Tu dois le cirer. » Pico trouva de l'huile de poisson et se la frotta sur le ventre. Son ventre devint brillant. Il respira, se positionna, et se poussa. Whoosh ! Il glissa et glissa — passé les phoques, les pingouins, la station ! « Wéééé ! » cria Pico. Il glissa si loin qu'il finit dans l'océan ! Quand il remonta, tout le monde applaudit. « Pico peut glisser ! » Et depuis ce jour, Pico fut le plus rapide d'Antarctique."}},{"id":"animals-3","category":"animals","title":{"en":"The Elephant Who Forgot Everything","es":"El elefante que lo olvidaba todo","ja":"すべてをわすれるぞう","fr":"L'éléphant qui oubliait tout"},"text":{"en":"Eli the Elephant had a terrible memory. This was very unusual for an elephant, since elephants are supposed to remember everything. But Eli could not even remember where he left his peanuts. \"Where are my peanuts?\" he would ask. \"In your trunk, dear,\" said his mother. \"Oh! So they are!\" One day, Eli went for a walk and forgot where he lived. He asked the parrot, \"Do I live in a tree?\" \"HA!\" laughed the parrot. \"Elephants do not live in trees! You live by the river, silly!\" Eli went to the river. \"Does this look like home?\" he asked the crocodile. \"Close enough,\" said the crocodile. \"But I think your family is upstream.\" Eli walked upstream. He passed a family of monkeys. \"Have you seen my family?\" \"They went that way!\" said the monkeys, pointing. Eli kept walking. He forgot why he was walking. \"Why am I walking?\" he asked a butterfly. \"I do not know,\" said the butterfly. \"Why are any of us walking?\" Eli thought about this for a very long time. Then he remembered — peanuts! He had peanuts in his trunk! He ate them. Then he remembered he was looking for his family. He walked a little further and found them having a picnic by the water. \"There you are!\" said his mother. \"Where have you been?\" Eli thought hard. \"I... forgot.\" His mother laughed. \"Well, you found your way home. That is what matters.\" And she gave him a big peanut. Eli ate it and smiled. He forgot what he was smiling about, but he was happy anyway.","es":"Eli el Elefante tenía memoria terrible. Muy raro para un elefante. No recordaba dónde dejaba sus cacahuates. \"¿Dónde están mis cacahuates?\" \"En tu trompa, querido,\" decía su madre. \"¡Ah, es verdad!\" Un día, Eli se perdió. \"¿Vivo en un árbol?\" preguntó al loro. \"¡JA!\" rió el loro. \"¡Los elefantes no viven en árboles! ¡Vives junto al río!\" Eli fue al río. \"¿Esto parece casa?\" preguntó al cocodrilo. \"Casi. Tu familia está río arriba.\" Eli caminó río arriba. Pasó a unos monos. \"¿Han visto a mi familia?\" \"¡Fueron por ahí!\" Eli siguió caminando y olvidó por qué caminaba. \"¿Por qué camino?\" preguntó a una mariposa. \"No sé. ¿Por qué caminamos todos?\" Eli pensó mucho. ¡Entonces recordó — cacahuates! Los tenía en la trompa. Se los comió. Recordó que buscaba a su familia. Caminó un poco más y los encontró de picnic. \"¡Aquí estás!\" dijo su madre. \"¿Dónde estabas?\" \"Se me... olvidó.\" Su madre rió. \"Pero encontraste el camino a casa. Eso es lo que importa.\" Le dio un cacahuate gigante.","ja":"エリぞうはひどいわすれものでした。ぞうなのにまいにちピーナッツをわすれました。「ピーナッツはどこ？」「はなのなかよ」おかあさんがいいました。「あっそうだ！」あるひエリはさんぽにいってうちがどこかわすれました。おうむにききました。「きのうえにすんでる？」「はっ！」おうむがわらいました。「ぞうはきにすまないよ！かわのそばにすんでるよ！」エリはかわにいきました。「ここうち？」わににききました。「ちかいよ。かぞくはかわのうえにあるよ。」エリはかわのうえにあるきました。さるにあいました。「かぞくをみた？」「あっちいったよ！」エリはあるきつづけました。でもなぜあるいているかわすれました。「なぜあるいてる？」ちょうちょにききました。「わからない。みんななぜあるいてるの？」エリはずっとかんがえました。そしておもいだしました—ピーナッツ！はなのなかにピーナッツがありました！たべました。かぞくをさがしていたのをおもいだしました。あるいていくとピクニックをしてるかぞくをみつけました。「いた！」おかあさんがいいました。「どこにいたの？」「…わすれた。」おかあさんはわらいました。「でもかえってきた。それがだいじ。」おおきいピーナッツをくれました。","fr":"Éli l'éléphant avait une mémoire terrible. Très inhabituel pour un éléphant. Il ne se souvenait même pas où il laissait ses cacahuètes. « Où sont mes cacahuètes ? — Dans ta trompe, chéri, » disait sa mère. « Ah, c'est vrai ! » Un jour, Éli se perdit. « Est-ce que j'habite dans un arbre ? » demanda au perroquet. « HA ! » rit le perroquet. « Les éléphants n'habitent pas dans les arbres ! Tu habites près de la rivière ! » Éli alla à la rivière. « Ça ressemble à chez moi ? » demanda au crocodile. « Presque. Ta famille est en amont. » Éli remonta la rivière. Il rencontra des singes. « Avez-vous vu ma famille ? — Ils sont passés par là ! » Éli continua et oublia pourquoi il marchait. « Pourquoi je marche ? » demanda à un papillon. « Je ne sais pas. Pourquoi marchons-nous tous ? » Éli réfléchit longuement. Puis il se souvint — les cacahuètes ! Il en avait dans sa trompe ! Il les mangea. Il se souvint qu'il cherchait sa famille. Il marcha un peu plus et les trouva en pique-nique. « Te voilà ! » dit sa mère. « Où étais-tu ? — J'ai... oublié. » Sa mère rit. « Mais tu as retrouvé le chemin. C'est ce qui compte. » Elle lui donna une grosse cacahuète."}},{"id":"animals-4","category":"animals","title":{"en":"The Bear Who Was Afraid of Bees","es":"El oso que le tenía miedo a las abejas","ja":"はちがこわいくま","fr":"L'ours qui avait peur des abeilles"},"text":{"en":"Boris the Bear loved honey more than anything in the world. But there was one problem: he was terrified of bees! Every time he saw a bee, he would run away screaming. \"BUZZZZ!\" went the bee. \"AHHHH!\" went Boris, climbing the nearest tree. One day, Boris decided he was tired of being afraid. \"I must face my fear!\" he declared. He marched up to a beehive with his eyes closed. \"Excuse me,\" he said politely. \"May I have some honey?\" A bee flew out. \"Why should we share with a bear who runs away screaming every time he sees us?\" \"Well,\" said Boris, \"I cannot help it. You are very buzzy.\" The bee laughed. \"We are not scary! We are just workers. Watch!\" The bee showed Boris how they made honey — flower by flower, drop by drop. It was amazing! \"That is the most beautiful thing I have ever seen,\" said Boris, his eyes wide. \"Would you like to help us collect nectar?\" asked the bee. \"Me? A bee helper?\" Boris was thrilled! So Boris spent the whole summer helping the bees. He was much bigger than them, so he could reach the high flowers. He would gently pick flowers and bring them to the hive. The bees made the best honey ever — \"Boris Honey\" — and gave him his own jar. \"I am not afraid of bees anymore!\" Boris told everyone. \"They are my friends!\" And from that day on, Boris never ran from a bee again. Well, almost never. Sometimes a bee would buzz in his ear and he would flinch. But then they would both laugh.","es":"Boris el Oso amaba la miel más que nada. Pero tenía un problema: ¡le aterrorizaban las abejas! Cada vez que veía una, salía corriendo. \"¡BZZZZ!\" \"¡AHHH!\" Boris subía al árbol más cercano. Un día decidió enfrentar su miedo. \"¡Debo enfrentar mi temor!\" Caminó hacia una colmena con los ojos cerrados. \"Disculpen, ¿puedo tener un poco de miel?\" Una abeja salió. \"¿Por qué compartiríamos con un oso que grita al vernos?\" \"No puedo evitarlo. Son muy zumbadoras.\" La abeja rio. \"¡No somos asustosas! Somos trabajadoras. ¡Mira!\" Le mostró cómo hacían miel — flor por flor, gota por gota. \"¡Es lo más hermoso que he visto!\" dijo Boris. \"¿Quieres ayudarnos a recolectar néctar?\" ¡Boris emocionado! Pasó todo el verano ayudando. Era más grande, así que alcanzaba las flores altas. Las abejas hicieron la mejor miel — \"Miel Boris\" — y le dieron su propio frasco. \"¡Ya no les tengo miedo!\" Boris nunca más corrió de una abeja. Bueno, casi nunca.","ja":"ボリスクマはせかいいちハチミツがすきでした。でももんだいがありました。はちがこわかったのです！はちをみるたびにさけんでにげました。「ぶんぶぶん！」「あああ！」ボリスクマはちかんきのぼりました。あるひボリスクマはおそれるのにつかれました。「こわさにむかおう！」めをとじてミツばちのすにいきました。「すみません、ハチミツをいただけますか？」はちがとびでました。「さけんでにげるくまにあげるの？」「しかたないんだ、ぶんぶんうるさいから。」はちはわらいました。「こわくないよ！しごとをしているだけ。みて！」はちミツのつくりかたをおしえました—はなをはなから、しずくからしずくへ。「いちばんきれい！」ボリスクマがいいました。「ねくたーをあつめるのをたすける？」「ぼくが？はちのてがかり？」ボリスクマはうれしくなりました！なつのあいだたすけました。おおきいからたかいはなにとどきました。やさしくはなをとってすにもっていきました。はちたちはいちばんおいしいハチミツをつくりました—「ボリスハチミツ」—じてんにもらいました。「もうこわくない！」ボリスクマはもうはちからにげませんでした。まあほとんど。たまにみみでぶんぶんするとびびりました。でもふたりでわらいました。","fr":"Boris l'Ours aimait le miel plus que tout. Mais il avait un problème : les abeilles le terrifiaient ! À chaque abeille, il criait et fuyait. « BZZZZ ! — AHHH ! » Boris grimpait au premier arbre. Un jour, il décida d'affronter sa peur. « Je dois affronter ma peur ! » Il marcha vers une ruche, yeux fermés. « Excusez-moi, puis-je avoir du miel ? » Une abeille sortit. « Pourquoi partagerions-nous avec un ours qui crie en nous voyant ? — Je n'y peux rien. Vous êtes très buzzeuses. » L'abeille rit. « Nous ne sommes pas effrayantes ! Regarde ! » Elle lui montra comment elles faisaient le miel — fleur par fleur, goutte par goutte. « C'est la plus belle chose que j'ai vue ! » dit Boris. « Veux-tu nous aider à récolter le nectar ? — Moi ? Un aide-abeille ? » Boris était ravi ! Il passa l'été à aider. Plus grand, il atteignait les fleurs hautes. Les abeilles firent le meilleur miel — « Miel Boris » — et lui donnèrent son propre pot. « Je n'ai plus peur ! » Boris ne fuit plus jamais une abeille. Enfin, presque jamais."}},{"id":"animals-5","category":"animals","title":{"en":"The Cat Who Thought He Was a Tiger","es":"El gato que se creía tigre","ja":"とらおもいのねこ","fr":"Le chat qui se croyait tigre"},"text":{"en":"Rex was a small orange cat who lived in a house with a garden. But Rex did not think he was a cat. He thought he was a tiger. \"I am a mighty tiger!\" he announced every morning. \"ROAAR!\" His meow sounded more like a squeak, but he did not notice. He tried to prowl through the garden like a tiger. He crouched low, wiggled his bottom, and pounced on a leaf. \"I have caught my prey!\" he declared proudly. The leaf just lay there. He tried to roar at the neighbor's dog. \"ROAAR!\" The dog looked down at him. \"You are a cat,\" said the dog. \"I am a TIGER!\" insisted Rex. The dog sighed. One day, Rex saw a real tiger on the television. \"That is me!\" said Rex, pointing with his paw. \"That is what I look like!\" His owner laughed. \"Rex, you are a cat. A very small cat.\" Rex refused to believe it. He went outside and tried to swim across the pond, because tigers can swim. Splash! He sank like a stone. The goldfish in the pond laughed. \"Nice try, tiger.\" Rex crawled out, wet and embarrassed. But he did not give up. He practiced his roar every day. \"ROAAR!\" It slowly got a tiny bit louder. \"ROAAR!\" The birds stopped laughing. \"ROAAR!\" The dog started to look a little nervous. One day, a burglar tried to break into the house. Rex pounced on him. \"ROAAR!\" The burglar was so startled he ran away! \"Did you see that?\" said the dog. \"That cat thinks he is a tiger — and now I believe him!\" Rex purred proudly. \"I told you. I am a mighty tiger.\"","es":"Rex era un pequeño gato naranja que se creía tigre. \"¡Soy un tigre poderoso!\" anunciaba cada mañana. \"¡GRRR!\" Su maullido sonaba como un chillido, pero no lo notaba. Acechaba el jardín como tigre. Se agachaba, movía el trasero, y saltaba sobre una hoja. \"¡Atrapé mi presa!\" La hoja solo estaba ahí. Intentó rugir al perro del vecino. \"¡GRRR!\" El perro lo miró. \"Eres un gato.\" \"¡Soy un TIGRE!\" Un día, Rex vio un tigre en la tele. \"¡Ese soy yo!\" Su dueño rio. \"Rex, eres un gato. Muy pequeño.\" Rex no lo creyó. Intentó nadar en el estanque porque los tigres nadan. ¡Splash! Se hundió como piedra. Las carpas rieron. \"Buen intento, tigre.\" No se rindió. Practicó su rugido diario. \"¡GRRR!\" Se hizo un poco más fuerte. \"¡GRRR!\" Los pájaros dejaron de reír. \"¡GRRR!\" El perro se puso nervioso. Un día, un ladrón intentó entrar. Rex saltó sobre él. \"¡GRRR!\" El ladrón salió corriendo. \"¿Viste eso?\" dijo el perro. \"¡Ese gato cree que es tigre — y ahora yo también lo creo!\" Rex ronroneó orgulloso. \"Les dije. Soy un tigre poderoso.\"","ja":"レックスはちいさなオレンジねこでした。でもトラだとおもっていました。「わたしはつよいトラだ！」まいあさつげました。「がおー！」でもそのなきごえはぴちゅぴちゅでした。きがつきませんでした。にわをトラのようにあるきました。うんこしてけつをふってはっぱにワン！「えものをとった！」はっぱはただそこにありました。おとなりのにわのいぬにがおーといいました。「がおー！」いぬがみおろしました。「ねこだ。」「トラだ！」レックスがいいました。いぬはためいきをつきました。あるひテレビでほんもののとらをみました。「あれはぼくだ！」レックスがっぱでゆびしました。「ぼくはあんなかんじだ！」ごしゅじんがわらいました。「レックス、きみはねこだ。ちいさなねこ。」レックスはしんじませんでした。そとにでていけをおよごうとしました—とらはおよげるから。ざぶん！いしのようにしずみました。きんぎょがわらいました。「ナイストライ、とら。」あきらめませんでした。まいにちがおーのれんしゅうをしました。「がおー！」すこしずつおおきくなりました。「がおー！」とりがわらうのをやめました。「がおー！」いぬがすこしきんちょうしました。あるひどろぼうがいえにはいろうとしました。レックスがとびかかりました。「がおー！」どろぼうはびっくりしてにげました。「みたか？」いぬがいいました。「あのねこがトラおもい—いまぼくもそうおもう！」レックスはほこらしくごろごろしました。「いったでしょ。わたしはつよいトラだって。」","fr":"Rex était un petit chat orange qui se croyait tigre. « Je suis un puissant tigre ! » annonçait-il chaque matin. « GRRR ! » Son miaulement ressemblait à un couinement, mais il ne le remarquait pas. Il chassait dans le jardin comme un tigre. Il s'accroupissait, wiggait son arrière-train, et sautait sur une feuille. « J'ai attrapé ma proie ! » La feuille restait là. Il rugit au chien du voisin. « GRRR ! » Le chien le regarda. « Tu es un chat. — Je suis un TIGRE ! » Un jour, Rex vit un vrai tigre à la télé. « C'est moi ! » Son maître rit. « Rex, tu es un chat. Très petit. » Rex refusa d'y croire. Il essaya de nager dans l'étang — les tigres nagent. Plouf ! Il coula comme une pierre. Les poissons rirent. « Bel essai, tigre. » Il ne renonça pas. Il pratiqua son rugissement. « GRRR ! » Il devint un peu plus fort. « GRRR ! » Les oiseaux cessèrent de rire. « GRRR ! » Le chien devint nerveux. Un jour, un cambrioleur tenta d'entrer. Rex sauta sur lui. « GRRR ! » Le cambrioleur prit la fuite ! « Tu as vu ça ? » dit le chien. « Ce chat se croit tigre — et maintenant je le crois aussi ! » Rex ronronna fièrement. « Je vous l'avais dit. Je suis un puissant tigre."}},{"id":"animals-6","category":"animals","title":{"en":"The Duck Who Quacked Too Loud","es":"El pato que graznaba muy fuerte","ja":"おおきいこえのあひる","fr":"Le canard qui coinçait trop fort"},"text":{"en":"Daisy the Duck had the loudest quack in the entire pond. When she quacked, the fish jumped out of the water, the frogs covered their ears, and the reeds bent backward. \"QUACK QUACK QUACK!\" \"Please, Daisy,\" said the mother swan. \"Some of us are trying to sleep.\" \"QUACK!\" said Daisy, not meaning to be loud. It just came out that way. The other ducks whispered. Daisy could not whisper. Her whispers were louder than most ducks' regular quacks. \"quack\" she would try. \"QUACK!\" it would come out. Daisy felt sad. \"Nobody wants me around,\" she said, swimming to the far end of the pond. A family of tiny ducklings was crossing the road nearby. A car was coming! The ducklings froze! Daisy saw the danger. She took the deepest breath of her life and let out the loudest quack ever heard in the history of ducks. \"QUUUUUUAAAAACK!\" The car screeched to a halt. The driver stopped and helped the ducklings cross safely. \"QUACK QUACK!\" Daisy shouted, making sure everyone was okay. When they were all safe, the mother duck ran to Daisy. \"You saved my babies! Your loud quack is a gift!\" The other animals cheered. \"Three cheers for Daisy! QUACK QUACK QUACK!\" From that day on, Daisy was the pond's official safety duck. Whenever there was danger, she would quack the alarm. And nobody ever asked her to be quiet again. Well, except at bedtime. Some things never change.","es":"Daisy la Pata tenía el graznido más fuerte del estanque. Cuando graznaba, los peces saltaban, las ranas tapaban sus oídos, y las cañas se doblaban. \"¡CUAC CUAC CUAC!\" \"Por favor, Daisy,\" dijo la mamá cisne. \"Algunos intentamos dormir.\" \"¡CUAC!\" No lo hacía a propósito. Los demás patos susurraban. Daisy no podía susurrar. \"cuac\" intentaba. \"¡CUAC!\" salía. Se sintió triste. \"Nadie me quiere cerca.\" Se fue al fondo del estanque. ¡Una familia de patitos cruzaba la calle! ¡Venía un coche! Los patitos se congelaron. Daisy tomó aire y dio el graznido más grande de la historia. \"¡CUUUUUAAAAAC!\" El coche frenó. El conductor ayudó a los patitos. \"¡CUAC CUAC!\" Cuando estuvieron seguros, la mamá pato abrazó a Daisy. \"¡Salvaste a mis bebés! ¡Tu graznido es un don!\" Todos aplaudieron. \"¡Viva Daisy!\" Desde entonces, fue la pato de seguridad oficial. Nadie le pidió silencio. Bueno, salvo a la hora de dormir.","ja":"デイジーあひるはいけでいちばんおおきいこえでした。ガアガアするとさかながとびはね、かえるがみみをふさぎ、あしがまえまがりました。「ガアガアガア！」「おねがいデイジー」はくちょうのおかあさんがいいました。「ねむいのよ。」「ガア！」わざとじゃありません。ほかのあひるはささやけました。デイジーはささやけませんでした。「があ」やってみました。「ガア！」なってしまいました。かなしくなりました。「だれもちかくにいてほしくないみたい。」いけのはしにおよいでいきました。するとちいさなあひるのこどもたちがみちをわたろうとしていました！くるまがきていました！あひるたちはこおりました！デイジーがきけんをみました。いちばんおおきくいきをすってせかいいちおおきいガアをしました。「ガアアアアアア！」くるまがきゅうブレーキしました。うんてんしゅがとまってあひるたちをたすけました。「ガアガア！」みんなだいじょうぶかたしかめました。みんなあんぜんになるとあひるのおかあさんがデイジーにかけました。「こどもをすくってくれた！おおきいこえはたからもの！」みんなはくしょくしました。「デイジーばんざい！」そのひからデイジーはいけのあんぜんあひるになりました。きけんがあるとガアでしらせました。だれもしずかにしてとはいいませんでした。まあねるじかんはのぞく。","fr":"Daisy la cane avait le coincoin le plus fort de l'étang. Quand elle coinçait, les poissons sautaient, les grenouilles se bouchaient les oreilles, et les roseaux se courbaient. « COIN COIN COIN ! — S'il te plaît, Daisy, » dit la maman cygne. « Certains essaient de dormir. — COIN ! » Ce n'était pas fait exprès. Les autres canards chuchotaient. Daisy ne pouvait pas chuchoter. « coin » essayait-elle. « COIN ! » sortait. Elle se sentit triste. « Personne ne me veut près. » Elle nagea au bout de l'étang. Une famille de canetons traversait la route ! Une voiture arrivait ! Les canetons se figèrent ! Daisy prait la plus grande inspiration de sa vie et lança le coincoin le plus fort de l'histoire. « COOOOIIIIN ! » La voiture freina. Le conducteur aida les canetons. « COIN COIN ! » Quand ils furent en sécurité, la maman cane courut à Daisy. « Tu as sauvé mes bébés ! Ton coincoin est un don ! » Tout le monde acclama. « Vive Daisy ! » Elle devint la cane de sécurité officielle. Personne ne lui demanda plus d'être silencieuse. Enfin, sauf au coucher."}},{"id":"animals-7","category":"animals","title":{"en":"The Monkey Who Stole Hats","es":"El mono que robaba sombreros","ja":"ぼうしをぬすんださる","fr":"Le singe qui volait des chapeaux"},"text":{"en":"In a sunny town by the sea, there lived a mischievous monkey named Momo. Momo loved hats. He did not buy hats. He stole them! The baker's hat? Gone! The postman's cap? Gone! The mayor's fancy top hat? Gone, gone, gone! Everyone was upset. \"That monkey stole my hat!\" complained the baker. \"Mine too!\" said the postman. Momo sat on the roof, wearing three hats at once, looking very pleased with himself. A visiting sailor had an idea. He took off his big white sailor hat and put it on the ground. Then he walked away. Momo crept down from the roof. He picked up the sailor hat and put it on his head. But this hat was special — it had a string attached! The sailor pulled the string, and the hat flew off Momo's head. \"Ooh!\" said Momo, surprised. The sailor put the hat down again. Momo grabbed it. Pull! Off it flew. Momo was confused. He tried again. Pull! Off! \"This is fun!\" said Momo. He forgot all about stealing. He played the hat game all afternoon. The next day, the sailor brought a second hat with a string. He gave one to Momo. \"Now you have your own hat to play with!\" Momo was so happy! He played with his hat all day — on, off, on, off! He had so much fun that he forgot to steal anyone's hat. One by one, he gave back all the stolen hats. The baker got his hat back. The postman got his
