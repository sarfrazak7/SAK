eow. She opened the door. A small, thin cat was sitting there, shivering. \"Oh, you poor thing!\" said Mrs. Chen. She brought the cat inside. She wrapped it in a towel and gave it warm milk. The cat purred. \"You are welcome to stay,\" said Mrs. Chen. The cat stayed. She named it Lucky. Lucky was a good cat. It sat on Mrs. Chen's lap while she watched TV. It slept at the foot of her bed. It greeted her every morning with a purr and a head-butt. Mrs. Chen was not lonely anymore. She talked to Lucky. \"Lucky, today I made dumplings. Do you want some?\" Lucky always wanted some. Mrs. Chen started going out more. She took Lucky to the park. She met other cat owners. \"Your cat is so cute!\" they said. \"Thank you! I found her on my doorstep.\" Soon, Mrs. Chen had friends — the cat owners, the park regulars, the shopkeepers. \"That cat changed your life!\" said her neighbor. \"She saved both of us,\" said Mrs. Chen. When her children visited, they were amazed. \"Mom, you look so happy!\" \"I have Lucky now,\" she said, smiling. Lucky purred on her lap. And every night, Mrs. Chen said to Lucky, \"I am so glad you found my door.\" And Lucky purred, which was cat for \"Me too.\"","es":"La Sra. Chen vivía sola. Una noche de invierno, un gato tembloroso apareció en su puerta. Lo acogió, lo llamó Lucky. Ya no estaba sola. Salió más, hizo amigos en el parque. \"Ese gato cambió tu vida.\" \"Nos salvamos mutuamente.\" Cada noche le decía: \"Qué bueno que encontraste mi puerta.\" Lucky ronroneaba.","ja":"チェンおばあさんはひとりぐらしでした。あるふゆのよるねこがドアのまえでふるえていました。いれてラッキーとなづけました。ひとりじゃなくなりました。こうえんにいってともだちができました。「ねこがかえた」「おたがいたすけあった。」まいばん「ドアをみつけてよかった」というとラッキーがゴロゴロいいました。","fr":"Mme Chen vivait seule. Une nuit d'hiver, un chat tremblant apparut à sa porte. Elle l'accueillit, le nomma Lucky. Elle n'était plus seule. Elle sortit plus, se fit des amis au parc. « Ce chat a changé ta vie. — Nous nous sommes sauvées mutuellement. » Chaque soir : « Que tu aies trouvé ma porte. » Lucky ronronnait."}},{"id":"kindness-6","category":"kindness","title":{"en":"The Bully Who Changed","es":"El matón que cambió","ja":"かわったいじめっこ","fr":"Le tyran qui changea"},"text":{"en":"Marcus was the biggest kid in school. He was also the meanest. He pushed kids, took their snacks, and called them names. Everyone was afraid of him. One day, a new kid named David arrived. David was small and wore glasses. Marcus saw an easy target. \"Hey, four-eyes!\" he said, snatching David's lunch. But David did not cry. He did not run. He just looked at Marcus. \"Why are you mean?\" he asked quietly. \"What?\" \"Why are you mean? You do not seem happy.\" Marcus was confused. Nobody had ever asked him that. \"I... I do not know,\" he said. \"Are you sad?\" asked David. Marcus felt something weird. His eyes got wet. He blinked hard. \"Nobody asks me that,\" he said. \"Maybe because they are afraid of you,\" said David. \"Are you afraid of me?\" \"No. You seem lonely.\" Marcus sat down. He did not say anything for a long time. Then he said, \"My dad moved away. He said he did not want me anymore.\" David sat next to him. \"That must hurt.\" \"It does.\" \"You know, being mean does not make the hurt go away. It just makes everyone else hurt too.\" Marcus thought about this. \"What should I do?\" \"Start by giving me my lunch back.\" Marcus handed the lunch back. \"Sorry,\" he said. \"And sorry to everyone else.\" The next day, Marcus did not push anyone. He did not take anyone's snacks. He sat with David at lunch. It was awkward at first. But slowly, things changed. Marcus was still big, but he used his strength to help, not hurt. He carried heavy things for the teacher. He helped smaller kids reach the top shelf. \"Marcus is nice now!\" said everyone, amazed. And David and Marcus became best friends.","es":"Marcus era el matón del colegio. Un día, el nuevo David le preguntó: \"¿Por qué eres malo? No pareces feliz.\" Marcus lloró: \"Mi papá se fue.\" David le dijo: \"Ser malo no quita el dolor.\" Marcus devolvió el almuerzo. Poco a poco cambió. Usó su fuerza para ayudar. Se hicieron mejores amigos.","ja":"マーカスはがっこうでいちばんおおきくていじめっこでした。あるひデイビッドがきて「なしていじめるの？かなしそうだね。」マーカスはないた。「パパがでっていった。」デイビッドが「いじめてもかなしみはきえないよ。」マーカスはべんとうをかえしました。だんだんかわりました。ちいさいこをたすけるようになりました。ベストフレンドになりました。","fr":"Marcus était le tyran de l'école. Un jour, le nouveau David demanda : « Pourquoi es-tu méchant ? Tu n'as pas l'air heureux. » Marcus pleura : « Mon père est parti. — Être méchant n'efface pas la douleur. » Marcus rendit le déjeuner. Peu à peu il changea. Il aida les autres. Ils devinrent meilleurs amis."}},{"id":"kindness-7","category":"kindness","title":{"en":"The Cookies That Made Friends","es":"Las galletas que hicieron amigos","ja":"ともだちをつくるクッキー","fr":"Les cookies qui firent des amis"},"text":{"en":"Sophie loved baking cookies. She baked them every weekend — chocolate chip, oatmeal, peanut butter. But she always ate them alone. \"Why do you not share your cookies?\" asked her mother. \"I do not have anyone to share with,\" said Sophie. Her mother smiled. \"Why do you not bring some to the neighbors?\" Sophie was shy. Talking to neighbors was scary. But she made a big batch of chocolate chip cookies and put them in a box. She knocked on the first door. Mrs. Kim opened it. \"Hello? Oh! Cookies! For me?\" \"Yes! I made them!\" said Sophie. Mrs. Kim beamed. \"Thank you! I will bring you some kimchi!\" Sophie knocked on the second door. Mr. Garcia opened it. \"Cookies? Thank you! I will bring you empanadas!\" She knocked on the third door. The Tanaka family. \"Cookies! Arigato! I will bring you mochi!\" By the end of the day, Sophie had given cookies to ten neighbors. And in return, she received kimchi, empanadas, mochi, dumplings, curry, and cake! \"Mom! Look at all this food!\" \"You see? Sharing makes more food, not less.\" Every weekend after that, Sophie baked cookies and shared them. The neighbors started sharing too. Mrs. Kim brought kimchi. Mr. Garcia brought empanadas. The Tanakas brought mochi. Soon, they had a monthly block party where everyone brought food. \"All of this because of cookies,\" said Sophie. \"Not just cookies,\" said her mother. \"Because you were brave enough to knock on a door.\" And Sophie was not shy anymore. She was the cookie girl — the girl who brought the street together.","es":"Sophie horneaba galletas pero las comía sola. Su madre sugirió compartirlas. Sophie las llevó a los vecinos. Recibió kimchi, empanadas, mochi, dumplings, curry. Cada fin de semana horneaba y compartía. Los vecinos empezaron a compartir también. Hubo fiestas mensuales de la cuadra. \"Todo por galletas.\" \"No, por ser valiente de tocar puertas.\"","ja":"ソフィーはまいしゅうまつクッキーをやいてひとりでたべていました。「ともだちにわけたら？」ママがいいました。ソフィーはきんちょしてとなりにクッキーをもっていきました。キムチ、エンパナダ、もち、ギョーザ、カレーをもらいました！まいしゅうまつわけあうようになりました。まいつきブロックパーティーがありました。「クッキーのおかげ。」「どアをノックするゆうきのおかげ。」","fr":"Sophie cuisinait des cookies mais les mangeait seule. Sa mère suggéra de les partager. Sophie les porta aux voisins. Elle reçut kimchi, empanadas, mochi, dumplings, curry ! Chaque week-end, elle partageait. Les voisins aussi. Il y eut des fêtes de rue mensuelles. « Tout ça grâce aux cookies. — Non, grâce au courage de frapper aux portes."}},{"id":"kindness-8","category":"kindness","title":{"en":"The Letters to Grandma","es":"Las cartas a la abuela","ja":"おばあちゃんへのてがみ","fr":"Les lettres à grand-mère"},"text":{"en":"Grandma lived far away in the countryside. Emma missed her. \"Can we call Grandma?\" \"She does not have a phone,\" said Mom. \"Can we visit?\" \"It is too far.\" Emma was sad. \"Then I will write her a letter!\" Emma got paper and crayons. She drew a picture of her and Grandma holding hands. She wrote: \"Dear Grandma, I miss you. I learned to ride a bike. Love, Emma.\" Mom mailed the letter. Two weeks later, a letter came back! Emma opened it excitedly. It was from Grandma! \"Dear Emma, I miss you too. I am proud of you for riding a bike. I planted sunflowers in the garden. Love, Grandma.\" Emma was so happy! She wrote back immediately. She drew a picture of sunflowers. \"Dear Grandma, I drew your sunflowers! Can you send me a seed?\" Grandma sent a sunflower seed! Emma planted it in a pot. She wrote: \"Dear Grandma, I planted your seed! It has not grown yet but I am waiting.\" Every week, Emma wrote a letter. She told Grandma about school, her friends, her pet fish. Grandma wrote back about the garden, the birds, the weather. The letters piled up — dozens of them! Emma's teacher said, \"Emma, you are the best writer in class!\" \"I practice every week writing to my Grandma.\" When Emma finally visited Grandma that summer, they hugged for a long time. \"I feel like I have been with you all along,\" said Grandma. \"Your letters kept me company.\" Emma looked at Grandma's garden. The sunflowers were taller than she was! \"Your letters gave me something to look forward to,\" said Grandma. And Emma kept writing letters for the rest of her life. Because she knew that a letter could travel where a phone could not reach, and carry love across any distance.","es":"Emma extrañaba a su abuela que vivía lejos. Empezó a escribirle cartas cada semana. Dibujaba y contaba sobre la escuela. La abuela respondía sobre el jardín y las flores. La maestra dijo: \"¡Eres la mejor escritora!\" Al verano, se visitaron. \"Tus cartas me acompañaron.\" Emma siguió escribiendo cartas toda su vida.","ja":"エマはとおくにすむおばあちゃんにあいたかったです。「でんわかけたい」「ないよ。」「あいたい。」「とおいよ。」エマはてがみをかくことにしました。まいしゅうかきました。おばあちゃんもへんじをかきました。せんせいが「クラスでいちばんじょうず！」といいました。なつにあいにいきました。「てがみがあい手だったよ。」エマはいっしょうてがみをかきつづけました。","fr":"Emma voulait voir sa grand-mère loin. Elle commença à écrire des lettres chaque semaine. Dessins et histoires d'école. Grand-mère répondait sur le jardin. La maîtresse dit : « Tu écris le mieux ! » En été, elles se visitèrent. « Tes lettres m'ont tenue compagnie. » Emma écrivit toute sa vie."}},{"id":"kindness-9","category":"kindness","title":{"en":"The Toy Share","es":"Compartir juguetes","ja":"おもちゃわかちあい","fr":"Le partage de jouets"},"text":{"en":"Ben had a huge toy collection. Cars, trains, blocks, puzzles — his room was full. But he never shared. \"These are MY toys,\" he said whenever friends came over. His friends had to sit and watch him play. They got bored and went home. Soon, nobody came to play with Ben. \"Why does nobody want to play with me?\" he asked his mom. \"Would you want to play with someone who never shares?\" Ben thought about it. \"No.\" \"Then maybe you should share.\" The next day, Ben brought his bucket of cars to school. \"Anyone want to play cars?\" he asked. Five kids ran over! \"Me! Me! Me!\" Ben gave each kid a car. They built a giant track together. It was the most fun Ben had ever had! \"Playing together is better than playing alone!\" he said. He brought blocks the next day. They built a tower so tall it touched the ceiling! \"This is amazing!\" said his friend. On Friday, Ben brought his whole toy collection. \"Share day!\" he announced. Everyone shared. Kids who never talked to Ben were suddenly his friends. \"Ben, you are so nice now!\" said a girl who used to avoid him. \"I was not nice before?\" \"Not really.\" Ben was surprised. \"I did not realize.\" He went home and told his mom. \"Sharing made me friends!\" \"Yes, it did.\" Ben kept sharing. He even gave some toys to kids who did not have any. \"Here, this is for you.\" \"Really? Thank you!\" Ben discovered that giving things away felt even better than getting things. \"Who knew?\" he said. And his room was less full, but his heart was fuller.","es":"Ben tenía muchos juguetes pero no compartía. Nadie jugaba con él. Su mamá le dijo: \"¿Jugarías con quien no comparte?\" Al día siguiente, Ben llevó autos a la escuela. ¡Cinco niños jugaron! \"Jugar juntos es mejor.\" Compartió cada día. Hizo amigos. Hasta regaló juguetes. \"Dar se siente mejor que recibir.\"","ja":"ベンはおもちゃがたくさんありましたがわかちあいませんでした。だれもあそびにきませんでした。「わけたら？」ママがいいました。つぎのひベンはがっこうにくるまをもっていきました。ごにんのこがあそびました。「いっしょのほうがたのしい！」まいにちわかちあいました。ともだちができました。おもちゃをプレゼントしました。「あげるほうがもらうよりうれしい。」","fr":"Ben avait beaucoup de jouets mais ne partageait pas. Personne ne jouait avec lui. Sa mère dit : « Jouerais-tu avec quelqu'un qui ne partage pas ? » Le lendemain, Ben apporta des voitures à l'école. Cinq enfants jouèrent ! « Ensemble c'est mieux ! » Il partagea chaque jour. Se fit des amis. Offrit même des jouets. « Donner est mieux que recevoir."}},{"id":"kindness-10","category":"kindness","title":{"en":"The Kindness Jar","es":"El frasco de bondad","ja":"やさしさびん","fr":"Le bocal de bonté"},"text":{"en":"Ms. Park's class had a special jar. It was called the Kindness Jar. Every time someone did something kind, they put a marble in the jar. \"When the jar is full,\" said Ms. Park, \"we will have a pizza party!\" The jar started empty. On Monday, Leo helped Mia pick up her spilled crayons. Click! A marble went in. On Tuesday, Sam shared his snack with a hungry classmate. Click! On Wednesday, Lily invited the new kid to play. Click! On Thursday, Tom held the door for the teacher carrying books. Click! On Friday, everyone cleaned up the classroom without being asked. Click, click, click! Three marbles! The jar was filling up. The kids were excited. \"How many marbles do we need?\" \"Fifty,\" said Ms. Park. They counted every day. \"We have twenty!\" \"Thirty!\" \"Forty!\" Then the marbles slowed down. The kids got busy. They forgot to be kind. \"We have been stuck at forty-two for a week,\" said Leo. \"We need more kindness!\" said Mia. They made kindness posters. \"Be kind!\" \"Share!\" \"Help!\" They put them up around the school. Other classes saw the posters. \"What is the Kindness Jar?\" \"Every kind act gets a marble. When it is full, pizza party!\" Other classes started their own jars. The whole school was doing kind acts! The hallway was full of kindness. Kids held doors, shared snacks, helped each other. Finally, Ms. Park's jar reached fifty! \"Pizza party!\" cheered the class. But something interesting happened. Even after the jar was full, the kids kept being kind. \"Why?\" asked Ms. Park. \"Because being kind feels good,\" said Leo. \"Better than pizza?\" \"Almost as good as pizza,\" said Leo. And everyone laughed. And the kindness continued, jar or no jar.","es":"La clase de la Sra. Park tenía un \"Frasco de Bondad\". Cada acto amable merecía una canica. Lleno = fiesta de pizza. Los niños ayudaban, compartían, invitaban. Llegaron a 42 y se estancaron. Hicieron carteles. Otras clases copiaron la idea. ¡Todo el colegio fue amable! Llegaron a 50. ¡Pizza! Pero siguieron siendo amables. \"Ser amable se siente bien. Casi tan bien como la pizza.\"","ja":"パークせんせいのクラスにはやさしさびんがありました。やさしいことをするとビー玉をいれました。いっぱいになるとピザパーティー！まいにちたすけあっていました。48でとまったのでポスターをつくりました。ほかのクラスもまねしました。がっこうぜんぶやさしくなりました！ビンがいっぱいになりました！ピザパーティー！でもやさしくつづけました。「やさしいといいきがする。ピザよりちょっとへや。」","fr":"La classe de Mme Park avait un « Bocal de Bonté ». Chaque acte gentil méritait une bille. Plein = fête pizza. Les enfants aidaient, partageaient, invitaient. Atteignirent 42 et stagnèrent. Affiches créées. D'autres classes copièrent. Tout le collège devint gentil ! Atteignirent 50. Pizza ! Mais continuèrent d'être gentils. « Être gentil fait du bien. Presque autant que la pizza."}}];spookyStories=[{"id":"haunted-1","category":"haunted","title":{"en":"The Whispering Shadow","es":"La sombra que susurraba","ja":"ささやくかげ","fr":"L'ombre qui chuchotait"},"text":{"en":"In a creaky old house at the end of Lonely Lane, a little girl named Molly heard whispers in the dark. \"Moooolly... Molly... come and play...\" The voice was soft and cold, like wind through a keyhole. Molly pulled her blanket up to her chin. \"Who is there?\" she whispered. No answer. Only the whispering. \"Mooooolly... we are waiting...\" She looked at the wall. A shadow moved — but there was nothing casting it! The shadow slid along the wall like dark water. It had no body, no shape, just a swirling darkness. Molly was scared. But she was also curious. She got out of bed and followed the shadow. It slid under her bedroom door and into the hallway. The hallway was dark. The floorboards creaked with every step. Creeeeak. Creeeeak. The shadow led her down the stairs. One step. Two steps. Three. The house was so quiet she could hear her own heartbeat. Thump. Thump. Thump. The shadow stopped at the old grandfather clock. It was midnight. The clock ticked slower than normal. Tick... tock... tick... tock... The shadow swirled around the clock and whispered, \"Open the door, Molly.\" Molly's hand trembled. She opened the glass door of the clock. Inside, she found a tiny music box. She opened it. A beautiful, eerie melody played. The shadow began to dance! It twirled and swirled, and as it danced, it slowly changed shape. It became a small girl — a ghost girl, transparent and glowing. \"Thank you, Molly,\" said the ghost girl. \"I have been trapped in that clock for a hundred years. The music box was the key. Now I can go home.\" The ghost girl floated toward the window and vanished into the moonlight. Molly stood in the dark hallway, heart pounding. She was shaking — but she was also smiling. \"Goodbye, ghost girl,\" she whispered. She went back to bed. But she could not sleep all night. Every time she closed her eyes, she heard the music box playing. And somewhere, far away, a ghost girl was finally home.","es":"En una casa vieja al final de Lonely Lane, Molly escuchó susurros. \"Moooolly... ven a jugar...\" Una sombra sin cuerpo se movió por la pared. Molly la siguió escaleras abajo hasta un reloj de pie. Dentro había una caja de música. Al abrirla, la sombra se convirtió en una niña fantasma. \"Gracias. Estuve atrapada cien años.\" La fantasma se fue a casa. Molly no pudo dormir. Escuchó la melodía toda la noche.","ja":"ロンリーレーンのはずれのきしむいえにモリーというおんなのこがすんでいました。まよるになるとささやきがきこえました。「モリー…あそびにおいで…」かべにうごくかげがあったけどもとはなかった！モリーはこわかったけどきになってついていきました。かいだんをくだりおじいさんのとけいのまえにきました。とけいのドアをあけるとちいさなオルゴールがあった。ひらくとまほうのメロディー。かげがおどりはじめてゆうれいのじょのこになった。「ありがとう。ひゃくねんとじこめられてたの。」ゆうれいはつきのひかりにきえていった。モリーはよるねむれませんでした。","fr":"Dans une vieille maison au bout de Lonely Lane, Molly entendit des murmures. « Moooolly... viens jouer... » Une ombre sans corps glissa sur le mur. Molly la suivit jusqu'à une horloge. À l'intérieur, une boîte à musique. En l'ouvrant, l'ombre se transforma en fillette fantôme. « Merci. Je suis restée prisonnière cent ans. » Le fantôme rentra chez elle. Molly ne put dormir, entendant la mélodie toute la nuit."}},{"id":"haunted-2","category":"haunted","title":{"en":"The Ghost in the Mirror","es":"El fantasma en el espejo","ja":"かがみのゆうれい","fr":"Le fantôme dans le miroir"},"text":{"en":"Tom's new bedroom had an old mirror. It was tall and dark, with a frame carved like twisted vines. His mother said, \"Do not look in the mirror at night.\" \"Why?\" asked Tom. \"Just... do not.\" But Tom was curious. One night, at midnight, he looked. At first, he saw his own face. But then — his reflection blinked. Tom had not blinked. His reflection smiled. Tom was not smiling. \"Hello, Tom,\" said the reflection. Its voice came from inside the mirror, echoing like it was spoken in a cave. \"Let me out. I have been in here so long.\" Tom stepped back. \"Who are you?\" \"I am you. The other you. The one who lives in the mirror.\" Tom looked closer. The reflection looked exactly like him — but its eyes were darker. Its smile was too wide. \"Let me out,\" it said again. \"How?\" asked Tom, even though he was scared. \"Just say: 'Come out, come out, do not hide.'\" Tom's heart was pounding. The reflection leaned closer to the glass. Its breath fogged the mirror. \"Say it, Tom.\" Tom opened his mouth. But something stopped him. He noticed that the reflection's room was different. The room behind the reflection was dark and empty. No bed. No toys. No sunlight. Just darkness. \"No,\" said Tom. \"No?\" said the reflection, its smile fading. \"You are not me. My room has sunshine and toys. Yours has nothing. You are not me.\" The reflection screamed — a long, cold scream that made the mirror crack. Then the mirror went dark. Tom ran to his mother. \"The mirror!\" They went back. The mirror was just... a mirror. Tom's reflection was normal. But the crack was still there. They replaced the mirror the next day. And Tom never looked in a mirror at midnight again. Well, almost never. Sometimes he checked — just to make sure his reflection blinked when he blinked. It always did. He was pretty sure.","es":"El espejo del cuarto de Tom tenía una advertencia: no mirar de noche. A medianoche, Tom miró. Su reflejo parpadeó solo y sonrió. \"Déjame salir, Tom.\" Pero Tom notó que el cuarto del reflejo era oscuro y vacío. \"No eres yo.\" El reflejo gritó y el espejo se rajó. Cambiaron el espejo. Tom nunca más miró a medianoche. Casi nunca.","ja":"トムのへやにはふるいかがみがありました。よるはみてはいけないといわれました。まよるトムがみるとどうぞうがじぶんでまばたきしてわらいました。「だしてトム。」「あなたはだれ？」「もうひとりのトム。」でもかがみのなかのへやはまっくらでなにもありませんでした。「あなたはぼくじゃない。」どうぞうがさけんでかがみがわれました。つぎのかがみはふつうでした。トムはまよるかがみをみませんでした。ほとんど。","fr":"Le miroir de la chambre de Tom avait un avertissement : ne pas regarder la nuit. À minuit, Tom regarda. Son reflet cligna seul et sourit. « Laisse-moi sortir, Tom. » Mais Tom vit que la pièce du reflet était sombre et vide. « Tu n'es pas moi. » Le reflet hurla et le miroir se fendit. On changea le miroir. Tom ne regarda plus jamais à minuit. Presque jamais."}},{"id":"haunted-3","category":"haunted","title":{"en":"The Attic Door","es":"La puerta del desván","ja":"やねのうらのドア","fr":"La porte du grenier"},"text":{"en":"There was a door in Lucy's house that was always locked. It was in the hallway, small and painted the same color as the wall. You might not even notice it. But Lucy noticed. \"What is behind that door?\" she asked her father. \"Nothing,\" he said. \"Just an old closet.\" But Lucy saw that the door had three locks. Three! Who puts three locks on a closet? One night, Lucy heard a sound. Tap. Tap. Tap. It came from behind the door. She pressed her ear against it. The wood was cold — colder than the wall around it. Inside, she heard breathing. Slow, heavy breathing. In. Out. In. Out. And then a voice, deep and rumbling: \"Luuuucy... open the door... Luuuucy...\" Lucy ran to her father. \"There is something behind the door!\" Her father went to the door. He listened. Silence. \"There is nothing, Lucy. Go back to bed.\" But that night, Lucy could not sleep. The tapping continued. Tap. Tap. Tap. She put a chair against the door. The tapping got louder. TAP. TAP. TAP. Then the doorknob turned. Slowly. Click. Click. Click. The locks were unlocking from the inside! Lucy screamed. Her father came running. He grabbed the doorknob and held it shut. \"Get me the hammer!\" he shouted. Lucy brought the hammer. Her father nailed the door shut. Bang! Bang! Bang! The tapping stopped. The breathing stopped. Everything was silent. In the morning, her father explained. \"Before you were born, I heard the same thing. I locked that door and I swore I would never open it.\" \"What is behind it?\" \"I do not know. And I do not want to know.\" They painted the door again, the same color as the wall, so you could barely see it. But Lucy always saw it. And sometimes, late at night, she thought she heard one small tap. Just one. Then silence. She turned up her music and pulled the blanket tight.","es":"La casa de Lucy tenía una puerta con tres cerraduras. De noche, escuchaba golpes y respiración. \"Luuucy... abre la puerta...\" Los cerrojos se abrían solos. Su padre clavó la puerta. \"No sé qué hay detrás. No quiero saber.\" Pintaron la puerta del color de la pared. Pero Lucy a veces escuchaba un pequeño golpe. Solo uno.","ja":"ルーシーのいえにさんこのロックがあるドアがありました。よるになるとタンタンタンとおとがしました。きいてみるとていきゅうがきこえました。「ルーシー…ドアをあけて…」ロックがなかからあきました！パパがハンマーでうちつけました。「なかになにがあるかわからない。しりたくない。」ドアをかべとおなじいろにぬりました。でもルーシーはときどきひとつだけタンのおとをききました。","fr":"La maison de Lucy avait une porte avec trois serrures. La nuit, des coups et une respiration. « Luuucy... ouvre la porte... » Les verrous s'ouvrirent de l'intérieur ! Son père cloua la porte. « Je ne sais pas ce qu'il y a derrière. Je ne veux pas savoir. » Ils peignirent la porte de la couleur du mur. Mais Lucy entendait parfois un petit coup. Juste un."}},{"id":"haunted-4","category":"haunted","title":{"en":"The Cold Spot","es":"El punto frío","ja":"さむいばしょ","fr":"Le point froid"},"text":{"en":"In the middle of the school playground, there was a cold spot. It was always cold, even in summer. Even when the sun was blazing hot, that one spot was freezing. The kids called it the Cold Spot. \"Do not stand on the Cold Spot!\" they warned each other. \"If you stand there too long, you disappear!\" Nobody knew if it was true. Until Danny tried it. \"I am not scared,\" said Danny. He stood on the Cold Spot. At first, nothing happened. Then his feet felt numb. Then his legs. The cold crawled up his body like ice water. He shivered. His breath came out in white clouds, even though it was summer! \"Danny, get off!\" shouted his friends. Danny tried to move. He could not. His feet were frozen to the ground! \"Help!\" he cried. His friends ran to pull him, but when they touched the Cold Spot, they felt the cold too. They jumped back. \"It is like ice!\" Then Danny heard a voice. It came from underground. \"Stay with me... it is so cold under here... stay with me...\" \"No!\" shouted Danny. He thought about warm things — hot chocolate, summer sun, his mother's hug. He thought so hard that he started to feel warm. The cold retreated. His feet came free! He ran as fast as he could. \"I am never standing there again!\" he said, gasping. The next day, the school covered the Cold Spot with concrete. But the concrete cracked within a week. Frost patterns spread across it, even in the heat. They covered it again. It cracked again. Eventually, they built a bench on top. People who sat on the bench said it was always cold. \"Like someone is sitting underneath,\" they said. And sometimes, if you listened very carefully, you could hear a whisper coming from below. \"So cold... so cold... so cold...\" Nobody sat on that bench anymore. Nobody at all.","es":"En el patio había un punto siempre frío. Danny se atrevió a pararse ahí. Sus pies se congelaron. Escuchó una voz subterránea: \"Quédate conmigo... hace frío aquí abajo...\" Danny pensó en cosas calientes y escapó. Cubrieron el punto con concreto, pero se rajaba. Pusieron un banco. Nadie se sentaba. A veces se escuchaba: \"Tanto frío... tanto frío...\"","ja":"がっこうのグラウンドにいつもさむいばしょがありました。なつでもこおりのようでした。ダニーがたってみました。あしがこおりのようにうごかなくなりました。「いっしょにいて…したはさむいんだ…」ダニーはあたたかいことをかんがえてにげました。コンクリートでかくしてもひびがはいりました。ベンチをおきました。だれもすわれませんでした。ときどき「さむい…さむい…」ときこえました。","fr":"Dans la cour, il y avait un point toujours froid. Danny s'y tenait. Ses pieds gelèrent. Il entendit une voix souterraine : « Reste avec moi... il fait si froid sous terre... » Danny pensa à des choses chaudes et s'échappa. Ils couvrirent le point de béton, mais il se fissura. Un banc fut posé. Personne ne s'y assit. Parfois : « Si froid... si froid... »"}},{"id":"haunted-5","category":"haunted","title":{"en":"The Doll That Moved","es":"La muñeca que se movía","ja":"うごくにんぎょう","fr":"La poupée qui bougeait"},"text":{"en":"Grace received a porcelain doll from her aunt. \"It was mine when I was little,\" said Aunt Mary. \"Her name is Annabelle.\" The doll was beautiful — blue glass eyes, curly hair, a blue dress. But Grace did not like it. The doll's eyes seemed to follow her. When Grace walked across the room, the doll's head turned. Just a little. Just enough to notice. \"Mom, the doll is watching me.\" \"Dolls cannot watch, dear.\" Grace put the doll on the shelf. She went to bed. In the middle of the night, she woke up. Something was different. She looked at the shelf. The doll was gone. Then she heard a small voice. \"Graaace... I am here...\" The doll was sitting at the foot of her bed! \"How did you get there?\" whispered Grace, shaking. \"I walked,\" said the doll. \"My legs are stiff, but I can walk.\" Grace pulled the blanket over her head. \"Go away! Go away!\" \"I do not want to hurt you,\" said the doll. \"I just want to play. It has been so long since anyone played with me.\" Grace peeked over the blanket. The doll's glass eyes were shining in the moonlight. They looked... sad. \"You are lonely?\" asked Grace. \"Very,\" said the doll. \"Aunt Mary put me on a shelf and never played with me again. I waited for years.\" Grace felt sorry for the doll. She picked it up. The doll was cold — colder than it should have been. \"I will play with you,\" said Grace. \"But only during the day. And you have to stay on the shelf at night. Deal?\" \"Deal,\" said the doll. And it smiled — a real smile, not a creepy one. From that day on, Grace played with Annabelle every afternoon. The doll never moved on its own again. But sometimes, when Grace was not looking, Annabelle's smile seemed a little wider. As if she were happy. Or as if she were waiting for something. Grace did not think about that. She preferred not to.","es":"Grace recibió una muñeca de porcelana. Sus ojos la seguían. De noche, la muñeca caminó hasta su cama. \"Solo quiero jugar. Hace años que nadie juega conmigo.\" Grace acordó jugar de día. La muñeca no se movió sola otra vez. Pero a veces su sonrisa parecía más amplia.","ja":"グレースはおばさんからポーセリンにんぎょうをもらいました。めがあとをついてくるようでした。よるになるとにんぎょうがベッドのあしもとにいきました。「あそびたいだけ。だれもあそんでくれないの。」グレースはひるあそぶことにしました。にんぎょうはうごきませんでした。でもときどきえがおがひろくなっているようにみえました。","fr":"Grace reçut une poupée de porcelaine. Ses yeux la suivaient. La nuit, la poupée marcha jusqu'à son lit. « Je veux juste jouer. Personne ne joue avec moi depuis des années. » Grace accepta de jouer le jour. La poupée ne bougea plus seule. Mais parfois son sourire semblait plus large."}},{"id":"haunted-6","category":"haunted","title":{"en":"The Footsteps in the Hall","es":"Los pasos en el pasillo","ja":"ろうかのあしおと","fr":"Les pas dans le couloir"},"text":{"en":"Every night at exactly 3 AM, the footsteps started. Thump. Thump. Thump. They walked down the hallway, past every bedroom, and stopped at the last door. Then silence. Then they walked back. Thump. Thump. Thump. Nobody knew who — or what — was walking. The family had lived in the house for years, and the footsteps had always been there. \"Just the house settling,\" said Dad. But houses do not walk in straight lines. They do not stop at specific doors. And they do not walk back. One night, twelve-year-old Peter decided to follow the footsteps. He waited in his room with a flashlight. At 3 AM — thump. Thump. Thump. He opened his door. The hallway was dark. But he could see the footprints — wet footprints on the wooden floor! They appeared one by one, as if an invisible person was walking. Thump. Thump. Thump. Peter followed. The footprints led past his room, past his sister's room, past the bathroom. They stopped at the last door — the storage room. The door was closed. Peter reached for the handle. It was wet. Wet with what? He did not want to know. He opened the door. Inside, it was pitch black. His flashlight flickered. Flickered. Went out. He was in complete darkness. Then he felt something. A breath on his neck. Cold. Slow. \"You... followed... me...\" said a voice, close to his ear. Peter ran. He ran so fast he tripped on the stairs and tumbled down. His parents found him at the bottom, shaking. \"What happened?\" Peter could not speak for an hour. When he finally could, he said, \"Something walks in our hallway every night. And it does not like to be followed.\" They moved out the next month. The new owners asked, \"Why are you leaving such a nice house?\" Peter's father just said, \"It has... character.\" The new owners lasted two weeks. They never said why they left. But the real estate agent noticed the hallway floor was always wet. Even on sunny days. Wet footprints. Thump. Thump. Thump.","es":"Cada noche a las 3 AM, pasos recorrían el pasillo. Thump. Thump. Thump. Peter los siguió. Huellas mojadas aparecían solas. Llegaron al cuarto de almacenamiento. La linterna se apagó. Una respiración fría en su cuello. \"Me... seguiste...\" Peter huyó. Se mudaron. Los nuevos dueños duraron dos semanas. El pasillo siempre estaba mojado. Thump. Thump. Thump.","ja":"まいばん３じになるとろうかにあしおとがきこえました。ドン。ドン。ドン。ピーターはついていきました。ぬれたあしあとがひとつずつあらわれました。さいごのドアのまえでとまりました。ふるいライトがきえました。くびにためいきがかかりました。「おまえ…ついてきたな…」ピーターはにげました。いっかはひっこしました。つぎの人はにしゅうかんででていきました。ろうかはいつもぬれていました。","fr":"Chaque nuit à 3h, des pas parcouraient le couloir. Thump. Thump. Thump. Peter les suivit. Des empreintes mouillées apparaissaient seules. Arrivés à la porte de stockage. La lampe s'éteignit. Un souffle froid sur son cou. « Tu... m'as... suivi... » Peter s'enfuit. La famille déménagea. Les nouveaux propriétaires tinrent deux semaines. Le couloir était toujours mouillé."}},{"id":"haunted-7","category":"haunted","title":{"en":"The Music from Nowhere","es":"La música de la nada","ja":"どこからかのおんがく","fr":"La musique de nulle part"},"text":{"en":"The children at Sunnybrook School heard music in the music room after hours. But nobody was ever there. A teacher would open the door — silence. Close the door — the music would start again. It was always the same song: a slow, haunting piano melody that seemed to come from the walls themselves. \"It is just the pipes,\" said the principal. But pipes do not play piano. Three brave students — Amy, Ravi, and Kate — decided to investigate. They hid in the music room after school, behind the curtains. They waited. At 6 PM, the music started. The piano began to play by itself. The keys moved up and down — but no one was sitting on the bench! Amy recorded it on her phone. The melody was slow and sad, like someone playing their last song. Then the piano stopped. The room was silent. Then a voice — soft, echoing — sang: \"Find me... find me... I am under the floor...\" The children looked at each other, terrified. Kate whispered, \"Should we look?\" \"No!\" said Ravi. \"Yes!\" said Amy. They lifted the rug under the piano. There was a loose floorboard. They pried it open. Inside, they found an old journal. It belonged to a music teacher from 1935. The last entry read: \"I cannot play anymore. My hands are too weak. But I want the children to hear music forever. I leave my soul in this piano.\" \"His soul is in the piano,\" whispered Kate. They put the journal back and replaced the floorboard. They told the principal. He did not believe them — until he heard the music himself that evening. He sat in the empty music room, and the piano played for him. The same haunting melody. He cried. \"He just wanted children to hear music,\" he said. They never removed the piano. And every evening, the music played. The children said it was the most beautiful — and the scariest — music they had ever heard.","es":"En la escuela, el piano tocaba solo después de horas. Tres estudiantes investigaron. El piano se movía solo. Una voz cantó: \"Encuéntrame... bajo el suelo...\" Encontraron el diario de un profesor de 1935. \"Dejo mi alma en este piano.\" El director no creyó hasta que escuchó la música. Nunca quitaron el piano. Cada noche tocaba. La música más hermosa y aterradora.","ja":"がっこうのうたのきょうしつでへいこうじにおんがくがきこえました。でもだれもいませんでした。さんにんのせいとがしらべました。６じになるとピアノがじぶんでひきはじめました。「わたしをさがして…ゆかのしたに…」ゆかのしたににっきをみつけました。１９３５ねんのおんがくのせんせいでした。「ピアノにたましいをのこす。」せんせいはしんじませんでしたがじぶんできいてないた。ピアノはへいこうじにひきつづけました。","fr":"À l'école, le piano jouait seul après les cours. Trois élèves enquêtèrent. Le piano bougeait seul. Une voix chanta : « Trouvez-moi... sous le sol... » Ils trouvèrent le journal d'un professeur de 1935. « Je laisse mon âme dans ce piano. » Le directeur ne crut pas jusqu'à ce qu'il entendit la musique. Le piano resta. Chaque soir il jouait."}},{"id":"haunted-8","category":"haunted","title":{"en":"The Halloween Pumpkin","es":"La calabaza de Halloween","ja":"ハロウィンのカボチャ","fr":"La citrouille d'Halloween"},"text":{"en":"Every Halloween, old Mr. Black carved a pumpkin. But not a normal pumpkin. He carved a face so scary that children crossed the street to avoid his house. \"His pumpkin watches you,\" they whispered. \"It follows you with its eyes.\" One Halloween, a boy named Finn was not scared. \"It is just a pumpkin,\" he said. \"I will go to his door.\" Finn walked up the path. The pumpkin sat on the porch, its carved eyes glowing with candlelight. As Finn got closer, the candle flickered. The pumpkin's mouth seemed to stretch wider. \"Hello?\" called Finn. No answer. He knocked on the door. It opened slowly. Inside was dark. \"Mr. Black?\" said Finn. A voice came from inside — not from a person, but from everywhere. \"Come in, Finn.\" Finn stepped inside. The door slammed behind him. He was in darkness. Then — whoom! — every candle in the house lit at once. The house was full of pumpkins. Dozens of them, all carved with scary faces. And every single one was looking at Finn. \"Do you like my collection?\" said the voice. \"I have been collecting for a hundred years. Every Halloween, I add one more.\" \"What do you mean, add one more?\" asked Finn, his voice shaking. \"A new pumpkin. A new face. A new... child.\" Finn felt something grab his ankle. He looked down. A vine — a pumpkin vine — was wrapping around his leg. He kicked free and ran for the door. It would not open! He pulled and pulled. The pumpkins were getting closer. Their candle-eyes followed him. Their mouths stretched wider and wider. \"Stay for Halloween, Finn. Stay forever.\" Finn threw a pumpkin at the window. CRASH! He climbed through the broken glass and ran. He ran all the way home. When he looked back, Mr. Black's house was dark. All the candles were out. But on the porch, the pumpkin was still there. Its mouth was open. And inside its mouth — a new face was forming. A face that looked like Finn.","es":"El Sr. Black tallaba calabazas恐怖. Finn no tuvo miedo y entró. La casa estaba llena de calabazas que lo miraban. \"Cada Halloween añado una... un niño.\" Una vid agarró su pierna. Finn escapó por la ventana. Al mirar atrás, la calabaza formaba una cara nueva. Parecía Finn.","ja":"ブラックおじいさんはまいハロウィンこわいカボチャをほりました。フィンはこわがらずにいえにはいりました。いえじゅうカボチャだらけでみんなフィンをみていました。「まいとしひとりふえる…こどもを。」ツルがあしにまきついた。まどをやぶってにげた。ふりかえるとカボチャにあたらしいかおができていた。フィンのかおだった。","fr":"Mr Black sculptait des citrouilles effrayantes. Finn n'eut pas peur et entra. La maison était pleine de citrouilles qui le regardaient. « Chaque Halloween j'en ajoute une... un enfant. » Une liane attrapa sa cheville. Finn s'échappa par la fenêtre. En regardant en arrière, la citrouille formait un nouveau visage. Le visage de Finn."}},{"id":"haunted-9","category":"haunted","title":{"en":"The House on the Hill","es":"La casa en la colina","ja":"おかのうえのいえ","fr":"La maison sur la colline"},"text":{"en":"There was a house on top of Black Hill. Nobody lived there. Nobody had lived there for fifty years. But every night, a light came on in the top window. Just one light. Just one window. \"It is just a reflection,\" said the adults. \"It is a ghost,\" said the children. Four friends — Max, Zoe, Leo, and Mia — decided to spend the night in the house. \"We will prove there is no ghost,\" said Max. They entered at sunset. The door was unlocked. Inside, the house was dusty and cold. Cobwebs hung from the ceiling like curtains. The stairs creaked as they climbed. \"This place gives me the creeps,\" said Mia. They explored the rooms. Old furniture covered with sheets. A kitchen with rusty pots. A bedroom with a child's toys, still on the floor, as if someone had just left. \"This is weird,\" said Leo. \"These toys look new.\" At 10 PM, they set up sleeping bags in the living room. At midnight, Max woke up. He heard footsteps upstairs. Thump. Thump. Thump. \"Guys, wake up.\" They all listened. The footsteps walked across the ceiling — right above them. \"Someone is up there,\" whispered Zoe. They crept upstairs. The hallway was dark. The footsteps had stopped. But the door at the end of the hall — the door to the room with the light — was open. A soft glow came from inside. They walked toward it. The room was a child's bedroom. A small bed, a small chair, a small table. On the table was a lamp — the source of the light. Sitting in the chair was... nothing. An empty chair. But it was rocking. Rocking back and forth, slowly. Creak. Creak. Creak. \"There is no one there!\" said Leo. \"But it is rocking!\" said Mia. Then the lamp went out. Total darkness. And then they heard a child's voice, small and quiet: \"Will you stay and play with me? Forever and ever and ever?\" They ran. They ran down the stairs, out the door, down the hill, and did not stop until they were home. They never went back. But every night, the light still came on. And every night, the chair still rocked. Waiting for someone to play. Forever and ever and ever.","es":"La casa de Black Hill tenía una luz nocturna. Cuatro amigos pasaron la noche. A medianoche, pasos arriba. Un cuarto de niño. Una silla vacía que se balanceaba. Una voz: \"¿Se quedan a jugar? Para siempre.\" Salieron corriendo. Nunca volvieron. Cada noche, la luz seguía encendida. La silla seguía moviéndose. Esperando. Para siempre.","ja":"くろいおかのうえにいえがありました。よるになるとまどにあかりがともりました。よにんのともだちがとまってみることにしました。まよるになるとうえからあしおと。こどものへやにいすがひとりでゆれていました。「あそんでくれる？ずーっとずーっと？」ふたりはにげました。もういきませんでした。でもまいばんあかりがついていすがゆれていました。","fr":"La maison de Black Hill avait une lumière nocturne. Quatre amis y passèrent la nuit. À minuit, des pas au-dessus. Une chambre d'enfant. Une chaise vide qui se balançait. Une voix : « Vous restez jouer ? Pour toujours ? » Ils s'enfuirent. Ne revinrent jamais. Chaque nuit, la lumière s'allumait. La chaise se balançait. Attendant. Pour toujours."}},{"id":"haunted-10","category":"haunted","title":{"en":"The Shadow Under the Bed","es":"La sombra bajo la cama","ja":"ベッドのしたのかげ","fr":"L'ombre sous le lit"},"text":{"en":"Every child knows there are monsters under the bed. But most children grow up and stop believing. Nine-year-old Ruby never stopped believing — because she had proof. Every night, when the lights went out, Ruby heard breathing under her bed. Slow. Steady. In. Out. In. Out. Like something was sleeping under there. She told her parents. They looked under the bed. \"Nothing, Ruby. Just dust and shoes.\" But Ruby knew better. The breathing only started when the lights were out. When the lights were on, there was nothing. She tried sleeping with the light on. The breathing stopped. But her mother said, \"You cannot sleep with the light on forever.\" She turned it off. In. Out. In. Out. One night, Ruby had enough. She grabbed her flashlight. She turned off the room light. The breathing started. In. Out. In. Out. She leaned over the edge of the bed and clicked on the flashlight. Under the bed, she saw... a shadow. Not a monster. Not a creature. A shadow. It was shaped like a person, but flat against the floor. It was breathing — the shadow was expanding and contracting, in and out, like a flat black lung. \"What are you?\" whispered Ruby. The shadow stopped breathing. It was still. Then it sat up. A flat, black silhouette sat up from the floor. It had no face, no eyes, no mouth. But it spoke. \"I am what is left behind. When a child is afraid of the dark, I grow. When the light comes, I shrink. I have been under your bed for years, Ruby. I am the dark itself.\" Ruby was shaking. But she was also angry. \"I am not afraid of you anymore.\" The shadow tilted its head. \"Are you not?\" \"No. You are just a shadow. And shadows cannot hurt me.\" The shadow shrank. It got smaller and smaller. \"No! Do not say that! I need your fear!\" But Ruby was not afraid. The shadow shrank until it was the size of a coin. Then it vanished. Ruby smiled. She turned off the flashlight and went to sleep. The breathing was gone. It never came back. But sometimes, in the deepest dark, Ruby thought she felt something small under her bed. Something tiny. Something waiting. She turned on her nightlight and smiled. \"Not tonight, shadow. Not tonight.\"","es":"Ruby escuchaba respiración bajo su cama cada noche. Con la luz apagada, algo respiraba. Se lo dijo a sus padres, pero no vieron nada. Una noche, Ruby miró con linterna: una sombra plana que respiraba. \"Soy lo que queda del miedo. Sin miedo, me encogo.\" Ruby dijo: \"No te temo.\" La sombra se encogió hasta desaparecer. Nunca volvió. Pero a veces Ruby sentía algo pequeño esperando. Encendía su luz nocturna.","ja":"ルビーはまいばんベッドのしたでていきゅうをききました。でんきをけすとはくいきがきこえました。あるよるライトをつかってしたをみました。ぺちゃんこのかげがていきゅうしていました。「わたしはこわさのなかのこりもの。こわさがなくなるとちいさくなる。」「こわくない！」ルビーがいうと、かげはどんどんちいさくなってきえました。もうきこえませんでした。でもときどきなにかちいさなものがまっているようなきがしました。ライトをつけてわらいました。","fr":"Ruby entendait une respiration sous son lit chaque nuit. Lumière éteinte, quelque chose respirait. Une nuit, elle regarda avec une lampe : une ombre plate qui respirait. « Je suis ce qui reste de la peur. Sans peur, je rétrécis. — Je n'ai pas peur ! » L'ombre rétrécit jusqu'à disparaître. Plus jamais. Mais parfois Ruby sentait quelque chose de petit qui attendait. Elle allumait sa veilleuse et souriait."}}];ep=[...Yf,...Kf,...Jf,...Xf,...Zf,...spookyStories];function Fl(e){return ep.filter(t=>t.category===e)}
