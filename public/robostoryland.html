 children down there need their nightlight!\" Pip tried his best, but tonight, his light kept flickering like a birthday candle in the wind. \"I just need five minutes,\" Pip yawned. He tried hiding behind a cloud, but the cloud moved. He tried putting sunglasses on, but stars don't have noses to rest them on. Finally, the Moon noticed Pip blinking slowly. \"Go to sleep, little one,\" the Moon whispered. \"I'll cover for you tonight.\" And so Pip curled up in a blanket of stardust, snored a tiny silver snore, and the Moon shone extra bright. The children below never even noticed — they just dreamed a little sweeter that night."}},{"id":"bedtime-2","category":"bedtime","title":{"en":"Grandpa's Lantern","es":"La linterna del abuelo","ja":"おじいさんのランタン","fr":"La lanterne de grand-père"},"text":{"en":"Every bedtime, Grandpa brought out a rusty old lantern and told the silliest stories. \"This lantern,\" he said, \"was once carried by a knight who was afraid of the dark.\" The kids giggled. \"He wore his armor backwards and tripped over his own sword!\" Grandpa acted it out, wobbling around the room. \"He fought a dragon — but it was just a gecko.\" The lantern flickered as if it was laughing. \"The knight finally realized the dark wasn't scary — it was just the sun taking a nap.\" Grandpa tucked the lantern back on the shelf. \"And that's why we sleep at night — because even brave knights need their rest.\" The kids pulled their blankets up, still giggling about the backwards knight. \"Grandpa, tell the one about the snoring giant tomorrow!\" they begged. Grandpa smiled. \"Only if you promise to snore louder than him.\" And they did."}},{"id":"bedtime-3","category":"bedtime","title":{"en":"The Sleepy Owl","es":"El búho soñoliento","ja":"ねむいうさぎ","fr":"Le hibou ensommeillé"},"text":{"en":"Oliver the Owl was supposed to be the night watchman of the forest, but he kept falling asleep on the job. \"Hoo... hoo... zzz...\" his calls would go. The squirrels would hear \"hoo-hoo-snore-hoo\" and think it was a secret code. \"Three hoos and a snore means acorns are ripe!\" they'd chirp. Oliver woke up one evening to find the squirrels had built an entire acorn stockpile based on his snoring patterns. \"That snore meant Tuesday, not acorns!\" he hooted. But the squirrels didn't care — they had the biggest acorn collection in forest history. Oliver tried coffee, cold showers, and even a tiny alarm clock. Nothing worked. \"Maybe I'm just a morning owl,\" he yawned. The other animals laughed. \"Owls aren't morning anything!\" Finally, Oliver accepted his sleepy self. He became the forest's official lullaby singer. His soft snoring actually put every animal to sleep perfectly. \"Best night watchman ever,\" they all said. \"He watches over our dreams.\""}},{"id":"bedtime-4","category":"bedtime","title":{"en":"The Moon's Blanket","es":"La manta de la luna","ja":"つきのブランケット","fr":"La couverture de la lune"},"text":{"en":"The Moon was cold. Every night, she shivered in the sky, making the stars rattle. \"I need a blanket,\" she complained. The clouds tried to help, but they kept drifting away. \"We're not blanket material,\" they apologized. The wind tried wrapping autumn leaves around her, but they tickled her and she laughed so hard she almost fell out of the sky. Finally, a little girl named Emma looked up and said, \"Mommy, the Moon is shivering.\" She asked her grandma to knit the biggest blanket ever. Grandma knit for three months straight — it was enormous, fuzzy, and had moons and stars embroidered on it. But how to get it to the Moon? Emma tied it to a kite, and on a windy night, it flew up, up, up. The Moon wrapped herself in it and sighed happily. \"Finally, warm!\" she said. And that's why, on cloudy nights, the Moon hides — she's just snuggling in her favorite blanket."}},{"id":"bedtime-5","category":"bedtime","title":{"en":"The Cloud That Couldn't Rain","es":"La nube que no podía llover","ja":"あめをふらせられなかったくも","fr":"Le nuage qui ne pouvait pas pleuvoir"},"text":{"en":"Cumulus was a fluffy white cloud who had one problem — he couldn't rain. Every time he tried, out came... confetti. The other clouds laughed. \"That's not rain, that's a birthday party!\" Cumulus felt embarrassed. He tried squeezing hard — out popped a rubber duck. He tried again — bubbles. Thousands of bubbles floated down on a town, and kids ran outside in pajamas chasing them. \"Best rain ever!\" they shouted. Cumulus felt a little better. He tried once more and out came marshmallows. The town had a marshmallow fight. The weatherman on TV said, \"Today's forecast: fluffy with a chance of sweets.\" Cumulus became the most popular cloud in the sky. Other clouds started practicing their own funny rain — one rained jellybeans, another rained tiny paper airplanes. The old grumpy thunderclouds just rolled their eyes. \"Kids these days,\" they grumbled. But even they smiled a little when it rained hot chocolate one evening."}},{"id":"bedtime-6","category":"bedtime","title":{"en":"The Dream Train","es":"El tren de los sueños","ja":"ゆめ列車","fr":"Le train des rêves"},"text":{"en":"Every night at exactly 8:00 PM, the Dream Train pulled into bedtime stations around the world. The conductor was a very serious penguin named Captain Waddle, who wore a tiny hat and punched tickets with his beak. \"All aboard!\" he squawked. \"Next stop: Dreamland!\" The train had the funniest cars — one was a bouncy castle, another was a swimming pool filled with jelly, and the last car was a library where books read themselves aloud. A boy named Tim stepped on. \"Ticket, please,\" said Captain Waddle. Tim handed him a yawn. \"Perfect,\" the penguin nodded. \"That's a first-class yawn.\" Tim rode through fields of cotton candy, past mountains made of pillows, and over a bridge made of licorice. When the train arrived at Dreamland, Captain Waddle tipped his hat. \"Sweet dreams, passenger. Train leaves again tomorrow at 8.\" Tim was already fast asleep before the penguin finished speaking. The train chugged away into the night, picking up more dreamers at every stop."}},{"id":"bedtime-7","category":"bedtime","title":{"en":"The Lullaby Bird","es":"El pájaro de las nanas","ja":"ララバイバード","fr":"L'oiseau berceuse"},"text":{"en":"There was a tiny bird named Melody who sang lullabies — but she was terrible at it. Instead of soft, sleepy songs, she squawked like a rusty door. \"SQUAWK-squawk-SQUAWK-squeak!\" The baby birds covered their ears. \"That's not a lullaby, that's an alarm clock!\" they chirped. Melody was embarrassed. She went to the old wise owl for lessons. \"Sing from here,\" the owl said, pointing to her belly. \"Not from your throat.\" Melody tried. \"Squawk... tweet... hoo?\" It was getting better. She practiced every day — in the shower, in the trees, even in her sleep. One night, she sang for the baby birds again. This time, it was soft, gentle, and warm. The babies yawned, snuggled into their nests, and fell asleep. Melody was so proud she nearly burst into a victory squawk — but she caught herself and whispered instead. \"Goodnight, little ones.\" The wise owl nodded from the next tree. \"See? Even the squeakiest bird can sing the sweetest song.\""}},{"id":"bedtime-8","category":"bedtime","title":{"en":"The Pillow That Was Too Soft","es":"La almohada demasiado suave","ja":"やわらかすぎるまくら","fr":"L'oreiller trop doux"},"text":{"en":"A girl named Sophie got a new pillow that was so incredibly soft that when she laid her head on it, she sank in and couldn't get up. \"Mom!\" she called. \"I'm stuck in the pillow!\" Her mom came in and pulled — Sophie popped out like a cork from a bottle. \"Maybe it's too soft,\" Mom said. But Sophie loved it. She named it Fluffy and took it everywhere — to breakfast, to school, to the dentist. Her teacher said, \"Sophie, you can't bring a pillow to class.\" \"But it's my emotional support pillow!\" Sophie argued. The teacher sighed. During storytime, Sophie fell asleep on Fluffy and dreamed she was a marshmallow in a hot chocolate ocean. She woke up with a pillow mark on her face and drool on Fluffy. \"Best nap ever,\" she whispered. That night, Fluffy was so comfortable that Sophie fell asleep in three seconds — a new family record. Her dad timed it. \"Three seconds!\" he announced. Fluffy just sat there, being fluffy, doing what it did best."}},{"id":"bedtime-9","category":"bedtime","title":{"en":"The Clock That Stopped Time","es":"El reloj que detuvo el tiempo","ja":"じかんをとめたとけい","fr":"L'horloge qui a arrêté le temps"},"text":{"en":"In a clock shop at the corner of the street, there was one clock that could stop time — but only for ten minutes, and only if you tickled it. A boy named Max discovered this by accident when he brushed past it and the clock giggled. Everything froze — the cars outside, the flies in the air, the dripping faucet. Max walked around the frozen world. He ate three ice creams from the frozen ice cream truck (he left money, of course). He rearranged his sister's room so all her stuffed animals were having a tea party. He even pulled a funny face at the frozen school bully. When time restarted, his sister screamed, \"My toys are having a party!\" The bully blinked, confused, feeling like someone had made a face at him. Max giggled. He went back to the clock shop the next day, but the clock was gone — replaced by a note: \"Gone to tickle someone else's funny bone. —The Clock\" Max smiled. \"Thanks for the ten minutes, old friend.\""}},{"id":"bedtime-10","category":"bedtime","title":{"en":"The Sandman's Assistant","es":"El asistente del Sandman","ja":"サンドマンのアシスタント","fr":"L'assistant du marchand de sable"},"text":{"en":"The Sandman was hiring. He put up a sign: \"WANTED: Assistant to help deliver sleep sand. Must work nights. Must be quiet. Must NOT sneeze.\" A bumbling raccoon named Ringo applied. \"I'm very quiet,\" he whispered — then knocked over a lamp. The Sandman hired him anyway because nobody else applied. On the first night, Ringo accidentally dumped an entire bag of sand on one house. The whole family slept for two days. \"That was too much!\" the Sandman scolded. On the second night, Ringo sneezed and blew sand into his own face. He fell asleep in a mailbox. On the third night, he got it right — just a pinch of sand per child, gentle and perfect. \"See? You're learning!\" the Sandman said. Ringo beamed. But then he tripped on a garden hose and sand flew everywhere. The entire neighborhood's gardens grew overnight into jungles. \"That's not sleep sand, that's fertilizer!\" the Sandman groaned. Ringo shrugged. \"At least the tomatoes are happy.\" The Sandman couldn't argue — they were the best tomatoes he'd ever seen."}}],Kf=[{"id":"animals-1","category":"animals","title":{"en":"Granny and the Lost Bunny","es":"La abuela y el conejo perdido","ja":"おばあさんとまいごのうさぎ","fr":"Grand-mère et le lapin perdu"},"text":{"en":"Granny Mae was watering her petunias when she found a tiny bunny stuck in a flower pot. \"Well, hello there, fuzzy britches!\" she said. The bunny sneezed — a tiny puff of fur flew up. \"Bless you,\" Granny said. She tried to pull the bunny out, but he was wedged in tight. She tried soap. She tried butter. She tried offering him a carrot to lure him out — he ate the carrot but stayed put. \"You're not stuck, are you?\" Granny said, narrowing her eyes. \"You just like my petunias.\" The bunny wiggled his nose guiltily. Granny laughed so hard her glasses fell off. \"Fine. You can stay. But you're helping with the garden.\" The bunny became Granny's gardening assistant. He planted seeds with his paws, watered plants by splashing in the watering can, and kept the snails away by sitting on them. \"Best helper I ever had,\" Granny told her neighbors. The bunny just wiggled his nose and ate another petunia."}},{"id":"animals-2","category":"animals","title":{"en":"The Penguin Who Couldn't Slide","es":"El pingüino que no podía deslizarse","ja":"すべれないペンギン","fr":"Le pingouin qui ne pouvait pas glisser"},"text":{"en":"Pablo the Penguin was the only penguin in the colony who couldn't slide on his belly. Every time he tried, he did a faceplant into the snow. \"SPLAT!\" The other penguins winced. \"Dude, just lean back!\" they advised. Pablo leaned back — and slid backwards into an ice wall. He tried waxing his belly with fish oil — he slid too fast and crashed into a seal. The seal was not amused. He tried using a sled — the other penguins said that was cheating. Finally, Pablo discovered that if he did a little wiggle first, he could slide perfectly. \"It's all in the hips!\" he announced. He became the best slider in the colony. He even invented a new move — the Spin-o-rama Splash, which ended with a perfect belly flop into the ocean. The crowd went wild. \"PABLO! PABLO!\" they cheered. Pablo bowed, slipped, and faceplanted again. The crowd cheered even louder. \"Encore!\" they shouted. Pablo just spat out snow and grinned."}},{"id":"animals-3","category":"animals","title":{"en":"The Elephant Who Forgot Everything","es":"El elefante que lo olvidaba todo","ja":"すべてをわすれるゾウ","fr":"L'éléphant qui oubliait tout"},"text":{"en":"Eldon the Elephant had the worst memory in the savannah — which is saying something for an elephant. He'd walk to the river, forget why he was there, walk back, then remember he was thirsty. He introduced himself to the same giraffe every morning. \"Hi, I'm Eldon!\" \"Eldon, we've met forty-seven times.\" \"Really? I'm Eldon!\" He once forgot he was an elephant and tried to climb a tree. The tree did not appreciate it. His friends started leaving sticky notes on his trunk: \"You live at the big rock.\" \"Your best friend is Zebra Dan.\" \"DO NOT climb trees.\" Eldon collected so many sticky notes that his trunk looked like a sticky note monster. One day, all the notes blew away in the wind. Eldon stood there, confused, with no reminders. Then he smiled. \"I feel great! I'm going on an adventure!\" He walked to the river, had a drink, met a giraffe, and made a new friend. \"Hi, I'm Eldon!\" Sometimes forgetting isn't so bad."}},{"id":"animals-4","category":"animals","title":{"en":"The Bear Who Was Afraid of Bees","es":"El oso que le tenía miedo a las abejas","ja":"ハチをこわがるクマ","fr":"L'ours qui avait peur des abeilles"},"text":{"en":"Barnaby the Bear was terrified of bees — which is very inconvenient when your favorite food is honey. He would sneak to beehives wearing a full beekeeper suit he'd found at a yard sale. \"I am a flower,\" he'd whisper to himself. \"Bees don't bother flowers.\" The bees were not fooled. They'd see a 600-pound bear in a veiled helmet waddling toward their hive and think, \"That is definitely not a flower.\" One bee named Beatrice took pity on him. \"Listen, big guy. Just be polite. Say please and thank you.\" Barnaby tried it. \"Um... could I please have some honey? Thank you?\" Beatrice was so surprised by the manners that she gave him a whole jar. \"Thank you, kind bee!\" Barnaby said, bowing. He bowed so low he fell over. Beatrice laughed so hard she dropped her pollen. After that, Barnaby visited every Tuesday with cookies, and the bees gave him honey. \"Best trade deal in the forest,\" Barnaby said, his mouth full of both."}},{"id":"animals-5","category":"animals","title":{"en":"The Cat Who Thought He Was a Tiger","es":"El gato que se creía un tigre","ja":"トラおもいのネコ","fr":"Le chat qui se prenait pour un tigre"},"text":{"en":"Marmalade was a small orange tabby cat who firmly believed he was a 500-pound Bengal tiger. He'd practice his roar: \"Mew. Mew-mew. MEOW.\" Not very intimidating. He'd stalk through the backyard grass pretending to hunt, then get distracted by a butterfly and chase it for twenty minutes. He tried pouncing on a squirrel — the squirrel caught him and pinned him down. \"I let you win,\" Marmalade told the squirrel. \"Sure, tiger,\" the squirrel said. Marmalade tried to intimidate the neighbor's Great Dane by standing tall and puffing his fur. The dog licked him. Marmalade spent an hour cleaning the dog spit off his fur, muttering, \"A tiger does not get licked. A tiger does the licking.\" His owner put a tiny tiger costume on him for Halloween. Marmalade strutted around like he'd finally been recognized for what he truly was. \"See?\" he seemed to say. \"I told you.\" He fell off the windowsill that night and pretended it was a deliberate tiger pounce. Nobody bought it."}},{"id":"animals-6","category":"animals","title":{"en":"The Duck Who Quacked Too Loud","es":"El pato que graznaba demasiado fuerte","ja":"おおきいこえのアヒル","fr":"Le canard qui cacardait trop fort"},"text":{"en":"Daphne the Duck had a quack so loud it registered on seismographs. When she quacked, ripples spread across the entire pond. Fish jumped out of the water. Frogs plugged their ears. The herons filed a noise complaint. \"I can't help it!\" Daphne said. \"I'm passionate!\" Her passion was usually about bread. \"BREAD! BREAD! BREAD!\" she'd quack when someone brought crumbs. The whole park shook. A man dropped his sandwich in surprise. Daphne ate it. \"Thank you! BREAD!\" She tried whispering — it came out as a foghorn. She tried singing — it came out as a brass band. The other ducks wore earplugs. One day, Daphne's loud quack scared away a fox that was sneaking up on the ducklings. \"She may be loud,\" the other ducks admitted, \"but she's our foghorn.\" Daphne beamed. \"QUACK!\" she celebrated. A window cracked somewhere. \"Sorry!\" she whispered — at full volume."}},{"id":"animals-7","category":"animals","title":{"en":"The Monkey Who Stole Hats","es":"El mono que robaba sombreros","ja":"ぼうしをぬすんだサル","fr":"Le singe qui volait des chapeaux"},"text":{"en":"Milo the Monkey had a hat problem. He stole them. Baseball caps, bowlers, top hats, beanies — if it sat on a head, Milo wanted it. Tourists would look up and see Milo wearing five hats stacked on his head, looking like a furry hat rack. \"That's my cap!\" a man shouted. Milo put on sunglasses too — also stolen. He looked fabulous and unrepentant. The park rangers tried negotiating. \"Milo, return the hats and we'll give you bananas.\" Milo considered this. He threw back three hats — but kept the best ones. \"That's my wedding hat!\" a man cried. Milo put it on backwards and posed. The tourists started taking photos. Milo became the park's main attraction. People came just to see the hat-wearing monkey. He started a hat swap — leave a hat, take a selfie. The park gift shop started selling \"Milo the Hat Thief\" t-shirts. Milo stole those too. He wore six t-shirts and four hats and looked like a fashion disaster. \"Iconic,\" the tourists said. Milo agreed."}},{"id":"animals-8","category":"animals","title":{"en":"The Snail's Big Race","es":"La gran carrera del caracol","ja":"カタツムリのおおレース","fr":"La grande course de l'escargot"},"text":{"en":"Simon the Snail entered the Great Forest Sprint. Every other animal laughed. \"You'll finish next year!\" they joked. Simon didn't care. He lined up at the start with the cheetah, the rabbit, and the fox. The gun went off. The cheetah ran so fast he crashed into a tree. The rabbit was so fast he took a wrong turn and ended up in a carrot field. The fox was so fast he ran straight off a cliff and landed in a river. Simon just kept sliding. Slowly. Steadily. He passed the dazed cheetah. He passed the carrot-stuffed rabbit. He passed the soaking fox. After three hours, Simon crossed the finish line. The crowd went silent. Then they erupted. \"SIMON! SIMON!\" Simon looked around with his eye stalks. \"I won?\" he said. \"I WON!\" He tried to do a victory dance but just spun in a circle. The trophy was bigger than him. He slid home wearing it as a hat. \"Slow and steady,\" he whispered. \"And hope everyone else crashes.\" The moral: you don't have to be fast if everyone else is a disaster."}},{"id":"animals-9","category":"animals","title":{"en":"The Hedgehog's Balloon Problem","es":"El problema de los globos del erizo","ja":"ハリネズミのふうせんもんだい","fr":"Le problème de ballons du hérisson"},"text":{"en":"Harriet the Hedgehog loved balloons — but every time she hugged one, POP! She tried hugging gently — pop. She tried hugging with her belly — pop. She tried wrapping herself in a blanket first — the blanket popped the balloon too. \"Why do I love things that can't love me back?\" she sighed, surrounded by rubber shreds. Her friend the mouse suggested she try hugging soft things. \"Like what?\" \"Marshmallows!\" Harriet tried it. She hugged a marshmallow and it squished perfectly. No popping. She was so happy she cried — which made the marshmallow sticky. She tried hugging pillows — also great. She tried hugging bread — oddly satisfying. But she still missed balloons. So she got a balloon and just looked at it from a distance. \"I love you,\" she told the balloon. \"From far away.\" The balloon floated up and popped on the ceiling. \"Even from here!\" Harriet cried. Her friend patted her back. \"Some things just aren't meant to be hugged, Harriet.\" She hugged her friend instead. No pop. Perfect."}},{"id":"animals-10","category":"animals","title":{"en":"The Fox Who Learned to Share","es":"El zorro que aprendió a compartir","ja":"わかちあうことをまなんだキツネ","fr":"Le renard qui apprit à partager"},"text":{"en":"Felix the Fox never shared. At picnics, he'd hoard all the berries. At birthday parties, he'd grab the biggest slice of cake. At Christmas, he'd shake every present to find the biggest one. \"Mine, mine, mine,\" he'd say. One day, he found a giant pizza in the forest. A huge, delicious, cheesy pizza. \"MINE!\" he yelled. He tried to eat it all himself. He ate and ate and ate until his belly was round as a balloon. \"Ugh,\" he groaned. \"I can't eat another bite.\" But he still had three-quarters of a pizza left. His forest friends walked by, eyeing the pizza. \"Want some?\" Felix mumbled reluctantly. They sat down and ate together. They laughed, told jokes, and had the best picnic ever. \"That was fun,\" Felix admitted. \"More fun than eating alone?\" asked the bunny. Felix thought about it. \"Way more fun.\" From that day on, Felix shared everything — except his socks. \"Some things are personal,\" he said. Everyone agreed that was fair."}}],Jf=[{"id":"magic-1","category":"magic","title":{"en":"The Tiny Dragon","es":"El dragón diminuto","ja":"ちいさなドラゴン","fr":"Le petit dragon"},"text":{"en":"There was a dragon so small he could sit on a cupcake. His name was Sparky, and his fire was the size of a match flame. He tried to roar — it came out as a hiccup. \"HIC-cough!\" A tiny puff of smoke came out. The other dragons laughed. \"You're not a dragon, you're a lizard with heartburn!\" Sparky was determined to prove them wrong. He practiced his fire-breathing on birthday candles — he blew them out instead of lighting them. He tried to fly — he flapped his tiny wings and hovered for about two seconds before landing on his face. Then one day, a knight came to the dragon cave. The big dragons hid. Sparky stood his ground. \"HIC-cough!\" he fired. The smoke went straight up the knight's nose. The knight sneezed so hard his armor fell off. He ran away screaming, \"The dragon's smoke is poisonous!\" The big dragons stared at Sparky. \"Okay,\" they said. \"You're a dragon. A very small, very sneezy dragon.\" Sparky hiccuped proudly."}},{"id":"magic-2","category":"magic","title":{"en":"The Wizard's Lost Hat","es":"El sombrero perdido del mago","ja":"まほうつかいのうしなわれたぼうし","fr":"Le chapeau perdu du sorcier"},"text":{"en":"Wizard Wobblebottom lost his hat. This was a serious problem because his hat was where he kept his spells — and his lunch. Without his hat, every time he waved his wand, a sandwich came out instead of a spell. \"Abracadabra!\" he shouted. A tuna sandwich appeared. \"Expecto Patronum!\" A grilled cheese. He tried to fight a goblin — he threw a club sandwich at it. The goblin ate it and asked for more. \"You're the worst wizard ever,\" the goblin said between bites. Wobblebottom retraced his steps. He'd left his hat at the barber. He ran to the barber shop and found his hat — on the barber's head. \"This hat makes my hair grow faster!\" the barber said. \"Give it back!\" Wobblebottom snatched it and put it on. He waved his wand. \"Abracadabra!\" A real spell came out — turning the barber's hair blue. \"Oops,\" Wobblebottom said. \"Wrong spell.\" He reached into his hat and pulled out an apology sandwich. The barber ate it. \"We're even,\" he said. \"But fix my hair.\" Wobblebottom ran away. Some problems can't be fixed with sandwiches."}},{"id":"magic-3","category":"magic","title":{"en":"The Fairy Who Lost Her Wings","es":"El hada que perdió sus alas","ja":"つばさをなくしたようせい","fr":"La fée qui perdit ses ailes"},"text":{"en":"Sparkle the Fairy lost her wings — they just popped off one morning like buttons on a tight shirt. \"Oh no!\" she gasped. She tried taping them back on. They stayed for ten seconds, then fell off mid-flight. She crash-landed in a birdbath. A duck quacked at her disapprovingly. She tried glue — it stuck her wings to her back, but also stuck her hands to her wings. She had to walk around like a T-rex. \"Rawr,\" she said, not amused. She went to the fairy doctor, who said, \"Have you tried turning them off and on again?\" \"They're wings, not a computer!\" The doctor shrugged. \"Have you tried blowing on them?\" Sparkle almost hit him. Finally, a fairy mechanic looked at them. \"Your wings just need new screws.\" He tightened two tiny screws and the wings snapped back on. \"That'll be fifty pixie dollars.\" Sparkle flew home, vowing never to skip wing maintenance again. She set a reminder on her phone: \"Check wing screws monthly.\" It worked — until she lost her phone."}},{"id":"magic-4","category":"magic","title":{"en":"The Magic Paintbrush","es":"El pincel mágico","ja":"マジックペンブラシ","fr":"Le pinceau magique"},"text":{"en":"A girl named Rose found a paintbrush that made everything she painted come to life. She painted a cookie — a real cookie appeared. She bit into it. \"Delicious!\" She painted a puppy — a real puppy jumped out and licked her face. \"Best paintbrush ever!\" She got carried away. She painted a pizza, a treehouse, a trampoline, and a life-sized dinosaur. The dinosaur ate the pizza, broke the trampoline, and sat on the treehouse. \"Oops,\" Rose said. The dinosaur burped. It was a tiny, cute burp — the dinosaur was actually a baby. It looked at Rose with big eyes and made a sound like a squeaky toy. \"Awww,\" Rose said. She painted it a bottle of milk. It drank the milk and fell asleep on the trampoline ruins. Rose painted a leash and took the baby dino for a walk. Her mom looked out the window. \"Rose, why is there a dinosaur in our yard?\" Rose smiled. \"Art class project.\" Her mom closed the curtains. \"I'm not dealing with this,\" she said."}},{"id":"magic-5","category":"magic","title":{"en":"The Mermaid and the Music Box","es":"La sirena y la caja de música","ja":"にんぎょとオルゴール","fr":"La sirène et la boîte à musique"},"text":{"en":"Marina the Mermaid found a music box at the bottom of the ocean. She opened it — it played a song so catchy that every fish within a mile started dancing. The crabs did the sideways shuffle. The octopus did an eight-armed wave. The sharks tried to dance but kept biting each other's tails. \"Stop biting!\" Marina scolded. \"It's a dance, not a buffet!\" The seahorses waltzed. The jellyfish did the float — which was basically just existing. A whale tried to spin and created a whirlpool that sucked everyone in. \"STOP DANCING!\" Marina screamed, spinning in the whirlpool. She slammed the music box shut. Everyone stopped. The whale burped. \"That was fun,\" the whale said. \"Let's do it again.\" \"NO,\" said everyone. Marina buried the music box in the sand. \"Some treasures should stay closed,\" she said. A crab dug it up the next day and opened it. The dance party started all over again. Marina screamed into a clamshell."}},{"id":"magic-6","category":"magic","title":{"en":"The Invisible Cloak","es":"La capa invisible","ja":"トウメイのマント","fr":"La cape invisible"},"text":{"en":"A boy named Theo got an invisibility cloak for his birthday. He put it on and — poof — he was invisible. \"This is amazing!\" he whispered. He snuck into the kitchen and ate all the cookies. His mom opened the cabinet. \"Who ate the cookies?\" Theo stood there, invisible, crumbs on his invisible face. \"Must have been mice,\" his mom said. She set mouse traps. Theo felt guilty. He snuck into his sister's room and rearranged all her books alphabetically. She screamed. \"My books were in perfect chaos order!\" He went outside and tap-danced in the park. People saw floating shoes and ran screaming. \"Ghost shoes!\" the headlines said. Theo tried to take the cloak off — it was stuck. The zipper was jammed. He was invisible permanently. \"Help!\" he shouted. Nobody could see him. He spent three hours bumping into things before his grandma found him. \"I can smell you,\" she said. \"You smell like cookies.\" She fixed the zipper with WD-40. \"Note to self,\" Theo said, reappearing. \"Invisibility is not an excuse for bad behavior.\""}},{"id":"magic-7","category":"magic","title":{"en":"The Magic Garden","es":"El jardín mágico","ja":"マジックガーデン","fr":"Le jardin magique"},"text":{"en":"Willow planted a magic seed in her garden. Overnight, it grew into a garden where everything was slightly wrong. The tomatoes were blue. The carrots grew upside down. The sunflowers faced the ground. \"You're supposed to face the SUN!\" Willow told them. They sulked. The watermelons grew square — which was actually convenient for stacking. The corn whispered gossip. \"Did you hear about the cabbage? It's rotting from the inside.\" Willow looked at the cabbage. It was fine. \"Liar corn,\" she muttered. The pumpkins told jokes. \"Why did the scarecrow win an award? Because he was OUTSTANDING in his field!\" The pumpkins laughed at their own joke. Nobody else did. A Venus flytrap tried to eat Willow's gardening glove. She slapped it. \"Bad plant!\" It sulked and caught a fly instead. \"At least someone appreciates my humor,\" the flytrap seemed to say. Willow sold the square watermelons at the farmer's market for triple the price. \"Best magic garden ever,\" she said. The corn disagreed. It thought the tomatoes were getting too much attention."}},{"id":"magic-8","category":"magic","title":{"en":"The Crystal Ball's Bad Day","es":"El mal día de la bola de cristal","ja":"クリスタルボールのわるいひ","fr":"La mauvaise journée de la boule de cristal"},"text":{"en":"Gloria the Fortune Teller's crystal ball was having a bad day. Instead of showing the future, it showed reruns of sitcoms. \"I see... a man in a puffy shirt... he's called the Soup Nazi...\" Gloria stared. \"That's Seinfeld.\" The crystal ball shrugged — if crystal balls could shrug. It then showed a cat video. \"What does this mean for my client's future?\" Gloria asked. The ball showed a dog chasing its tail. \"Your client will go in circles?\" The client looked worried. The ball then showed a cooking show. \"Your future involves... a soufflé?\" The client left confused. Gloria tapped the ball. \"Work properly!\" The ball showed a test pattern. \"Great. You're broken.\" She took it to the repair shop. \"It needs a firmware update,\" the repairman said. \"It's a crystal ball, not a TV!\" Gloria shouted. \"Same thing,\" the repairman shrugged. After the update, the ball worked — but it only showed the future in black and white. \"At least it's not showing cat videos anymore,\" Gloria said. The ball showed a cat video. \"Traitor,\" Gloria whispered."}},{"id":"magic-9","category":"magic","title":{"en":"The Spell That Went Wrong","es":"El hechizo que salió mal","ja":"まちがえたじゅもん","fr":"Le sort qui a mal tourné"},"text":{"en":"A young wizard named Pip tried to cast a spell to make his bed make itself. He said the magic words wrong — instead of making the bed, it made everything in his room bounce. His pillow bounced. His books bounced. His desk bounced. His goldfish bowl bounced — the goldfish was having the time of its life. \"Stop bouncing!\" Pip shouted, bouncing himself. He tried to reverse the spell — he said the words backwards, which made everything bounce higher. His hamster wheel bounced across the room with the hamster still running in it. \"This is actually fun,\" the hamster seemed to say. Pip tried a different counter-spell — everything stopped bouncing and started spinning instead. His chair spun into the wall. His lamp spun like a helicopter and took off. \"I'm going to be in so much trouble,\" Pip said, spinning. His mom opened the door, got hit by a spinning sock, and closed the door. \"I'm not coming in there,\" she said. \"Fix it yourself.\" Pip eventually found the right spell — everything stopped. His room was a disaster. \"Next time,\" he panted, \"I'll just make my bed manually.\""}},{"id":"magic-10","category":"magic","title":{"en":"The Unicorn Who Could Not Sparkle","es":"El unicornio que no podía brillar","ja":"キラキラできないユニコーン","fr":"La licorne qui ne pouvait pas briller"},"text":{"en":"Pearl the Unicorn was the only unicorn in the meadow who couldn't sparkle. She'd shake, jump, and spin — nothing. The other unicorns shimmered like diamonds. Pearl was matte. \"Maybe I'm a horse with a horn,\" she said, depressed. She tried glitter — it fell off. She tried sequins — they looked ridiculous. She tried standing in a rainbow — she got wet. A fairy told her, \"Sparkle comes from within.\" \"What does that mean?\" Pearl asked. \"I don't know. I'm a fairy, not a therapist.\" Pearl tried eating shiny food — nothing. She tried bathing in moonlight — she got cold. Finally, she stopped trying. She just went about her day, helping a lost foal, sharing her apples, and making a sad donkey laugh. The donkey said, \"You don't need to sparkle. You're already bright.\" Pearl felt warm inside. She looked down — she was glowing. Not sparkling, but glowing. A warm, golden light. \"I'm not sparkling,\" she said. \"I'm GLOWING.\" \"Same thing,\" the donkey said. \"Better, actually.\" And Pearl agreed."}}],Xf=[{"id":"adventures-1","category":"adventures","title":{"en":"The Little Boat That Sailed","es":"El barquito que navegó","ja":"こざかなふねのぼうけん","fr":"Le petit bateau qui navigua"},"text":{"en":"A toy boat named Puddle was dropped in a creek by a boy named Max. \"Bon voyage, Puddle!\" Max waved. Puddle sailed down the creek, feeling very adventurous for something made of plastic. A fish jumped over him. \"Watch it, I'm sailing here!\" Puddle wobbled. He went over a tiny waterfall — which was dramatic for a boat his size. \"MAYDAY! MAYDAY!\" He survived. He passed a family of ducks. \"Where are you going?\" the ducks asked. \"To the ocean!\" Puddle declared. \"You're a toy boat,\" the ducks said. \"You'll melt.\" Puddle didn't care. He sailed through a storm (a sprinkler), battled pirates (some kids with water guns), and survived a whirlpool (a draining pipe). He finally reached the big lake. \"THE OCEAN!\" he cheered. A real boat passed by. The captain looked down. \"Cute boat,\" he said. Puddle puffed with pride. He sailed around the lake for three days before a seagull picked him up, carried him back to Max's yard, and dropped him. \"Home!\" Puddle said. Max picked him up. \"You're back! And you smell like fish.\" Best adventure ever."}},{"id":"adventures-2","category":"adventures","title":{"en":"The Hot Air Balloon Ride","es":"El paseo en globo aerostático","ja":"ねつきゅうのり","fr":"La promenade en montgolfière"},"text":{"en":"Claire won a hot air balloon ride at the fair. The pilot was an old man named Captain Bob who told terrible jokes. \"What do you call a flying monkey? A hot air baboon!\" Claire groaned. They lifted off. The view was amazing — the town looked like a toy set. \"Look, there's my school!\" Claire pointed. \"I can see my house!\" Captain Bob steered the balloon toward a cloud. \"Want to touch it?\" Claire reached out — the cloud was wet and cold. \"It's just water!\" she said, disappointed. \"What did you expect? Cotton candy?\" \"Kind of, yeah.\" A bird landed on the balloon's basket. \"Nice ride,\" the bird seemed to say. It pooped and flew away. \"Bird review: two stars,\" Captain Bob said. The wind picked up and they drifted toward a cow field. \"Brace for cows!\" Captain Bob shouted. They landed softly in the middle of the field. The cows stared. \"Moo,\" one said judgmentally. \"We've been invaded by a giant balloon and two humans.\" Claire and Captain Bob had to walk the balloon back to the fair. \"Best ride ever,\" Claire said. The cows disagreed."}},{"id":"adventures-3","category":"adventures","title":{"en":"The Treasure Map","es":"El mapa del tesoro","ja":"トレジャーマップ","fr":"La carte au trésor"},"text":{"en":"Three friends — Max, Zoe, and Leo — found a treasure map in a bottle on the beach. \"It says the treasure is under the big rock!\" Max said. They ran to the big rock and tried to dig under it. It was solid. \"Maybe a different big rock?\" Zoe suggested. There were twelve big rocks. They dug under all of them. They found: a worm, a shoe, another shoe (matching pair!), a lost sandwich, and a very angry crab. The crab chased Leo for ten minutes. \"THE TREASURE IS NOT WORTH THIS!\" Leo screamed. They followed the map to an X under the pier. They dug — and hit something solid. \"It's the treasure!\" Max shouted. They pulled out a chest. They opened it. Inside was a note: \"Congratulations. The real treasure was the friends you made along the way.\" They stared. \"Are you kidding me?!\" Leo yelled. Zoe started laughing. Max started laughing. Leo didn't laugh — until he found a bag of gold coins under the note. \"WAIT. There IS treasure!\" They split the coins and bought ice cream. \"Best treasure hunt ever,\" Max said. \"The note was right,\" Zoe said. \"The friends were the treasure. The gold was just a bonus.\" Leo rolled his eyes. \"Whatever. I'm getting the large cone.\""}},{"id":"adventures-4","category":"adventures","title":{"en":"The Mountain Climber","es":"El alpinista","ja":"やまのぼり","fr":"Le grimpeur"},"text":{"en":"A boy named Raj decided to climb the biggest hill in his town. It wasn't a real mountain — it was the hill behind the grocery store — but Raj was determined. He packed supplies: three sandwiches, a juice box, a compass he didn't know how to use, and a flag. \"To the summit!\" he announced. His mom watched from the kitchen window. \"He's climbing the hill again,\" she told his dad. Raj climbed for ten minutes. A goat was on the hill. \"This is MY hill,\" the goat seemed to say. It headbutted Raj in the bottom. \"OW!\" Raj dropped a sandwich. The goat ate it. \"My summit supplies!\" Raj tried to go around the goat. The goat followed. Raj tried offering the goat a juice box. The goat drank it and headbutted him again. \"You're welcome!\" Raj said. He finally reached the top, planted his flag, and looked out. He could see the grocery store parking lot. \"Majestic,\" he said. A pigeon landed on his flag. \"Nice summit,\" it pooped. Raj climbed down, muddy, bruised, and minus two sandwiches. \"How was the climb?\" his mom asked. \"I conquered the hill,\" Raj said. \"A goat conquered me.\" His mom laughed. \"Same thing, honey.\""}},{"id":"adventures-5","category":"adventures","title":{"en":"The Underground Tunnel","es":"El túnel subterráneo","ja":"ちかトンネル","fr":"Le tunnel souterrain"},"text":{"en":"Sam and Daisy were digging a fort in the backyard when they broke through into an underground tunnel. \"Should we go in?\" Sam asked. \"Obviously,\" Daisy said, already crawling in. The tunnel was dark and smelled like dirt. \"I can't see anything,\" Sam said. \"That's because it's dark,\" Daisy said helpfully. They crawled for ten minutes and ended up under the neighbor's yard. They could hear Mr. Henderson watching TV. \"He's watching a cooking show,\" Daisy whispered. They crawled further and ended up under the school. \"We're under the cafeteria!\" Sam whispered. They could smell lasagna. \"I'm hungry now,\" Daisy said. They kept crawling and popped up in the park. They were covered in dirt from head to toe. A dog barked at them. \"We look like mole people,\" Sam said. They walked home through the streets, filthy. Their mom saw them. \"WHAT HAPPENED TO YOU?\" \"We found a tunnel,\" Daisy said. \"It goes from our yard to the park.\" Their mom stared. \"You're grounded.\" \"Worth it,\" Sam whispered. They went back the next day with flashlights. And snacks."}},{"id":"adventures-6","category":"adventures","title":{"en":"The River Raft Race","es":"La carrera de balsas","ja":"いかだレース","fr":"La course de radeaux"},"text":{"en":"It was the annual river raft race, and the competition was fierce. Team Rocket (three kids on an actual door) vs. The Floaters (two kids on pool noodles tied together) vs. Captain Soggy (one kid on a pool inflatable unicorn). \"START YOUR RAFTS!\" the judge yelled. Team Rocket's door sank immediately. \"Abandon ship!\" They swam to shore. The Floaters' noodles came undone and they floated away in different directions. \"We're splitting up!\" one shouted. \"Not on purpose!\" the other yelled. Captain Soggy on the unicorn was in the lead — until the unicorn's horn punctured and started deflating. \"Nooo! My steed!\" The unicorn wheezed and sank slowly. Captain Soggy rode it down like a ship captain. \"Going down with the ship!\" The crowd on the banks was laughing so hard no one could film properly. The winner was a turtle who had entered by accident. It floated past the finish line on a log. \"The turtle wins!\" the judge announced. Captain Soggy saluted the turtle. \"Well deserved, old friend.\" The turtle blinked and fell off the log. \"Even the winner's a disaster,\" someone in the crowd said. \"Best race ever,\" everyone agreed."}},{"id":"adventures-7","category":"adventures","title":{"en":"The Treehouse Kingdom","es":"El reino de la casa del árbol","ja":"ツリーハウスおうこく","fr":"Le royaume de la cabane dans l'arbre"},"text":{"en":"A group of friends built a treehouse and declared it an independent kingdom. King Henry (age 9) ruled with an iron fist. \"All subjects must bring snacks!\" he decreed. Queen Zoe (age 8) was in charge of defense — she had a water balloon catapult. Knight Oscar (age 7) was the royal guard — he stood at the ladder and demanded passwords. \"What's the password?\" \"Open up, it's me.\" \"Wrong. The password is 'banana pickle.'\" \"That's disgusting.\" \"Correct! You may enter.\" The kingdom had laws: no running, no loud chewing, and no saying the word 'moist.' Anyone who said 'moist' was banished for five minutes. Henry said it by accident and banished himself. \"The king is banished!\" Zoe announced. \"I'm taking over.\" Henry came back after five minutes. \"I'm back. I'm the king again.\" \"Says who?\" \"Says me.\" They had a democratic election. Henry won 2-1 (Oscar voted for the dog). The Treehouse Kingdom lasted exactly one week — until Henry's mom said it was dinner time. \"The kingdom has fallen,\" Henry announced solemnly. \"Long live the kingdom.\" They all went inside for mac and cheese."}},{"id":"adventures-8","category":"adventures","title":{"en":"The Desert Island","es":"La isla desierta","ja":"むとう","fr":"L'île déserte"},"text":{"en":"A boy named Kai drifted to a desert island on a pool inflatable. He wasn't worried — he had a backpack with snacks and a juice box. \"I'll survive!\" he declared. He built a shelter out of pool noodles (he had a lot of them for some reason). He tried to start a fire with two sticks — he rubbed them for an hour and got nothing but sore arms. \"How does anyone survive without a lighter?\" A coconut fell on his head. \"OW.\" He tried to open it — he threw it at a rock, dropped it on his foot, and finally cracked it open by sitting on it. \"I am the coconut king!\" he announced. He drew a face in the sand and talked to it. \"Hello, Wilson.\" A crab walked over and rearranged the face. \"My face!\" Kai said. The crab clicked its claws. \"It's better now,\" Kai admitted. After three hours, a fishing boat passed by. \"Need a lift, kid?\" Kai grabbed his coconut and his pool noodles. \"Take me home. I've survived enough.\" The fisherman looked at his supplies. \"You brought pool noodles to a desert island?\" \"I was at a pool party,\" Kai said. \"It's a long story.\""}},{"id":"adventures-9","category":"adventures","title":{"en":"The Balloon That Flew Away","es":"El globo que voló","ja":"とんでいったふうせん","fr":"Le ballon qui s'est envolé"},"text":{"en":"A girl named Poppy accidentally let go of her balloon at the fair. \"NO!\" she cried as it floated away. The balloon had other plans. It floated over the fairground, photobombing a family's selfie. It drifted over the highway, causing a driver to do a double take. It floated over a farm, where a cow tried to eat it. It bounced off the cow's nose. \"Moo,\" the cow said, confused. It floated over a school, landing on the roof. A kid tried to reach it with a broom and fell off. He was fine — he landed on a bush. The balloon lifted off again and floated over the ocean. A seagull attacked it. \"Mine!\" the seagull squawked. The balloon escaped and floated over a cruise ship. A man on the deck caught it. \"Hey, a free balloon!\" He gave it to his daughter. The daughter was delighted. The balloon had traveled fifty miles. Poppy, back at the fair, got a new balloon. \"Don't let go this time,\" her dad said. She held on tight. The old balloon, on the cruise ship, was having a great time. It had always wanted to see the world."}},{"id":"adventures-10","category":"adventures","title":{"en":"The Secret Cave","es":"La cueva secreta","ja":"ひみつのどうくつ","fr":"La grotte secrète"},"text":{"en":"Jade and Marcus found a cave behind the waterfall at the local park. \"It's a secret cave!\" Jade said. \"It's probably just a hole,\" Marcus said. It was, in fact, a cave — a small one. They went inside and found: a broken flashlight, a candy wrapper from 2007, and a drawing on the wall that looked like a potato. \"Ancient art!\" Jade said. \"It's a potato, Jade.\" \"A SYMBOLIC potato.\" They explored further. The cave was about ten feet deep. \"This is the smallest cave ever,\" Marcus said. \"It's cozy,\" Jade corrected. They decided to make it their secret base. They brought: a rug, two flashlights, snacks, and a sign that said \"NO GROWN-UPS.\" Jade's little brother followed them. \"I want in!\" \"No. It's a secret.\" He cried. They let him in. \"Now it's not a secret,\" Marcus said. The cave became their hangout spot for the whole summer. They had cave movie nights (a tablet), cave snacks, and cave club meetings. The cave club had three rules: bring snacks, don't tell parents, and never say 'moist.' Marcus said it. He was banished for five minutes. \"The cave has spoken,\" Jade said."}}],Zf=[{"id":"kindness-1","category":"kindness","title":{"en":"The Garden of Friends","es":"El jardín de los amigos","ja":"ともだちガーデン","fr":"Le jardin des amis"},"text":{"en":"A girl named Lily started a community garden where everyone was welcome. \"Plant whatever you want!\" she said. The neighbors came. Mr. Henderson planted tomatoes but watered them with coffee — they grew hyperactive and wouldn't stop vibrating. Mrs. Chen planted peppers so hot they made the soil spicy. A kid planted gummy bears, hoping for a gummy tree. \"That's not how plants work,\" Lily said. \"But imagine if it did!\" the kid replied. The garden became the funniest, most chaotic place in town. The sunflowers grew crooked because they kept trying to face different neighbors' windows. The carrots grew in letter shapes — someone had carved a message: \"HI LILY.\" The garden brought everyone together. People who never talked became friends over weird vegetables. \"Your zucchini looks like a nose,\" Mrs. Chen told Mr. Henderson. \"Your peppers made my cat sneeze for an hour,\" he replied. They laughed. The gummy bear patch never grew anything, but the kid kept trying. \"Maybe next year,\" he said. Lily smiled. The garden wasn't about perfect plants — it was about perfect neighbors. Even the vibrating tomatoes seemed happy."}},{"id":"kindness-2","category":"kindness","title":{"en":"The Soup Stone","es":"La sopa de piedra","ja":"スープストーン","fr":"La soupe aux cailloux"},"text":{"en":"A stranger came to town with a magic stone that could make soup. \"This stone can feed the whole village!\" she said. The villagers were suspicious. \"A stone? That's soup?\" The stranger dropped the stone in a pot of water. \"It just needs a carrot,\" she said. A villager brought a carrot. \"And a potato.\" Another brought a potato. \"And some salt.\" Another brought salt. \"And maybe a onion.\" Another brought an onion. \"And a little meat would help.\" The butcher brought meat. \"And some herbs.\" The gardener brought herbs. The pot bubbled and stewed. The stranger tasted it. \"Perfect! The stone did it again!\" The villagers tasted the soup — it was delicious. \"The stone is magic!\" they said. The stranger smiled and took her stone when she left. The villagers made soup every week — each time adding different ingredients. They never figured out the stone was just a rock. But it didn't matter. The real magic was that everyone shared. \"Best soup I ever had,\" the mayor said. \"Must be the stone.\" A kid whispered, \"There's no stone in this batch.\" \"Shhh,\" his mom said. \"Let them believe.\" The soup tasted better when everyone contributed. That was the real recipe."}},{"id":"kindness-3","category":"kindness","title":{"en":"The New Kid","es":"El niño nuevo","ja":"あたらしいこ","fr":"Le nouvel enfant"},"text":{"en":"Tom was the new kid at school, and he was nervous. He walked into class and tripped over a chair. \"I'm okay!\" he said, face red. The class was silent — then a girl named Amy laughed. Not mean laughter — genuine, \"that was funny\" laughter. Tom laughed too. \"Good entrance,\" Amy said. At lunch, Tom sat alone. Amy came over. \"Do you like dinosaurs?\" she asked. \"I LOVE dinosaurs,\" Tom said. \"Great. We need a dinosaur expert for our group project.\" Tom joined the group. He knew more about dinosaurs than anyone. \"The T-Rex had teeth the size of bananas!\" he told them. \"Banana teeth!\" the group repeated, amazed. At recess, they played dinosaur tag. Tom was the T-Rex — he had tiny arms and had to chase everyone with just his head. \"RAWRRR!\" he yelled. Everyone ran screaming and laughing. By the end of the day, Tom had five new friends. \"Best first day ever,\" he told his mom. \"I tripped and became a dinosaur.\" His mom laughed. \"That's how all great friendships start.\" Tom went to bed happy, dreaming of banana-toothed T-Rexes and new friends."}},{"id":"kindness-4","category":"kindness","title":{"en":"The Shared Umbrella","es":"El paraguas compartido","ja":"あかい傘","fr":"Le parapluie partagé"},"text":{"en":"It was raining hard, and Mei forgot her umbrella. She stood at the school door, watching the rain, when a boy named Liam walked by with a giant umbrella. \"Want to share?\" he asked. \"It's big enough for three people.\" Mei stepped under it. \"Thanks!\" They walked together. The umbrella was enormous — it could have covered a car. \"Where did you get this?\" Mei asked. \"My grandma. She said, 'Better too big than too wet.'\" They passed another kid, Sam, who was soaked. \"Get under here!\" Liam called. Sam joined them. Then a teacher walked by, dripping. \"Come on in, Mrs. Park!\" The umbrella now sheltered four people and a dog that had followed Sam. \"Whose dog is this?\" Mrs. Park asked. \"Not mine,\" Sam said. \"Not mine,\" Mei said. \"I think the umbrella attracted it,\" Liam said. The dog shook water on everyone. \"Great,\" Mrs. Park said. They all walked together, laughing, under the world's biggest umbrella. Liam's grandma watched from her window. \"That's my umbrella doing its job,\" she said. The dog followed them home and became Sam's. They named it Umbrella. It made no sense. They kept the name anyway."}},{"id":"kindness-5","category":"kindness","title":{"en":"The Old Woman and the Cat","es":"La anciana y el gato","ja":"おばあさんとネコ","fr":"La vieille dame et le chat"},"text":{"en":"Mrs. Chen was an old woman who lived alone with her cat, Chairman Meow. Chairman Meow was the most dignified cat in the neighborhood — he sat on the windowsill like a furry emperor, judging passersby. One day, a boy named Danny threw a ball that broke Mrs. Chen's window. Chairman Meow was not impressed. Danny knocked on the door, terrified. \"I'm sorry, I broke your window,\" he said. Mrs. Chen looked at the broken window, then at Danny. \"Can you fix windows?\" \"No.\" \"Can you catch mice?\" \"No.\" \"Can you cat-sit?\" \"...Maybe?\" Mrs. Chen smiled. \"Then you owe me three cat-sitting sessions.\" Danny came over every Tuesday to watch Chairman Meow. The cat ignored him completely. \"He likes you,\" Mrs. Chen said. \"He's literally looking the other way,\" Danny said. \"That's his way of showing trust.\" Danny started bringing treats. Chairman Meow still ignored him — but ate the treats. After three weeks, the cat sat on Danny's lap. \"He trusts you now,\" Mrs. Chen said. \"He's just using me for warmth,\" Danny said. \"That's how all relationships start,\" Mrs. Chen replied. Danny kept coming even after he paid off his debt. Chairman Meow pretended not to care — but he always sat on Danny's lap."}},{"id":"kindness-6","category":"kindness","title":{"en":"The Bully Who Changed","es":"El matón que cambió","ja":"かわったいじめっこ","fr":"Le tyran qui a changé"},"text":{"en":"Rex was the school bully. He took lunches, pushed kids around, and once ate someone's entire cake at a birthday party. \"It was just sitting there!\" he said. One day, a small kid named Oscar stood up to him. \"Why are you mean?\" Oscar asked. Rex was stunned. Nobody had ever asked him that. \"Because... because...\" Rex thought about it. \"I don't know.\" \"Do you want to be my friend?\" Oscar asked. Rex was confused. \"Nobody's ever asked me that either.\" \"That's sad,\" Oscar said. \"Come sit with us at lunch.\" Rex sat with Oscar's group. He was awkward. \"So... what do friends do?\" \"They share,\" a girl said, offering him a cookie. Rex ate the cookie. \"This is... nice.\" He tried sharing back — he gave half his sandwich to Oscar. \"This sandwich is terrible,\" Oscar said. \"I know,\" Rex said. \"My mom is a terrible cook.\" They both laughed. Rex slowly stopped bullying. He started bringing extra snacks to share. \"Rex is nice now?\" the school whispered. \"Since when?\" \"Since someone asked him why he was mean.\" It was the simplest question that changed everything. \"Turns out,\" Rex told Oscar, \"I just needed a friend.\" Oscar nodded. \"And better sandwiches.\""}},{"id":"kindness-7","category":"kindness","title":{"en":"The Cookies That Made Friends","es":"Las galletas que hicieron amigos","ja":"ともだちをつくるクッキー","fr":"Les biscuits qui ont fait des amis"},"text":{"en":"Two girls, Anna and Beth, were in a fight. \"You copied my hairstyle!\" Anna said. \"I didn't! It's a coincidence!\" Beth said. They weren't talking. Anna's mom made cookies to cheer her up. Anna had an idea — she wrote \"I'm sorry\" on a cookie and put it in Beth's mailbox. Beth found it, ate it, and wrote \"I'm sorry too\" on a cookie and put it in Anna's mailbox. Anna ate it. They kept exchanging apology cookies for a week. The cookies got more elaborate: \"I'm sorry I said your shoes were ugly.\" \"I'm sorry I told everyone you snore.\" \"I'm sorry I glued your backpack shut.\" \"I'm sorry I put a frog in your locker.\" The cookies became a daily ritual. The whole school started doing it — apology cookies everywhere. \"Sorry I tripped you.\" \"Sorry I ate your eraser.\" \"Sorry I told the teacher you were the one who drew on the wall.\" The principal had to make a rule: no cookies in the hallways. Anna and Beth finally hugged. \"We're best friends again,\" Anna said. \"Best friends who never glue each other's backpacks,\" Beth added. \"Deal,\" Anna said."}},{"id":"kindness-8","category":"kindness","title":{"en":"The Letters to Grandma","es":"Las cartas a la abuela","ja":"おばあちゃんへのてがみ","fr":"Les lettres à grand-mère"},"text":{"en":"Danny's grandma was in the hospital and couldn't have visitors. Danny was sad. \"I'll write her letters!\" he said. He wrote: \"Dear Grandma, today I learned to ride my bike. I fell into a bush. The bush won.\" He drew a picture of himself in a bush. Grandma wrote back: \"Dear Danny, when I was your age, I fell into a pond. The fish won. Love, Grandma.\" Danny laughed and wrote another: \"Dear Grandma, I got an A on my math test. Dad cried tears of joy. Mom fainted.\" Grandma: \"Dear Danny, your father cried when he was born too. Some things never change. Love, Grandma.\" Danny: \"Dear Grandma, I tried to cook dinner. The smoke alarm worked great.\" Grandma: \"Dear Danny, your grandfather once burned water. WATER. You're doing fine. Love, Grandma.\" The letters went back and forth every day. The nurses read them and laughed. \"Your grandson is hilarious,\" they told Grandma. \"He gets it from me,\" Grandma said. When she came home, she had a box of Danny's letters. \"These are my treasure,\" she said. \"Better than gold.\" \"Better than your cooking,\" Danny said. Grandma threw a pillow at him. They both laughed."}},{"id":"kindness-9","category":"kindness","title":{"en":"The Toy Share","es":"El juguete compartido","ja":"おもちゃシェア","fr":"Le jouet partagé"},"text":{"en":"Henry and Oscar were brothers who fought over every toy. \"It's MY turn with the robot!\" Henry yelled. \"You had it for an HOUR!\" Oscar yelled. Their mom had a solution: the Share Bear. \"This bear watches you. If you share, the bear smiles. If you don't, the bear frowns.\" She put a stuffed bear on the shelf. Henry and Oscar stared at it. \"It's a stuffed bear, Mom. It can't smile.\" \"It can if you believe,\" Mom said mysteriously. Henry took the robot. Oscar grabbed it. They both looked at the bear. Mom had secretly turned its mouth upside down. \"The bear is FROWNING!\" Oscar gasped. \"We have to share!\" They took turns. The bear's mouth was turned up. \"The bear is smiling!\" They shared all day. The bear smiled. They were angels. The next morning, Henry saw Mom adjusting the bear's mouth. \"MOM! You're CHANGING IT!\" \"It's magic,\" Mom said, caught. \"No it's not!\" Henry said. He told Oscar. \"The bear is fake!\" \"Then why are we still sharing?\" Oscar asked. They looked at each other. \"Because sharing is actually... fun?\" Henry said slowly. \"Don't tell Mom,\" Oscar whispered. \"She thinks the bear works.\" They kept sharing. The bear kept smiling. Mom kept adjusting it. Everyone was happy."}},{"id":"kindness-10","category":"kindness","title":{"en":"The Kindness Jar","es":"El frasco de bondad","ja":"やさしさびん","fr":"Le bocal de bonté"},"text":{"en":"Lily found an empty jar and wrote \"Kindness\" on it. \"Every time someone does something kind, we put a note in the jar,\" she told her family. Day 1: Dad made breakfast — \"Dad made pancakes. They were burned, but he tried.\" Day 2: Mom drove Lily to school — \"Mom didn't yell at the bad driver. She only muttered. Progress.\" Day 3: Lily's brother shared his chips — \"Oscar gave me three chips. He ate the rest. But three is something.\" Day 4: The dog didn't bark at the mailman — \"Good boy, Rex. Very kind.\" Day 5: Dad helped a neighbor carry groceries — \"The bag broke. Eggs everywhere. Dad still got a thank you.\" The jar filled up. On Sunday, they read all the notes at dinner. They laughed at the burned pancakes, the three chips, and the eggs. \"We do a lot of kind things,\" Lily said. \"Even the small ones count,\" Mom said. \"Especially the small ones,\" Dad added. \"Can we start a new jar?\" Oscar asked. \"But this time, let's call it the Funny Jar — for all the funny things that happen.\" They did. The Funny Jar filled faster than the Kindness Jar. \"We're funnier than we are kind,\" Oscar observed. \"We're both,\" Lily said. \"We're just better at laughing.\""}}];spookyStories=[{"id":"haunted-1","title":{"en":"The Whispering Shadow Writer","es":"El escritor sombra susurrante","ja":"ささやくかげのライター","fr":"L'écrivain d'ombre chuchotant"},"text":{"en":"In an old mansion at the end of the street, a shadow would whisper stories to anyone who listened. A girl named Nora stood outside the mansion one night and heard: \"Write... write... write...\" She followed the whisper inside and found a study full of books. A shadow ghost sat at a desk, writing furiously. \"I've been writing for centuries,\" the shadow said. \"I was a horror writer who was too afraid to publish. Now I write in the dark, where no one can judge me.\" Nora sat beside the shadow. \"Your stories are wonderful,\" she said, reading a page. \"You should share them.\" The shadow hesitated, then handed her the manuscript. \"If you think they're good enough...\" Nora published the stories under the name \"The Shadow Writer.\" They became a sensation. The shadow glowed a little brighter that night."},"category":"haunted"},{"id":"haunted-2","title":{"en":"The Ghost in the Mirror's Story","es":"La historia del fantasma en el espejo","ja":"かがみのなかのゴーストのものがたり","fr":"L'histoire du fantôme dans le miroir"},"text":{"en":"A boy named Alex moved into a new house and found a ghost in the bathroom mirror. But this ghost wasn't scary — she was a writer. \"I've been writing stories in this mirror for a hundred years,\" the ghost said. \"Every time someone looks in the mirror, I write a story about what I see in their eyes.\" The ghost showed Alex her collection: stories about brave grandmothers, shy children, lonely fathers, and hopeful mothers. \"You see all that in someone's eyes?\" Alex asked. \"Eyes are the best windows to stories,\" the ghost replied. \"Now let me write yours.\" The ghost studied Alex's eyes and wrote: \"A boy who is braver than he knows, kinder than he shows, and more creative than he believes.\" Alex read it and felt something change inside. \"Thank you,\" he said. The ghost smiled. \"I just wrote what was already true.\""},"category":"haunted"},{"id":"haunted-3","title":{"en":"The Attic Door's Ghost Manuscript","es":"El manuscrito fantasma de la puerta del desván","ja":"やねうらのドアのゴーストげんこう","fr":"Le manuscrit fantôme de la porte du grenier"},"text":{"en":"There was a door in the attic that nobody opened. A girl named Ivy was brave enough to open it. Behind the door was a room full of manuscripts — thousands of pages, written by a ghost. \"I was a mystery writer,\" the ghost said. \"I wrote a hundred mysteries but never solved the biggest one: how to share my stories with the world.\" Ivy read the manuscripts. They were brilliant — full of twists, clues, and suspense. \"Let me share them,\" Ivy said. \"I'll publish them under your name.\" \"But I'm a ghost,\" the ghost said. \"Nobody knows my name.\" Ivy thought for a moment. \"Then we'll call you 'The Ghost Writer.'\" The books were published and became bestsellers. Everyone wanted to know who The Ghost Writer was. But only Ivy knew — and she wasn't telling."},"category":"haunted"},{"id":"haunted-4","title":{"en":"The Cold Spot's Ghost Story","es":"La historia fantasma del punto frío","ja":"つめたいばしょのゴーストストーリー","fr":"L'histoire fantôme du point froid"},"text":{"en":"In the hallway of an old school, there was a cold spot where the temperature always dropped. Kids avoided it, but a girl named Sophie sat there one day and felt a presence. \"I'm a ghost,\" a voice said. \"I used to be the school's writing teacher. I died still grading papers.\" Sophie looked around. \"Do you still want to teach?\" \"More than anything,\" the ghost said. Sophie started bringing her writing to the cold spot every day. The ghost read her stories, gave feedback, and taught her about character, plot, and description. Sophie's writing improved so much that she won the school's writing contest. \"Thank you,\" Sophie said. The ghost smiled. \"You don't need me anymore. You're a real writer now.\" But Sophie kept coming back. \"I still need my favorite teacher,\" she said. And the cold spot never felt cold again."},"category":"haunted"},{"id":"haunted-5","title":{"en":"The Doll That Wrote Stories","es":"La muñeca que escribía historias","ja":"ものがたりをかいたにんぎょう","fr":"La poupée qui écrivait des histoires"},"text":{"en":"A girl named Maya received a porcelain doll from an antique shop. At night, the doll would sit at a tiny desk and write stories on miniature paper. A ghost lived inside the doll — a writer who had loved stories so much that she refused to stop writing, even after death. \"Can I read them?\" Maya asked. The ghost-doll handed her a tiny story. It was about a doll who wrote stories for a girl, and a girl who read stories to a doll. \"That's our story!\" Maya gasped. The ghost-doll nodded. \"Every night, I write a new chapter of our story. Will you read them to me?\" Maya read the stories every night, and the ghost-doll wrote new ones every day. Together, they created the most unusual book in the world — written by a ghost, read by a girl, and starring a doll who refused to stop writing."},"category":"haunted"},{"id":"haunted-6","title":{"en":"The Footsteps in the Hall Writer","es":"El escritor de los pasos en el pasillo","ja":"ろうかのあしおとライター","fr":"L'écrivain des pas dans le couloir"},"text":{"en":"Every night, footsteps echoed through the hallway of an old inn. A traveling writer named Jack decided to investigate. He followed the footsteps to a room at the end of the hall and found a ghost sitting at a desk, writing. \"I'm a writer too,\" Jack said. The ghost looked up. \"I was a travel writer. I died on the road, but I never finished my book. I've been walking the halls every night, trying to write the last chapter.\" Jack sat beside the ghost. \"What's the last chapter about?\" \"Coming home,\" the ghost said. \"But I never made it home, so I don't know how to write it.\" Jack thought for a moment. \"Let me write it for you.\" Jack wrote the last chapter — about a traveler who found peace in the stories he'd written and the people he'd met. The ghost read it and smiled. \"That's perfect,\" the ghost said. And the footsteps in the hall never echoed again."},"category":"haunted"},{"id":"haunted-7","title":{"en":"The Music from Nowhere","es":"La música de ninguna parte","ja":"どこからともなくくるおんがく","fr":"La musique de nulle part"},"text":{"en":"A family moved into a house where music played from nowhere. Every night, a piano would play by itself, and when they checked, no one was there. A girl named Grace stayed up one night and saw a ghost playing the piano. But the ghost wasn't just playing — he was writing. Music notes floated from the piano onto sheets of paper on the music stand. \"I was a songwriter,\" the ghost said. \"I wrote songs for everyone but myself. Now I write the songs I never had time to write.\" Grace listened to the music. It was beautiful — sad and hopeful at the same time. \"Can I sing them?\" Grace asked. The ghost nodded. Grace recorded the songs and shared them online. Millions of people listened. The ghost's music touched hearts around the world. \"Your songs are making people cry,\" Grace told the ghost. The ghost smiled. \"That's what songs are for — to make people feel. I just needed someone to sing them.\""},"category":"haunted"},{"id":"haunted-8","title":{"en":"The Halloween Ghost Writer","es":"El escritor fantasma de Halloween","ja":"ハロウィンのゴーストライター","fr":"L'écrivain fantôme d'Halloween"},"text":{"en":"Every Halloween, a ghost appeared in the town library and wrote a scary story. The story would appear in a blank book on the children's shelf, and whoever found it got to read it first. A boy named Ethan found the book one Halloween night. The story was about a ghost who wrote stories for children every Halloween. \"That's a story about you!\" Ethan said to the ghost. The ghost appeared. \"Every year, I write a new story. It's my gift to the children of this town.\" Ethan read the story aloud to his friends, and they all loved it. \"Can we write a story for you?\" Ethan asked. The ghost was surprised. \"No one has ever offered to write for me.\" The children wrote a story about a friendly ghost who brought joy every Halloween. The ghost read it and cried transparent tears. \"This is the best story I've ever received,\" he said. And he kept it on his desk forever."},"category":"haunted"},{"id":"haunted-9","title":{"en":"The House on the Hill's Ghost","es":"El fantasma de la casa en la colina","ja":"おかのうえのいえのゴースト","fr":"Le fantôme de la maison sur la colline"},"text":{"en":"There was a house on the hill that everyone said was haunted. A girl named Lucy moved in and discovered it was — haunted by a ghost writer. The ghost had been a novelist who wrote in the house for fifty years. \"I wrote twelve novels in this house,\" the ghost said. \"Every room has a story. The kitchen is where I wrote about feasts. The bedroom is where I wrote about dreams. The attic is where I wrote about secrets.\" Lucy explored each room and read the ghost's novels. They were wonderful. \"Why didn't you publish them?\" Lucy asked. \"I was afraid,\" the ghost said. \"Aren't you afraid now, being a ghost?\" \"Being a ghost is nothing compared to the fear of sharing your words,\" the ghost replied. Lucy promised to publish the novels. And she did. They became classics, and the house on the hill became a museum dedicated to the ghost writer who finally shared his stories with the world."},"category":"haunted"},{"id":"haunted-10","title":{"en":"The Shadow Under the Bed's Story","es":"La historia de la sombra bajo la cama","ja":"ベッドのしたのかげのものがたり","fr":"L'histoire de l'ombre sous le lit"},"text":{"en":"A boy named Toby was afraid of the shadow under his bed. But when he looked closer, the shadow was writing. A ghost lived under the bed — a writer who was too shy to write in the open. \"I write better in the dark,\" the ghost said. \"It's where I feel safe.\" Toby read the ghost's stories. They were about monsters who were kind, ghosts who were friendly, and shadows that protected children instead of scaring them. \"Your stories are not scary at all,\" Toby said. \"They're comforting.\" The ghost smiled. \"That's the secret. The things we're afraid of are usually just trying to help. I write stories to help kids see that.\" Toby wasn't afraid of the shadow anymore. Every night, he'd hang his hand over the bed, and the ghost would hand him a new story. \"Goodnight, ghost writer,\" Toby would say. \"Goodnight, brave reader,\" the ghost would reply."},"category":"haunted"}];ep=[...Yf,...Kf,...Jf,...Xf,...Zf,...spookyStories,{"id":"lullabies-1","category":"lullabies","title":{"en":"Moonboat Lullaby","es":"Nana del barco de luna","ja":"ムーンボートララバイ","fr":"Berceuse du bateau lune"},"text":{"en":"Sail, little moonboat, across the velvet sky. Stars tuck their silver blankets in and whisper soft goodnight. The moon hums a tune as old as time, and the clouds rock gently, rocking you to sleep. Drift, little dreamer, on waves of silver light. The moonboat knows the way to dreamland, so close your eyes and hold on tight. Morning is far away, the night is deep and kind. Sail on, sail on, to the land of sleep."}},{"id":"lullabies-2","category":"lullabies","title":{"en":"Sleepy Cloud Song","es":"Canción de la nube soñolienta","ja":"ねむいくものうた","fr":"Chanson du nuage ensommeillé"},"text":{"en":"Sleepy cloud, soft and round, float above without a sound. Gather wishes, warm and sweet, lay them gently at my feet. Close your eyes, the cloud will rise, above the hills and starlit skies. It drifts so slow, it drifts so light, carrying dreams through the night. Hush now, little one, the cloud is here, soft as a whisper, warm as a tear. Sleep, sleep, the cloud will keep you safe until the morning peeps."}},{"id":"lullabies-3","category":"lullabies","title":{"en":"Firefly Hush","es":"Silencio de luciérnaga","ja":"ホタルハッシュ","fr":"Berceuse de la luciole"},"text":{"en":"Little firefly, blink once, blink twice, sprinkle lanterns warm and nice. Glow above the garden bed, where the sleepy flowers nod their head. One blink for the robin, one blink for the moon, one blink for the crickets singing their tune. Hush, little firefly, dim your light, tuck the world in for the night. Stars are waking, fireflies rest, closing every tiny chest. Blink one last time, then drift away, and save your glow for another day."}},{"id":"lullabies-4","category":"lullabies","title":{"en":"Dream Train","es":"Tren de sueños","ja":"ゆめ列車","fr":"Train des rêves"},"text":{"en":"All aboard the dream train, rolling softly through the rain. Past the hills and past the trees, past the whispered lullabies. Cars are made of pillows soft, tracks are made of starlight bright. The conductor calls, 'Next stop: sleep,' and every dreamer settles deep. Close your eyes and hear the track, clickety-clack, clickety-clack. The dream train knows just where to go — into the land where sweet dreams flow. Hold your ticket, close your eyes, the dream train carries you to the skies."}},{"id":"lullabies-5","category":"lullabies","title":{"en":"Garden Goodnight","es":"Buenas noches del jardín","ja":"ガーデンおやすみ","fr":"Bonne nuit du jardin"},"text":{"en":"Goodnight, little daisy, goodnight, sleepy bee. Goodnight to the leaves on the old oak tree. The snail is curling in his shell, the spider's weaving one last spell. The tomatoes close their eyes, the carrots settle in the ground. The scarecrow stands with arms wide, guarding dreams all around. Goodnight, garden, goodnight, flowers. Goodnight through the quiet hours. The moon will watch, the stars will keep, the garden safe while you sleep."}},{"id":"lullabies-6","category":"lullabies","title":{"en":"The Pillow Boat","es":"El barco almohada","ja":"まくらぼう","fr":"Le bateau oreiller"},"text":{"en":"My pillow is a boat tonight, my blanket is the sail. It drifts across a quiet sea where moonbeams leave a trail. The stars are lighthouses in the dark, they blink and shine and guide. My pillow boat rocks gently, with dreams on every side. I'm sailing to an island where the sand is soft as sleep, where lullabies grow on trees and the water is warm and deep. So close your eyes and climb aboard, the pillow boat is here. It knows the way to dreamland, it travels every year."}},{"id":"lullabies-7","category":"lullabies","title":{"en":"Rain on the Roof","es":"Lluvia en el techo","ja":"やねのあめ","fr":"Pluie sur le toit"},"text":{"en":"Rain on the roof goes tap, tap, tap, soft as a hand on a bedtime map. Raindrops slide down the window glass, making rivers that come and pass. Pitter, patter, hush, hush, hush — the rain is singing to the brush. The trees drink deep, the flowers nod, the world is bathed and kissed by God. Close your eyes and hear the rain, washing away the day's small pain. Let it tap you a lullaby, a rhythm of sky, a song of night. The rain will keep you safe and warm, a blanket of water, gentle and light."}},{"id":"lullabies-8","category":"lullabies","title":{"en":"Little Lantern","es":"Pequeña linterna","ja":"ちいさなランタン","fr":"Petite lanterne"},"text":{"en":"Little lantern, shine so low, show the dreams where they should go. Paint a path of amber gold, through the night so deep and cold. The lantern swings on someone's arm, walking where the dreams are warm. It passes windows one by one, tucking in each little one. Shine on the book that's being read, shine on the pillow, shine on the bed. When the last dream has found its way, the lantern dims to greet the day. But for now, little lantern, glow and glow — you have miles of dreams to go."}},{"id":"lullabies-9","category":"lullabies","title":{"en":"Whispering Woods","es":"Bosque susurrante","ja":"ささやくもり","fr":"Forêt chuchotante"},"text":{"en":"In the woods the branches sway, whispering softly, night and day. Owls hum low and crickets chirp, a lullaby for those at work. The foxes curl in underground dens, the badgers sleep and dream of hens. The river hums a bassline deep, and all the forest falls to sleep. The trees bend down to touch the ground, they're tucking in the world around. Whispers, hushes, gentle sighs — the woods are singing lullabies. So close your eyes and join the song, the woods will hum you all night long."}},{"id":"lullabies-10","category":"lullabies","title":{"en":"Sunrise Promise","es":"Promesa del amanecer","ja":"ゆうやけのやくそく","fr":"Promesse de l'aube"},"text":{"en":"Sleep until the sky turns gold, sleep until the night grows old. Morning keeps a promise sweet: the sun will rise, the birds will meet. So rest now, little one, the day is done, the night has won. But morning waits with open arms, with light and warmth and birdsong charms. The stars will fade, the moon will set, the sun will rise — but not just yet. So sleep, sleep, while the night is deep, and let the morning its promise keep. Sleep until the sky turns gold, and all the stories have been told."}}];function Fl(e){return ep.filter(t=>t.category===e)}function Vv(cat,idx){var m={bedtime:"sweet",animals:"sweet",magic:"sensational",adventures:"dramatic",kindness:"sweet",haunted:"heavy",lullabies:"sweet"};var v=m[cat]||"female";if(cat==="adventures"&&idx%2===1)v="sensational";if(cat==="magic"&&idx%2===1)v="dramatic";return v}
