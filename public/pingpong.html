<html lang="en">
<head>
<meta charset="utf-8"/>

<meta name="mobile-web-app-capable" content="yes"/>

<title>Robo Ping Pro v59</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1017;color:#eef3f7;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(8,12,18,.92);border:1px solid rgba(210,222,234,.42);border-radius:10px}
#build{position:absolute;left:8px;top:6px;font:700 9px Arial;color:#8fb7c9}
#status{position:absolute;left:8px;top:20px;font:700 9px Arial;color:#6fe59a}
#score{position:absolute;left:50%;transform:translateX(-50%);top:calc(5px + var(--safe-top));width:286px;padding:6px 10px;text-align:center}
#score .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-weight:800;font-size:13px}
#score .rally{margin-top:3px;color:#ffd86a;font-size:9px}
#autoBtn{position:absolute;left:50%;transform:translateX(-50%);top:calc(88px + var(--safe-top));width:140px;height:30px;pointer-events:auto;border:0;border-radius:9px;color:#fff;font-weight:800;font-size:10px;background:linear-gradient(#56df89,#1b884d)}
#audioBtn,#tipBtn{position:absolute;top:calc(7px + var(--safe-top));width:38px;height:38px;pointer-events:auto;border-radius:50%;border:1px solid #8298aa;background:#172737;color:#fff;padding:0}
#audioBtn{right:58px}#tipBtn{right:12px}
#audioBtn::before{content:'🔊';font-size:18px}.muted#audioBtn::before{content:'🔇'}
#tipBtn::before{content:'💡';font-size:18px}
#tipBtn::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:#ff2b2b;right:-1px;top:-1px;animation:blink .8s steps(1,end) infinite}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.15}}
#tip{
 position:absolute;
 right:14px;
 top:58px;
 bottom:auto;
 max-height:calc(100vh - 120px);
 width:min(400px,42vw);
 padding:18px 20px;
 display:none;
 overflow-y:auto;
 overflow-x:hidden;
 z-index:40;
 color:#f2f6fa;
 background:rgba(12,20,32,.42);
 border:1px solid rgba(255,216,106,.28);
 border-radius:18px;
 backdrop-filter:blur(16px) saturate(1.2);
 -webkit-backdrop-filter:blur(16px) saturate(1.2);
 box-shadow:0 16px 48px rgba(0,0,0,.36),0 0 0 1px rgba(255,216,106,.08),inset 0 1px 0 rgba(255,255,255,.06);
 font-size:clamp(11px,1.1vw,14px);
 line-height:1.48;
 pointer-events:auto;
 animation:tipFloat .5s cubic-bezier(.22,1,.36,1);
}
@keyframes tipFloat{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
#tip .tipTitle{position:sticky;top:-18px;margin:-18px -20px 8px;padding:14px 20px 10px;background:linear-gradient(135deg,rgba(255,216,106,.18),rgba(255,184,40,.08));font-weight:900;color:#ffd86a;font-size:15px;letter-spacing:.04em;text-shadow:0 0 18px rgba(255,216,106,.35);border-bottom:1px solid rgba(255,216,106,.18)}
#tip .tipItem{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
#tip .tipItem:last-child{border-bottom:0}
#tip b{color:#ffe9a0}
#playBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + var(--safe-bottom));width:92px;height:36px;pointer-events:auto;border:0;border-radius:9px;color:#fff;font-size:16px;font-weight:800;background:#35637f}
#speedWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(58px + var(--safe-bottom));width:min(520px,48vw);pointer-events:auto}
#speedLabel{display:block;text-align:center;font-size:9px;margin-bottom:2px}
#speed{width:100%;appearance:none;height:14px;border-radius:8px;border:1px solid #d9e0e7;background:linear-gradient(90deg,#78b8ff,#e6ef7b,#ff6a4d)}
#speed::-webkit-slider-thumb{appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid #1a232c}
.serveSideBtn,#resetBtn{position:absolute;bottom:calc(60px + var(--safe-bottom));width:106px;height:40px;pointer-events:auto;touch-action:none;border-radius:9px;border:1px solid #8296a8;color:#fff;font-weight:800;font-size:10px}
#resetBtn{right:14px;background:#613535}
#serveArrow{font-size:15px;color:#ffd55a;margin-right:5px;display:inline-block}
.serveSideBtn.armed .serveArrow{animation:serveBlink .44s steps(1,end) infinite}
@keyframes serveBlink{0%,45%{opacity:1}46%,100%{opacity:.12}}
#serveHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(28px + var(--safe-bottom));font-size:8px;color:#c7d2dc;white-space:nowrap}
#strokeBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(3px + var(--safe-bottom));display:flex;gap:4px;pointer-events:auto}
.stroke{min-width:52px;padding:5px 7px;border-radius:7px;border:1px solid #62798d;background:#162331;color:#eef3f7;font-weight:800;font-size:9px}
.stroke.active{background:#1b9b51;border-color:#7ef5a7;animation:pulse .55s ease-in-out infinite alternate;box-shadow:0 0 10px rgba(62,235,116,.5)}
@keyframes pulse{from{filter:brightness(.8)}to{filter:brightness(1.35)}}
@keyframes netPulse{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.4;transform:translate(-50%,-50%) scale(1.08)}}
/* telemetry panel removed for more play space */
#rotateGuard{display:none;position:fixed;z-index:999;inset:0;background:#0b1017;color:white;place-items:center;text-align:center;font-size:19px;font-weight:800;padding:24px}
body.mobile-device.portrait #rotateGuard{display:grid}

/* 3D tactile controls */
.serveSideBtn,#resetBtn{
  transform:translateY(0) scale(1);
  box-shadow:
    0 6px 0 rgba(0,0,0,.42),
    0 9px 14px rgba(0,0,0,.30),
    inset 0 2px 0 rgba(255,255,255,.18);
  transition:transform .08s ease,box-shadow .08s ease,filter .08s ease;
}
.serveSideBtn{background:linear-gradient(#29465e,#183247)}
#resetBtn{background:linear-gradient(#7c4848,#5c3030)}

.serveSideBtn.pressed,#resetBtn.pressed,
.serveSideBtn:active,#resetBtn:active{
  transform:translateY(5px) scale(.985);
  box-shadow:
    0 1px 0 rgba(0,0,0,.48),
    0 3px 5px rgba(0,0,0,.20),
    inset 0 3px 8px rgba(0,0,0,.24);
  filter:brightness(.92);
}
.serveSideBtn.pressed::after,#resetBtn.pressed::after{
  content:'';
  position:absolute;inset:3px;border-radius:7px;
  border:1px solid rgba(255,255,255,.22);
  pointer-events:none;
}


.serveSideBtn{
  position:absolute;bottom:calc(92px + var(--safe-bottom));
  width:102px;height:32px;pointer-events:auto;border-radius:10px;
  border:1px solid #8296a8;color:#fff;font-weight:800;font-size:12px;
  background:linear-gradient(#29465e,#183247);
}
#cpuServeBtn{left:31%}
#humanServeBtn{right:31%}
.serveSideBtn:disabled{opacity:.42;filter:grayscale(.5);cursor:not-allowed}.serveSideBtn.selected{opacity:.46;filter:grayscale(.65);box-shadow:none}
.serveArrow{font-size:24px;color:#ffd55a;display:inline-block;margin:0 4px}
.serveSideBtn.armed .serveArrow{animation:serveBlink .42s steps(1,end) infinite}

:root{--human:#2f7cff;--cpu:#ff4f55;--hud:#08111b;--hudBorder:#33404d}
#score{background:linear-gradient(180deg,var(--hud),#070d13);border:1px solid var(--hudBorder);border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
#humanServeBtn{background:linear-gradient(#173f7a,#0d2e61)!important;border-color:#5c9cff!important;box-shadow:0 0 14px rgba(47,124,255,.28)}
#cpuServeBtn{background:linear-gradient(#7a1e25,#53151a)!important;border-color:#ff767b!important;box-shadow:0 0 14px rgba(255,79,85,.25)}
#humanServeBtn .serveArrow{color:#78a9ff!important}
#cpuServeBtn .serveArrow{color:#ff8b8f!important}
#humanServeBtn.armed{box-shadow:0 0 0 2px rgba(95,155,255,.7),0 0 18px rgba(47,124,255,.55)}
#cpuServeBtn.armed{box-shadow:0 0 0 2px rgba(255,108,113,.7),0 0 18px rgba(255,79,85,.5)}


/* v54 mobile/tablet scaling QA rules */
html,body{overscroll-behavior:none}
#game{touch-action:none}
button,input{touch-action:manipulation}

 #tipBtn{right:8px}

 #cpuServeBtn{left:2%;bottom:58px !important}

 #speedWrap{bottom:54px;width:min(360px,48vw)}
 #resetBtn{right:8px;bottom:50px;width:82px;height:36px;font-size:9px}
 #serveHint{bottom:25px;font-size:7px;max-width:78vw;overflow:hidden;text-overflow:ellipsis}

/* telemetry removed */

   top:42px;

 #playBtn{bottom:137px;width:74px;height:32px;font-size:13px}
 .serveSideBtn{bottom:89px;width:78px;height:27px}
 #cpuServeBtn{left:1.5%;bottom:49px !important}
 #humanServeBtn{right:1.5%;bottom:49px !important}
 #speedWrap{bottom:49px;width:42vw}
 #resetBtn{bottom:46px;width:72px;height:34px}
 #serveHint{bottom:22px}

 #score{top:2px;padding:3px 6px}

 #score .rally{font-size:7px}
 #autoBtn{top:53px;height:24px}
 #audioBtn,#tipBtn{top:4px;width:30px;height:30px}
 #audioBtn{right:42px}
 #playBtn{bottom:126px;height:30px}
 .serveSideBtn{bottom:82px;height:26px}
 #speedWrap{bottom:44px}
 #resetBtn{bottom:42px;height:32px}
 #serveHint{bottom:19px}
 #strokeBar{bottom:1px}
 .stroke{min-width:38px;padding:3px;font-size:7px}
 #tip{top:36px;bottom:4px;width:46vw;font-size:8.5px;line-height:1.22}
}

@media (orientation:portrait) and (max-width:900px){
 #tip{left:8px;right:8px;top:48px;bottom:8px;width:auto;font-size:12px}
}


/* v55 reduced-height iPhone preview / Safari viewport scaling */
@media (orientation:landscape) and (max-height:360px){
 #build{font-size:6px;top:2px}
 #status{font-size:6px;top:11px}
 #score{top:1px!important;width:min(315px,48vw)!important;padding:2px 5px!important}
 #score .row{font-size:9px!important}
 #score .rally{font-size:6px!important;margin-top:1px}
 #autoBtn{top:43px!important;width:100px!important;height:22px!important;font-size:8px!important}
 #audioBtn,#tipBtn{top:3px!important;width:28px!important;height:28px!important}
 #playBtn{bottom:106px!important;width:68px!important;height:28px!important;font-size:12px!important}
 .serveSideBtn{bottom:70px!important;width:74px!important;height:23px!important;font-size:9px!important}
 #speedWrap{bottom:37px!important;width:44vw!important}
 #speedLabel{font-size:7px!important}
 #speed{height:10px!important}
 #resetBtn{bottom:36px!important;width:68px!important;height:30px!important;font-size:8px!important}
 #serveHint{bottom:17px!important;font-size:6px!important}
 #strokeBar{bottom:1px!important}
 .stroke{min-width:36px!important;padding:2px 3px!important;font-size:6px!important}
 #tip{top:32px!important;bottom:3px!important;width:48vw!important;font-size:8px!important}
}

#serveHint{display:none!important}
#score{padding-bottom:7px!important}
.serveSideBtn{bottom:calc(29px + var(--safe-bottom))!important}

}

}

 .serveSideBtn{bottom:calc(18px + var(--safe-bottom))!important}

/* v61: reachable bottom controls */
#playResetWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(58px + var(--safe-bottom));display:flex;align-items:center;gap:12px;pointer-events:auto;z-index:50}
#playResetWrap #playBtn,#playResetWrap #resetBtn{position:relative!important;display:block!important;visibility:visible!important;opacity:1!important;flex:0 0 auto;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;width:69px!important;height:27px!important;font-size:11px!important;border:0;border-radius:9px;color:#fff;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.42),0 9px 14px rgba(0,0,0,.30),inset 0 2px 0 rgba(255,255,255,.18);transition:transform .08s ease,box-shadow .08s ease,filter .08s ease}
#playResetWrap #playBtn{background:#35637f}

@media(orientation:landscape) and (max-height:360px){#playResetWrap{bottom:calc(64px + var(--safe-bottom))!important}#playResetWrap #playBtn,#playResetWrap #resetBtn{width:51px!important;height:21px!important;font-size:9px!important}.serveSideBtn{width:92px;height:23px;font-size:9px}.serveArrow{font-size:14px}}

</style>

<body>
<canvas id="game"></canvas>
<div id="canvasRecovery" style="display:none;position:absolute;left:8px;top:34px;z-index:40;font:700 8px Arial;color:#ffd86a;pointer-events:none">CANVAS RECOVERY</div>
<div id="rotateGuard">Rotate your mobile device to landscape</div>
<div id="announcement" style="display:none;position:fixed;z-index:50;left:50%;top:43%;transform:translate(-50%,-50%);
 min-width:300px;padding:18px 24px;border-radius:16px;background:rgba(4,10,16,.94);border:2px solid #ffd86a;
 box-shadow:0 0 28px rgba(255,216,106,.28);text-align:center;color:white;font:800 22px Arial;pointer-events:none"></div>
<div id="netFlash" style="display:none;position:fixed;z-index:60;left:50%;top:40%;transform:translate(-50%,-50%);
 padding:24px 48px;border-radius:20px;background:rgba(180,40,40,.22);border:3px solid #ff5050;
 box-shadow:0 0 40px rgba(255,80,80,.45),inset 0 0 30px rgba(255,80,80,.18);
 text-align:center;color:#ff5555;font:900 38px Arial;letter-spacing:.12em;text-shadow:0 0 22px rgba(255,80,80,.7);
 pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)"></div>
<div id="hud">
  <div id="build" style="display:none">BUILD v59 • CPU SHOULDER 0.50 + COMPACT HUD • RIGHT-HANDED PLAYERS</div>
  <div id="status" style="display:none">BOOTING v14</div>
  <div id="renderDiag" style="display:none">RENDER: WAITING</div>

  <div id="score" class="panel" style="width:365px">
    <div class="row"><span>HUMANOID <span id="cScore">00</span></span><span>HUMAN <span id="pScore">00</span></span></div>
    <div class="rally">
      GAMES <span id="cSets">0</span>–<span id="pSets">0</span> &nbsp; • &nbsp;
      GAME <span id="setNo">1</span> &nbsp; • &nbsp; RALLY <span id="rally">00</span>
    </div>
    <div class="rally" style="color:#dce9ef">
      POINTS <span id="setPointScore">00–00</span> &nbsp; • &nbsp; BEST OF 5
    </div>
    <div aria-hidden="true" style="display:none">
      <span id="serverText">HUMAN</span>
      <span id="servesLeft">2</span>
      <span id="matchText">FIRST TO 3 GAMES</span>
    </div>
  </div>

  <button id="autoBtn">AUTO MODE: OFF</button>
  <button id="audioBtn" aria-label="audio"></button>
  <button id="tipBtn" aria-label="pro tip"></button>
  <div id="tip" class="panel" role="dialog" aria-label="Pro Tips"></div>


  <div id="playResetWrap">
  <button id="playBtn">PLAY</button>
  <button id="resetBtn">RESET</button>
  </div>
  <button id="cpuServeBtn" class="serveSideBtn"><span class="serveArrow">➡</span> HUMANOID</button>
  <button id="humanServeBtn" class="serveSideBtn"><span class="serveArrow">⬅</span> HUMAN</button>

  <div id="speedWrap">
    <span id="speedLabel">BALL SPEED 50% • SLOW ← → FAST</span>
    <input id="speed" type="range" min="0" max="100" value="50"/>
  </div>

  <div id="serveHint" aria-hidden="true"></div>

  <div id="strokeBar">
    <button class="stroke active" data-stroke="forehand">FH</button>
    <button class="stroke" data-stroke="backhand">BH</button>
    <button class="stroke" data-stroke="topspin">TOP</button>
    <button class="stroke" data-stroke="slice">SLICE</button>
    <button class="stroke" data-stroke="smash">SMASH</button>
  </div>
</div>

<script>
'use strict';
(function(){
 const V='20260902-23';
 try{
  const u=new URL(location.href);
  if(u.searchParams.get('v')!==V){
   u.searchParams.set('v',V);
   location.replace(u.toString());
   return;
  }
 }catch(_){}
})();

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
window.addEventListener('message',e=>{
 if(e.data&&e.data.type==='supabase-creds'){
  window.__SUPABASE_URL__=e.data.url||'';
  window.__SUPABASE_ANON_KEY__=e.data.key||'';
 }
});
window.addEventListener('error',e=>{
 const rd=$('renderDiag');
 const st=$('status');
 if(rd){rd.style.display='block';rd.textContent='RUNTIME: '+(e.message||'error');rd.style.color='#ff6b6b';}
 if(st){st.style.display='block';st.textContent='SCRIPT ERROR';st.style.color='#ff6b6b';}
});


function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function dist3(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)}
function detectDevice(){
  const ua=navigator.userAgent||'';
  const mobile=/iPhone|iPad|iPod|Android|Mobile/i.test(ua)||(navigator.userAgentData&&navigator.userAgentData.mobile===true);
  document.body.classList.toggle('mobile-device',!!mobile);
  document.body.classList.toggle('portrait',!!mobile&&innerHeight>innerWidth);
}
function viewportSize(){
 const vv=window.visualViewport;
 const w=Math.max(320,Math.round(vv&&vv.width?vv.width:document.documentElement.clientWidth||innerWidth));
 const h=Math.max(240,Math.round(vv&&vv.height?vv.height:document.documentElement.clientHeight||innerHeight));
 return{w,h};
}
function resize(){
 const {w,h}=viewportSize();
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(w*dpr));
 canvas.height=Math.max(1,Math.round(h*dpr));
 canvas.style.width=w+'px';

function updateDynamicTactic(){
 S.tactic.exchange++;

 // Change direction every 1–2 returns.
 if(S.tactic.exchange-S.tactic.lastSwitch >= (1+Math.floor(Math.random()*2))){
   S.tactic.lastSwitch=S.tactic.exchange;
   S.tactic.angleBias*=-1;

   // Alternate short/deep pressure and lateral attack.
   S.tactic.depthBias=(Math.random()*.36-.18);
   S.tactic.lateralBias=S.tactic.angleBias*(.12+Math.random()*.20);
   S.tactic.aggression=.45+Math.random()*.45;
 }
}

function movementTargetForShot(actor,recvPoint,stroke){
 const side=actor.homeX>0?'human':'cpu';
 const towardTable=side==='human'?-1:1;

 const depth=Math.abs(recvPoint.x);
 const shortBall=clamp((1.55-depth)/.55,0,1);
 const deepBall=clamp((depth-1.35)/.50,0,1);

 // Ball-speed-driven aggression.
 const speedAgg=clamp(S.speed,0,1);
 const shotAgg=stroke==='smash'?1:stroke==='topspin'?.78:stroke==='slice'?.55:.62;

 let forward=shortBall*(.18+.30*speedAgg+.12*shotAgg);
 let retreat=deepBall*(.12+.24*speedAgg+.06*shotAgg);

 if(stroke==='smash')forward+=.12+.10*speedAgg;
 if(stroke==='slice')forward+=.04;
 if(stroke==='topspin')retreat+=.04+.06*speedAgg;

 let x=actor.homeX+towardTable*(forward-retreat);

 // More lateral footwork at fast speed and wide trajectories.
 const lateralGain=1.02+.38*speedAgg+.20*shotAgg;
 let z=clamp(
   recvPoint.z*lateralGain + S.tactic.lateralBias*.42,
   -.64,.64
 );

 // hard no-step zone outside table
 const _mh=mobileHomeX();
 if(side==='human')x=clamp(x,_mh-0.16,_mh+0.08);
 else x=clamp(x,-(_mh+0.08),-(_mh-0.16));

 return{x,z};
}

// 6 slots, each exactly 5 seconds:
// 3 seconds active demonstration + 2 seconds transition.
// Slow TOP/SLICE/SMASH, then fast TOP/SLICE/SMASH.
function startAutoDemo(){
 stopAutoDemo();
 const token=(S.autoDemo?.token||0)+1;
 S.autoDemo={active:true,token,slot:0,transition:false,stroke:'topspin',mode:'VERY SLOW'};
 const slots=[
   {stroke:'topspin',speed:.04,mode:'VERY SLOW'},
   {stroke:'slice', speed:.04,mode:'VERY SLOW'},
   {stroke:'smash', speed:.04,mode:'VERY SLOW'},
   {stroke:'topspin',speed:.98,mode:'VERY FAST'},
   {stroke:'slice', speed:.98,mode:'VERY FAST'},
   {stroke:'smash', speed:.98,mode:'VERY FAST'}
 ];

 const runSlot=()=>{
   if(!S.auto||!S.autoDemo?.active||S.autoDemo.token!==token)return;
   const q=slots[S.autoDemo.slot%slots.length];
   S.autoDemo.stroke=q.stroke;
   S.autoDemo.mode=q.mode;
   S.autoDemo.transition=false;
   S.stroke=q.stroke;
   S.speed=q.speed;
   $('speed').value=Math.round(q.speed*100);
   applySelectedPaddlePreset();
   ui();
   announce('AUTO • '+q.mode+' • '+autoDemoStrokeName(q.stroke),'3 SEC DEMO',900);

   // Ensure an auto rally is actually running.
   if(!S.shot&&!S.pointLocked)scheduleCurrentServe(80);

   setTimeout(()=>{
     if(!S.auto||!S.autoDemo?.active||S.autoDemo.token!==token)return;
     S.autoDemo.transition=true;
     S.phase='auto transition';
     $('serveHint').textContent='AUTO • 2 SEC TRANSITION • NEXT ROUTINE IN 5-SECOND CYCLE';
     ui();
   },3000);

   setTimeout(()=>{
     if(!S.auto||!S.autoDemo?.active||S.autoDemo.token!==token)return;
     S.autoDemo.slot=(S.autoDemo.slot+1)%slots.length;
     runSlot();
   },5000);
 };
 runSlot();
}

function scheduleCurrentServe(delay=280){
 const token=++S.serveToken;
 computeServer();
 setTimeout(()=>{
   if(token!==S.serveToken||S.matchOver||!S.playing||S.shot||S.pointLocked)return;
   computeServer();

   // v53 fix: previous scheduler stopped here and never launched the serve.
   let stroke=S.autoDemo?.active ? S.autoDemo.stroke : S.stroke;
   if(!stroke)stroke='forehand';

   if(S.auto){
     launchServe(S.server,stroke);
   }else if(S.server==='cpu'){
     launchServe('cpu',chooseCPUStroke());
   }
   ui();
 },delay);
}


function computeServer(){
 const oldServer=S.server;

 if(S.p>=10&&S.c>=10){
   // Deuce: one serve each.
   S.servicePair=S.pointIndex-20;
   S.servicePoint=0;
   const flip=S.servicePair&1;
   S.server=flip?otherSide(S.gameStartServer):S.gameStartServer;
 }else{
   // Normal play: exactly two completed points per service pair.
   S.servicePair=Math.floor(S.pointIndex/2);
   S.servicePoint=S.pointIndex%2;
   const flip=S.servicePair&1;
   S.server=flip?otherSide(S.gameStartServer):S.gameStartServer;
 }

 if(oldServer!==S.server){
   serveBtnFlash();
   announce(
     (S.server==='human'?'HUMAN':'HUMANOID')+' TO SERVE',
     S.p>=10&&S.c>=10?'ONE SERVE AT DEUCE':'TWO SERVES',
     900
   );
 }
}

function chooseBalancedRallyWinner(){
 // Keep the match competitive. The trailing side gets a recovery bias.
 const pointGap=S.p-S.c;
 const gameGap=S.hGames-S.cGames;
 let humanChance=.52;
 if(pointGap<=-2)humanChance=.68;
 else if(pointGap>=2)humanChance=.38;
 if(gameGap<0)humanChance=Math.max(humanChance,.62);
 else if(gameGap>0)humanChance=Math.min(humanChance,.44);
 return Math.random()<humanChance?'human':'cpu';
}

function beginRallyPlan(){

}

function finishGame(side){
 const wasPlaying=S.playing;
 if(side==='human')S.hGames++; else S.cGames++;
 S.playing=false;S.shot=null;S.phase='game over';
 const label=side==='human'?'HUMAN':'HUMANOID';
 announce(label+' WINS GAME '+S.gameNumber, 'Games '+S.cGames+'–'+S.hGames+' • Set score reset to 0–0',1600);

 if((side==='human'?S.hGames:S.cGames)>=S.gamesToWin){
   S.matchOver=true;S.matchWinner=side;S.p=0;S.c=0;S.rally=0;
   S.server=S.gameStartServer;
   ui();
   submitMatchScore(side);
   setTimeout(()=>announce(label+' WINS THE MATCH',
     'Final games: HUMANOID '+S.cGames+' – HUMAN '+S.hGames+' • Press RESET for a new match',5000),1650);
   return;
 }
 setTimeout(()=>startNextGame(wasPlaying),1700);
}

function submitMatchScore(winner){
 try{
  const url=(window.__SUPABASE_URL__||'')+'/functions/v1/submit-score';
  const key=window.__SUPABASE_ANON_KEY__||'';
  if(!url||!key)return;
  const score=(winner==='human'?S.hGames:S.cGames)*1000+S.rally*10;
  fetch(url,{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
   body:JSON.stringify({
    category:'table-tennis',
    finishTime:Math.max(1,Math.round((performance.now()-(S.matchStart||performance.now()))/1000)),
    score:score,
    playerTag:winner==='human'?'Human':'Humanoid'
   })
  }).catch(function(){});
 }catch(_){}
}

}

function ensureAudio(){
 if(!S.audioCtx)S.audioCtx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
 if(S.audioCtx.state==='suspended')S.audioCtx.resume();
}
function tone(f,d,g=.08,type='sine',delay=0){
 if(!S.audio)return;ensureAudio();const a=S.audioCtx,t=a.currentTime+delay,o=a.createOscillator(),v=a.createGain();
 o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d);
}
function grunt(side,stroke){
 if(!S.audio)return;ensureAudio();
 const base=side==='human'?122:106,amp=stroke==='smash'?.075:.045,dur=stroke==='smash'?.18:.12;
 tone(base,dur,amp,'sawtooth',0);tone(base*1.75,dur*.82,amp*.35,'triangle',.005);tone(72,.07,amp*.42,'sine',0);
}
function hitSound(side,stroke){tone(1550,.042,.11,'sine');tone(3000,.022,.035,'sine');grunt(side,stroke)}

const CAM={pos:{x:0,y:4.40,z:6.00},target:{x:0,y:.70,z:0},focal:1.38};
function isMobileLandscape(){return innerWidth>innerHeight&&Math.min(innerWidth,innerHeight)<=500;}
function mobileCam(){

const PLAYER_HEIGHT_SCALE=2.063;

function vsub(a,b){return{x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}}
function vdot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}
function vcross(a,b){return{x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}}
function vnorm(a){const n=Math.hypot(a.x,a.y,a.z)||1;return{x:a.x/n,y:a.y/n,z:a.z/n}}
function cameraBasis(){const cm=mobileCam()||CAM;const f=vnorm(vsub(cm.target,cm.pos)),up={x:0,y:1,z:0},r=vnorm(vcross(f,up)),u=vcross(r,f);return{f,r,u}}
function project(p){
 const cm=mobileCam()||CAM;
 const B=cameraBasis(),q=vsub(p,cm.pos),depth=vdot(q,B.f),sx=vdot(q,B.r),sy=vdot(q,B.u),f=Math.min(innerWidth,innerHeight)*cm.focal,s=f/Math.max(.25,depth);
 return{x:innerWidth/2+sx*s,y:innerHeight*.485-sy*s,s};
}

function line(a,b,c='#dfe7ee',lw=4){const A=project(a),B=project(b);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}
function poly(P,fill,stroke='#fff',lw=2){P=P.map(project);ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(P[0].x,P[0].y);for(let i=1;i<P.length;i++)ctx.lineTo(P[i].x,P[i].y);ctx.closePath();ctx.fill();ctx.stroke()}
function circ(p,r,c){const P=project(p);ctx.fillStyle=c;ctx.beginPath();ctx.arc(P.x,P.y,Math.max(2,r*P.s),0,Math.PI*2);ctx.fill()}

function drawTable(){
 const y=.82,hx=isMobileLandscape()?1.78:1.37,hz=isMobileLandscape()?.88:.7625,e=.745;
 /* UNDERCARRIAGE FIRST: prevents frame from covering the playing surface. */
 for(const [x,z] of [[-.92,-.52],[-.92,.52],[.92,-.52],[.92,.52]])line({x,y:e,z},{x,y:.06,z},'#3b4349',9);
 line({x:-.92,y:.26,z:-.52},{x:.92,y:.26,z:-.52},'#454d53',6);
 line({x:-.92,y:.26,z:.52},{x:.92,y:.26,z:.52},'#454d53',6);

 const A={x:-hx,y,z:-hz},B={x:hx,y,z:-hz},C={x:hx,y,z:hz},D={x:-hx,y,z:hz};
 /* aprons */
 poly([{x:-hx,y,z:hz},{x:hx,y,z:hz},{x:hx,y:e,z:hz},{x:-hx,y:e,z:hz}],'#0b1115','#252d34',1);
 poly([{x:-hx,y,z:-hz},{x:hx,y,z:-hz},{x:hx,y:e,z:-hz},{x:-hx,y:e,z:-hz}],'#171d22','#252d34',1);
 poly([{x:-hx,y,z:-hz},{x:-hx,y,z:hz},{x:-hx,y:e,z:hz},{x:-hx,y:e,z:-hz}],'#11171c','#252d34',1);
 poly([{x:hx,y,z:-hz},{x:hx,y,z:hz},{x:hx,y:e,z:hz},{x:hx,y:e,z:-hz}],'#11171c','#252d34',1);

 /* tabletop LAST: full green surface is never occluded */
 poly([A,B,C,D],'#1f8a46','#ffffff',3);
 line(A,B,'#fff',3);line(B,C,'#fff',3);line(C,D,'#fff',3);line(D,A,'#fff',3);
 line({x:-hx,y:y+.004,z:0},{x:hx,y:y+.004,z:0},'#fff',2);

 /* net on top */
 const nt=y+.1525;
 for(let i=0;i<=16;i++){let z=-hz+i*(2*hz/16);line({x:0,y,z},{x:0,y:nt,z},'#d9e1e5',1)}

function baseTarget(actor,recvPoint,stroke,dt){
 const tgt=movementTargetForShot(actor,recvPoint,stroke);

 const speedAgg=clamp(S.speed,0,1);
 const gain=(stroke==='smash'?17:11)+8*speedAgg;
 const a=Math.min(1,gain*dt);

 const ox=actor.baseX,oz=actor.baseZ;
 actor.baseX=lerp(actor.baseX,tgt.x,a);
 actor.baseZ=lerp(actor.baseZ,tgt.z,a);

 const _h=Math.abs(actor.homeX);
 if(actor.homeX>0)actor.baseX=clamp(actor.baseX,_h-0.13,_h+0.13);
 else actor.baseX=clamp(actor.baseX,-(_h+0.13),-(_h-0.13));

 actor.baseZ=clamp(actor.baseZ,-.66,.66);
 actor.move=Math.hypot(actor.baseX-ox,actor.baseZ-oz)/Math.max(dt,.001);

 // expose footwork direction for body tilt
 actor.stepVX=(actor.baseX-ox)/Math.max(dt,.001);
 actor.stepVZ=(actor.baseZ-oz)/Math.max(dt,.001);
}
function handReady(actor,recvPoint,stroke,phaseU,dt){
 // CPU autonomously changes paddle face according to incoming shot.
 if(actor===S.cpu){
   const p=profiles[stroke];
   actor.paddle.pitch=lerp(actor.paddle.pitch,stroke==='slice'?.28:stroke==='topspin'?-.24:stroke==='smash'?-.08:-.12,Math.min(1,10*dt));
   actor.paddle.yaw=lerp(actor.paddle.yaw,clamp(recvPoint.z*.45,-.35,.35),Math.min(1,10*dt));
 }

 const side=actor.homeX>0?'human':'cpu';
 const toward=side==='human'?-1:1;
 let x=actor.baseX+toward*.38,z=actor.baseZ,y=1.14;
 if(phaseU<.55){
   const q=ease(phaseU/.55);
   /* visible backswing in 3D */
   x=lerp(x,actor.baseX-toward*(stroke==='smash'?.20:.10),q);
   z=lerp(z,actor.baseZ+(stroke==='backhand'?-.30:.26),q);
   y=lerp(y,stroke==='smash'?1.52:1.22,q);
 }else{
   const q=ease((phaseU-.55)/.45);
   x=lerp(actor.baseX-toward*(stroke==='smash'?.20:.10),recvPoint.x,q);
   z=lerp(actor.baseZ+(stroke==='backhand'?-.30:.26),recvPoint.z,q);
   y=lerp(stroke==='smash'?1.52:1.22,recvPoint.y-.07,q);
 }
 const a=Math.min(1,22*dt);
 actor.hand.x=lerp(actor.hand.x,x,a);actor.hand.y=lerp(actor.hand.y,y,a);actor.hand.z=lerp(actor.hand.z,z,a);
}
function followThrough(actor,stroke,u,dt){
 const side=actor.homeX>0?'human':'cpu',toward=side==='human'?-1:1,p=profiles[stroke];
 if(u>.34)return;
 const q=ease(u/.34),x=actor.baseX+toward*(stroke==='smash'?.62:.48),y=stroke==='topspin'?1.48:stroke==='slice'?.96:stroke==='smash'?.92:1.24,z=actor.baseZ+(stroke==='backhand'?-.22:.18);
 const a=Math.min(1,18*dt);actor.hand.x=lerp(actor.hand.x,x,a);actor.hand.y=lerp(actor.hand.y,y,a);actor.hand.z=lerp(actor.hand.z,z,a);
}
function rotX(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x,y:p.y*c-p.z*s,z:p.y*s+p.z*c}}
function rotY(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c+p.z*s,y:p.y,z:-p.x*s+p.z*c}}
function rotZ(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c-p.y*s,y:p.x*s+p.y*c,z:p.z}}


function vadd(a,b){return{x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}}
function vscale(a,s){return{x:a.x*s,y:a.y*s,z:a.z*s}}
function vlen(a){return Math.hypot(a.x,a.y,a.z)||1}
function vunit(a){const n=vlen(a);return{x:a.x/n,y:a.y/n,z:a.z/n}}
function vcross3(a,b){return{x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}}
function vdot3(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}

function humanPaddlePresetAngles(){
 if(S.stroke==='topspin') return {pitch:.20,yaw:0,roll:0};
 if(S.stroke==='slice') return {pitch:-.12,yaw:0,roll:0};
 if(S.stroke==='smash') return {pitch:-.04,yaw:0,roll:0};
 if(S.stroke==='backhand') return {pitch:.01,yaw:-.06,roll:0};
 return {pitch:.02,yaw:.05,roll:0};
}

function applySelectedPaddlePreset(){
 if(!S.human||!S.human.paddle)return;

 if(S.setupPaddle&&S.setupPaddle.locked){
   S.human.paddle.pitch=S.setupPaddle.pitch;
   S.human.paddle.yaw=S.setupPaddle.yaw;
   S.human.paddle.roll=S.setupPaddle.roll;
   return;
 }

 // Before SERVE, preserve the user's freely adjusted setup.

 const stroke=S.faceLocked?S.lockedStroke:S.stroke;
 const p=lockedPaddleAnglesForStroke(stroke);
 S.human.paddle.pitch=p.pitch;
 S.human.paddle.yaw=p.yaw;

function paddleBasis(cpu,angles){
 angles=angles||{pitch:0,yaw:0,roll:0};
 const dir=cpu?1:-1;
 const pitch=clamp(angles.pitch,-.30,.30);
 const yaw=clamp(angles.yaw,-.22,.22);

 const normal=vunit({
   x:dir*Math.cos(pitch)*Math.cos(yaw),
   y:Math.sin(pitch),
   z:Math.sin(yaw)*Math.cos(pitch)
 });

 const worldUp={x:0,y:1,z:0};
 const upDot=vdot3(worldUp,normal);
 const vertical=vunit({
   x:-normal.x*upDot,
   y:1-normal.y*upDot,
   z:-normal.z*upDot
 });
 const horizontal=vunit(vcross3(normal,vertical));
 return{normal,vertical,horizontal};
}

function paddleBladeCenter(hand,cpu,angles){
 const B=paddleBasis(cpu,angles);
 const along=(cpu?.13:-.13)*PADDLE_SCALE;
 return vadd(hand,vadd(vscale(B.normal,along),vscale(B.vertical,.13*PADDLE_SCALE)));
}

function worldToPaddleLocal(world,hand,cpu,angles){
 const B=paddleBasis(cpu,angles);
 const center=paddleBladeCenter(hand,cpu,angles);
 const d={x:world.x-center.x,y:world.y-center.y,z:world.z-center.z};
 return{x:vdot3(d,B.normal),y:vdot3(d,B.vertical),z:vdot3(d,B.horizontal)};
}

function ballTouchesPaddle(ball,hand,cpu,angles){
 const q=worldToPaddleLocal(ball,hand,cpu,angles);
 const ballR=ball.r||.026;
 const planeTol=ballR+.008;
 const ry=.125*PADDLE_SCALE+ballR*.55;
 const rz=.085*PADDLE_SCALE+ballR*.55;
 const ellipse=(q.y*q.y)/(ry*ry)+(q.z*q.z)/(rz*rz);
 return{hit:Math.abs(q.x)<=planeTol&&ellipse<=1,plane:Math.abs(q.x),ellipse,local:q};
}

function desiredHandForBladeContact(ball,cpu,angles){
 const B=paddleBasis(cpu,angles);
 const along=(cpu?.13:-.13)*PADDLE_SCALE;
 const offset=vadd(vscale(B.normal,along),vscale(B.vertical,.13*PADDLE_SCALE));
 return{x:ball.x-offset.x,y:ball.y-offset.y,z:ball.z-offset.z};
}


function humanPaddleArrowGeometry(){
 const hand=S.human.hand,angles=S.human.paddle||{pitch:0,yaw:0,roll:0};
 const B=paddleBasis(false,angles);
 const center=paddleBladeCenter(hand,false,angles);

 // Narrow double-direction orientation arrow lies across the blade's local vertical axis.
 const a=vadd(center,vscale(B.vertical,-.070));
 const b=vadd(center,vscale(B.vertical,.070));
 return{a,b,center,B};
}

function drawHumanPaddle3DArrow(){
 if(!S.human||!S.human.hand)return;
 const G=humanPaddleArrowGeometry();
 const A=project(G.a),B=project(G.b);
 const dx=B.x-A.x,dy=B.y-A.y,n=Math.hypot(dx,dy)||1,ux=dx/n,uy=dy/n;
 const px=-uy,py=ux;

 ctx.save();
 ctx.strokeStyle='#64e9ff';
 ctx.fillStyle='#64e9ff';
 ctx.lineWidth=1.35;
 ctx.globalAlpha=.95;

 // Very narrow shaft.
 ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();

 // Small arrowhead at both ends to indicate free 3D orientation.
 for(const [P,s] of [[B,1],[A,-1]]){
   ctx.beginPath();
   ctx.moveTo(P.x,P.y);
   ctx.lineTo(P.x-ux*s*7+px*2.5,P.y-uy*s*7+py*2.5);
   ctx.lineTo(P.x-ux*s*7-px*2.5,P.y-uy*s*7-py*2.5);
   ctx.closePath();ctx.fill();
 }
 ctx.restore();
}

const PADDLE_SCALE=1.10;

function computeArmElbow(actor,cpu){
 const x=actor.baseX,z=actor.baseZ;
 const sh={x:x+(cpu?.02:-.02),y:1.46,z:z+(cpu?-.18:.18)};
 const wrist=actor.hand;

 const upperLen=.33,foreLen=.34;
 const dx=wrist.x-sh.x,dy=wrist.y-sh.y,dz=wrist.z-sh.z;
 const d=Math.max(.10,Math.min(upperLen+foreLen-.01,Math.hypot(dx,dy,dz)));
 const ux=dx/d,uy=dy/d,uz=dz/d;
 const cosA=clamp((upperLen*upperLen+d*d-foreLen*foreLen)/(2*upperLen*d),-1,1);
 const along=upperLen*cosA;
 const bend=Math.sqrt(Math.max(0,upperLen*upperLen-along*along));

 let px=-uz,py=.28,pz=ux;
 const pn=Math.hypot(px,py,pz)||1;
 px/=pn;py/=pn;pz/=pn;
 const bendSign=cpu?-1:1;

 return{
   shoulder:sh,
   elbow:{
     x:sh.x+ux*along+px*bend*bendSign,
     y:sh.y+uy*along+py*bend,
     z:sh.z+uz*along+pz*bend*bendSign
   },
   wrist
 };
}

function pointSegmentDistance(px,py,ax,ay,bx,by){
 const vx=bx-ax,vy=by-ay;
 const wx=px-ax,wy=py-ay;
 const vv=vx*vx+vy*vy;
 let t=vv>1e-9?(wx*vx+wy*vy)/vv:0;
 t=clamp(t,0,1);
 const qx=ax+t*vx,qy=ay+t*vy;
 return Math.hypot(px-qx,py-qy);
}

function humanControlZoneHit(clientX,clientY){
 const arm=computeArmElbow(S.human,false);
 const E=applyPlayerScale(project(arm.elbow),false);
 const W=applyPlayerScale(project(arm.wrist),false);
 const C=applyPlayerScale(project(paddleBladeCenter(S.human.hand,false,S.human.paddle)),false);

 // Local screen-space capsule:
 // elbow radius ~55 px, wrist corridor ~48 px, paddle radius ~82 px.
 const dElbow=Math.hypot(clientX-E.x,clientY-E.y);
 const dPaddle=Math.hypot(clientX-C.x,clientY-C.y);
 const dForearm=pointSegmentDistance(clientX,clientY,E.x,E.y,W.x,W.y);
 const dWristBlade=pointSegmentDistance(clientX,clientY,W.x,W.y,C.x,C.y);

 return dElbow<=60 || dPaddle<=90 || dForearm<=52 || dWristBlade<=64;
}
function playerControlZoneHit(side,clientX,clientY){
 if(side==='human')return humanControlZoneHit(clientX,clientY);
 const arm=computeArmElbow(S.cpu,true);
 const E=applyPlayerScale(project(arm.elbow),true),W=applyPlayerScale(project(arm.wrist),true);
 const C=applyPlayerScale(project(paddleBladeCenter(S.cpu.hand,true,S.cpu.paddle)),true);
 return Math.hypot(clientX-E.x,clientY-E.y)<=60 ||
        Math.hypot(clientX-C.x,clientY-C.y)<=90 ||
        pointSegmentDistance(clientX,clientY,E.x,E.y,W.x,W.y)<=52 ||
        pointSegmentDistance(clientX,clientY,W.x,W.y,C.x,C.y)<=64;
}


function updateSpineDynamics(actor,cpu,dt){
 const side=cpu?'cpu':'human';
 let target=.15,twist=0;
 if(!cpu&&S.manualPaddle.drag&&S.playing&&!S.auto){target=clamp(actor.spine.targetLean,.03,.34);twist=clamp(actor.spine.targetTwist,-.12,.12);}

 if(S.serve.armed&&S.serve.side===side){
   target=.17;
   if(S.serve.backswing)target=.11;
   if(S.serve.forward)target=.24;
 }
 if(S.shot){
   if(S.shot.hitter===side){
     target=S.shot.stroke==='smash'?.30:S.shot.stroke==='slice'?.21:.18;
     twist=(S.shot.stroke==='backhand'?-1:1)*.075;
   }else if(S.shot.receiver===side){
     target=.18;
     twist=clamp(S.shot.end.z*.075,-.075,.075);
   }
 }
 const speedAgg=clamp(S.speed,0,1);
 const motionLean=clamp(Math.abs(actor.stepVX||0)*.018,0,.12)*speedAgg;
 const lateralTilt=clamp((actor.stepVZ||0)*.016,-.10,.10)*speedAgg;

 actor.spine.targetLean=clamp(target+motionLean,.03,.36);
 actor.spine.targetTwist=clamp(twist+lateralTilt,-.14,.14);
 const g=Math.min(1,7.2*dt);
 actor.spine.lean=lerp(actor.spine.lean,target,g);
 actor.spine.twist=lerp(actor.spine.twist,twist,g);
}
function spineJoints(actor){
 const J=[];
 const rig=actor.rig||{bodyYaw:0,bodyLift:0,bodyBend:0};
 const x=actor.baseX,z=actor.baseZ;
 const lift=rig.bodyLift||0;
 const lean=clamp((actor.spine?.lean||.095)+(rig.bodyBend||0),-.12,.46);
 const twist=actor.spine?.twist||0;
 const towardTable=actor.homeX>0?-1:1;
 const yaw=rig.bodyYaw||0;

 const fd=rotXZ(towardTable,0,yaw);

 for(let i=0;i<7;i++){
   const t=i/6;
   const curve=t*t*(1.85-.85*t);
   const lateral=twist*Math.sin(Math.PI*t);
   const lat=rotXZ(0,lateral,yaw);
   J.push({
     x:x+fd.x*lean*curve+lat.x,
     y:.92+lift+t*.64,
     z:z+fd.z*lean*curve+lat.z
   });
 }
 return J;
}
function drawSpine(actor){
 // Hidden biomechanical rig: calculate joints but do not display bones.
 return spineJoints(actor);
}


function updateLegDynamics(actor,cpu,dt){
 const side=cpu?'cpu':'human';
 let flex=.24,stance=.21;
 if(!cpu&&S.manualPaddle.drag&&S.playing&&!S.auto){flex=clamp(actor.legs.targetFlex,.16,.40);stance=clamp(actor.legs.targetStance||.21,.18,.28);}

 if(S.serve.armed&&S.serve.side===side){
   flex=.28;
   if(S.serve.backswing)flex=.30;
   if(S.serve.forward)flex=.34;
   stance=.22;
 }
 if(S.shot){
   if(S.shot.hitter===side){
     flex=S.shot.stroke==='smash'?.38:S.shot.stroke==='slice'?.30:.26;
     stance=S.shot.stroke==='smash'?.24:.22;
   }else if(S.shot.receiver===side){
     flex=.28;stance=.23;
   }
 }
 const speedAgg=clamp(S.speed,0,1);
 const moveBoost=clamp(Math.hypot(actor.stepVX||0,actor.stepVZ||0)*.02,0,.12)*speedAgg;
 actor.legs.targetFlex=clamp(flex+moveBoost,.16,.42);
 actor.legs.targetStance=clamp(stance+.04*speedAgg,.18,.28);
 const g=Math.min(1,8.5*dt);
 actor.legs.kneeFlex=lerp(actor.legs.kneeFlex,flex,g);
 actor.legs.stance=lerp(actor.legs.stance,stance,g);
}

function solveLeg2D(hip,foot,kneeFlex,sideSign){
 const thigh=.39,shin=.41;
 const dx=foot.x-hip.x,dy=foot.y-hip.y;
 const dRaw=Math.hypot(dx,dy);
 const d=clamp(dRaw,.10,thigh+shin-.015);
 const ux=dx/d,uy=dy/d;

 const cosA=clamp((thigh*thigh+d*d-shin*shin)/(2*thigh*d),-1,1);
 const along=thigh*cosA;
 const h=Math.sqrt(Math.max(0,thigh*thigh-along*along));

 const px=-uy,py=ux;
 const flexScale=.66+.58*kneeFlex;

 return{
   x:hip.x+ux*along+px*h*sideSign*flexScale,
   y:hip.y+uy*along+py*h*sideSign*flexScale,
   z:lerp(hip.z,foot.z,.48)
 };
}

function lowerBodyPose(actor,pelvis,cpu){

 const A=skeletonAnchors(actor,cpu),sk=actor.skel,lo=actor.rig?.footLOffset||{x:0,z:0},ro=actor.rig?.footROffset||{x:0,z:0};
 const flex=actor.legs?.kneeFlex||.17;
 const t=cpu?1:-1;
 const side=cpu?'cpu':'human';

 // Left foot stays planted. Right (paddle-side) foot steps back firmly during shots.
 let rBackTarget=0;
 if(!(S.serve&&S.serve.armed&&S.serve.side===side)&&S.shot){
   if(S.shot.hitter===side||S.shot.receiver===side){
     rBackTarget=-t*.15;
   }
 }
 const rBackKey=cpu?'_rBackX_cpu':'_rBackX_human';
 if(actor[rBackKey]===undefined)actor[rBackKey]=0;
 actor[rBackKey]=lerp(actor[rBackKey],rBackTarget,Math.min(1,.18));
 const rBackX=actor[rBackKey];

 const lf0=baseFootTarget(actor,cpu,'left'),rf0=baseFootTarget(actor,cpu,'right');
 const lf={x:lf0.x+lo.x,y:lf0.y,z:lf0.z+lo.z};
 const rf={x:rf0.x+ro.x+rBackX,y:rf0.y,z:rf0.z+ro.z};
 const L=solveTwoBone3D(A.leftHip,lf,sk.thigh,sk.shin,{x:A.leftHip.x+t*.20,y:A.leftHip.y-.22,z:A.leftHip.z-.16-flex*.10});
 const R=solveTwoBone3D(A.rightHip,rf,sk.thigh,sk.shin,{x:A.rightHip.x+t*.20,y:A.rightHip.y-.22,z:A.rightHip.z+.16+flex*.10});
 return{hipL:A.leftHip,hipR:A.rightHip,kneeL:L.joint,kneeR:R.joint,footL:L.end,footR:R.end};
}


function capsulePoly(a,b,rA,rB,steps=5){
 // Camera-facing tapered quadrilateral/capsule approximation.
 const A=project(a),B=project(b);
 const dx=B.x-A.x,dy=B.y-A.y;
 const n=Math.hypot(dx,dy)||1;
 const nx=-dy/n,ny=dx/n;

 return[
   {x:A.x+nx*rA,y:A.y+ny*rA},
   {x:B.x+nx*rB,y:B.y+ny*rB},
   {x:B.x-nx*rB,y:B.y-ny*rB},
   {x:A.x-nx*rA,y:A.y-ny*rA}
 ];
}

 ctx.closePath();
 ctx.fillStyle=fill;
 ctx.fill();
 if(stroke){

function faceScreenDirection(head,cpu){
 if(!S.playing&&S.resetIntro?.active){
   // straight toward spectator camera at RESET/ready-bow stage
   return{x:0,y:0};

 const other=cpu?S.human:S.cpu;

 if(S.playing&&S.ball&&S.shot){
   target={
     x:lerp(target.x,S.ball.x,.72),

   };
 }
 const H=project(head),T=project(target);

 return{x:dx/n,y:dy/n};
}

function drawFace(head,cpu,bodyTangent){
 const tracked=trackedHeadPose(head,cpu,bodyTangent);
 const H=project(tracked.center);
 const r=Math.abs(project({x:tracked.center.x,y:tracked.center.y+.118,z:tracked.center.z}).y-H.y);
 const rr=Math.max(16,r);
 const dir=faceScreenDirection(tracked.center,cpu);

 if(cpu){
   // ROBOT HEAD visibly turns by shifting visor/eyes toward its target.
   ctx.save();

   const squash=.88+.12*Math.abs(dir.x);
   ctx.beginPath();
   ctx.ellipse(H.x,H.y,rr*.82*squash,rr*.86,0,0,Math.PI*2);
   ctx.fillStyle='#aeb6bf';
   ctx.fill();
   ctx.strokeStyle='#e5ebef';
   ctx.lineWidth=1.4;
   ctx.stroke();

   const faceShift=dir.x*rr*.24;
   const faceLift=dir.y*rr*.10;

   ctx.beginPath();
   ctx.roundRect(H.x-rr*.50+faceShift,H.y-rr*.30+faceLift,rr*.94,rr*.34,rr*.10);
   ctx.fillStyle='#20252a';
   ctx.fill();

   ctx.shadowBlur=12;
   ctx.shadowColor='#ff2a2a';
   ctx.fillStyle='#ff3a3a';
   for(const s of [-1,1]){
     ctx.beginPath();
     ctx.ellipse(
       H.x+faceShift+s*rr*.20,
       H.y-rr*.13+faceLift,
       rr*.095,rr*.052,0,0,Math.PI*2
     );
     ctx.fill();
   }
   ctx.shadowBlur=0;
   ctx.restore();
   return;
 }

 // HUMAN HEAD. Facial features visibly move to the table/opponent-facing side.
 ctx.beginPath();
 ctx.arc(H.x,H.y,rr,0,Math.PI*2);
 ctx.fillStyle='#e0b28f';
 ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.26)';
 ctx.lineWidth=1.5;
 ctx.stroke();

 const faceShift=dir.x*rr*.25;
 const faceLift=dir.y*rr*.08;
 const eyeY=H.y-rr*.12+faceLift;
 const eyeSep=rr*.26;
 const eyeR=Math.max(2.5,rr*.095);

 // Both eyes sit on the side of the face oriented toward the opponent.
 for(const s of [-1,1]){
   const ex=H.x+faceShift+s*eyeSep;
   ctx.beginPath();
   ctx.arc(ex,eyeY,eyeR,0,Math.PI*2);
   ctx.fillStyle='#fff';
   ctx.fill();

   ctx.beginPath();
   ctx.arc(
     ex+dir.x*eyeR*.58,
     eyeY+dir.y*eyeR*.58,
     eyeR*.50,0,Math.PI*2
   );
   ctx.fillStyle='#17212a';
   ctx.fill();
 }

 // Nose projects toward the opponent.
 ctx.beginPath();
 ctx.moveTo(H.x+faceShift,eyeY+rr*.10);
 ctx.lineTo(
   H.x+faceShift+dir.x*rr*.16,
   eyeY+rr*.18+dir.y*rr*.08
 );
 ctx.strokeStyle='rgba(70,50,40,.60)';
 ctx.lineWidth=1.2;
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(H.x+faceShift-rr*.10,H.y+rr*.24+faceLift);
 ctx.lineTo(H.x+faceShift+rr*.10,H.y+rr*.24+faceLift);
 ctx.stroke();
}

function updateHeadTracking(actor,cpu,dt){
 const J=spineJoints(actor);
 const neck=J[6];
 const other=cpu?S.human:S.cpu;

 // Default visual orientation is always toward the opponent/table.
 let target={x:other.baseX,y:1.30,z:other.baseZ};

 // During a live trajectory, smoothly bias gaze/head toward the ball.
 if(S.playing&&S.ball&&S.shot){
   const ballWeight=.72;
   target={
     x:lerp(target.x,S.ball.x,ballWeight),
     y:lerp(target.y,S.ball.y,ballWeight),
     z:lerp(target.z,S.ball.z,ballWeight)
   };
 }

 const dx=target.x-neck.x;
 const dy=target.y-neck.y;
 const dz=target.z-neck.z;

 actor.headTrack.targetYaw=clamp(Math.atan2(dz,Math.abs(dx)+.001),-.36,.36);
 actor.headTrack.targetPitch=clamp(Math.atan2(dy,Math.abs(dx)+.001),-.26,.26);

 const g=Math.min(1,11.5*dt);
 actor.headTrack.yaw=lerp(actor.headTrack.yaw,actor.headTrack.targetYaw,g);
 actor.headTrack.pitch=lerp(actor.headTrack.pitch,actor.headTrack.targetPitch,g);
}

function trackedHeadCenter(actor,cpu,neck,tangent){
 const ht=actor.headTrack||{yaw:0,pitch:0};
 const towardOpponent=cpu?1:-1;

 const toeFold=(
   !cpu &&
   S.drill &&
   S.drill.active &&
   S.drill.stage===1 &&
   (S.drill.phase==='bend'||S.drill.phase==='downHold')
 );

 if(toeFold){
   // head continues the cervical tangent, staying above shoulders/hands
   return{
     x:neck.x+tangent.x*.13+towardOpponent*.015,
     y:neck.y+tangent.y*.13+.02,
     z:neck.z+tangent.z*.13
   };
 }

 return{
   x:neck.x+tangent.x*.145+towardOpponent*.040,
   y:neck.y+tangent.y*.145+Math.sin(ht.pitch)*.050,
   z:neck.z+tangent.z*.145+Math.sin(ht.yaw)*.060
 };
}


function updateRobotScan(dt){
 const rs=S.robotScan;
 const robotPlaying=!!(
   S.playing &&
   (
     S.server==='cpu' ||
     (S.shot && (S.shot.hitter==='cpu' || S.shot.receiver==='cpu'))
   )
 );

 rs.active=robotPlaying;
 if(!robotPlaying)return;

 rs.phase+=dt*1.9;

 // During robot's attacking phase, bias scan target toward planned bounce.
 if(S.shot && S.shot.hitter==='cpu' && S.shot.bounce){
   rs.targetZ=lerp(rs.targetZ,clamp(S.shot.bounce.z,-.55,.55),Math.min(1,dt*4));
   rs.targetDepth=lerp(rs.targetDepth,clamp(Math.abs(S.shot.bounce.x)/1.37,.38,.96),Math.min(1,dt*4));
 }else{
   // gentle boundary sweep while preparing
   rs.targetZ=Math.sin(rs.phase)*.48;
   rs.targetDepth=.55+.30*(.5+.5*Math.sin(rs.phase*.73));
 }
}

function tableScanTarget(){
 // Convert scan plan into a table-surface world point on the Human court.
 const z=clamp(S.robotScan.targetZ,-.58,.58);
 const x=lerp(.18,1.22,clamp(S.robotScan.targetDepth,0,1));
 return{x,y:.78,z};
}

 ctx.save();

 for(const s of [-1,1]){
   const grad=ctx.createLinearGradient(H.x+s*eyeSpread,H.y,T.x,T.y);
   grad.addColorStop(0,'rgba(255,35,35,.90)');
   grad.addColorStop(.65,'rgba(255,35,35,.35)');
   grad.addColorStop(1,'rgba(255,35,35,.08)');
   ctx.strokeStyle=grad;
   ctx.lineWidth=1.6;
   ctx.beginPath();
   ctx.moveTo(H.x+s*eyeSpread,H.y);
   ctx.lineTo(T.x,T.y);
   ctx.stroke();
 }

 // scan marker on table
 ctx.beginPath();
 ctx.arc(T.x,T.y,10+3*Math.sin(S.robotScan.phase*4),0,Math.PI*2);
 ctx.strokeStyle='rgba(255,55,55,.82)';

 ctx.beginPath();

 ctx.lineWidth=1.3;
 ctx.stroke();

 ctx.restore();
}

   if(!S.humanRally.drag)prepareHumanIntercept();
   const beforeContactShot=S.shot;
   updateContactWindow();
   if(S.shot!==beforeContactShot)return;

   if(S.humanRally.contactGrace>0){
     S.humanRally.contactGrace=Math.max(0,S.humanRally.contactGrace-dt);
   }

   if(u>=1&&!S.pointLocked){
     if(!S.humanRally.contactLatched){
       $('serveHint').textContent='MISSED RETURN • HUMANOID POINT';
       pointTo('cpu');
       return;
     }
     if(S.humanRally.drag&&S.humanRally.contactGrace<=0){
       $('serveHint').textContent='RETURN NOT RELEASED • HUMANOID POINT';
       S.humanRally.contactLatched=false;
       pointTo('cpu');
       return;
     }
   }
   return;
 }

 if(q.phase==='pre'){
   const u=clamp(q.t/q.pre,0,1);
   S.ball=Object.assign(S.ball,shotPoint(q,u));
   S.phase=q.outcome==='net'?'to net':'to bounce';

   if($('bounceName')){if(q.outcome==='net')$('bounceName').textContent='NET';else $('bounceName').textContent=q.receiver.toUpperCase()+' COURT'}

   followThrough(hit,q.stroke,u,dt);

   // Receiver reads apparent trajectory, not hidden spin kick.
   const readTarget=(q.deceptiveSpin&&q.receiver==='cpu')?q.apparentEnd:q.end;

   if(q.receiver==='human'&&!S.auto){
     armHumanRallyControl();
     baseTarget(recv,q.end,q.stroke,dt);
   }else{
     baseTarget(recv,readTarget,q.stroke,dt);
     handReady(recv,readTarget,q.stroke,u*.45,dt);
   }

   if(u>=1){
     // Illegal human/CPU shots resolve immediately at net or off-table landing.
     if(q.outcome==='net'){flashNet();}
     if(q.outcome==='net'||q.outcome==='wide'||q.outcome==='long'){
       pointTo(q.receiver);
       return;
     }

     q.phase='post';
     q.t=0;
     S.phase=q.outcome==='short'?'short bounce':'after bounce';
     bounceSound();
   }
 }else{
   const u=clamp(q.t/q.post,0,1);
   S.ball=Object.assign(S.ball,shotPoint(q,u));
   S.phase=q.deceptiveSpin?'spin kick':'to paddle';

   // CPU commits to the apparent straight line until after bounce,
   // then realizes the sidespin progressively.
   let readTarget=q.end;
   if(q.deceptiveSpin&&q.receiver==='cpu'){
     const deception=clamp((u-.48)/.52,0,1);
     readTarget={
       x:q.end.x,
       y:q.end.y,
       z:lerp(q.apparentEnd.z,q.end.z+(q.spinKick||0),deception)
     };
   }

   if(q.receiver==='human'&&!S.auto){
     armHumanRallyControl();
     baseTarget(recv,q.end,q.stroke,dt);
   }else{
     baseTarget(recv,readTarget,q.stroke,dt);
     handReady(recv,readTarget,q.stroke,.45+.55*u,dt);
   }

   if(u>=1){
     if(q.receiver==='human'&&!S.auto){
       q.phase='humanContact';
       q.t=0;
       q.contactStart={x:q.end.x,y:q.end.y,z:q.end.z};
       q.contactEnd={x:q.end.x+.48,y:q.end.y-.10,z:q.end.z};
       q.contactDuration=1.30*speedFactor();

       S.humanRally.contactElapsed=0;
       S.humanRally.contactGrace=0;
       S.cpuServePending=false;
       S.cpuServeCountdown=0;
       S.humanRally.contactDuration=q.contactDuration;
       armHumanRallyControl();
       return;
     }

     recv.hand={x:q.end.x,y:q.end.y-.07,z:q.end.z};

function vadd3(a,b){return{x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}}
function vsub3(a,b){return{x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}}
function vmul3(a,s){return{x:a.x*s,y:a.y*s,z:a.z*s}}
function vlen3(a){return Math.hypot(a.x,a.y,a.z)}
function vnorm3(a){const n=vlen3(a)||1;return vmul3(a,1/n)}
function vdot3(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}

function clampTargetToReach(root,target,maxReach,minReach=.015){
 const d=vsub3(target,root),n=vlen3(d)||1;
 const rr=clamp(n,minReach,maxReach);

}
function solveTwoBone3D(root,target,L1,L2,pole){
 const end=clampTargetToReach(root,target,L1+L2-.003,Math.abs(L1-L2)+.003);
 const d=vsub3(end,root),dist=Math.max(.0001,vlen3(d)),dir=vnorm3(d);

 pv=vsub3(pv,vmul3(dir,vdot3(pv,dir)));
 if(vlen3(pv)<.001) pv={x:0,y:0,z:1};
 pv=vnorm3(pv);
 const along=(L1*L1-L2*L2+dist*dist)/(2*dist);
 const h=Math.sqrt(Math.max(0,L1*L1-along*along));
 const joint=vadd3(vadd3(root,vmul3(dir,along)),vmul3(pv,h));
 return{joint,end};
}

function skeletonAnchors(actor,cpu){

   // It follows the torso but cannot slide toward the neck or down the ribs.
   const upper=J[5];

   // For this fixed 2.5D camera, use the camera-lateral axis for the shoulder

 }else{

   rightShoulder={x:shoulderCenter.x+lx*halfWidth,y:shoulderCenter.y,z:shoulderCenter.z+lz*halfWidth};

function beginCpuServeCountdown(){
 ensureAudio();
 if(!S.playing||S.matchOver||S.drill.active)return;
 computeServer();
 if(S.server!=='cpu')return;

 ++S.serveToken;
 const token=S.serveToken;
 S.cpuServePending=true;
 S.cpuServeCountdown=3;
 ui();

 const tick=()=>{
   if(token!==S.serveToken||S.matchOver||!S.playing||S.server!=='cpu'){
     S.cpuServePending=false;
     S.cpuServeCountdown=0;
     ui();
     return;
   }

   if(S.cpuServeCountdown<=0){
     S.cpuServePending=false;
     armServeFor('cpu');

     // CPU performs its own mirrored serve biomechanics.
     S.serve.backswing=true;
     S.serve.forward=false;
     S.cpu.hand.x=-2.28;
     S.cpu.hand.y=1.10;
     S.ball={x:-2.23,y:1.19,z:S.cpu.hand.z,r:.026};
     ui();

     setTimeout(()=>{
       if(token!==S.serveToken||S.matchOver||S.server!=='cpu')return;
       S.serve.forward=true;
       S.cpu.hand.x=-1.56;
       S.cpu.hand.y=1.04;
       S.ball={x:-1.61,y:1.12,z:S.cpu.hand.z,r:.026};
       ui();

       setTimeout(()=>{
         if(token!==S.serveToken||S.matchOver||S.server!=='cpu')return;
         releaseServe();
       },180);
     },380);
     return;
   }

   S.cpuServeCountdown--;
   ui();
   setTimeout(tick,1000);
 };
 setTimeout(tick,1000);
}

 computeServer();

   S.setupPaddle.yaw=S.human.paddle.yaw;

 const actor=side==='human'?S.human:S.cpu;

function prepareHumanIntercept(){
 if(S.auto||!S.shot||S.shot.receiver!=='human')return;
 const ball=S.shot.end;
 S.humanRally.target={x:ball.x,y:ball.y,z:ball.z};

 const a=.72;
 const _te=tableHX();S.human.baseX=lerp(S.human.baseX,S.human.homeX-(ball.x<_te?.16:.04),a);
 S.human.baseZ=lerp(S.human.baseZ,clamp(ball.z*1.05,-.48,.48),a);

 if((performance.now()-S.human.paddleInputAt)>700)applySelectedPaddlePreset();

 const desired=desiredHandForBladeContact(ball,false,S.human.paddle);
 const B=paddleBasis(false,S.human.paddle);
 const behind=vscale(B.normal,-.025);

 S.human.hand.x=lerp(S.human.hand.x,desired.x+behind.x,.82);
 S.human.hand.y=lerp(S.human.hand.y,desired.y+behind.y,.82);
 S.human.hand.z=lerp(S.human.hand.z,desired.z+behind.z,.82);
}


function sweptBallPaddleContact(prevBall,currBall,hand,cpu,angles){
 if(!prevBall||!currBall)return null;

 const a=worldToPaddleLocal(prevBall,hand,cpu,angles);
 const b=worldToPaddleLocal(currBall,hand,cpu,angles);

 const da=a.x,db=b.x;
 const denom=da-db;
 let t;

 if(Math.abs(denom)<1e-8){
   if(Math.min(Math.abs(da),Math.abs(db))>.040)return null;
   t=.5;
 }else{
   t=da/denom;
   if(t<0||t>1)return null;
 }

 const y=lerp(a.y,b.y,t);
 const z=lerp(a.z,b.z,t);
 const ballR=currBall.r||.026;
 const ry=.125*PADDLE_SCALE+ballR*.55;
 const rz=.085*PADDLE_SCALE+ballR*.55;
 const ellipse=(y*y)/(ry*ry)+(z*z)/(rz*rz);
 if(ellipse>1)return null;

 return{
   hit:true,
   t,
   point:{
     x:lerp(prevBall.x,currBall.x,t),
     y:lerp(prevBall.y,currBall.y,t),
     z:lerp(prevBall.z,currBall.z,t),
     r:ballR
   }
 };
}


function sweptBladeClosestContact(prevBall,currBall,hand,cpu,angles){
 if(!prevBall||!currBall)return null;

 const a=worldToPaddleLocal(prevBall,hand,cpu,angles);
 const b=worldToPaddleLocal(currBall,hand,cpu,angles);

 const vx=b.x-a.x,vy=b.y-a.y,vz=b.z-a.z;
 const vv=vx*vx+vy*vy+vz*vz;
 let t=vv>1e-9?-(a.x*vx+a.y*vy+a.z*vz)/vv:0;
 t=clamp(t,0,1);

 const x=a.x+vx*t;
 const y=a.y+vy*t;
 const z=a.z+vz*t;

 const ballR=currBall.r||.026;
 const planeTol=ballR+.018;
 const ry=.125*PADDLE_SCALE+ballR*.72;
 const rz=.085*PADDLE_SCALE+ballR*.72;
 const ellipse=(y*y)/(ry*ry)+(z*z)/(rz*rz);

 if(Math.abs(x)>planeTol||ellipse>1)return null;

 return{
   hit:true,
   t,
   point:{
     x:lerp(prevBall.x,currBall.x,t),
     y:lerp(prevBall.y,currBall.y,t),
     z:lerp(prevBall.z,currBall.z,t),
     r:ballR
   },
   ellipse
 };
}


function humanPaddleRecentlyControlled(){
 const now=performance.now();
 return S.humanRally.drag ||
        S.manualPaddle.drag ||
        (now-(S.human.paddleInputAt||0))<1400;
}

function launchHumanReturnFromContact(contact){
 if(!S.shot||S.shot.receiver!=='human'||S.pointLocked)return false;

 const built=buildManualHumanShot();
 built.shot.start={x:contact.x,y:contact.y,z:contact.z};

 S.shot=built.shot;
 S.phase='manual human return';
 S.rally++;
 S.best=Math.max(S.best,S.rally);
 hitSound('human',built.stroke);
 S.spinPhase+=(built.stroke==='slice'?-1:1)*(8+Math.abs(S.human.paddle.yaw)*8);

 S.humanRally.armed=false;
 S.humanRally.drag=false;
 S.humanRally.contactLatched=false;
 S.humanRally.contactBall=null;
 S.humanRally.contactGrace=0;
 $('serveHint').textContent='CONTACT • HUMAN RETURN';
 ui();
 return true;
}

function updateContactWindow(){
 if(!S.shot||S.shot.receiver!=='human'){
   S.humanRally.window=0;
   S.humanRally.contactReady=false;
   return;
 }

 const staticHit=ballTouchesPaddle(S.ball,S.human.hand,false,S.human.paddle);
 const swept=sweptBallPaddleContact(S.prevBall,S.ball,S.human.hand,false,S.human.paddle);
 const closest=sweptBladeClosestContact(S.prevBall,S.ball,S.human.hand,false,S.human.paddle);

 const center=paddleBladeCenter(S.human.hand,false,S.human.paddle);
 const dx=S.ball.x-center.x,dy=S.ball.y-center.y,dz=S.ball.z-center.z;

 // Slightly enlarged touchscreen-friendly physical blade corridor.
 const corridor=Math.sqrt(dx*dx+dy*dy+dz*dz)<.135;
 const dynamicHit=swept||closest;

 S.humanRally.contactReady=staticHit.hit||!!dynamicHit||corridor;

 if(S.humanRally.contactReady&&humanPaddleRecentlyControlled()){
   const contact=dynamicHit?.point || S.ball;

   // Physical paddle contact wins immediately. No later timeout is allowed
   // to turn this visible hit into a Humanoid point.
   if(launchHumanReturnFromContact(contact))return;
 }

 const planeScore=clamp(1-staticHit.plane/.13,0,1);
 const ovalScore=clamp(1-(Math.sqrt(Math.max(0,staticHit.ellipse))-1)/.85,0,1);
 S.humanRally.window=clamp(Math.max(planeScore*ovalScore,corridor?.86:0),0,1);
}

function humanIncoming(){
 return !!(S.shot&&S.shot.receiver==='human'&&(S.shot.phase==='post'||S.shot.phase==='humanContact'));
}

function armHumanRallyControl(){
 if(S.auto)return;
 S.humanRally.armed=true;
 if((performance.now()-S.human.paddleInputAt)>900)applySelectedPaddlePreset();
 prepareHumanIntercept();
 updateContactWindow();
 $('serveHint').textContent='YOUR RETURN • DRAG HAND/PADDLE TO BALL • RELEASE TO HIT';
}

function beginHumanRallyGesture(x,y){
 if(!S.playing || S.auto || !humanIncoming())return false;
 if(!humanControlZoneHit(x,y))return false;

 prepareHumanIntercept();
 updateContactWindow();

 S.humanRally.drag=true;
 S.humanRally.last={x,y,t:performance.now()};
 S.humanRally.pointerStart={x,y};
 S.humanRally.start={...S.human.hand};
 S.humanRally.gestureBase={
   hand:{...S.human.hand},
   paddle:{...S.human.paddle}
 };
 S.humanRally.totalDX=0;
 S.humanRally.totalDY=0;
 S.humanRally.peakSpeed=0;S.humanRally.maxBackDrag=0;S.humanRally.maxForwardDrag=0;S.humanRally.contactLatched=false;S.humanRally.contactBall=null;
 S.humanRally.contactReady=false;
 S.human.paddleInputAt=performance.now();
 return true;
}

function moveHumanRallyGesture(x,y){
 if(!S.humanRally.drag||!S.humanRally.last||!S.humanRally.gestureBase||S.auto)return;

 const now=performance.now();
 const prev=S.humanRally.last;
 const dt=Math.max(.012,(now-prev.t)/1000);
 const dxStep=x-prev.x,dyStep=y-prev.y;
 const totalDX=x-S.humanRally.pointerStart.x;
 const totalDY=y-S.humanRally.pointerStart.y;

 S.humanRally.totalDX=totalDX;
 S.humanRally.totalDY=totalDY;

 // Preserve backswing magnitude for shot-depth physics.
 const backDrag=Math.max(0,-totalDX);
 const fwdDrag=Math.max(0,totalDX);
 S.humanRally.maxBackDrag=Math.max(S.humanRally.maxBackDrag,backDrag);
 S.humanRally.maxForwardDrag=Math.max(S.humanRally.maxForwardDrag,fwdDrag);

 applySelectedPaddlePreset();

 const desired=desiredHandForBladeContact(S.ball,false,S.human.paddle);

 // CURSOR-SYNCED mapping:
 // cursor right  -> paddle right on screen
 // cursor left   -> paddle left on screen
 // cursor up     -> paddle up
 // cursor down   -> paddle down
 //
 // world Z controls visible left/right most directly in this camera.
 // world X adds only a smaller depth component.
 const _sens=isMobileLandscape()?2.6:1;
 const lateral=clamp(totalDX*.00155*_sens,-.22,.22);
 const depth=clamp(totalDX*.00055*_sens,-.08,.08);
 const vertical=clamp(-totalDY*.00135*_sens,-.18,.18);

 S.human.hand.z=clamp(desired.z+lateral,-.78,.78);
 S.human.hand.x=clamp(desired.x-depth,S.human.homeX-0.50,S.human.homeX+0.50);
 S.human.hand.y=clamp(desired.y+vertical,.66,1.78);

 const eventVX=(-dxStep*.00055)/dt;
 const eventVY=(-dyStep*.00135)/dt;
 const eventVZ=(dxStep*.00155)/dt;
 const eventSpeed=Math.hypot(eventVX,eventVY,eventVZ);

 S.humanRally.peakSpeed=Math.max(S.humanRally.peakSpeed,eventSpeed);
 S.humanRally.lastGesture={dx:eventVX,dy:eventVY,dz:eventVZ};

 updateContactWindow();
 S.humanRally.last={x,y,t:now};
 ui();
}


function manualShotOutcome(stroke){
 const g=S.humanRally.lastGesture;
 const speed=Math.max(.01,S.humanRally.peakSpeed);
 const backPx=S.humanRally.maxBackDrag||0;
 const fwdPx=S.humanRally.maxForwardDrag||0;
 const totalDX=S.humanRally.totalDX||0;
 const totalDY=S.humanRally.totalDY||0;

 // Total drag magnitude — the primary driver for how deep the ball goes.
 // Short drag -> ball lands short near the net; long drag -> ball goes deep.
 const dragMag=Math.hypot(totalDX,totalDY);
 const dragNorm=clamp(dragMag/320,0,1.5);

 // Forward component (toward table on human side = negative X on screen = left swipe).
 // This is the main depth driver: more forward swipe = deeper ball.
 const fwdNorm=clamp(fwdPx/200,0,1.5);
 const backNorm=clamp(backPx/240,0,1.35);
 const speedNorm=clamp(speed/5.2,0,1.35);

 // Depth maps directly to drag distance:
 // - Minimal drag (tap/flick) -> ball drops just past the net (~0.22)
 // - Medium drag -> mid-table (~0.65)
 // - Long drag + fast swing -> deep near baseline (~1.4+)
 let depth=.22 + dragNorm*.55 + fwdNorm*.35 + speedNorm*.22;

 // Swipe angle controls lateral placement.
 // The perpendicular component of the swipe relative to "toward table"
 // determines cross-court vs down-the-line.
 // totalDX < 0 (left swipe) = toward table; totalDY < 0 (up) = higher arc.
 // Lateral comes from the DY component mixed with gesture lateral velocity.
 // Lateral z from the vertical component of the swipe and gesture lateral velocity.
 const z=clamp(
   profiles[stroke].lateral*.30 +
   (g?.dz||0)*.12 +
   totalDY*.0018 +
   totalDX*.00080,
   -1.05,1.05
 );

 // Clearance (arc height): upward swipe = higher arc, downward = flatter.
 let clearance=.06 + clamp(-totalDY/200,-.8,.8)*.20 + speedNorm*.03;

 if(stroke==='smash'){depth+=.18;clearance-=.05}
 if(stroke==='slice'){depth-=.10;clearance+=.02}
 if(stroke==='topspin'){depth+=.08;clearance+=.03}

 const wide=Math.abs(z)>.72;
 const long=depth>1.40;
 const tooShort=depth<.15;

 let outcome='legal';
 if(clearance<.02||tooShort)outcome='net';
 else if(wide)outcome='wide';
 else if(long)outcome='long';
 else if(depth<.42)outcome='short';

 return{
   outcome,depth,z,clearance,speed,
   backNorm,fwdNorm,speedNorm,dragNorm
 };
}

function buildFreeHumanShot(stroke,contact){
 const intent=manualShotOutcome(stroke);
 const p=profiles[stroke];

 let bounceX=-clamp(intent.depth,.12,1.72);
 let bounceZ=intent.z;
 let bounceY=.845;
 // End X scales with depth: short ball stays near net, deep ball goes to baseline.
 let endX=-clamp(1.10+intent.depth*.55,1.20,2.10);
 let endZ=bounceZ+p.sideSpin*.012;

 // Backward drag also pushes cross-court placement farther toward a side edge.
 const edgeBias=clamp(intent.backNorm*.34 + intent.speedNorm*.12,0,.48);
 const dragSign=Math.sign((S.humanRally.totalDX||0) || (S.humanRally.lastGesture?.dz||1))||1;
 if(Math.abs(bounceZ)<.18 && edgeBias>.10){
   bounceZ=dragSign*(.18+edgeBias);
 }

 const sliceDir=dragSign;
 if(stroke==='slice'){
   bounceZ=clamp(dragSign*(.24+Math.abs(intent.z)*.55+edgeBias*.25),-.62,.62);
   endZ=clamp(-bounceZ+dragSign*.18,-.80,.80);
 }

 if(intent.outcome==='net'){
   bounceX=0;
   bounceY=.825+clamp(intent.clearance,-.05,.02);
   bounceZ=lerp(contact.z,intent.z,.45);
   endX=0;endZ=bounceZ;
 }
 if(intent.outcome==='wide'){
   bounceX=-clamp(intent.depth,.45,1.25);
   bounceZ=clamp(intent.z,-1.05,1.05);
   endZ=bounceZ;
 }
 if(intent.outcome==='long'){
   bounceX=-clamp(intent.depth,1.42,1.72);
   endX=-2.10;
 }
 if(intent.outcome==='short'){
   bounceX=-clamp(intent.depth,.20,.45);
   // Short ball: opponent must lean forward to reach.
   endX=-clamp(1.10+intent.depth*.55,1.20,1.50);
 }

 const total=clamp(p.duration*speedFactor()*(1.08-.09*intent.speed),.38,1.45);
 const pre=total*(stroke==='slice'?.62:.54),post=total-pre;

 const bounce={x:bounceX,y:bounceY,z:bounceZ};
 const end={x:endX,y:stroke==='smash'?.98:stroke==='slice'?1.00:1.10,z:endZ};
 const apparentEnd={x:end.x,y:end.y,z:bounceZ};

 return{
   hitter:'human',receiver:'cpu',stroke,
   start:{...contact},bounce,end,apparentEnd,
   outcome:intent.outcome,clearance:intent.clearance,
   phase:'pre',t:0,pre,post,forceMiss:false,
   deceptiveSpin:stroke==='topspin',
   spinKick:stroke==='topspin'?clamp((S.humanRally.totalDX||0)*.0028,-.46,.46):0,
   sliceDir,
   userBackNorm:intent.backNorm,
   userSpeedNorm:intent.speedNorm
 };
}

function buildManualHumanShot(){
 let stroke=S.stroke;
 const pitchDeg=S.human.paddle.pitch*180/Math.PI;
 if(pitchDeg>10)stroke='topspin';
 else if(pitchDeg<-6)stroke='slice';

 const contact=S.humanRally.contactBall||S.ball;
 const shot=buildFreeHumanShot(stroke,contact);
 return{stroke,shot};
}

function endHumanRallyGesture(){
 if(!S.humanRally.drag||S.auto||S.pointLocked)return false;

 S.humanRally.drag=false;
 S.humanRally.last=null;
 S.humanRally.gestureBase=null;
 S.humanRally.pointerStart=null;

 if(!humanIncoming())return false;

 // A visually/physically valid paddle touch must count.
 // Keep only a small minimum swing-speed threshold.
 if(!S.humanRally.contactLatched || S.humanRally.peakSpeed<.08){
   $('serveHint').textContent='MISS • SWING THROUGH THE BALL';
   pointTo('cpu');
   return true;
 }

 const contact=S.humanRally.contactBall||S.ball;
 const built=buildManualHumanShot();
 built.shot.start={x:contact.x,y:contact.y,z:contact.z};

 S.shot=built.shot;
 S.phase='manual human return';
 S.rally++;
 S.best=Math.max(S.best,S.rally);
 hitSound('human',built.stroke);
 S.spinPhase+=(built.stroke==='slice'?-1:1)*(8+Math.abs(S.human.paddle.yaw)*8);

 S.humanRally.armed=false;
 S.humanRally.contactLatched=false;
 S.humanRally.contactBall=null;
 S.humanRally.contactGrace=0;

 $('serveHint').textContent='RETURN RELEASED • HUMANOID TRACKING';
 ui();
 return true;
}

function beginManualPaddle(x,y){
 if(!S.playing || S.auto || S.serve.armed)return false;
 if(!humanControlZoneHit(x,y))return false;
 S.manualPaddle.drag=true;S.manualPaddle.last={x,y};
 S.human.paddleInputAt=performance.now();
 return true;
}
function moveManualPaddle(x,y){
 if(!S.manualPaddle.drag||!S.manualPaddle.last)return;

 const p=S.manualPaddle.last;
 const dx=x-p.x,dy=y-p.y;

 if(S.playing&&!S.auto&&!S.setupPaddle.locked){
   // PRE-SERVE SETUP MODE:
   // drag horizontally -> yaw
   // drag vertically   -> pitch
   // diagonal component -> roll
   S.human.paddle.yaw=clamp(S.human.paddle.yaw-dx*.0050,-.65,.65);
   S.human.paddle.pitch=clamp(S.human.paddle.pitch-dy*.0050,-.55,.55);
   S.human.paddle.roll=clamp(S.human.paddle.roll+(dx-dy)*.0018,-.45,.45);

   S.setupPaddle.pitch=S.human.paddle.pitch;
   S.setupPaddle.yaw=S.human.paddle.yaw;
   S.setupPaddle.roll=S.human.paddle.roll;

   // move wrist a little too so user can position paddle around body
   S.human.hand.z=clamp(S.human.hand.z+dx*.00085,-.78,.78);
   S.human.hand.y=clamp(S.human.hand.y-dy*.00115,.72,1.72);

   // body follows setup position
   const reach=clamp((S.human.homeX-S.human.hand.x)*.75,-.18,.32);
   S.human.spine.targetLean=clamp(.10+reach,.04,.32);
   S.human.spine.targetTwist=clamp(S.human.hand.z*.10,-.11,.11);
 }else if(S.playing&&!S.auto&&S.setupPaddle.locked){
   // Once serve is armed, preserve the chosen face exactly.
   S.human.paddle.pitch=S.setupPaddle.pitch;
   S.human.paddle.yaw=S.setupPaddle.yaw;
   S.human.paddle.roll=S.setupPaddle.roll;

   // allow position movement without changing face
   S.human.hand.z=clamp(S.human.hand.z+dx*.00145,-.78,.78);
   S.human.hand.y=clamp(S.human.hand.y-dy*.00180,.66,1.78);
   S.human.hand.x=clamp(S.human.hand.x-dx*.00045,S.human.homeX-0.50,S.human.homeX+0.50);
 }else{
   S.human.paddle.yaw=clamp(S.human.paddle.yaw-dx*.0040,-.65,.65);
   S.human.paddle.pitch=clamp(S.human.paddle.pitch-dy*.0040,-.55,.55);
   S.human.paddle.roll=clamp(S.human.paddle.roll+(dx-dy)*.0015,-.45,.45);
 }

 S.human.paddleInputAt=performance.now();
 S.manualPaddle.last={x,y};
 ui();
}
function endManualPaddle(){S.manualPaddle.drag=false;S.manualPaddle.last=null}

function beginGesture(x,y){
 if(!S.serve.armed)return;
 if(!playerControlZoneHit(S.serve.side,x,y))return;
 S.serve.drag=true;
 S.serve.last={x,y,t:performance.now()};
 ensureAudio();
}
function releaseServe(){
 computeServer();if(!S.serve.armed||S.server!==S.serve.side||S.pointLocked)return false;
 const side=S.serve.side,actor=side==='human'?S.human:S.cpu;const moved=S.serve.forward||S.serve.backswing||(S.serve.lastMotion&&S.serve.lastMotion>.015);if(side==='human'&&!moved)return false;
 S.serve.armed=false;S.serve.drag=false;S.ball={x:actor.hand.x+(side==='human'?-.05:.05),y:actor.hand.y+.07,z:actor.hand.z,r:.026};launchServe(side,side==='human'?S.stroke:chooseCPUStroke());ui();return true;
}
function moveGesture(x,y){
 if(!S.serve.armed||!S.serve.drag||!S.serve.last)return;
 const side=S.serve.side;
 const actor=side==='human'?S.human:S.cpu;
 const p=S.serve.last,dx=x-p.x,dy=y-p.y;S.serve.lastMotion=Math.hypot(dx,dy);
 const _ss=isMobileLandscape()?2.2:1;
 if(side==='human'){
   const _hh=Math.abs(actor.homeX);
   actor.hand.x=clamp(actor.hand.x+dx*.0042*_ss,_hh-0.20,_hh+0.50);
   S.serve.maxBackX=Math.max(S.serve.maxBackX,actor.hand.x);
   const _h=Math.abs(actor.homeX);
   if(S.serve.maxBackX>_h+0.20)S.serve.backswing=true;
   if(S.serve.backswing&&actor.hand.x<S.serve.maxBackX-.16)S.serve.forward=true;
 }else{
   actor.hand.x=clamp(actor.hand.x-dx*.0042*_ss,-(_h+0.50),-(_h-0.20));
   S.serve.maxBackX=Math.min(S.serve.maxBackX,actor.hand.x);
   if(S.serve.maxBackX<-(_h+0.20))S.serve.backswing=true;
   if(S.serve.backswing&&actor.hand.x>S.serve.maxBackX+.16)S.serve.forward=true;
 }
 actor.hand.y=clamp(actor.hand.y-dy*.0035*_ss,.90,1.50);
 actor.hand.z=clamp(actor.hand.z+dy*.0018*_ss,-.50,.50);
 S.ball={x:actor.hand.x+(side==='human'?-.05:.05),y:actor.hand.y+.08,z:actor.hand.z,r:.026};
 S.serve.last={x,y,t:performance.now()};
 ui();
}
function endGesture(){
 if(!S.serve.armed)return;
 S.serve.drag=false;
 S.serve.last=null;
 if(!releaseServe())ui();
}
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch')return;
 let accepted=false;

 if(S.serve.armed){
   if(playerControlZoneHit(S.serve.side,e.clientX,e.clientY)){
     beginGesture(e.clientX,e.clientY);
     accepted=true;
   }
 }else if(humanIncoming()&&!S.auto){
   if(humanControlZoneHit(e.clientX,e.clientY)){
     accepted=beginHumanRallyGesture(e.clientX,e.clientY)!==false;
   }
 }else if(S.playing&&!S.auto){
   accepted=beginRigControl(e.clientX,e.clientY);
 }

 if(accepted){
   try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 }
});

canvas.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch')return;
 if(!S.rigControl?.active && S.playing && !S.auto){
   canvas.style.cursor=humanPaddleArrowHit(e.clientX,e.clientY)?'grab':'default';
 }
});
canvas.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch')return;
 if(S.serve.drag)moveGesture(e.clientX,e.clientY);
 else if(S.humanRally.drag)moveHumanRallyGesture(e.clientX,e.clientY);
 else if(S.rigControl?.active)moveRigControl(e.clientX,e.clientY);
 else if(S.manualPaddle.drag)moveManualPaddle(e.clientX,e.clientY);
});

canvas.addEventListener('pointerup',e=>{
 if(e.pointerType==='touch')return;
 if(S.serve.drag)endGesture();
 else if(S.humanRally.drag)endHumanRallyGesture();
 else if(S.rigControl?.active)endRigControl();
 else if(S.manualPaddle.drag)endManualPaddle();
});

canvas.addEventListener('touchstart',e=>{
 if(!e.touches[0])return;
 e.preventDefault();
 const x=e.touches[0].clientX,y=e.touches[0].clientY;

 if(S.serve.armed&&!playerControlZoneHit(S.serve.side,x,y))return;

 if(S.serve.armed)beginGesture(x,y);
 else if(humanIncoming()&&!S.auto)beginHumanRallyGesture(x,y);
 else if(S.playing&&!S.auto)beginRigControl(x,y);
},{passive:false});

canvas.addEventListener('touchmove',e=>{
 if(!e.touches[0])return;
 e.preventDefault();
 const x=e.touches[0].clientX,y=e.touches[0].clientY;
 if(S.serve.drag)moveGesture(x,y);
 else if(S.humanRally.drag)moveHumanRallyGesture(x,y);
 else if(S.rigControl?.active)moveRigControl(x,y);
 else if(S.manualPaddle.drag)moveManualPaddle(x,y);
},{passive:false});

canvas.addEventListener('touchend',e=>{
 e.preventDefault();
 if(S.serve.drag)endGesture();
 else if(S.humanRally.drag)endHumanRallyGesture();
 else if(S.rigControl?.active)endRigControl();
 else if(S.manualPaddle.drag)endManualPaddle();
},{passive:false});


['humanServeBtn','cpuServeBtn','resetBtn'].forEach(id=>{
 const b=$(id);
 if(!b)return;
 b.addEventListener('pointerdown',()=>b.classList.add('pressed'));
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('pressed')));
 b.addEventListener('touchstart',()=>b.classList.add('pressed'),{passive:true});
 b.addEventListener('touchend',()=>b.classList.remove('pressed'),{passive:true});
});




let rafHandle=0;
let lastRenderBeat=0;
let renderLoopRunning=false;

function renderStep(t,physics=true){
 try{
   const now=Number.isFinite(t)?t:performance.now();
   let dt=Math.min(.03,Math.max(0,(now-S.last)/1000));
   if(!Number.isFinite(dt))dt=.016;
   S.last=now;

   if(physics){
     S.prevBall=S.ball?{...S.ball}:null;
     updateResetPresentation(dt);
     if(S.drill.active)updatePreGameDrills(dt);
     else if(S.playing&&S.shot&&!S.pointLocked)updateShot(dt);
     if(S.playing&&!S.drill.active)updateSpineDynamics(S.human,false,dt);
     if(S.playing)updateSpineDynamics(S.cpu,true,dt);
     if(S.playing&&!S.drill.active)updateLegDynamics(S.human,false,dt);
     if(S.playing)updateLegDynamics(S.cpu,true,dt);
     if(!S.drill.active)updateHeadTracking(S.human,false,dt);
     updateHeadTracking(S.cpu,true,dt);
     updateRobotScan(dt);
   }

   draw();
   lastRenderBeat=performance.now();
   const rd=$('renderDiag');
   if(rd){
     rd.textContent='RENDER: PASS • TABLE + PLAYERS';
     rd.style.color='#6fe59a';
   }
   const cr=$('canvasRecovery'); if(cr)cr.style.display='none';
 }catch(err){
   const st=$('status'),rd=$('renderDiag');
   if(st){st.textContent='RUNTIME ERROR';st.style.color='#ff6b6b';}
   if(rd){
     rd.textContent='RENDER ERROR: '+String(err&&err.message?err.message:err);
     rd.style.color='#ff6b6b';
   }
   console.error(err);
 }
}

function frame(t){
 renderStep(t,true);
 rafHandle=requestAnimationFrame(frame);
}

function kickRenderLoop(){
 // Always force a synchronous paint first.
 renderStep(performance.now(),false);
 if(!renderLoopRunning){
   renderLoopRunning=true;
   rafHandle=requestAnimationFrame(frame);
 }
}

function frameWatchdog(){
 const age=performance.now()-lastRenderBeat;
 if(document.visibilityState==='visible' && age>450){
   // Some iPhone HTML previewers throttle or fail RAF. Paint without waiting for RAF.
   const cr=$('canvasRecovery'); if(cr)cr.style.display='block';
   resize();
   renderStep(performance.now(),false);
 }
}

resetAll();
try{draw();lastRenderBeat=performance.now();}catch(_){}

(function(){
 try{
   const tests=[
     ['ctx',!!ctx],
     ['drawTable',typeof drawTable==='function'],
     ['drawRobot',typeof drawRobot==='function'],
     ['drawBall',typeof drawBall==='function'],
     ['paddle',!!(S.human&&S.human.paddle)],
     ['frame',typeof frame==='function']
   ];
   const bad=tests.filter(x=>!x[1]);
   if(bad.length){
     $('status').textContent='SELF-TEST FAIL: '+bad.map(x=>x[0]).join(',');
     $('status').style.color='#ff6b6b';
   }else{
     $('status').textContent='SELF-TEST PASS • v20.1';
     $('status').style.color='#6fe59a';
   }
 }catch(e){
   $('status').textContent='SELF-TEST ERROR';
   $('status').style.color='#ff6b6b';
 }
})();
kickRenderLoop();
setInterval(frameWatchdog,300);
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'){
   setTimeout(()=>{resize();kickRenderLoop();},50);
 }
});
window.addEventListener('pageshow',()=>setTimeout(()=>{resize();kickRenderLoop();},40));

</script>
