<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
:root{--sb:env(safe-area-inset-top,0px);--sbb:env(safe-area-inset-bottom,0px)}
@keyframes blinkArrow{0%,100%{opacity:1}50%{opacity:.2}}
#nextArrow{display:inline-flex;align-items:center;cursor:pointer;pointer-events:auto;animation:blinkArrow 1s ease-in-out infinite;color:#d6a21f;font-size:16px;font-weight:900;padding-left:6px}
#nextArrow:active{transform:scale(1.2)}
</style>
<title>CrossWord Pro 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;overscroll-behavior:none}
#kc{position:fixed;inset:0;background:#111;font:13px Arial;color:#eee;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
select,button{font:inherit}

/* Scoreboard banner - top center, ping pong style */
#scoreboard{
  position:absolute;left:50%;transform:translateX(-50%);top:0;
  width:300px;padding:2px 10px 3px;text-align:center;z-index:20;pointer-events:none;
  background:linear-gradient(180deg,#08111b,#070d13);
  border:1px solid #33404d;border-radius:0 0 12px 12px;
  box-shadow:0 8px 18px rgba(0,0,0,.28);
}
#scoreboard .scoreHeader{
  font-weight:900;font-size:13px;letter-spacing:.1em;color:#ffd86a;
  text-shadow:0 0 16px rgba(255,216,106,.4),0 1px 3px rgba(0,0,0,.6);
  padding:1px 0 1px;margin-bottom:1px;
  background:linear-gradient(135deg,rgba(255,216,106,.12),rgba(255,184,40,.04));
  border-radius:6px;
  border-bottom:1px solid rgba(255,216,106,.18);
}
#scoreboard .scoreRow{
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:36px;padding:1px 0;
}
#scoreboard .grp{display:flex;flex-direction:row;align-items:center;gap:5px}
#scoreboard .lbl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px}
#scoreboard #sc{font-size:14px;color:#6ee787;min-width:40px;text-align:left}
#scoreboard #atc{font-size:13px;color:#d6a21f;min-width:36px;text-align:left}
#scoreboard #atc.loading{color:#555}

/* Stage - full screen for cube dragging */
#stagediv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1e1e1e,#0a0a0a);overflow:hidden}
#st{display:grid;place-items:center;perspective:900px;touch-action:none;overflow:hidden;width:100%;height:100%;position:relative}
#cu{--s:min(70vw,300px);--h:calc(var(--s)/2);width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;will-change:transform}
.f{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);background:#c91f28;border:3px solid #333;backface-visibility:hidden}
.a{transform:translateZ(var(--h))}
.b{transform:rotateY(-90deg) translateZ(var(--h))}
.c{transform:rotateY(180deg) translateZ(var(--h))}
.d{transform:rotateY(90deg) translateZ(var(--h))}
.e{transform:rotateX(90deg) translateZ(var(--h))}
.g{transform:rotateX(-90deg) translateZ(var(--h))}
.x{position:relative;display:grid;place-items:center;border-right:1px solid #222;border-bottom:1px solid #222;background:#c91f28;font-size:11px;font-weight:900;color:#fff;user-select:none}
.x.o{background:#fff;color:#111}
.x.s{background:#ffe18a;color:#111}
.x.ok{background:#cdeecf;color:#111}
.n{position:absolute;left:1px;top:0;font-size:12px;font-weight:900;color:#222;line-height:1;pointer-events:none}

/* FACE indicator - in action button row */
#fb{
  background:#d0d0d0;color:#222;border:1px solid #999;
  border-radius:5px;padding:4px 9px;font-weight:900;font-size:9px;
  z-index:15;cursor:pointer;letter-spacing:.05em;
}

/* Category dropdown - below action buttons, centered */
#catwrap{position:absolute;left:50%;transform:translateX(-50%);top:118px;z-index:10;display:flex;flex-direction:column;gap:4px;align-items:center}
#catwrap label{font-size:8px;font-weight:900;color:#888;text-transform:uppercase;letter-spacing:1px;text-align:center}
select#cat{padding:6px 10px;border:1px solid #444;border-radius:8px;background:#222;color:#eee;min-width:110px;max-width:160px;font-size:11px}

/* Difficulty slider - below category, centered */
#diffwrap{position:absolute;left:50%;transform:translateX(-50%);top:160px;z-index:10;display:flex;flex-direction:column;gap:3px;align-items:center;width:min(70vw,300px)}
#diffwrap label{font-size:8px;font-weight:900;color:#888;text-transform:uppercase;letter-spacing:1px;text-align:center}
#diffBar{width:100%;appearance:none;-webkit-appearance:none;height:12px;border-radius:8px;border:1px solid #444;background:linear-gradient(90deg,#4ade80,#facc15,#f87171);outline:none;cursor:pointer}
#diffBar::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #333;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#diffBar::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #333;cursor:pointer}
#diffLabels{display:flex;justify-content:space-between;width:100%;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
#diffLabels span{color:#666;cursor:pointer;flex:1;text-align:center;transition:color .2s;padding-top:1px}
#diffLabels span.active{color:#fff}

/* Hint bar - below keyboard, same width as cube */
#hintbar{
  position:absolute;left:50%;transform:translateX(-50%);
  z-index:15;width:min(70vw,300px);
  background:#1a1a1a;border:1px solid #d6a21f;border-radius:8px;
  padding:6px 12px;text-align:left;overflow:hidden;
  display:flex;align-items:center;gap:4px;
}
#hintbar .hlabel{font-weight:900;font-size:11px;color:#d6a21f;letter-spacing:.05em;flex-shrink:0}
#hintbar .htext{font-size:11px;color:#ccc;line-height:1.3;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Score panel removed - score now in scoreboard */

/* Keyboard - 1.4x, below cube bottom edge, centered */
#kbWrap{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(50% + min(42vw,180px) + 10px);
  z-index:15;
  border:3px solid #444;border-radius:10px;padding:6px;
  background:#0a0a0a;box-shadow:0 0 12px rgba(0,0,0,.6);
  margin-bottom:env(safe-area-inset-bottom,0px);
}
#kb{transform:scale(1.4);transform-origin:center top;padding:2px;display:grid;gap:3px}
.r{display:flex;gap:3px;justify-content:center}
.k{flex:1;max-width:35px;height:36px;border:0;border-radius:5px;background:#2a2a2a;color:#eee;box-shadow:0 1px 1px #000;font-weight:900;font-size:14px}
.w{max-width:58px}

/* Action buttons - below scoreboard */
#ac{
  position:absolute;left:50%;transform:translateX(-50%);
  top:82px;display:flex;gap:5px;justify-content:center;z-index:15;
}
.q{border:0;border-radius:5px;background:#06b6d4;color:#111;padding:4px 9px;font-weight:900;font-size:9px}
.q.alt{background:#333;color:#eee;border:1px solid #555}

#sc.pop{animation:p .3s}@keyframes p{50%{transform:scale(1.4);color:#6ee787}}

@media(min-width:700px){
  #cu{--s:360px}
  #kbWrap{top:calc(50% + 235px)}
  #hintbar{width:360px}
}
@media(max-width:600px){
  #kb{transform:scale(1.15);transform-origin:center top}
}
@media(max-width:420px){
  #kb{transform:scale(0.95);transform-origin:center top}
  #scoreboard{width:220px}
  #scoreboard .scoreHeader{font-size:10px}
  #catwrap{left:50%;transform:translateX(-50%);top:118px}
}
</style>
</head>
<body>
<div id="kc">
  <div id="scoreboard">
    <div class="scoreHeader">CROSSWORD 3D</div>
    <div class="scoreRow">
      <div class="grp"><span class="lbl">Score</span><b id="sc">0</b></div>
      <div class="grp"><span class="lbl">All-Time</span><b id="atc" class="loading">—</b></div>
    </div>
  </div>
  <div id="ac">
    <button class="q" id="ck">CHECK</button>
    <button class="q alt" id="nx">HINT</button>
    <button class="q alt" id="rv">REVEAL</button>
    <button class="q alt" id="rs">RESET</button>
    <button class="q" id="fb">FACE 1</button>
  </div>
  <div id="catwrap">
    <label>Category</label>
    <select id="cat"></select>
  </div>
  <div id="diffwrap">
    <label>Difficulty</label>
    <input type="range" id="diffBar" min="0" max="2" step="1" value="1">
    <div id="diffLabels"><span data-d="0">Beginner</span><span data-d="1" class="active">Intermediate</span><span data-d="2">Expert</span></div>
  </div>
  <div id="stagediv"><div id="st"><div id="cu"></div></div></div>
  <div id="kbWrap"><div id="kb"></div></div>
  <div id="hintbar"><span class="hlabel" id="cd">1 Across</span> <span class="htext" id="ct"></span><span id="nextArrow">→</span></div>
</div>

/* --- Player identity & score sync (mirrors Pangram device_id pattern) --- */
let SUPA_URL='',SUPA_KEY='',DEV_ID='';
let allTimeCredit=0,allTimeDebit=0,supaReady=false;

window.addEventListener('message',e=>{
  const m=e.data;
  if(!m||m.type!=='crossword3d-creds')return;
  SUPA_URL=m.url;SUPA_KEY=m.key;DEV_ID=m.deviceId;
  supaReady=true;loadAllTime();
});

async function loadAllTime(){
  if(!supaReady)return;
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/crossword3d_player_stats?select=total_credit,total_debit&device_id=eq.${DEV_ID}`,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    if(!r.ok)return;
    const rows=await r.json();
    if(rows.length>0){allTimeCredit=rows[0].total_credit||0;allTimeDebit=rows[0].total_debit||0;}
    updateAllTimeDisplay();
  }catch(err){}
}

function updateAllTimeDisplay(){
  atc.classList.remove('loading');
  const net=allTimeCredit-allTimeDebit;
  atc.textContent=(net>=0?'+':'')+net;
  atc.style.color=net>=0?'#d6a21f':'#ef4444';
}

async function syncStats(creditDelta,debitDelta){
  allTimeCredit+=creditDelta;
  allTimeDebit+=debitDelta;
  updateAllTimeDisplay();
  if(!supaReady)return;
  try{
    const sel=await fetch(`${SUPA_URL}/rest/v1/crossword3d_player_stats?select=total_credit,total_debit&device_id=eq.${DEV_ID}`,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    let cur={total_credit:0,total_debit:0};
    if(sel.ok){const rows=await sel.json();if(rows.length>0)cur=rows[0];}
    await fetch(`${SUPA_URL}/rest/v1/crossword3d_player_stats?on_conflict=device_id`,{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({
        device_id:DEV_ID,
        total_credit:(cur.total_credit||0)+creditDelta,
        total_debit:(cur.total_debit||0)+debitDelta,
        updated_at:new Date().toISOString()
      })
    });
  }catch(err){}
}

function placeWord(G,word,d,r,c){
  const L=word.length;
  for(let k=0;k<L;k++){
    let rr=r+(d==='D'?k:0),cc=c+(d==='A'?k:0);
    if(rr<0||rr>=10||cc<0||cc>=10)return false;
    let existing=G[rr][cc];
    if(existing&&existing!==word[k])return false;
  }
  if(d==='A'){
    if(c>0&&G[r][c-1])return false;
    if(c+L<10&&G[r][c+L])return false;
  }else{
    if(r>0&&G[r-1][c])return false;
    if(r+L<10&&G[r+L][c])return false;
  }
  for(let k=1;k<L-1;k++){
    let rr=r+(d==='D'?k:0),cc=c+(d==='A'?k:0);
    if(d==='A'){
      if((rr>0&&G[rr-1][cc])||(rr<9&&G[rr+1][cc]))return false;
    }else{
      if((cc>0&&G[rr][cc-1])||(cc<9&&G[rr][cc+1]))return false;
    }
  }
  for(let k=0;k<L;k++){
    let rr=r+(d==='D'?k:0),cc=c+(d==='A'?k:0);
    G[rr][cc]=word[k];
  }
  return true;
}
function tryPlace(G,word,d){
  const L=word.length;
  if(L>10)return null;
  let best=null;
  for(let r=0;r<10;r++)for(let c=0;c<10;c++){
    let intersects=false,ok=true;
    for(let k=0;k<L;k++){
      let rr=r+(d==='D'?k:0),cc=c+(d==='A'?k:0);
      if(rr>=10||cc>=10){ok=false;break}
      if(G[rr][cc]){
        if(G[rr][cc]!==word[k]){ok=false;break}
        intersects=true;
      }
    }
    if(!ok)continue;
    if(d==='A'){
      if(c>0&&G[r][c-1])continue;
      if(c+L<10&&G[r][c+L])continue;
    }else{
      if(r>0&&G[r-1][c])continue;
      if(r+L<10&&G[r+L][c])continue;
    }
    let sideConflict=false;
    for(let k=1;k<L-1;k++){
      let rr=r+(d==='D'?k:0),cc=c+(d==='A'?k:0);
      if(d==='A'){
        if((rr>0&&G[rr-1][cc])||(rr<9&&G[rr+1][cc])){sideConflict=true;break}
      }else{
        if((cc>0&&G[rr][cc-1])||(cc<9&&G[rr][cc+1])){sideConflict=true;break}
      }
    }
    if(sideConflict)continue;
    if(intersects)return{r,c};
    if(!best)best={r,c};
  }
  return best;
}
function buildFace(pool){

      placeWord(G,first[0],d,r,c);

        placeWord(G,word,chosen.d,chosen.r,chosen.c);
        placed.push({word,clue,d:chosen.d,r:chosen.r,c:chosen.c});

    if(placed.length>bestCount){bestCount=placed.length;bestG=G;bestPlaced=placed;}

        if(placed.length>=10)break;
        let word=allPool[j][0],clue=allPool[j][1];
        if(word.length>10)continue;

        let dD=tryPlace(G,word,'D');
        let chosen=null;
        if(dA&&dD)chosen=Math.random()<0.5?{r:dA.r,c:dA.c,d:'A'}:{r:dD.r,c:dD.c,d:'D'};
        else if(dA)chosen={r:dA.r,c:dA.c,d:'A'};
        else if(dD)chosen={r:dD.r,c:dD.c,d:'D'};
        if(chosen){
          placeWord(G,word,chosen.d,chosen.r,chosen.c);
          placed.push({word,clue,d:chosen.d,r:chosen.r,c:chosen.c});
        }
      }
      if(placed.length>bestCount){bestCount=placed.length;bestG=G;bestPlaced=placed;}
      if(bestCount>=6)break;
    }
  }
  if(!bestG){bestG=Array.from({length:10},()=>Array(10).fill(''));bestPlaced=[];}
  bestPlaced.sort((a,b)=>(a.r*10+a.c)-(b.r*10+b.c));
  let W=[];
  bestPlaced.forEach((p,i)=>{W.push({id:0,ans:p.word,cl:p.clue,r:p.r,c:p.c,d:p.d,n:i+1});});
  return{G:bestG,W};
}
function groups(){
  let R=[];
  let pool=[...getPool()].sort(()=>Math.random()-0.5);
  let facePools=Array.from({length:6},()=>[]);
  pool.forEach((w,i)=>facePools[i%6].push(w));
  for(let f=0;f<6;f++){
    let{G,W}=buildFace(facePools[f]);
    W.forEach(w=>w.id=f*10+W.indexOf(w));
    R.push({G,W});
  }
  return R;
}
let P=groups();

function wordKey(w){return cat+'|'+face+'|'+w.id}
function cellKey(r,c){return cat+'|'+face+'|'+r+'|'+c}
function tr(){cu.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`}

function wordsAt(f,r,c){
  return P[f].W.filter(q=>q.d==='A'
    ? r===q.r && c>=q.c && c<q.c+q.ans.length
    : c===q.c && r>=q.r && r<q.r+q.ans.length);
}
function findWord(f,r,c){
  const all=wordsAt(f,r,c);
  if(all.length===0)return null;
  if(selw&&all.some(w=>w.id===selw.id))return all.find(w=>w.id===selw.id);
  return all[0];
}
function draw(){
  cu.innerHTML='';
  for(let f=0;f<6;f++){
    const fe=document.createElement('div');fe.className='f '+F[f];
    for(let r=0;r<10;r++)for(let c=0;c<10;c++){
      const z=document.createElement('div');z.className='x';
      if(P[f].G[r][c]){
        z.classList.add('o');
        const allW=wordsAt(f,r,c);
        const w=findWord(f,r,c);
        if(w){
          if(f===face&&selw&&allW.some(ww=>ww.id===selw.id))z.classList.add('s');
          if(f===face&&allW.some(ww=>sol.has(wordKey(ww))))z.classList.add('ok');
          const starts=allW.filter(q=>q.r===r&&q.c===c).sort((a,b)=>a.n-b.n);
          if(starts.length>0){const nn=document.createElement('span');nn.className='n';nn.textContent=starts.map(s=>s.n).join('/');z.append(nn)}
          if(f===face) z.append(document.createTextNode(letm[cellKey(r,c)]||''));
          if(f===face) z.onclick=()=>{
            if(allW.length>1){
              const curIdx=allW.findIndex(ww=>selw&&ww.id===selw.id);
              selw=allW[(curIdx+1)%allW.length];
            }else{
              selw=w;
            }
            clue();draw();
          };
        }
      }
      fe.append(z);
    }
    cu.append(fe);
  }
  fb.textContent='FACE '+(face+1);
  sc.textContent=score;
}
function clue(){
  if(!selw||!P[face].W.some(w=>w.id===selw.id))selw=P[face].W[0];
  const dir=selw.d==='A'?'Across':'Down';
  cd.textContent=selw.n+' '+dir+': ';
  ct.textContent=selw.cl;
}
function type(ch){
  if(!selw)return;
  for(let i=0;i<selw.ans.length;i++){
    let r=selw.r+(selw.d==='D'?i:0),c=selw.c+(selw.d==='A'?i:0),k=cellKey(r,c);
    if(!letm[k]){letm[k]=ch;break}
  }
  draw();
}
function back(){
  if(!selw)return;
  for(let i=selw.ans.length-1;i>=0;i--){
    let r=selw.r+(selw.d==='D'?i:0),c=selw.c+(selw.d==='A'?i:0),k=cellKey(r,c);
    if(letm[k]){letm[k]='';break}
  }
  draw();
}
function answer(w){
  let s='';
  for(let i=0;i<w.ans.length;i++) s+=letm[cellKey(w.r+(w.d==='D'?i:0),w.c+(w.d==='A'?i:0))]||'';
  return s;
}
function hint(){
  if(!selw)return;
  const ans=selw.ans;
  const empty=[];
  for(let i=0;i<ans.length;i++){
    const r=selw.r+(selw.d==='D'?i:0),c=selw.c+(selw.d==='A'?i:0),k=cellKey(r,c);
    if(letm[k]!==ans[i])empty.push(i);
  }
  if(empty.length>0){
    const idx=empty[Math.floor(Math.random()*empty.length)];
    const r=selw.r+(selw.d==='D'?idx:0),c=selw.c+(selw.d==='A'?idx:0),k=cellKey(r,c);
    letm[k]=ans[idx];
    score-=50;syncStats(0,50);
    sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop');
  }
  draw();
}
function nextWord(){
  let a=P[face].W,i=a.findIndex(w=>w.id===selw.id);
  selw=a[(i+1)%a.length];clue();draw();
}
function check(){
  if(answer(selw)===selw.ans&&!sol.has(wordKey(selw))){
    sol.add(wordKey(selw));score+=100;sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop');syncStats(100,0);nextWord();
  }
  draw();
}
function reveal(){
  if(!selw)return;
  let K=wordKey(selw);
  for(let i=0;i<selw.ans.length;i++) letm[cellKey(selw.r+(selw.d==='D'?i:0),selw.c+(selw.d==='A'?i:0))]=selw.ans[i];
  if(!sol.has(K)){sol.add(K);score-=100;syncStats(0,100)}
  nextWord();
}
function live(){
  let p=Math.max(-90,Math.min(90,rx)),f;
  if(p<=-45)f=4;
  else if(p>=45)f=5;
  else{
    let y=((ry%360)+360)%360;
    f=[0,3,2,1][Math.round(y/90)%4];
  }
  fb.textContent='FACE '+(f+1);
  return f;
}
function snap(){
  face=live();
  let T=[[0,0],[0,-90],[0,180],[0,90],[-90,0],[90,0]][face];
  rx=T[0];ry=T[1];
  cu.style.transition='transform .15s';tr();
  setTimeout(()=>cu.style.transition='',160);
  selw=P[face].W[0];clue();draw();
}

se.onchange=()=>{
  cat=se.value;face=0;rx=ry=score=0;sol.clear();letm={};P=groups();selw=P[0].W[0];tr();clue();draw();
};
document.getElementById('ck').onclick=check;
document.getElementById('nx').onclick=hint;
document.getElementById('rv').onclick=reveal;
document.getElementById('rs').onclick=()=>{
  cat=C[Math.floor(Math.random()*C.length)];se.value=cat;
  score=0;sol.clear();letm={};face=0;rx=ry=0;P=groups();selw=P[0].W[0];tr();clue();draw();
};
document.getElementById('nextArrow').onclick=()=>{
  let a=P[face].W,i=a.findIndex(w=>w.id===selw.id);
  selw=a[(i+1)%a.length];clue();draw();
};

['ABCDEFGHIJKL','MNOPQRSTUV'].forEach((r)=>{
  let d=document.createElement('div');d.className='r';
  [...r].forEach(ch=>{let b=document.createElement('button');b.className='k';b.textContent=ch;b.onclick=()=>type(ch);d.append(b)});
  kb.append(d);
});
{
  let d=document.createElement('div');d.className='r';
  let bb=document.createElement('button');bb.className='k w';bb.textContent='⌫';bb.onclick=back;d.append(bb);
  [...'WXYZ'].forEach(ch=>{let b=document.createElement('button');b.className='k';b.textContent=ch;b.onclick=()=>type(ch);d.append(b)});
  let cb=document.createElement('button');cb.className='k w';cb.textContent='✓';cb.onclick=check;d.append(cb);
  kb.append(d);
}

function positionHint(){
  const hb=document.getElementById('hintbar');
  const kbEl=document.getElementById('kb');
  if(!hb||!kbEl)return;
  const kbRect=kbEl.getBoundingClientRect();
  const kcRect=document.getElementById('kc').getBoundingClientRect();
  const hintTop=kbRect.bottom-kcRect.top+8;
  const hintH=hb.offsetHeight||40;
  const maxTop=kcRect.height-hintH-6;
  hb.style.top=Math.min(hintTop,maxTop)+'px';
}

function reposition(){positionHint()}

window.addEventListener('resize',reposition);
window.addEventListener('load',()=>setTimeout(reposition,50));
document.addEventListener('fullscreenchange',()=>setTimeout(reposition,100));
window.addEventListener('orientationchange',()=>setTimeout(reposition,200));

let dg=0,sx=0,sy=0,bx=0,by=0;
st.addEventListener('pointerdown',e=>{
  dg=1;sx=e.clientX;sy=e.clientY;bx=rx;by=ry;
  st.setPointerCapture(e.pointerId);
});
st.addEventListener('pointermove',e=>{
  if(!dg)return;
  ry=by+(e.clientX-sx)*.75;
  rx=Math.max(-90,Math.min(90,bx-(e.clientY-sy)*.75));
  tr();live();
});
st.addEventListener('pointerup',()=>{dg=0;snap()});
st.addEventListener('pointercancel',()=>{dg=0;snap()});

selw=P[0].W[0];tr();clue();draw();reposition();
})();
</script>
